<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc">
<title id="title">Backbone and Refiner caches</title><desc id="desc">A low-resolution causal backbone reads higher-noise history. One-step latent refinement reads lower-noise high-resolution history. These are distinct from VAE decoding.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/></marker><marker id="grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287361"/></marker></defs>
<rect width="680" height="820" rx="16" fill="#f8f6f3"/>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; } .secondary { fill: #5a5a5a; }</style>
<text x="340" y="48" font-size="27" font-weight="700" text-anchor="middle" class="">SEPARATE MOTION FROM DETAIL</text>
<g id="backbone-cache" data-graph-role="node"><rect x="30" y="120" width="260" height="135" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
<text x="160.0" y="156" font-size="25" font-weight="600" text-anchor="middle" class="">Backbone history</text>
<text x="160.0" y="187" font-size="21" font-weight="400" text-anchor="middle" class="secondary">higher noise: tau B</text>
<text x="160.0" y="216" font-size="21" font-weight="400" text-anchor="middle" class="secondary">coarse temporal prior</text>
</g>
<g id="backbone" data-graph-role="node"><rect x="370" y="120" width="280" height="135" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/>
<text x="510.0" y="156" font-size="25" font-weight="600" text-anchor="middle" class="">Causal backbone</text>
<text x="510.0" y="187" font-size="21" font-weight="400" text-anchor="middle" class="secondary">low-resolution output</text>
<text x="510.0" y="216" font-size="21" font-weight="400" text-anchor="middle" class="secondary">motion + structure</text>
</g>
<polyline id="b-read" points="290,187 370,187" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/>
<g id="refiner-cache" data-graph-role="node"><rect x="30" y="405" width="260" height="135" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
<text x="160.0" y="441" font-size="25" font-weight="600" text-anchor="middle" class="">Refiner history</text>
<text x="160.0" y="472" font-size="21" font-weight="400" text-anchor="middle" class="secondary">lower noise: tau R</text>
<text x="160.0" y="501" font-size="21" font-weight="400" text-anchor="middle" class="secondary">high-resolution cues</text>
</g>
<g id="refiner" data-graph-role="node"><rect x="370" y="405" width="280" height="135" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/>
<text x="510.0" y="441" font-size="25" font-weight="600" text-anchor="middle" class="">One-step Refiner</text>
<text x="510.0" y="472" font-size="21" font-weight="400" text-anchor="middle" class="secondary">upsample + add noise</text>
<text x="510.0" y="501" font-size="21" font-weight="400" text-anchor="middle" class="secondary">predict HR latent</text>
</g>
<polyline id="r-read" points="290,472 370,472" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline id="lowres-refiner" points="510,255 510,405" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="340" y="329" font-size="27" font-weight="600" text-anchor="middle" class="">tau B &gt; tau R</text>
<g id="decode" data-graph-role="node"><rect x="370" y="655" width="280" height="100" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2"/>
<text x="510.0" y="691" font-size="25" font-weight="600" text-anchor="middle" class="">VAE decoder</text>
<text x="510.0" y="722" font-size="21" font-weight="400" text-anchor="middle" class="secondary">720p video output</text>
</g>
<polyline id="refiner-decode" points="510,540 510,655" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="160" y="683" font-size="22" font-weight="600" text-anchor="middle" class="">Schematic:</text>
<text x="160" y="716" font-size="20" font-weight="400" text-anchor="middle" class="">no internal sizes</text>
<text x="160" y="746" font-size="20" font-weight="400" text-anchor="middle" class="">or timings assumed</text>
</svg>

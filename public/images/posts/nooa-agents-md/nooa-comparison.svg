<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#4a3fb5"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="28" font-weight="700">NOOA vs 传统 Agent 架构</text>

  <!-- Center dividing line -->
  <line x1="600" y1="80" x2="600" y2="680" stroke="#3a3a5a" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- LEFT SIDE: Traditional Agent -->
  <g transform="translate(0, 0)">
    <!-- Section label -->
    <rect x="180" y="80" width="160" height="32" rx="16" fill="#2c1a1a" stroke="#e74c3c" stroke-width="1"/>
    <text x="260" y="101" text-anchor="middle" fill="#ff7675" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">传统 Agent</text>

    <!-- Scattered boxes -->
    <!-- Box 1: Prompt 模板 -->
    <g transform="translate(120, 160)">
      <rect x="0" y="0" width="140" height="50" rx="6" fill="#1e1e2e" stroke="#e17055" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="70" y="20" text-anchor="middle" fill="#fab1a0" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="13">Prompt 模板</text>
      <text x="70" y="38" text-anchor="middle" fill="#636e72" font-family="ui-monospace, monospace" font-size="10">system_prompt.txt</text>
    </g>

    <!-- Box 2: Tool Schema JSON -->
    <g transform="translate(310, 180)">
      <rect x="0" y="0" width="155" height="50" rx="6" fill="#1e1e2e" stroke="#e17055" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="78" y="20" text-anchor="middle" fill="#fab1a0" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="13">Tool Schema JSON</text>
      <text x="78" y="38" text-anchor="middle" fill="#636e72" font-family="ui-monospace, monospace" font-size="10">tools_definition.json</text>
    </g>

    <!-- Box 3: Callback 代码 -->
    <g transform="translate(140, 290)">
      <rect x="0" y="0" width="140" height="50" rx="6" fill="#1e1e2e" stroke="#e17055" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="70" y="20" text-anchor="middle" fill="#fab1a0" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="13">Callback 代码</text>
      <text x="70" y="38" text-anchor="middle" fill="#636e72" font-family="ui-monospace, monospace" font-size="10">handlers/*.py</text>
    </g>

    <!-- Box 4: Workflow 图 -->
    <g transform="translate(330, 310)">
      <rect x="0" y="0" width="140" height="50" rx="6" fill="#1e1e2e" stroke="#e17055" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="70" y="20" text-anchor="middle" fill="#fab1a0" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="13">Workflow 图</text>
      <text x="70" y="38" text-anchor="middle" fill="#636e72" font-family="ui-monospace, monospace" font-size="10">graph.yaml</text>
    </g>

    <!-- Box 5: State 管理 -->
    <g transform="translate(200, 410)">
      <rect x="0" y="0" width="140" height="50" rx="6" fill="#1e1e2e" stroke="#e17055" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="70" y="20" text-anchor="middle" fill="#fab1a0" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="13">State 管理</text>
      <text x="70" y="38" text-anchor="middle" fill="#636e72" font-family="ui-monospace, monospace" font-size="10">state_machine.py</text>
    </g>

    <!-- Dotted connections showing fragmentation -->
    <path d="M 190,210 Q 300,240 310,200" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4"/>
    <path d="M 260,210 Q 230,260 210,290" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4"/>
    <path d="M 465,220 Q 450,270 440,310" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4"/>
    <path d="M 280,340 Q 290,370 290,410" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4"/>
    <path d="M 380,360 Q 340,390 330,410" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4"/>

    <!-- Fragmentation label -->
    <text x="300" y="510" text-anchor="middle" fill="#b2bec3" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="12" opacity="0.7">能力碎片化分散在 5+ 个文件中</text>

    <!-- Stats box -->
    <g transform="translate(170, 560)">
      <rect x="0" y="0" width="250" height="70" rx="8" fill="#2c1a1a" stroke="#e74c3c" stroke-width="1" opacity="0.8"/>
      <text x="125" y="24" text-anchor="middle" fill="#ff7675" font-family="ui-monospace, monospace" font-size="13" font-weight="600">~66 calls</text>
      <text x="125" y="44" text-anchor="middle" fill="#ff7675" font-family="ui-monospace, monospace" font-size="13">~2.2M tokens</text>
      <text x="125" y="62" text-anchor="middle" fill="#d63031" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">→ 78% 成功率</text>
    </g>
  </g>

  <!-- RIGHT SIDE: NOOA -->
  <g transform="translate(620, 0)">
    <!-- Section label -->
    <rect x="180" y="80" width="120" height="32" rx="16" fill="#1a2a2e" stroke="#00cec9" stroke-width="1"/>
    <text x="240" y="101" text-anchor="middle" fill="#81ecec" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">NOOA</text>

    <!-- Unified Python class box -->
    <g transform="translate(100, 150)">
      <!-- Main container -->
      <rect x="0" y="0" width="380" height="340" rx="10" fill="#1a1e2e" stroke="url(#greenAccent)" stroke-width="2"/>

      <!-- Class header -->
      <rect x="0" y="0" width="380" height="44" rx="10" fill="#1a2a3e"/>
      <rect x="0" y="30" width="380" height="14" fill="#1a2a3e"/>
      <text x="20" y="28" fill="#81ecec" font-family="ui-monospace, monospace" font-size="13" font-weight="600">class BookingAgent(NOOA):</text>

      <!-- Internal sections -->
      <!-- Section 1: 方法=能力 -->
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="340" height="55" rx="5" fill="#162032" stroke="#6c5ce7" stroke-width="0.8"/>
        <text x="15" y="22" fill="#a29bfe" font-family="ui-monospace, monospace" font-size="12">def search_flights(self):</text>
        <text x="15" y="42" fill="#636e72" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">方法 = 能力（LLM 自动发现可调用）</text>
        <rect x="270" y="8" width="60" height="20" rx="10" fill="#6c5ce7" opacity="0.3"/>
        <text x="300" y="22" text-anchor="middle" fill="#a29bfe" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="10">能力</text>
      </g>

      <!-- Section 2: 字段=状态 -->
      <g transform="translate(20, 130)">
        <rect x="0" y="0" width="340" height="55" rx="5" fill="#162032" stroke="#00cec9" stroke-width="0.8"/>
        <text x="15" y="22" fill="#81ecec" font-family="ui-monospace, monospace" font-size="12">confirmed: bool = False</text>
        <text x="15" y="42" fill="#636e72" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">字段 = 状态（LLM 读写，类型安全）</text>
        <rect x="270" y="8" width="60" height="20" rx="10" fill="#00cec9" opacity="0.3"/>
        <text x="300" y="22" text-anchor="middle" fill="#81ecec" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="10">状态</text>
      </g>

      <!-- Section 3: 类型=约束 -->
      <g transform="translate(20, 200)">
        <rect x="0" y="0" width="340" height="55" rx="5" fill="#162032" stroke="#fdcb6e" stroke-width="0.8"/>
        <text x="15" y="22" fill="#ffeaa7" font-family="ui-monospace, monospace" font-size="12">budget: float = Field(le=5000)</text>
        <text x="15" y="42" fill="#636e72" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">类型注解 = 约束（编译期 + 运行时保障）</text>
        <rect x="270" y="8" width="60" height="20" rx="10" fill="#fdcb6e" opacity="0.3"/>
        <text x="300" y="22" text-anchor="middle" fill="#ffeaa7" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="10">约束</text>
      </g>

      <!-- Section 4: ...=LLM填充 -->
      <g transform="translate(20, 270)">
        <rect x="0" y="0" width="340" height="50" rx="5" fill="#162032" stroke="#55efc4" stroke-width="0.8"/>
        <text x="15" y="22" fill="#55efc4" font-family="ui-monospace, monospace" font-size="12">"""..."""  # docstring → LLM prompt</text>
        <text x="15" y="40" fill="#636e72" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">文档字符串 = LLM 填充指令</text>
        <rect x="270" y="6" width="60" height="20" rx="10" fill="#55efc4" opacity="0.3"/>
        <text x="300" y="20" text-anchor="middle" fill="#55efc4" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="10">填充</text>
      </g>
    </g>

    <!-- Unity label -->
    <text x="290" y="530" text-anchor="middle" fill="#b2bec3" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="12" opacity="0.7">一个类 = 一个完整 Agent（零碎片）</text>

    <!-- Stats box -->
    <g transform="translate(160, 560)">
      <rect x="0" y="0" width="250" height="70" rx="8" fill="#1a2e2a" stroke="#00cec9" stroke-width="1" opacity="0.8"/>
      <text x="125" y="24" text-anchor="middle" fill="#81ecec" font-family="ui-monospace, monospace" font-size="13" font-weight="600">~29 calls</text>
      <text x="125" y="44" text-anchor="middle" fill="#81ecec" font-family="ui-monospace, monospace" font-size="13">~1.1M tokens</text>
      <text x="125" y="62" text-anchor="middle" fill="#00b894" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">→ 82% 成功率</text>
    </g>
  </g>

  <!-- Comparison arrows/indicators -->
  <g transform="translate(560, 600)">
    <text x="0" y="0" text-anchor="middle" fill="#636e72" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">调用量 -56%</text>
    <text x="0" y="18" text-anchor="middle" fill="#636e72" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">Token -50%</text>
    <text x="0" y="36" text-anchor="middle" fill="#00b894" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11" font-weight="600">成功率 +4pp</text>
  </g>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
</svg>
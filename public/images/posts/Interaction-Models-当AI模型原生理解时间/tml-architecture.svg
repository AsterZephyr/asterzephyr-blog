<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c4956a"/>
    </marker>
    <marker id="arrowAsync" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b72b0"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 13px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 11px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .type-label { font-size: 10px; font-weight: 600; fill: #ffffff; letter-spacing: 0.05em; }
    .arrow-label { font-size: 10px; font-weight: 500; fill: #5a5a58; }
    .legend { font-size: 11px; fill: #5a5a58; }
  </style>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">TML Interaction Model 架构</text>

  <!-- Input Layer container -->
  <rect x="40" y="55" width="300" height="280" rx="10" fill="none" stroke="#ded8cf" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="55" y="75" class="section-label">INPUT (每 200ms)</text>

  <!-- Audio input -->
  <rect x="70" y="95" width="240" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <rect x="70" y="95" width="55" height="20" rx="4" fill="#6b9e8a"/>
  <text x="97" y="108" text-anchor="middle" class="type-label">AUDIO</text>
  <text x="190" y="117" text-anchor="middle" class="node-title">音频流</text>
  <text x="190" y="135" text-anchor="middle" class="node-sub">dMel 编码 → Bag of Embeddings</text>

  <!-- Video input -->
  <rect x="70" y="165" width="240" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <rect x="70" y="165" width="55" height="20" rx="4" fill="#6b9e8a"/>
  <text x="97" y="178" text-anchor="middle" class="type-label">VIDEO</text>
  <text x="190" y="187" text-anchor="middle" class="node-title">视频帧</text>
  <text x="190" y="205" text-anchor="middle" class="node-sub">40×40 patch → hMLP 编码</text>

  <!-- Text input -->
  <rect x="70" y="235" width="240" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <rect x="70" y="235" width="45" height="20" rx="4" fill="#6b9e8a"/>
  <text x="92" y="248" text-anchor="middle" class="type-label">TEXT</text>
  <text x="190" y="257" text-anchor="middle" class="node-title">文本</text>
  <text x="190" y="275" text-anchor="middle" class="node-sub">Token Embedding</text>

  <!-- Core Transformer -->
  <rect x="410" y="110" width="250" height="100" rx="12" fill="#fdf6e3" stroke="#c4956a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="535" y="145" text-anchor="middle" class="node-title">276B MoE Transformer</text>
  <text x="535" y="165" text-anchor="middle" class="node-sub">12B 激活参数</text>
  <text x="535" y="183" text-anchor="middle" class="node-sub">从头联合训练（无冻结编码器）</text>

  <!-- Output: Text -->
  <rect x="730" y="90" width="190" height="46" rx="8" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="825" y="117" text-anchor="middle" class="node-title">文本输出</text>

  <!-- Output: Flow Head -->
  <rect x="730" y="160" width="190" height="60" rx="8" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="825" y="185" text-anchor="middle" class="node-title">Flow Head</text>
  <text x="825" y="203" text-anchor="middle" class="node-sub">Mel Spectrogram → 语音输出</text>

  <!-- Background Model -->
  <rect x="410" y="290" width="250" height="80" rx="10" fill="#f5f5f5" stroke="#8a8a87" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadowSoft)"/>
  <text x="535" y="322" text-anchor="middle" class="node-title">Background Model</text>
  <text x="535" y="342" text-anchor="middle" class="node-sub">异步深度推理</text>
  <text x="535" y="358" text-anchor="middle" class="node-sub">处理复杂任务</text>

  <!-- Arrows: Inputs → Transformer -->
  <line x1="310" y1="120" x2="410" y2="140" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
  <line x1="310" y1="190" x2="410" y2="165" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
  <line x1="310" y1="260" x2="410" y2="190" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>

  <!-- Arrows: Transformer → Outputs -->
  <line x1="660" y1="140" x2="730" y2="115" stroke="#9b72b0" stroke-width="1.5" marker-end="url(#arrowAsync)"/>
  <line x1="660" y1="165" x2="730" y2="185" stroke="#9b72b0" stroke-width="1.5" marker-end="url(#arrowAsync)"/>

  <!-- Arrows: Transformer ↔ Background -->
  <path d="M 490 210 L 490 290" fill="none" stroke="#8a8a87" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowControl)"/>
  <text x="460" y="250" class="arrow-label">委托</text>
  <path d="M 580 290 L 580 210" fill="none" stroke="#8a8a87" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowControl)"/>
  <text x="590" y="250" class="arrow-label">回注</text>

  <!-- Legend -->
  <rect x="40" y="400" width="880" height="60" rx="8" fill="none" stroke="#ded8cf" stroke-width="1"/>
  <text x="60" y="425" class="legend">关键创新:</text>
  <text x="60" y="445" class="node-sub">1. 所有编码器与 Transformer 从头联合训练 — 无预训练冻结编码器（Whisper/CLIP）</text>
  <text x="520" y="425" class="node-sub">2. 输入/输出同时流式处理 — 每 200ms 一个 chunk</text>
  <text x="520" y="445" class="node-sub">3. Background Model 异步处理复杂推理 — 在合适时机流入对话</text>
</svg>

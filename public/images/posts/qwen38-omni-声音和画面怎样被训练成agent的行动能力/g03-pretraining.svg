<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="435" viewBox="0 0 1100 435" role="img" aria-labelledby="title desc"><title id="title">四阶段训练：先稳住表示，再改变访问方式</title><desc id="desc">四阶段原生序列长度均为 262,144；1M 扩展发生在后训练之后。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#9c6924"/></marker></defs><rect width="1100" height="435" rx="20" fill="#fffaf1"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#30281e"><text x="36" y="48" font-size="27" font-weight="600">四阶段训练：先稳住表示，再改变访问方式</text><rect x="36.0" y="80" width="497.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="54.0" y="109" font-size="21" font-weight="600">S1 · Encoder Alignment</text><text x="54.0" y="138" font-size="17">LLM 冻结</text><text x="54.0" y="161" font-size="17">先 adapters，后各自 encoders</text><path d="M537.0 134H562.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="567.0" y="80" width="497.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="585.0" y="109" font-size="21" font-weight="600">S2 · General</text><text x="585.0" y="138" font-size="17">全参数解冻</text><text x="585.0" y="161" font-size="17">文本 / 音频 / 图像 / 视频共训</text><path d="M550 192V219" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="36.0" y="225" width="497.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="54.0" y="254" font-size="21" font-weight="600">S3 · QSA Warmup</text><text x="54.0" y="283" font-size="17">backbone 冻结；dense 保留</text><text x="54.0" y="306" font-size="17">dense attention 监督 indexer</text><path d="M537.0 279H562.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="567.0" y="225" width="497.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="585.0" y="254" font-size="21" font-weight="600">S4 · QSA</text><text x="585.0" y="283" font-size="17">启用稀疏访问</text><text x="585.0" y="306" font-size="17">backbone + indexer
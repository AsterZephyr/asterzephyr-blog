<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="435" viewBox="0 0 1100 435" role="img" aria-labelledby="title desc"><title id="title">多教师蒸馏：先形成专家，再合并能力</title><desc id="desc">减少干扰是作者的解释；报告未给完整教师消融或蒸馏损失配方。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#9c6924"/></marker></defs><rect width="1100" height="435" rx="20" fill="#fffaf1"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#30281e"><text x="36" y="48" font-size="27" font-weight="600">多教师蒸馏：先形成专家，再合并能力</text><rect x="36.0" y="80" width="320.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="54.0" y="109" font-size="21" font-weight="600">共同 pretrained base</text><text x="54.0" y="138" font-size="17">各专家由 Qwen3.8 base 初始化</text><text x="54.0" y="161" font-size="17">不等于多个异构供应商模型</text><path d="M360.0 134H385.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="390.0" y="80" width="320.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="408.0" y="109" font-size="21" font-weight="600">领域专家各自 SFT + RL</text><text x="408.0" y="138" font-size="17">指令 / 推理 / coding / agent</text><text x="408.0" y="161" font-size="17">视觉 / 音频等领域</text><path d="M714.0 134H739.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="744.0" y="80" width="320.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="762.0" y="109" font-size="21" font-weight="600">生成领域训练轨迹</text><text x="762.0" y="138" font-size="17">筛选后的专家监督</text><text x="762.0" y="161" font-size="17">报告未披露完整配比与筛选规则</text><path d="M550 192V219" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="36.0" y="225" width="320.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="54.0" y="254" font-size="21" font-weight="600">统一训练混合</text><text x="54.0" y="283" font-size="17">文本、视觉、音频与混合对话</text><text x="54.0" y="306" font-size="17">ChatML 序列化</text><path d="M360.0 279H385.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="390.0" y="225" width="320.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="408.0" y="254" font-size="21" font-weight="600">蒸馏到单一学生</text><text x="408.0" y="283" font-size="17">一个共享参数策略</text><text x="408.0" y="306" font-size="17">推理时无需并行部署全部教师</text><path d="M714.0 279H739.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="744.0" y="225" width="320.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="762.0" y="254" font-size="21" font-weight="600">进入统一 RL</text><text x="762.0" y="283" font-size="17">继续修正模态与交互不均衡</text><text x="762.0" y="306" font-size="17">不是蒸馏后的直接结束</text><text x="36" y="413" font-size="16" fill="#78674d">减少干扰是作者的解释；报告未给完整教师消融或蒸馏损失配方。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="435" viewBox="0 0 1100 435" role="img" aria-labelledby="title desc"><title id="title">统一表示 → 联合学习 → 可执行策略</title><desc id="desc">解释性结构图；输入统一不等于每种任务都同样可靠。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#9c6924"/></marker></defs><rect width="1100" height="435" rx="20" fill="#fffaf1"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#30281e"><text x="36" y="48" font-size="27" font-weight="600">统一表示 → 联合学习 → 可执行策略</text><rect x="36.0" y="80" width="320.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="54.0" y="109" font-size="21" font-weight="600">三路感知编码</text><text x="54.0" y="138" font-size="17">Vision · AuT · Spatial AuT</text><text x="54.0" y="161" font-size="17">保留画面、语音与空间线索</text><path d="M360.0 134H385.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="390.0" y="80" width="320.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="408.0" y="109" font-size="21" font-weight="600">共享 Thinker</text><text x="408.0" y="138" font-size="17">适配器投影 + 时间对齐</text><text x="408.0" y="161" font-size="17">GDN + 可检索的注意力层</text><path d="M714.0 134H739.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="744.0" y="80" width="320.0" height="108" rx="12" fill="#f8e5c4" stroke="#cbbd9e"/><text x="762.0" y="109" font-size="21" font-weight="600">统一输出策略</text><text x="762.0" y="138" font-size="17">文本回答 · 工具调用</text><text x="762.0" y="161" font-size="17">Talker 负责流式语音</text><path d="M550 192V219" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="36.0" y="225" width="320.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="54.0" y="254" font-size="21" font-weight="600">S1 / S2</text><text x="54.0" y="283" font-size="17">先对齐，再全参数共训练</text><text x="54.0" y="306" font-size="17">在统一序列中学习跨模态关系</text><path d="M360.0 279H385.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="390.0" y="225" width="320.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="408.0" y="254" font-size="21" font-weight="600">S3 / S4</text><text x="408.0" y="283" font-size="17">先训练 QSA indexer</text><text x="408.0" y="306" font-size="17">再适应稀疏上下文访问</text><path d="M714.0 279H739.0" stroke="#9c6924" stroke-width="2" marker-end="url(#arrow)"/><rect x="744.0" y="225" width="320.0" height="108" rx="12" fill="#e3efea" stroke="#cbbd9e"/><text x="762.0" y="254" font-size="21" font-weight="600">后训练</text><text x="762.0" y="283" font-size="17">多教师轨迹 → 单一学生</text><text x="762.0" y="306" font-size="17">统一 RL → 执行与交互反馈</text><text x="36" y="413" font-size="16" fill="#78674d">解释性结构图；输入统一不等于每种任务都同样可靠。</text></g></svg>
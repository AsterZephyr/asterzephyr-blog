<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Video Generation Inference Pipeline (DiT Architecture)</text>
  <text x="480" y="55" text-anchor="middle" font-size="12" fill="#6b7280">Text-to-Video: From Prompt to Pixels</text>
  <rect x="40" y="90" width="140" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="118" text-anchor="middle" font-size="11" fill="#6b7280">Input</text>
  <text x="110" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Text Prompt</text>
  <rect x="220" y="90" width="140" height="60" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="118" text-anchor="middle" font-size="11" fill="#6b7280">Encoding</text>
  <text x="290" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Text Encoder</text>
  <rect x="400" y="90" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="118" text-anchor="middle" font-size="11" fill="#6b7280">Compression</text>
  <text x="480" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">3D VAE Encoder</text>
  <rect x="160" y="200" width="640" height="220" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="480" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#2563eb">DiT Denoising Loop (30~100 steps)</text>
  <rect x="190" y="250" width="120" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="250" y="272" text-anchor="middle" font-size="11" fill="#6b7280">Random</text>
  <text x="250" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Noise z_T</text>
  <rect x="360" y="250" width="160" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="272" text-anchor="middle" font-size="11" fill="#6b7280">Transformer</text>
  <text x="440" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">DiT Block x N</text>
  <rect x="570" y="250" width="120" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="630" y="272" text-anchor="middle" font-size="11" fill="#6b7280">Output</text>
  <text x="630" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Pred Noise</text>
  <rect x="280" y="330" width="400" height="70" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="480" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">Spatio-Temporal Attention (O(T^2))</text>
  <text x="480" y="372" text-anchor="middle" font-size="11" fill="#6b7280">Spatial tokens (H*W patches) x Temporal tokens (T frames)</text>
  <text x="480" y="390" text-anchor="middle" font-size="11" fill="#6b7280">10s@16fps = 160 frames -> ~216K latent tokens per step</text>
  <rect x="600" y="460" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="488" text-anchor="middle" font-size="11" fill="#6b7280">Decoding</text>
  <text x="680" y="505" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">3D VAE Decoder</text>
  <rect x="800" y="460" width="130" height="60" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="865" y="488" text-anchor="middle" font-size="11" fill="#6b7280">Output</text>
  <text x="865" y="505" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Video</text>
  <line x1="180" y1="120" x2="218" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="360" y1="120" x2="398" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 480 150 L 480 198" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="310" y1="275" x2="358" y2="275" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="520" y1="275" x2="568" y2="275" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M 630 300 C 630 320, 250 320, 250 300" stroke="#9333ea" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow-purple)"/>
  <rect x="410" y="308" width="60" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="440" y="320" text-anchor="middle" font-size="10" fill="#9333ea">Loop x N</text>
  <path d="M 680 420 L 680 458" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="760" y1="490" x2="798" y2="490" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 290 150 L 290 180 L 440 180 L 440 248" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>
  <rect x="320" y="172" width="90" height="14" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="365" y="183" text-anchor="middle" font-size="10" fill="#16a34a">Cross-Attn</text>
  <rect x="40" y="550" width="880" height="80" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="575" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Compute per 10s Video (720p, 50 steps, ~10B params)</text>
  <text x="160" y="600" text-anchor="middle" font-size="12" fill="#6b7280">Tokens: ~216K/step</text>
  <text x="360" y="600" text-anchor="middle" font-size="12" fill="#6b7280">FLOPS/step: ~4.3 PFLOPS</text>
  <text x="560" y="600" text-anchor="middle" font-size="12" fill="#6b7280">Total: ~200 PFLOPS</text>
  <text x="760" y="600" text-anchor="middle" font-size="12" fill="#6b7280">H100 Latency: ~37.5s</text>
</svg>
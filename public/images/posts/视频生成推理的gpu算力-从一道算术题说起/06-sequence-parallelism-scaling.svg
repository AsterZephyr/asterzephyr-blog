  <text x="796" y="411.6666666666667" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">6.0x</text>
  <rect x="620" y="100" width="200" height="60" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="640" y1="120" x2="680" y2="120" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="660" cy="120" r="4" fill="#2563eb"/>
  <text x="690" y="124" font-size="11" fill="#374151">Actual (Seq Parallelism)</text>
  <line x1="640" y1="145" x2="680" y2="145" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="690" y="149" font-size="11" fill="#374151">Ideal Linear Scaling</text>
  <rect x="60" y="520" width="840" height="65" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="542" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Memory per GPU: 60.3 GB (1x) -> 44.3 GB (8x)</text>
  <text x="480" y="562" text-anchor="middle" font-size="12" fill="#6b7280">8x GPUs achieve 6x speedup (75% efficiency) due to communication overhead in sequence parallelism</text>
  <text x="480" y="578" text-anchor="middle" font-size="11" fill="#dc2626">Sub-linear scaling confirms: production video gen services MUST use multi-GPU per request, not just for throughput</text>
</svg>
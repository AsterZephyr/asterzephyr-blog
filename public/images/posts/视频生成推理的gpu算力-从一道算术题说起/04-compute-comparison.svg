<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Compute Requirements: Video Gen vs Image Gen vs LLM</text>
  <text x="480" y="55" text-anchor="middle" font-size="12" fill="#6b7280">Single request compute in PFLOPS (log scale visualization)</text>
  <text x="30" y="350" text-anchor="middle" font-size="12" fill="#6b7280" transform="rotate(-90, 30, 350)">Compute (PFLOPS)</text>
  <rect x="90" y="510" width="100" height="20" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="535" text-anchor="middle" font-size="16" font-weight="600" fill="#2563eb">~0.1</text>
  <text x="140" y="552" text-anchor="middle" font-size="10" fill="#2563eb">PFLOPS</text>
  <text x="140" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">LLM Inference</text>
  <text x="140" y="566" text-anchor="middle" font-size="10" fill="#6b7280">GPT-4, 1K tokens</text>
  <rect x="290" y="430" width="100" height="100" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="455" text-anchor="middle" font-size="16" font-weight="600" fill="#16a34a">~10</text>
  <text x="340" y="472" text-anchor="middle" font-size="10" fill="#16a34a">PFLOPS</text>
  <text x="340" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Image Generation</text>
  <text x="340" y="566" text-anchor="middle" font-size="10" fill="#6b7280">SD3/FLUX, 1024x1024</text>
  <rect x="490" y="230" width="100" height="300" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="255" text-anchor="middle" font-size="16" font-weight="600" fill="#ea580c">~200</text>
  <text x="540" y="272" text-anchor="middle" font-size="10" fill="#ea580c">PFLOPS</text>
  <text x="540" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Video Gen (720p)</text>
  <text x="540" y="566" text-anchor="middle" font-size="10" fill="#6b7280">10s, 24fps, 50 steps</text>
  <rect x="690" y="80" width="100" height="450" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="105" text-anchor="middle" font-size="16" font-weight="600" fill="#dc2626">~600+</text>
  <text x="740" y="122" text-anchor="middle" font-size="10" fill="#dc2626">PFLOPS</text>
  <text x="740" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Video Gen (1080p)</text>
  <text x="740" y="566" text-anchor="middle" font-size="10" fill="#6b7280">10s, 24fps, 50 steps</text>
  <line x1="70" y1="530" x2="890" y2="530" stroke="#d1d5db" stroke-width="1"/>
  <path d="M 165 510 C 165 460, 515 460, 515 230" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <rect x="290" y="440" width="80" height="18" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="330" y="453" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">2000x</text>
  <path d="M 365 430 C 365 400, 515 400, 515 250" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <rect x="420" y="385" width="50" height="18" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="445" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">20x</text>
  <rect x="60" y="580" width="840" height="55" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="140" y="600" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">Latency:</text>
  <text x="140" y="620" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">1600x H100 QPS:</text>
  <text x="280" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">&lt;1s</text>
  <text x="280" y="620" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">Thousands</text>
  <text x="480" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">2~5s</text>
  <text x="480" y="620" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">300~800</text>
  <text x="680" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="#ea580c">30~40s</text>
  <text x="680" y="620" text-anchor="middle" font-size="12" font-weight="600" fill="#ea580c">~42</text>
  <text x="880" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">90~120s</text>
  <text x="880" y="620" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">~13</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">H100 vs H20: GPU Performance Comparison for Video Generation</text>
  <text x="480" y="55" text-anchor="middle" font-size="12" fill="#6b7280">Video generation is COMPUTE-BOUND, not memory-bound</text>
  <rect x="60" y="80" width="400" height="440" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">NVIDIA H100 SXM</text>
  <text x="260" y="135" text-anchor="middle" font-size="11" fill="#6b7280">Data Center GPU (Unrestricted)</text>
  <rect x="90" y="165" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="188" font-size="13" fill="#374151">BF16 Tensor TFLOPS</text>
  <text x="400" y="188" text-anchor="end" font-size="14" font-weight="600" fill="#2563eb">989</text>
  <rect x="90" y="209" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="232" font-size="13" fill="#374151">FP8 Tensor TFLOPS</text>
  <text x="400" y="232" text-anchor="end" font-size="14" font-weight="600" fill="#2563eb">1,979</text>
  <rect x="90" y="253" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="276" font-size="13" fill="#374151">HBM3 Bandwidth</text>
  <text x="400" y="276" text-anchor="end" font-size="14" font-weight="600" fill="#6b7280">3.35 TB/s</text>
  <rect x="90" y="297" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="320" font-size="13" fill="#374151">HBM3 Capacity</text>
  <text x="400" y="320" text-anchor="end" font-size="14" font-weight="600" fill="#6b7280">80 GB</text>
  <rect x="90" y="341" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="364" font-size="13" fill="#374151">TDP</text>
  <text x="400" y="364" text-anchor="end" font-size="14" font-weight="600" fill="#6b7280">700W</text>
  <rect x="90" y="385" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="408" font-size="13" fill="#374151">Video Gen (10s)</text>
  <text x="400" y="408" text-anchor="end" font-size="14" font-weight="600" fill="#16a34a">~37.5s</text>
  <text x="260" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Compute Power (BF16)</text>
  <rect x="90" y="459" width="340" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <rect x="90" y="459" width="340" height="24" rx="4" fill="#2563eb"/>
  <text x="260" y="476" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">989 TFLOPS (100%)</text>
  <text x="260" y="499" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Memory Bandwidth</text>
  <rect x="90" y="509" width="340" height="24" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  <rect x="90" y="509" width="285" height="24" rx="4" fill="#6b7280"/>
  <text x="232" y="526" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">3.35 TB/s (84%)</text>
  <rect x="500" y="80" width="400" height="440" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#c2410c">NVIDIA H20</text>
  <text x="700" y="135" text-anchor="middle" font-size="11" fill="#6b7280">China-Export Variant (Compute Capped)</text>
  <rect x="530" y="165" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="188" font-size="13" fill="#374151">BF16 Tensor TFLOPS</text>
  <text x="840" y="188" text-anchor="end" font-size="14" font-weight="600" fill="#dc2626">148</text>
  <rect x="530" y="209" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="232" font-size="13" fill="#374151">FP8 Tensor TFLOPS</text>
  <text x="840" y="232" text-anchor="end" font-size="14" font-weight="600" fill="#dc2626">296</text>
  <rect x="530" y="253" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="276" font-size="13" fill="#374151">HBM3e Bandwidth</text>
  <text x="840" y="276" text-anchor="end" font-size="14" font-weight="600" fill="#16a34a">4.0 TB/s</text>
  <rect x="530" y="297" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="320" font-size="13" fill="#374151">HBM3e Capacity</text>
  <text x="840" y="320" text-anchor="end" font-size="14" font-weight="600" fill="#16a34a">96 GB</text>
  <rect x="530" y="341" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="364" font-size="13" fill="#374151">TDP</text>
  <text x="840" y="364" text-anchor="end" font-size="14" font-weight="600" fill="#6b7280">400W</text>
  <rect x="530" y="385" width="340" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="408" font-size="13" fill="#374151">Video Gen (10s)</text>
  <text x="840" y="408" text-anchor="end" font-size="14" font-weight="600" fill="#dc2626">~300s (5min)</text>
  <text x="700" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Compute Power (BF16)</text>
  <rect x="530" y="459" width="340" height="24" rx="4" fill="#fed7aa" stroke="#fdba74" stroke-width="1"/>
  <rect x="530" y="459" width="51" height="24" rx="4" fill="#ea580c"/>
  <text x="556" y="476" text-anchor="start" font-size="11" fill="#ffffff" font-weight="600">148 (15%)</text>
  <text x="700" y="499" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Memory Bandwidth</text>
  <rect x="530" y="509" width="340" height="24" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  <rect x="530" y="509" width="340" height="24" rx="4" fill="#6b7280"/>
  <text x="700" y="526" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">4.0 TB/s (100%)</text>
  <rect x="60" y="540" width="840" height="45" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="480" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Performance Gap: H100 is ~6.7x in BF16 TFLOPS, effective ~8x for video generation (compute-bound)</text>
  <text x="480" y="578" text-anchor="middle" font-size="11" fill="#6b7280">H20 has higher bandwidth (4.0 vs 3.35 TB/s) and more VRAM (96 vs 80 GB), but these advantages are irrelevant for compute-bound workloads</text>
</svg>
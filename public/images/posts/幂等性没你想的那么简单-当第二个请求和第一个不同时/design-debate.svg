<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 13px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 12px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .arrow-label { font-size: 11px; fill: #5a5a58; }
  </style>

  <!-- Background -->
  <rect width="960" height="460" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">幂等设计两派之争</text>

  <!-- Left: Minimalist -->
  <rect x="30" y="55" width="420" height="340" rx="10" fill="none" stroke="#6b9e8a" stroke-width="1.5"/>
  <text x="240" y="80" text-anchor="middle" class="section-label">极简派：永远 409</text>

  <rect x="60" y="100" width="360" height="44" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="127" text-anchor="middle" class="node-title">见过这个 key？直接 409 Conflict</text>

  <rect x="60" y="162" width="360" height="44" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="189" text-anchor="middle" class="node-title">不存储响应，不做重放</text>

  <rect x="60" y="224" width="360" height="44" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="251" text-anchor="middle" class="node-title">客户端自己负责区分重试结果</text>

  <rect x="60" y="286" width="360" height="44" rx="8" fill="#ffffff" stroke="#ded8cf" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="308" text-anchor="middle" class="node-title">实现成本</text>
  <text x="240" y="323" text-anchor="middle" class="node-sub">一个 unique constraint</text>

  <text x="240" y="365" text-anchor="middle" class="node-sub">代价：客户端不知道原请求是否成功</text>

  <!-- Right: Replay -->
  <rect x="510" y="55" width="420" height="340" rx="10" fill="none" stroke="#c4956a" stroke-width="1.5"/>
  <text x="720" y="80" text-anchor="middle" class="section-label">完整 Replay 派</text>

  <rect x="540" y="100" width="360" height="44" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="720" y="127" text-anchor="middle" class="node-title">存储请求 hash + 响应 + 状态</text>

  <rect x="540" y="162" width="360" height="44" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="720" y="189" text-anchor="middle" class="node-title">相同请求：重放存储的响应</text>

  <rect x="540" y="224" width="360" height="44" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="720" y="251" text-anchor="middle" class="node-title">不同请求：返回 409</text>

  <rect x="540" y="286" width="360" height="44" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="720" y="313" text-anchor="middle" class="node-title">并发请求：202 或等待</text>

  <text x="720" y="365" text-anchor="middle" class="node-sub">代价：服务端复杂度显著增加</text>

  <!-- Bottom: Core tradeoff -->
  <rect x="330" y="405" width="300" height="40" rx="8" fill="#f5f0ea" stroke="#8a8a87" stroke-width="1.5"/>
  <text x="480" y="430" text-anchor="middle" class="node-title">核心分歧：谁承担复杂度？</text>

  <!-- Arrows to tradeoff -->
  <path d="M 240 380 L 240 405 L 330 425" fill="none" stroke="#6b9e8a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 720 380 L 720 405 L 630 425" fill="none" stroke="#c4956a" stroke-width="1.2" stroke-dasharray="4,3"/>
</svg>

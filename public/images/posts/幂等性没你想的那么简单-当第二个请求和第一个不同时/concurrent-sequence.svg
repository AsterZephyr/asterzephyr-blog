<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <marker id="arrowReq" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowRes" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c4956a"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #141413; }
    .participant { font-size: 13px; font-weight: 600; fill: #141413; }
    .msg { font-size: 11px; fill: #3d3d3d; }
    .note { font-size: 10px; fill: #5a5a58; font-style: italic; }
    .lifeline { stroke: #ded8cf; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Background -->
  <rect width="960" height="520" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" class="title">并发幂等请求的 INSERT-first 时序</text>

  <!-- Participants -->
  <rect x="60" y="45" width="110" height="32" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5"/>
  <text x="115" y="66" text-anchor="middle" class="participant">Request 1</text>

  <rect x="240" y="45" width="110" height="32" rx="6" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5"/>
  <text x="295" y="66" text-anchor="middle" class="participant">Request 2</text>

  <rect x="450" y="45" width="110" height="32" rx="6" fill="#f5f5f5" stroke="#8a8a87" stroke-width="1.5"/>
  <text x="505" y="66" text-anchor="middle" class="participant">Database</text>

  <rect x="680" y="45" width="130" height="32" rx="6" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.5"/>
  <text x="745" y="66" text-anchor="middle" class="participant">支付服务商</text>

  <!-- Lifelines -->
  <line x1="115" y1="77" x2="115" y2="500" class="lifeline"/>
  <line x1="295" y1="77" x2="295" y2="500" class="lifeline"/>
  <line x1="505" y1="77" x2="505" y2="500" class="lifeline"/>
  <line x1="745" y1="77" x2="745" y2="500" class="lifeline"/>

  <!-- Note -->
  <rect x="100" y="92" width="290" height="24" rx="4" fill="#fdf6e3" stroke="none"/>
  <text x="245" y="108" text-anchor="middle" class="note">同一个 Idempotency-Key，毫秒级间隔</text>

  <!-- Message 1: R1 → DB INSERT -->
  <line x1="115" y1="130" x2="495" y2="130" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowReq)"/>
  <text x="305" y="125" text-anchor="middle" class="msg">INSERT idempotency_row (ON CONFLICT DO NOTHING)</text>

  <!-- Message 2: R2 → DB INSERT -->
  <line x1="295" y1="155" x2="495" y2="155" stroke="#c4956a" stroke-width="1.5" marker-end="url(#arrowRes)"/>
  <text x="400" y="150" text-anchor="middle" class="msg">INSERT idempotency_row (ON CONFLICT DO NOTHING)</text>

  <!-- Response: DB → R1 -->
  <line x1="495" y1="190" x2="125" y2="190" stroke="#6b9e8a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowReq)"/>
  <text x="310" y="185" text-anchor="middle" class="msg">rows_inserted = 1 (获得执行权)</text>

  <!-- Response: DB → R2 -->
  <line x1="495" y1="215" x2="305" y2="215" stroke="#c4956a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowRes)"/>
  <text x="400" y="210" text-anchor="middle" class="msg">rows_inserted = 0 (冲突)</text>

  <!-- R1 → Payment -->
  <line x1="115" y1="255" x2="735" y2="255" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowReq)"/>
  <text x="425" y="250" text-anchor="middle" class="msg">调用支付服务商</text>

  <!-- R2 → DB query -->
  <line x1="295" y1="285" x2="495" y2="285" stroke="#c4956a" stroke-width="1.5" marker-end="url(#arrowRes)"/>
  <text x="395" y="280" text-anchor="middle" class="msg">查询 idempotency_row 状态</text>

  <!-- Note: R2 sees IN_PROGRESS -->
  <rect x="210" y="305" width="300" height="24" rx="4" fill="#fff5f5" stroke="none"/>
  <text x="360" y="321" text-anchor="middle" class="note">状态 = IN_PROGRESS, locked_until > now()</text>

  <!-- R2 returns 202 -->
  <rect x="220" y="340" width="260" height="28" rx="4" fill="#fdf6e3" stroke="#c4956a" stroke-width="1"/>
  <text x="350" y="359" text-anchor="middle" class="msg">返回 202 / 409 + Retry-After</text>

  <!-- Payment → R1 success -->
  <line x1="735" y1="400" x2="125" y2="400" stroke="#9b72b0" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowReq)"/>
  <text x="430" y="395" text-anchor="middle" class="msg">支付成功</text>

  <!-- R1 → DB update -->
  <line x1="115" y1="440" x2="495" y2="440" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowReq)"/>
  <text x="305" y="435" text-anchor="middle" class="msg">更新状态为 COMPLETED + 存储响应</text>

  <!-- Activation boxes -->
  <rect x="110" y="125" width="10" height="330" rx="2" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <rect x="290" y="150" width="10" height="210" rx="2" fill="#fdf6e3" stroke="#c4956a" stroke-width="1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700">
  <style>
    text { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1a1a2e; }
    .axis-label { font-size: 13px; fill: #495057; font-weight: 500; }
    .axis-end { font-size: 11px; fill: #868e96; }
    .node-label { font-size: 12px; font-weight: 600; }
    .node-sub { font-size: 10px; fill: #6b7280; }
    .legend-text { font-size: 11px; fill: #495057; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="#ffffff" rx="8"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" class="title">Agent Eval Benchmark Map</text>

  <!-- Quadrant grid area: x=120..880, y=80..600 -->
  <!-- Quadrant background fills -->
  <rect x="120" y="80" width="380" height="260" fill="#f8f9fa" rx="4"/>
  <rect x="500" y="80" width="380" height="260" fill="#fff8f0" rx="4"/>
  <rect x="120" y="340" width="380" height="260" fill="#f0f9ff" rx="4"/>
  <rect x="500" y="340" width="380" height="260" fill="#f9fafb" rx="4"/>

  <!-- Axes -->
  <line x1="120" y1="340" x2="880" y2="340" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="500" y1="80" x2="500" y2="600" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- X axis line and labels -->
  <line x1="120" y1="600" x2="880" y2="600" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="876,596 884,600 876,604" fill="#adb5bd"/>
  <text x="500" y="635" text-anchor="middle" class="axis-label">Granularity</text>
  <text x="140" y="620" class="axis-end">Function</text>
  <text x="860" y="620" text-anchor="end" class="axis-end">System</text>

  <!-- Y axis line and labels -->
  <line x1="120" y1="80" x2="120" y2="600" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="116,84 120,76 124,84" fill="#adb5bd"/>
  <text x="60" y="345" text-anchor="middle" class="axis-label" transform="rotate(-90, 60, 345)">Evaluation Method</text>
  <text x="110" y="590" text-anchor="end" class="axis-end">Auto Test</text>
  <text x="110" y="95" text-anchor="end" class="axis-end">Human Review</text>

  <!-- === BENCHMARK NODES === -->

  <!-- Classic (Blue): HumanEval, SWE-bench, CoderEval -->
  <rect x="140" y="510" width="120" height="50" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="535" text-anchor="middle" class="node-label" fill="#1971c2">HumanEval</text>
  <text x="200" y="550" text-anchor="middle" class="node-sub">standalone func</text>

  <rect x="265" y="460" width="120" height="50" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="485" text-anchor="middle" class="node-label" fill="#1971c2">CoderEval</text>
  <text x="325" y="500" text-anchor="middle" class="node-sub">6-level context</text>

  <rect x="400" y="430" width="130" height="50" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="465" y="455" text-anchor="middle" class="node-label" fill="#1971c2">SWE-bench</text>
  <text x="465" y="470" text-anchor="middle" class="node-sub">single issue fix</text>

  <!-- Emerging 2026 (Orange): ProgramBench, SaaSBench -->
  <rect x="720" y="470" width="140" height="50" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="495" text-anchor="middle" class="node-label" fill="#d9480f">ProgramBench</text>
  <text x="790" y="510" text-anchor="middle" class="node-sub">build from scratch</text>

  <rect x="710" y="240" width="130" height="50" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="265" text-anchor="middle" class="node-label" fill="#d9480f">SaaSBench</text>
  <text x="775" y="280" text-anchor="middle" class="node-sub">enterprise fullstack</text>

  <!-- Human Review (Purple): Arena, METR -->
  <rect x="220" y="140" width="140" height="50" rx="8" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="165" text-anchor="middle" class="node-label" fill="#5f3dc4">Chatbot Arena</text>
  <text x="290" y="180" text-anchor="middle" class="node-sub">ELO human vote</text>

  <rect x="410" y="120" width="130" height="50" rx="8" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="145" text-anchor="middle" class="node-label" fill="#5f3dc4">METR Study</text>
  <text x="475" y="160" text-anchor="middle" class="node-sub">maintainer review</text>

  <!-- Web/Interactive (Cyan): WebArena, DevEval -->
  <rect x="510" y="330" width="120" height="50" rx="8" fill="#e3fafc" stroke="#0c8599" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="355" text-anchor="middle" class="node-label" fill="#0c8599">WebArena</text>
  <text x="570" y="370" text-anchor="middle" class="node-sub">browser interact</text>

  <rect x="590" y="260" width="110" height="50" rx="8" fill="#e3fafc" stroke="#0c8599" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="285" text-anchor="middle" class="node-label" fill="#0c8599">DevEval</text>
  <text x="645" y="300" text-anchor="middle" class="node-sub">full lifecycle</text>

  <!-- Legend -->
  <rect x="130" y="650" width="700" height="35" rx="6" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <rect x="150" y="661" width="12" height="12" rx="3" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="168" y="672" class="legend-text">Classic (validated)</text>
  <rect x="310" y="661" width="12" height="12" rx="3" fill="#fff4e6" stroke="#d9480f" stroke-width="1"/>
  <text x="328" y="672" class="legend-text">Emerging (2026)</text>
  <rect x="470" y="661" width="12" height="12" rx="3" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="1"/>
  <text x="488" y="672" class="legend-text">Human Review</text>
  <rect x="620" y="661" width="12" height="12" rx="3" fill="#e3fafc" stroke="#0c8599" stroke-width="1"/>
  <text x="638" y="672" class="legend-text">Web/Interactive</text>

</svg>
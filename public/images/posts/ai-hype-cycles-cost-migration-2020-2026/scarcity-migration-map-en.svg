<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Seven waves of AI scarcity and cost migration from 2020 to 2026">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#86663b" />
    </marker>
  </defs>

  <rect width="960" height="450" rx="14" fill="#fbf9f4" stroke="#e2dacb" stroke-width="1.5" />

  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="18" font-weight="700" fill="#1f1b16">Seven AI Waves (2020 to 2026): Where Scarcity and True Cost Migrated</text>
  <text x="32" y="60" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="12.5" fill="#6b6356">Each wave compresses unit cost in one layer while pushing the binding bottleneck to the next</text>

  <!-- Node 1 -->
  <rect x="32" y="84" width="204" height="112" rx="10" fill="#ffffff" stroke="#d8cebc" stroke-width="1.5" />
  <rect x="32" y="84" width="204" height="26" rx="10" fill="#f3ecde" />
  <text x="44" y="102" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#86663b">01 · 2020 to 2022 Compute</text>
  <text x="44" y="129" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#1f1b16">Scaling Law / Emergence</text>
  <text x="44" y="150" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#4f483e">Scarce: Pre-training GPUs</text>
  <text x="44" y="170" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#b9533c">Trap: Loss fit sold as ROI</text>

  <line x1="236" y1="140" x2="262" y2="140" stroke="#86663b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 2 -->
  <rect x="266" y="84" width="204" height="112" rx="10" fill="#ffffff" stroke="#d8cebc" stroke-width="1.5" />
  <rect x="266" y="84" width="204" height="26" rx="10" fill="#f3ecde" />
  <text x="278" y="102" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#86663b">02 · Late 2022 to 2023</text>
  <text x="278" y="129" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#1f1b16">Open Weights &amp; RAG</text>
  <text x="278" y="150" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#4f483e">Scarce: Cloud &amp; enterprise entry</text>
  <text x="278" y="170" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#b9533c">Trap: Retrieval != understanding</text>

  <line x1="470" y1="140" x2="496" y2="140" stroke="#86663b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 3 -->
  <rect x="500" y="84" width="204" height="112" rx="10" fill="#ffffff" stroke="#d8cebc" stroke-width="1.5" />
  <rect x="500" y="84" width="204" height="26" rx="10" fill="#f3ecde" />
  <text x="512" y="102" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#86663b">03 · 2024 Unit Economics</text>
  <text x="512" y="129" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#1f1b16">MoE, Distillation &amp; o1</text>
  <text x="512" y="150" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#4f483e">Scarce: Cost per valid task</text>
  <text x="512" y="170" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#b9533c">Trap: Token price hides rework</text>

  <line x1="704" y1="140" x2="730" y2="140" stroke="#86663b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 4 -->
  <rect x="734" y="84" width="194" height="112" rx="10" fill="#ffffff" stroke="#d8cebc" stroke-width="1.5" />
  <rect x="734" y="84" width="194" height="26" rx="10" fill="#f3ecde" />
  <text x="746" y="102" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#86663b">04 · Late 2024 to 2025</text>
  <text x="746" y="129" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#1f1b16">Agents &amp; Digital Labor</text>
  <text x="746" y="150" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#4f483e">Scarce: Reliability &amp; governance</text>
  <text x="746" y="170" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#b9533c">Trap: Tool calls != delivery</text>

  <path d="M 831 196 L 831 214 L 178 214 L 178 232" fill="none" stroke="#86663b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 5 -->
  <rect x="32" y="236" width="286" height="118" rx="10" fill="#ffffff" stroke="#c9b491" stroke-width="1.6" />
  <rect x="32" y="236" width="286" height="26" rx="10" fill="#f5e9d5" />
  <text x="44" y="254" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#7c5422">05 · 2026 Artifact Cloning</text>
  <text x="44" y="281" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#1f1b16">Persona Skills &amp; Reverse Eng.</text>
  <text x="44" y="303" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#4f483e">Scarce: Judgment, uptime, customer trust</text>
  <text x="44" y="324" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#b9533c">Trap: Rebuilt code != commercial product</text>

  <line x1="318" y1="295" x2="344" y2="295" stroke="#86663b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 6 -->
  <rect x="348" y="236" width="282" height="118" rx="10" fill="#fffaf0" stroke="#c48a3a" stroke-width="2" />
  <rect x="348" y="236" width="282" height="26" rx="10" fill="#f3dfc0" />
  <text x="360" y="254" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#7c4f13">06 · 2025 to 2026 Software Frontier</text>
  <text x="360" y="281" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#1f1b16">Data Markets &amp; RL Verifiers</text>
  <text x="360" y="303" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#4f483e">Scarce: Trusted graders &amp; secure sandboxes</text>
  <text x="360" y="324" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#b9533c">Trap: Fast-depreciating tasks priced as SaaS</text>

  <line x1="630" y1="295" x2="656" y2="295" stroke="#86663b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 7 -->
  <rect x="660" y="236" width="268" height="118" rx="10" fill="#fffaf0" stroke="#c48a3a" stroke-width="2" />
  <rect x="660" y="236" width="268" height="26" rx="10" fill="#f3dfc0" />
  <text x="672" y="254" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#7c4f13">07 · 2025 to 2026 Physical Frontier</text>
  <text x="672" y="281" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#1f1b16">Physical AI &amp; Humanoids</text>
  <text x="672" y="303" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#4f483e">Scarce: Force control, uptime, integration</text>
  <text x="672" y="324" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#b9533c">Trap: Cheap BOM != autonomous hourly ROI</text>

  <!-- Bottom trap rail -->
  <rect x="32" y="376" width="896" height="52" rx="10" fill="#fdf2ef" stroke="#d98c7a" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="48" y="399" font-family="-apple-system, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#9b3422">Recurring Mispricing Pattern (Cost Does Not Vanish; It Moves)</text>
  <text x="48" y="418" font-family="-apple-system, Inter, sans-serif" font-size="11.5" fill="#5e3228">Local lab milestone  ->  Priced early as full replacement  ->  Hidden bill surfaces (verification, security, depreciation, human fallback, wear)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500">
  <rect width="960" height="500" fill="#1b1f23"/>
  <text x="480" y="36" text-anchor="middle" fill="#e1e4e8" font-family="system-ui, sans-serif" font-size="17" font-weight="bold">Preemption Strategies: Recompute vs Swap</text>
  <!-- Left: Recompute -->
  <rect x="40" y="60" width="420" height="400" fill="#24292e" rx="10" stroke="#374151" stroke-width="1"/>
  <text x="250" y="90" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Strategy: Recompute</text>
  <!-- Timeline -->
  <line x1="80" y1="130" x2="420" y2="130" stroke="#4b5563" stroke-width="1"/>
  <text x="80" y="122" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">t=0</text>
  <text x="420" y="122" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">t=T</text>
  <!-- Step 1: Running -->
  <rect x="80" y="145" width="160" height="35" fill="#1e3a5f" rx="4"/>
  <text x="160" y="167" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Req A generating...</text>
  <!-- Step 2: Preempt -->
  <rect x="240" y="145" width="40" height="35" fill="#4c1d1d" rx="4"/>
  <text x="260" y="167" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">STOP</text>
  <!-- Step 3: Free blocks -->
  <rect x="80" y="200" width="380" height="35" fill="#1b1f23" rx="4" stroke="#4b5563" stroke-width="1"/>
  <text x="270" y="222" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Free all KV blocks of Req A (instant)</text>
  <!-- Step 4: New request runs -->
  <rect x="80" y="250" width="200" height="35" fill="#1a3a2a" rx="4"/>
  <text x="180" y="272" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">Req B runs (high priority)</text>
  <!-- Step 5: Re-prefill -->
  <rect x="80" y="300" width="120" height="35" fill="#3b2a1a" rx="4" stroke="#f59e0b" stroke-width="1"/>
  <text x="140" y="322" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11">Re-prefill A</text>
  <!-- Step 6: Resume -->
  <rect x="210" y="300" width="160" height="35" fill="#1e3a5f" rx="4"/>
  <text x="290" y="322" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Req A resumes</text>
  <!-- Stats -->
  <text x="250" y="370" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Bandwidth cost: None</text>
  <text x="250" y="390" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Compute cost: Re-prefill ~100ms/K tokens</text>
  <text x="250" y="415" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Best for: short sequences, GPU memory pressure</text>
  <!-- Right: Swap -->
  <rect x="500" y="60" width="420" height="400" fill="#24292e" rx="10" stroke="#374151" stroke-width="1"/>
  <text x="710" y="90" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Strategy: Swap to CPU</text>
  <!-- Timeline -->
  <line x1="540" y1="130" x2="880" y2="130" stroke="#4b5563" stroke-width="1"/>
  <text x="540" y="122" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">t=0</text>
  <text x="880" y="122" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">t=T</text>
  <!-- Step 1: Running -->
  <rect x="540" y="145" width="160" height="35" fill="#1e3a5f" rx="4"/>
  <text x="620" y="167" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Req A generating...</text>
  <!-- Step 2: Swap out -->
  <rect x="700" y="145" width="80" height="35" fill="#2d1b4e" rx="4" stroke="#a78bfa" stroke-width="1"/>
  <text x="740" y="167" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="9">Swap Out</text>
  <!-- Step 3: Data flow -->
  <rect x="540" y="200" width="380" height="35" fill="#1b1f23" rx="4" stroke="#4b5563" stroke-width="1"/>
  <text x="730" y="222" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">GPU KV blocks -> CPU swap pool (PCIe ~50ms/GB)</text>
  <!-- Step 4: New request -->
  <rect x="540" y="250" width="200" height="35" fill="#1a3a2a" rx="4"/>
  <text x="640" y="272" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">Req B runs (high priority)</text>
  <!-- Step 5: Swap in -->
  <rect x="540" y="300" width="80" height="35" fill="#2d1b4e" rx="4" stroke="#a78bfa" stroke-width="1"/>
  <text x="580" y="322" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="9">Swap In</text>
  <!-- Step 6: Resume -->
  <rect x="630" y="300" width="160" height="35" fill="#1e3a5f" rx="4"/>
  <text x="710" y="322" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Req A resumes instantly</text>
  <!-- Stats -->
  <text x="710" y="370" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Bandwidth cost: 2x PCIe transfer</text>
  <text x="710" y="390" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Compute cost: None (KV preserved)</text>
  <text x="710" y="415" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Best for: long sequences, ample CPU RAM</text>
  <!-- Bottom comparison -->
  <rect x="200" y="470" width="560" height="25" fill="#1b1f23" rx="4"/>
  <text x="480" y="488" text-anchor="middle" fill="#e1e4e8" font-family="system-ui, sans-serif" font-size="12">Default: Recompute (vLLM) | Swap preferred when seq_len &gt; 8K tokens</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="title desc">
<title id="title">Four Engineering Gates of Data Taste and Their Failure Branches</title>
<desc id="desc">A four-stage left-to-right engineering decision flow covering compute-data regime, training stage goal, low-cost proxy signal, and verifiable synthesis, with dashed failure exits below each gate.</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#4f4942"/>
  </marker>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#b1462f"/>
  </marker>
</defs>

<rect width="960" height="412" fill="#faf7f2"/>

<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" x="480" y="34" font-size="18" font-weight="700" fill="#1f1d1a" text-anchor="middle">Four Engineering Gates Before Touching Any Data Pipeline</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" x="480" y="57" font-size="12.5" fill="#5d574f" text-anchor="middle">Lock the boundary condition across the top path; dashed exits show what breaks when a gate is skipped</text>

<!-- Gate 1 -->
<rect x="34" y="82" width="206" height="148" rx="10" fill="#edf3f9" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M44 82 H230 Q240 82 240 92 V118 H34 V92 Q34 82 44 82 Z" fill="#d3e3f3"/>
<line x1="34" y1="118" x2="240" y2="118" stroke="#2f5d8a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="105" font-size="13" font-weight="700" fill="#1b3956">01 Compute vs. Data</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="143" font-size="11.5" fill="#23201c">• Compute-bound: filter + dedup</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="167" font-size="11.5" fill="#23201c">• Fixed pool: avoid over-pruning</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="191" font-size="11.5" fill="#23201c">• Multilingual: guard 1-epoch</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="48" y="216" font-size="10.5" font-weight="600" fill="#2f5d8a">FineWeb · Bitter · ATLAS</text>

<!-- Gate 2 -->
<rect x="262" y="82" width="206" height="148" rx="10" fill="#fcf5e6" stroke="#a6631b" stroke-width="1.6"/>
<path d="M272 82 H458 Q468 82 468 92 V118 H262 V92 Q262 82 272 82 Z" fill="#f4e0bc"/>
<line x1="262" y1="118" x2="468" y2="118" stroke="#a6631b" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="105" font-size="13" font-weight="700" fill="#633a0d">02 Training Stage Goal</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="143" font-size="11.5" fill="#23201c">• Pre/Mid: breadth then anneal</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="167" font-size="11.5" fill="#23201c">• SFT: encode control protocols</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="191" font-size="11.5" fill="#23201c">• Big pools: target hidden states</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="276" y="216" font-size="10.5" font-weight="600" fill="#9a5914">Nemotron 3 · R1 · RDS+</text>

<!-- Gate 3 -->
<rect x="490" y="82" width="206" height="148" rx="10" fill="#e9f4f0" stroke="#2c6b5a" stroke-width="1.6"/>
<path d="M500 82 H686 Q696 82 696 92 V118 H490 V92 Q490 82 500 82 Z" fill="#cae4db"/>
<line x1="490" y1="118" x2="696" y2="118" stroke="#2c6b5a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="105" font-size="13" font-weight="700" fill="#1a463a">03 Cheap Proxy Signal</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="143" font-size="11.5" fill="#23201c">• Rank corpora: continuous probs</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="167" font-size="11.5" fill="#23201c">• Bulk tagging: 1.5B judges</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="191" font-size="11.5" fill="#23201c">• Core pools: meta-gradient val</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="504" y="216" font-size="10.5" font-weight="600" fill="#255d4e">DataDecide · DataMan · Rater</text>

<!-- Gate 4 -->
<rect x="718" y="82" width="208" height="148" rx="10" fill="#f3eff8" stroke="#634b7a" stroke-width="1.6"/>
<path d="M728 82 H916 Q926 82 926 92 V118 H718 V92 Q718 82 728 82 Z" fill="#dfd5eb"/>
<line x1="718" y1="118" x2="926" y2="118" stroke="#634b7a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="105" font-size="13" font-weight="700" fill="#3f2d52">04 Verifiable Synthesis</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="143" font-size="11.5" fill="#23201c">• Anchor on real states / graphs</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="167" font-size="11.5" fill="#23201c">• Reverse-build to block shortcuts</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="191" font-size="11.5" fill="#23201c">• Isolated verifiers + rollout filter</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="732" y="216" font-size="10.5" font-weight="600" fill="#594170">Kimi K3 · AgentWorld · WeAgent</text>

<!-- Horizontal main flow arrows -->
<line x1="240" y1="156" x2="259" y2="156" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="468" y1="156" x2="487" y2="156" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="696" y1="156" x2="715" y2="156" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>

<!-- Vertical failure arrows -->
<line x1="137" y1="230" x2="137" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="365" y1="230" x2="365" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="593" y1="230" x2="593" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="822" y1="230" x2="822" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>

<!-- Failure labels -->
<rect x="85" y="241" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="137" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">Wrong regime</text>

<rect x="313" y="241" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="365" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">Mixed stages</text>

<rect x="541" y="241" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="593" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">No proxy check</text>

<rect x="768" y="241" width="108" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="822" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">Self-judged synth</text>

<!-- Failure cards -->
<rect x="34" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="302" font-size="11.5" font-weight="700" fill="#9b3621">Fail 1: Silent Distribution Shift</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="325" font-size="11" fill="#433834">Global dedup upsamples spam;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="345" font-size="11" fill="#433834">hard filters hit the data wall;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="48" y="365" font-size="11" fill="#433834">low-resource &gt;1 epoch decays.</text>

<rect x="262" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="302" font-size="11.5" font-weight="700" fill="#9b3621">Fail 2: Scorer Gaming &amp; Drift</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="325" font-size="11" fill="#433834">External scorers lose to random;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="345" font-size="11" fill="#433834">long-only hurts short context;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="365" font-size="11" fill="#433834">forced truncation breaks CoT.</text>

<rect x="490" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="302" font-size="11.5" font-weight="700" fill="#9b3621">Fail 3: Bias &amp; Noise Amplification</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="325" font-size="11" fill="#433834">Eyeballing 10 rows fuels bias;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="345" font-size="11" fill="#433834">small-scale Acc is coin-flip;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="365" font-size="11" fill="#433834">raw high-loss picks gibberish.</text>

<rect x="718" y="278" width="208" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="302" font-size="11.5" font-weight="700" fill="#9b3621">Fail 4: Shortcuts &amp; Sim Drift</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="325" font-size="11" fill="#433834">URLs leak multimodal answers;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="345" font-size="11" fill="#433834">vague seeds cause sim drift;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="365" font-size="11" fill="#433834">weak checks invite reward hacks.</text>
</svg>

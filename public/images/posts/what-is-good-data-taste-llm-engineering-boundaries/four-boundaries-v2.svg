<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="title desc">
<title id="title">改数据管线前先想清楚四件事</title>
<desc id="desc">自左向右四个问题：缺卡还是缺数据、现在训到哪一步、别光靠肉眼验样本、数据不够时让环境当裁判；下方虚线框标出想反了会怎么翻车。</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#4f4942"/>
  </marker>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#b1462f"/>
  </marker>
</defs>

<rect width="960" height="412" fill="#faf7f2"/>

<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif" x="480" y="34" font-size="18.5" font-weight="700" fill="#1f1d1a" text-anchor="middle">改清洗或合成策略前，先想清楚这四件事</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif" x="480" y="57" font-size="12.5" fill="#5d574f" text-anchor="middle">上面一排是该怎么做，下面虚线是想反了、偷懒了会怎么翻车</text>

<!-- Gate 1 -->
<rect x="34" y="82" width="206" height="148" rx="10" fill="#edf3f9" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M44 82 H230 Q240 82 240 92 V118 H34 V92 Q34 82 44 82 Z" fill="#d3e3f3"/>
<line x1="34" y1="118" x2="240" y2="118" stroke="#2f5d8a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="105" font-size="13.5" font-weight="700" fill="#1b3956">01 缺卡，还是缺数据？</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="143" font-size="12" fill="#23201c">• 卡不够：放心去重和清洗</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="167" font-size="12" fill="#23201c">• 数据见底：砍太狠反学不够</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="191" font-size="12" fill="#23201c">• 小语种：别反复多轮硬背</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="48" y="216" font-size="10.5" font-weight="600" fill="#2f5d8a">FineWeb · Bitter · ATLAS</text>

<!-- Gate 2 -->
<rect x="262" y="82" width="206" height="148" rx="10" fill="#fcf5e6" stroke="#a6631b" stroke-width="1.6"/>
<path d="M272 82 H458 Q468 82 468 92 V118 H262 V92 Q262 82 272 82 Z" fill="#f4e0bc"/>
<line x1="262" y1="118" x2="468" y2="118" stroke="#a6631b" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="105" font-size="13.5" font-weight="700" fill="#633a0d">02 现在训到哪一步？</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="143" font-size="12" fill="#23201c">• 预训练求广，退火期求精</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="167" font-size="12" fill="#23201c">• SFT 教规矩（截断/调工具）</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="191" font-size="12" fill="#23201c">• 池子太大时，让模型自己挑</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="276" y="216" font-size="10.5" font-weight="600" fill="#9a5914">Nemotron 3 · R1 · RDS+</text>

<!-- Gate 3 -->
<rect x="490" y="82" width="206" height="148" rx="10" fill="#e9f4f0" stroke="#2c6b5a" stroke-width="1.6"/>
<path d="M500 82 H686 Q696 82 696 92 V118 H490 V92 Q490 82 500 82 Z" fill="#cae4db"/>
<line x1="490" y1="118" x2="696" y2="118" stroke="#2c6b5a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="105" font-size="13.5" font-weight="700" fill="#1a463a">03 花小钱怎么验好坏？</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="143" font-size="12" fill="#23201c">• 小模型看“答对概率”排先后</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="167" font-size="12" fill="#23201c">• 批量清洗用 1.5B 裁判打标</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="191" font-size="12" fill="#23201c">• 脏池看训完验证集降没降</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="504" y="216" font-size="10.5" font-weight="600" fill="#255d4e">DataDecide · DataMan · Rater</text>

<!-- Gate 4 -->
<rect x="718" y="82" width="208" height="148" rx="10" fill="#f3eff8" stroke="#634b7a" stroke-width="1.6"/>
<path d="M728 82 H916 Q926 82 926 92 V118 H718 V92 Q718 82 728 82 Z" fill="#dfd5eb"/>
<line x1="718" y1="118" x2="926" y2="118" stroke="#634b7a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="105" font-size="13.5" font-weight="700" fill="#3f2d52">04 造数据谁来判对错？</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="143" font-size="12" fill="#23201c">• 拿真实文档/状态打底防雷同</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="167" font-size="12" fill="#23201c">• 反着出题，堵死文本蒙答案</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="191" font-size="12" fill="#23201c">• 真环境跑通 + 藏测试防作弊</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="732" y="216" font-size="10.5" font-weight="600" fill="#594170">Kimi K3 · AgentWorld · WeAgent</text>

<!-- Horizontal main flow arrows -->
<line x1="240" y1="156" x2="259" y2="156" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="468" y1="156" x2="487" y2="156" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="696" y1="156" x2="715" y2="156" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>

<!-- Vertical failure arrows -->
<line x1="137" y1="230" x2="137" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="365" y1="230" x2="365" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="593" y1="230" x2="593" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="822" y1="230" x2="822" y2="275" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>

<!-- Failure labels on arrows -->
<rect x="93" y="241" width="88" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="137" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">想反了会怎样</text>

<rect x="321" y="241" width="88" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="365" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">混着用会怎样</text>

<rect x="549" y="241" width="88" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="593" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">靠感觉会怎样</text>

<rect x="774" y="241" width="96" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="822" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">自己评会怎样</text>

<!-- Failure cards -->
<rect x="34" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="302" font-size="12" font-weight="700" fill="#9b3621">踩坑 1：越洗越脏或洗光了</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="325" font-size="11.5" fill="#433834">跨历史删重把好网页删空，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="346" font-size="11.5" fill="#433834">广告页反变多；池子被砍光</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="367" font-size="11.5" fill="#433834">后，模型很快背死过拟合。</text>

<rect x="262" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="302" font-size="12" font-weight="700" fill="#9b3621">踩坑 2：挑歪了还伤基础</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="325" font-size="11.5" fill="#433834">大池外置打分器跑输随机；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="346" font-size="11.5" fill="#433834">只喂超长文反拖垮短对话；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="367" font-size="11.5" fill="#433834">线上强截断思考直接乱答。</text>

<rect x="490" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="302" font-size="12" font-weight="700" fill="#9b3621">踩坑 3：越翻越偏、误杀好料</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="325" font-size="11.5" fill="#433834">肉眼翻 10 条专找印证猜想的；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="346" font-size="11.5" fill="#433834">小模型看准确率全 0 选不出；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="367" font-size="11.5" fill="#433834">专挑高 loss 样本选出乱码。</text>

<rect x="718" y="278" width="208" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="302" font-size="12" font-weight="700" fill="#9b3621">踩坑 4：模型学会钻空子</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="325" font-size="11.5" fill="#433834">URL 泄答案，模型根本不看图；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="346" font-size="11.5" fill="#433834">种子太粗，仿真几步就跑偏；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="367" font-size="11.5" fill="#433834">没隐藏测试，直接刷爆漏洞。</text>
</svg>

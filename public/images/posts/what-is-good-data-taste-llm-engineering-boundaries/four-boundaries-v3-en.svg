<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" width="960" height="418" role="img" aria-labelledby="title desc">
<title id="title">Four Questions to Answer Before Editing Any Data Pipeline</title>
<desc id="desc">Four plain-English engineering checks across the top row: whether you lack GPUs, unique data, or trustworthy verifiers; which stage you are training; how to layer corpus and trajectory checks cheaply; and how to keep synthesis information-open with audited verifiers, with dashed failure traps below.</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#4f4942"/>
  </marker>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#b1462f"/>
  </marker>
</defs>

<rect width="960" height="418" fill="#faf7f2"/>

<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" x="480" y="34" font-size="18" font-weight="700" fill="#1f1d1a" text-anchor="middle">Four Questions to Answer Before Editing Any Data Pipeline</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" x="480" y="57" font-size="12.2" fill="#5d574f" text-anchor="middle">Top row: what works. Dashed traps below: how pipelines fail (audit contamination, judges, and lineage first).</text>

<!-- Gate 1 -->
<rect x="34" y="82" width="206" height="150" rx="10" fill="#edf3f9" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M44 82 H230 Q240 82 240 92 V118 H34 V92 Q34 82 44 82 Z" fill="#d3e3f3"/>
<line x1="34" y1="118" x2="240" y2="118" stroke="#2f5d8a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="105" font-size="12.4" font-weight="700" fill="#1b3956">01 GPUs, Data, or Verifiers?</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="143" font-size="11.3" fill="#23201c">• Short on GPUs: filter &amp; dedup</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="167" font-size="11.3" fill="#23201c">• Short on data: track exposure</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="191" font-size="11.3" fill="#23201c">• Weak verifier: fix judge first</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="46" y="218" font-size="10.2" font-weight="600" fill="#2f5d8a">FineWeb · Bitter · Olmix</text>

<!-- Gate 2 -->
<rect x="262" y="82" width="206" height="150" rx="10" fill="#fcf5e6" stroke="#a6631b" stroke-width="1.6"/>
<path d="M272 82 H458 Q468 82 468 92 V118 H262 V92 Q262 82 272 82 Z" fill="#f4e0bc"/>
<line x1="262" y1="118" x2="468" y2="118" stroke="#a6631b" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="105" font-size="12.4" font-weight="700" fill="#633a0d">02 Which Stage Is This?</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="143" font-size="11.3" fill="#23201c">• Pretrain broad, midtrain for RL</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="167" font-size="11.3" fill="#23201c">• SFT teaches runtime protocols</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="191" font-size="11.3" fill="#23201c">• Huge pool: base hidden states</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="276" y="218" font-size="10.2" font-weight="600" fill="#9a5914">Nemotron 3 · TrajLong · RDS+</text>

<!-- Gate 3 -->
<rect x="490" y="82" width="206" height="150" rx="10" fill="#e9f4f0" stroke="#2c6b5a" stroke-width="1.6"/>
<path d="M500 82 H686 Q696 82 696 92 V118 H490 V92 Q490 82 500 82 Z" fill="#cae4db"/>
<line x1="490" y1="118" x2="696" y2="118" stroke="#2c6b5a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="105" font-size="12.4" font-weight="700" fill="#1a463a">03 How to Layer Validation?</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="143" font-size="11.3" fill="#23201c">• Corpora: small-model prob + tag</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="167" font-size="11.3" fill="#23201c">• Traces: step mask + 4-way sort</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="191" font-size="11.3" fill="#23201c">• Human calib + real env gate</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="504" y="218" font-size="10.2" font-weight="600" fill="#255d4e">DataDecide · SRFT · GRM</text>

<!-- Gate 4 -->
<rect x="718" y="82" width="208" height="150" rx="10" fill="#f3eff8" stroke="#634b7a" stroke-width="1.6"/>
<path d="M728 82 H916 Q926 82 926 92 V118 H718 V92 Q718 82 728 82 Z" fill="#dfd5eb"/>
<line x1="718" y1="118" x2="926" y2="118" stroke="#634b7a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="105" font-size="12.4" font-weight="700" fill="#3f2d52">04 Who Grades Synth Data?</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="143" font-size="11.3" fill="#23201c">• Stay info-open via real signals</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="167" font-size="11.3" fill="#23201c">• Build backward to kill shortcuts</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="191" font-size="11.3" fill="#23201c">• Audit judge via 2×2 &amp; Cohen κ</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="732" y="218" font-size="10.2" font-weight="600" fill="#594170">Kimi K3 · AgentWorld · κ</text>

<!-- Horizontal main flow arrows -->
<line x1="240" y1="157" x2="259" y2="157" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="468" y1="157" x2="487" y2="157" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="696" y1="157" x2="715" y2="157" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>

<!-- Vertical failure arrows -->
<line x1="137" y1="232" x2="137" y2="278" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="365" y1="232" x2="365" y2="278" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="593" y1="232" x2="593" y2="278" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="822" y1="232" x2="822" y2="278" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>

<!-- Failure labels -->
<rect x="85" y="244" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="137" y="258" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">Misread bottleneck</text>

<rect x="313" y="244" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="365" y="258" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">Mix stage rules</text>

<rect x="541" y="244" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="593" y="258" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">Skip layered checks</text>

<rect x="768" y="244" width="108" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="822" y="258" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">Trust judge blindly</text>

<!-- Failure cards -->
<rect x="34" y="282" width="206" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="306" font-size="11.3" font-weight="700" fill="#9b3621">Trap 1: Skew, Starve, or Amplify</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="329" font-size="10.8" fill="#433834">Global dedup boosts ads; harsh</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="349" font-size="10.8" fill="#433834">cuts starve pools; lenient judges</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="46" y="369" font-size="10.8" fill="#433834">scale bad traces with more GPUs.</text>

<rect x="262" y="282" width="206" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="306" font-size="11.3" font-weight="700" fill="#9b3621">Trap 2: Mirage Gains &amp; Drift</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="329" font-size="10.8" fill="#433834">Raw mid-train gains vanish post-</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="349" font-size="10.8" fill="#433834">SFT; big-pool scorers lose to</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="276" y="369" font-size="10.8" fill="#433834">random; cutoffs break answers.</text>

<rect x="490" y="282" width="206" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="306" font-size="11.3" font-weight="700" fill="#9b3621">Trap 3: Bias &amp; Wasted Negatives</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="329" font-size="10.8" fill="#433834">Eyeballing 10 rows confirms bias;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="349" font-size="10.8" fill="#433834">tossing all failed runs throws</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="504" y="369" font-size="10.8" fill="#433834">away recovery and negative signal.</text>

<rect x="718" y="282" width="208" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="306" font-size="11.3" font-weight="700" fill="#9b3621">Trap 4: Collapse &amp; Judge Drift</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="329" font-size="10.8" fill="#433834">Closed loops decay via DPI; raw</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="349" font-size="10.8" fill="#433834">agreement hides position bias &amp;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" x="732" y="369" font-size="10.8" fill="#433834">lets models game weak judges.</text>
</svg>

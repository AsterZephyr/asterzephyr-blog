<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="title desc">
<title id="title">大模型数据 Taste 的四道工程决策关与失效分支</title>
<desc id="desc">自左向右依次经过算力与数据区位、训练阶段目标、低成本估值信号、可验证合成闭环四道工程关口，每道关口下方以虚线标出跳过或误判时的典型失效模式。</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#4f4942"/>
  </marker>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#b1462f"/>
  </marker>
</defs>

<rect width="960" height="412" fill="#faf7f2"/>

<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif" x="480" y="34" font-size="18.5" font-weight="700" fill="#1f1d1a" text-anchor="middle">改数据管线前先过四道工程关：主决策流与常见踩坑分支</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif" x="480" y="57" font-size="12.5" fill="#5d574f" text-anchor="middle">上排按顺序锁定边界条件，下排虚线标出跳过该关或套错前提时的典型失效</text>

<!-- Gate 1 -->
<rect x="34" y="82" width="206" height="148" rx="10" fill="#edf3f9" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M44 82 H230 Q240 82 240 92 V118 H34 V92 Q34 82 44 82 Z" fill="#d3e3f3"/>
<line x1="34" y1="118" x2="240" y2="118" stroke="#2f5d8a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="105" font-size="13.5" font-weight="700" fill="#1b3956">01 算力与数据区位</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="143" font-size="12" fill="#23201c">• 算力紧：单快照去重+过滤</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="167" font-size="12" fill="#23201c">• 固定池：警惕过严硬砍</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="48" y="191" font-size="12" fill="#23201c">• 多语种：严守 1-epoch 拐点</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="48" y="216" font-size="10.5" font-weight="600" fill="#2f5d8a">FineWeb · Bitter · ATLAS</text>

<!-- Gate 2 -->
<rect x="262" y="82" width="206" height="148" rx="10" fill="#fcf5e6" stroke="#a6631b" stroke-width="1.6"/>
<path d="M272 82 H458 Q468 82 468 92 V118 H262 V92 Q262 82 272 82 Z" fill="#f4e0bc"/>
<line x1="262" y1="118" x2="468" y2="118" stroke="#a6631b" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="105" font-size="13.5" font-weight="700" fill="#633a0d">02 训练阶段目标</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="143" font-size="12" fill="#23201c">• Pre/Mid：广度后做退火锐化</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="167" font-size="12" fill="#23201c">• SFT：把交互协议写进分布</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="276" y="191" font-size="12" fill="#23201c">• 百万池：切回基座自身表征</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="276" y="216" font-size="10.5" font-weight="600" fill="#9a5914">Nemotron 3 · R1 · RDS+</text>

<!-- Gate 3 -->
<rect x="490" y="82" width="206" height="148" rx="10" fill="#e9f4f0" stroke="#2c6b5a" stroke-width="1.6"/>
<path d="M500 82 H686 Q696 82 696 92 V118 H490 V92 Q490 82 500 82 Z" fill="#cae4db"/>
<line x1="490" y1="118" x2="696" y2="118" stroke="#2c6b5a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="105" font-size="13.5" font-weight="700" fill="#1a463a">03 低成本估值信号</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="143" font-size="12" fill="#23201c">• 语料排序：看连续概率指标</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="167" font-size="12" fill="#23201c">• 批量初筛：1.5B 多维打标</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="504" y="191" font-size="12" fill="#23201c">• 高价值池：双层验证元梯度</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="504" y="216" font-size="10.5" font-weight="600" fill="#255d4e">DataDecide · DataMan · Rater</text>

<!-- Gate 4 -->
<rect x="718" y="82" width="208" height="148" rx="10" fill="#f3eff8" stroke="#634b7a" stroke-width="1.6"/>
<path d="M728 82 H916 Q926 82 926 92 V118 H718 V92 Q718 82 728 82 Z" fill="#dfd5eb"/>
<line x1="718" y1="118" x2="926" y2="118" stroke="#634b7a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="105" font-size="13.5" font-weight="700" fill="#3f2d52">04 可验证合成闭环</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="143" font-size="12" fill="#23201c">• 真实状态/图谱作锚定种子</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="167" font-size="12" fill="#23201c">• 逆向构造堵死文本捷径</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="732" y="191" font-size="12" fill="#23201c">• 隔离验证器 + 组内对比筛题</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="732" y="216" font-size="10.5" font-weight="600" fill="#594170">Kimi K3 · AgentWorld · WeAgent</text>


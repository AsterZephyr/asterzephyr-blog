<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="137" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">看错区位时</text>

<rect x="321" y="241" width="88" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="365" y="255" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">混用标准时</text>


<!-- Failure cards -->
<rect x="34" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="302" font-size="12" font-weight="700" fill="#9b3621">失效 1：隐性分布畸变</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="325" font-size="11.5" fill="#433834">跨快照删重反把广告页抬高；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="346" font-size="11.5" fill="#433834">固定池硬砍提前撞上数据墙；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="48" y="367" font-size="11.5" fill="#433834">小语种超 1 轮收益急坠。</text>

<rect x="262" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="302" font-size="12" font-weight="700" fill="#9b3621">失效 2：裁判偏见与退化</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="325" font-size="11.5" fill="#433834">百万池外置打分器跑输随机；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="346" font-size="11.5" fill="#433834">纯超长序列反伤短上下文；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="276" y="367" font-size="11.5" fill="#433834">线上强截断思考直接乱答。</text>

<rect x="490" y="278" width="206" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="302" font-size="12" font-weight="700" fill="#9b3621">失效 3：误判与噪声放大</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="325" font-size="11.5" fill="#433834">肉眼翻 10 条放大确认偏误；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="346" font-size="11.5" fill="#433834">小模型看离散 Acc 等于抛硬币；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="504" y="367" font-size="11.5" fill="#433834">专挑高 loss 样本选出乱码。</text>

<rect x="718" y="278" width="208" height="104" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="302" font-size="12" font-weight="700" fill="#9b3621">失效 4：伪难度与捷径刷分</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="325" font-size="11.5" fill="#433834">多模态题面 URL 泄答案；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="346" font-size="11.5" fill="#433834">粗略 prompt 致仿真迅速漂移；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="732" y="367" font-size="11.5" fill="#433834">无隔离验证触发 reward hacking。</text>

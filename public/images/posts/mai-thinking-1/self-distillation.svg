<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 990" width="680" height="990" role="img" aria-labelledby="t d">
<title id="t">What self-distillation carries across a restart</title>
<desc id="d">RL rollouts are stored; successful traces from a range of later checkpoints are selected; a mid-trained checkpoint is fine-tuned on them together with mid-training data; the next RL climb starts from that model. The previous policy weights are not carried over.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 5, 0 10" fill="#5a5a5a"/></marker></defs>
<rect width="680" height="990" fill="#f8f6f3"/>
<rect id="climb-n" x="60" y="24" width="320" height="96" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="220.0" y="56" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a">RL climb N</text>
<text x="220.0" y="84" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">restart after a collapse,</text>
<text x="220.0" y="108" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">a newer base or a format switch</text>
<rect id="weights-n" x="410" y="24" width="210" height="96" rx="12" ry="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="515.0" y="56" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a">Policy weights</text>
<text x="515.0" y="84" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">not carried over</text>
<line x1="380" y1="72" x2="408" y2="72" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<text x="620" y="146" font-size="15" font-weight="400" text-anchor="end" fill="#6a6a6a">instability may already be inside</text>
<line x1="220" y1="120" x2="220" y2="168" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<text x="206" y="150" font-size="16" font-weight="400" text-anchor="end" fill="#6a6a6a">rollouts written during RL</text>
<rect id="store" x="60" y="170" width="320" height="84" rx="12" ry="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="220.0" y="202" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a">Rollout store</text>
<text x="220.0" y="230" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">traces from many checkpoints</text>
<line x1="220" y1="254" x2="220" y2="294" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="select" x="60" y="296" width="560" height="170" rx="12" ry="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="340.0" y="328" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a">Select about 1M traces</text>
<text x="340.0" y="356" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">successful traces only</text>
<text x="340.0" y="380" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">from a range of later checkpoints</text>
<text x="340.0" y="404" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">random sampling across many prompts</text>
<text x="340.0" y="428" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">drop samples that show reward hacking</text>
<line x1="340.0" y1="466" x2="340.0" y2="652" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="mt-data" x="60" y="506" width="250" height="104" rx="12" ry="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="185.0" y="538" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">Mid-training data</text>
<text x="185.0" y="566" font-size="16" font-weight="400" text-anchor="middle" fill="#1a1a1a">mixed in before length</text>
<text x="185.0" y="590" font-size="16" font-weight="400" text-anchor="middle" fill="#1a1a1a">extension (long context)</text>
<rect id="mt-ckpt" x="370" y="506" width="250" height="104" rx="12" ry="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="495.0" y="538" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">Mid-trained checkpoint</text>
<text x="495.0" y="566" font-size="16" font-weight="400" text-anchor="middle" fill="#1a1a1a">same or newer base</text>
<line x1="185" y1="610" x2="185" y2="652" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="495" y1="610" x2="495" y2="652" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="sft" x="60" y="654" width="560" height="104" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="340.0" y="686" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a">SFT on the selected traces</text>
<text x="340.0" y="714" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">dropout 0.15 · load-balance coefficient 1e-2</text>
<line x1="340.0" y1="758" x2="340.0" y2="802" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="climb-n1" x="60" y="804" width="560" height="104" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="340.0" y="836" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a">RL climb N+1</text>
<text x="340.0" y="864" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">starts from the SFT model</text>
<text x="340.0" y="888" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">load-balance coefficient 1e-5</text>
<text x="340.0" y="960" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a" font-style="italic">carried across: behavior in traces · discarded: the old weights</text>
</svg>

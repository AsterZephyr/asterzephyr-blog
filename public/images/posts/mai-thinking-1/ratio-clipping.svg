<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 710" width="680" height="710" role="img" aria-labelledby="t d">
<title id="t">Where the importance ratio still moves the policy</title>
<desc id="d">Log-scale axis of the importance ratio r. For positive advantage the clipped term passes gradient below the upper bound 2.5 + k; for negative advantage it passes gradient from 0.4 up to the outer clip at 50. Typical settings: epsilon 0.6, k between 0 and 2.5, r_max 50.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 5, 0 10" fill="#5a5a5a"/></marker></defs>
<rect width="680" height="710" fill="#f8f6f3"/>
<text x="70" y="40" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">importance ratio r = π_θ / π_old, log scale</text>
<text x="70" y="96" font-size="19" font-weight="700" text-anchor="start" fill="#1a1a1a">A &gt; 0: rollout better than its group</text>
<rect id="pos-grad" x="70.0" y="110" width="231.7" height="54" rx="6" ry="6" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/>
<rect id="pos-k" x="301.7" y="110" width="63.6" height="54" rx="6" ry="6" fill="#cfe9e2" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="5,4"/>
<rect id="pos-clip" x="365.2" y="110" width="274.8" height="54" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
<text x="185.82913230049195" y="144" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">gradient</text>
<text x="333.44577932934453" y="144" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">+ k</text>
<text x="502.6166470288525" y="144" font-size="18" font-weight="400" text-anchor="middle" fill="#3a3a3a">clipped: no gradient</text>
<text x="333.44577932934453" y="192" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a">upper bound 2.5 + k slides here as k goes 0 to 2.5</text>
<text x="70" y="252" font-size="19" font-weight="700" text-anchor="start" fill="#1a1a1a">A &lt; 0: rollout worse than its group</text>
<rect id="neg-clip" x="70.0" y="266" width="63.6" height="54" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
<rect id="neg-grad" x="133.6" y="266" width="442.8" height="54" rx="6" ry="6" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/>
<rect id="neg-outer" x="576.4" y="266" width="63.6" height="54" rx="6" ry="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
<line x1="301.6582646009839" y1="268" x2="301.6582646009839" y2="318" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="217.61664702885253" y="300" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">trust region</text>
<text x="439.0416175721313" y="300" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">unclipped GRPO branch</text>
<text x="78" y="348" font-size="16" font-weight="400" text-anchor="start" fill="#6a6a6a">below 0.4: no further push down</text>
<text x="636.0" y="348" font-size="16" font-weight="400" text-anchor="end" fill="#6a6a6a">above 50: outer clip, no gradient</text>
<line x1="70" y1="420" x2="648" y2="420" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="133.57502945672115" y1="412" x2="133.57502945672115" y2="428" stroke="#5a5a5a" stroke-width="2"/>
<text x="133.57502945672115" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">0.4</text>
<text x="133.57502945672115" y="476" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a">1 − ε</text>
<line x1="217.61664702885255" y1="412" x2="217.61664702885255" y2="428" stroke="#5a5a5a" stroke-width="2"/>
<text x="217.61664702885255" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">1</text>
<text x="217.61664702885255" y="476" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a">no change</text>
<line x1="301.6582646009839" y1="412" x2="301.6582646009839" y2="428" stroke="#5a5a5a" stroke-width="2"/>
<text x="301.6582646009839" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">2.5</text>
<text x="301.6582646009839" y="476" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a">(1 − ε)⁻¹</text>
<line x1="365.2332940577051" y1="412" x2="365.2332940577051" y2="428" stroke="#5a5a5a" stroke-width="2"/>
<text x="365.2332940577051" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">5.0</text>
<text x="365.2332940577051" y="500" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a">2.5 + k_max</text>
<line x1="576.4249705432787" y1="412" x2="576.4249705432787" y2="428" stroke="#5a5a5a" stroke-width="2"/>
<text x="576.4249705432787" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">50</text>
<text x="576.4249705432787" y="476" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a">r_max</text>
<rect id="legend" x="70" y="526" width="255" height="110" rx="10" ry="10" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
<rect x="86" y="546" width="34" height="22" rx="4" ry="4" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="132" y="563" font-size="16" font-weight="400" text-anchor="start" fill="#1a1a1a">term passes gradient</text>
<rect x="86" y="586" width="34" height="22" rx="4" ry="4" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="132" y="603" font-size="16" font-weight="400" text-anchor="start" fill="#1a1a1a">no gradient via this term</text>
<rect id="settings" x="345" y="526" width="295" height="110" rx="10" ry="10" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
<text x="492" y="556" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">typical settings (Sec. 3.1.5)</text>
<text x="492" y="584" font-size="16" font-weight="400" text-anchor="middle" fill="#1a1a1a">ε = 0.6, k from 0 to 2.5</text>
<text x="492" y="610" font-size="16" font-weight="400" text-anchor="middle" fill="#1a1a1a">r_max = 50, no lower outer clip</text>
<text x="340" y="680" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a" font-style="italic">clipping bounds the objective term, not the shared weights</text>
</svg>

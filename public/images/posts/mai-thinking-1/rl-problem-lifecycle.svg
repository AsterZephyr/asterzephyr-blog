<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1270" width="680" height="1270" role="img" aria-labelledby="t d">
<title id="t">One RL problem through Rocket</title>
<desc id="d">Path of one RL problem: controller, problem worker, rollout workers and SGLang inference, early pass-rate gate, full group, group filter, shaped reward and group advantage, staleness check, learner update and weight push every 5 steps.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 5, 0 10" fill="#5a5a5a"/></marker></defs>
<rect width="680" height="1270" fill="#f8f6f3"/>
<rect id="controller" x="96" y="24" width="400" height="84" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="296.0" y="56" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Controller</text>
<text x="296.0" y="84" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">takes problem q from a problem set</text>
<line x1="296.0" y1="108" x2="296.0" y2="146" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="problem-worker" x="96" y="148" width="400" height="84" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="296.0" y="180" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Problem worker</text>
<text x="296.0" y="208" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">requests 16 rollouts first</text>
<line x1="401" y1="232" x2="401" y2="270" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="inference" x="96" y="272" width="190" height="112" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="191" y="304" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">SGLang inference</text>
<text x="191" y="332" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">router + replicas</text>
<text x="191" y="356" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">current weights</text>
<rect id="rollout-workers" x="306" y="272" width="190" height="112" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="401" y="304" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">Rollout workers</text>
<text x="401" y="332" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">prompt, answer,</text>
<text x="401" y="356" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a">tool calls, grade</text>
<line x1="306" y1="314" x2="288" y2="314" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="286" y1="346" x2="304" y2="346" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="401" y1="384" x2="401" y2="424" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="gate-early" x="96" y="426" width="400" height="112" rx="12" ry="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="296.0" y="458" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Early gate</text>
<text x="296.0" y="486" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">task pass rate of the 16 rollouts</text>
<text x="296.0" y="511" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">in [0.05, 0.8], i.e. 1 to 12 pass</text>
<line x1="496" y1="470" x2="526" y2="470" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<text x="536" y="466" font-size="17" font-weight="700" text-anchor="start" fill="#6a6a6a">drop:</text>
<text x="536" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#6a6a6a">outside range</text>
<line x1="296.0" y1="538" x2="296.0" y2="576" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="full-group" x="96" y="578" width="400" height="70" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="296.0" y="610" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a">Full group of rollouts, graded</text>
<line x1="296.0" y1="648" x2="296.0" y2="686" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="gate-group" x="96" y="688" width="400" height="88" rx="12" ry="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="296.0" y="720" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Group filter</text>
<text x="296.0" y="748" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">task pass rate in [0.1, 0.8]</text>
<line x1="496" y1="730" x2="526" y2="730" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<text x="536" y="726" font-size="17" font-weight="700" text-anchor="start" fill="#6a6a6a">drop:</text>
<text x="536" y="748" font-size="15" font-weight="400" text-anchor="start" fill="#6a6a6a">low variance</text>
<line x1="296.0" y1="776" x2="296.0" y2="814" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="reward" x="96" y="816" width="400" height="136" rx="12" ry="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="296.0" y="848" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Reward and advantage</text>
<text x="296.0" y="876" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">R = R_task + 0.5·R_lang − 0.25·R_len</text>
<text x="296.0" y="901" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">A_i = (R_i − mean) / std in the group</text>
<text x="296.0" y="926" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">same A for every token of rollout i</text>
<line x1="296.0" y1="952" x2="296.0" y2="990" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<text x="310.0" y="978.0" font-size="16" font-weight="400" text-anchor="start" fill="#6a6a6a">batched for the learner</text>
<rect id="staleness" x="96" y="992" width="400" height="70" rx="12" ry="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="296.0" y="1024" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a">Staleness check</text>
<line x1="496" y1="1027" x2="526" y2="1027" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<text x="536" y="1023" font-size="17" font-weight="700" text-anchor="start" fill="#6a6a6a">drop:</text>
<text x="536" y="1045" font-size="15" font-weight="400" text-anchor="start" fill="#6a6a6a">&gt; 8 updates old</text>
<line x1="296.0" y1="1062" x2="296.0" y2="1100" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/>
<rect id="learner" x="96" y="1102" width="400" height="112" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="296.0" y="1134" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Learner (YOLO)</text>
<text x="296.0" y="1162" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">token-level GRPO, clipped ratio</text>
<text x="296.0" y="1187" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a">pushes new weights every 5 steps</text>
<path d="M 96 1158 L 56 1158 L 56 328 L 94 328" fill="none" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="40" y="760" font-size="17" fill="#6a6a6a" text-anchor="middle" transform="rotate(-90 40 760)">new weights every 5 learner steps</text>
<text x="340" y="1250" font-size="16" font-weight="400" text-anchor="middle" fill="#6a6a6a">pass rate = share of rollouts passing the task grader, not total reward</text>
</svg>

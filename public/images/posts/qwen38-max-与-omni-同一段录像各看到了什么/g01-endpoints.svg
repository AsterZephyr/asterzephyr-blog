<svg xmlns="http://www.w3.org/2000/svg" width="720" height="735" viewBox="0 0 720 735" role="img" aria-label="同一家族，先分清三个入口"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626977"/></marker></defs><rect width="720" height="735" rx="20" fill="#faf8f3"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="48" fill="#282c35" font-size="29" font-weight="600" text-anchor="start">同一家族，先分清三个入口</text><text x="36" y="79" fill="#626977" font-size="18" font-weight="400" text-anchor="start">公开 API 边界  ·  能力重叠不等于接口相同</text><rect x="36" y="108" width="648" height="152" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="58" y="143" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">Qwen3.8-Max</text><text x="58" y="177" fill="#626977" font-size="22" font-weight="400" text-anchor="start">输入：文本 · 图像 · 视频</text><text x="58" y="206" fill="#626977" font-size="22" font-weight="400" text-anchor="start">输出：文本，可组织工具执行</text><text x="58" y="235" fill="#626977" font-size="22" font-weight="400" text-anchor="start">声音输入：当前模型表未列出</text><rect x="36" y="284" width="648" height="152" rx="13" fill="#eee8ff" stroke="#dedbd4"/><text x="58" y="319" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">Qwen3.8-Omni-Flash</text><text x="58" y="353" fill="#626977" font-size="22" font-weight="400" text-anchor="start">输入：包括音频、视频声音</text><text x="58" y="382" fill="#626977" font-size="22" font-weight="400" text-anchor="start">输出：当前文档明确为文本</text><text x="58" y="411" fill="#626977" font-size="22" font-weight="400" text-anchor="start">语音输出：不能仅由 Omni 名称推定</text><rect x="36" y="460" width="648" height="152" rx="13" fill="#dcf1ec" stroke="#dedbd4"/><text x="58" y="495" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">Qwen3.8-Omni-Flash-Realtime</text><text x="58" y="529" fill="#626977" font-size="22" font-weight="400" text-anchor="start">输入：持续的音视频等信号</text><text x="58" y="558" fill="#626977" font-size="22" font-weight="400" text-anchor="start">输出：实时文本与语音会话</text><text x="58" y="587" fill="#626977" font-size="22" font-weight="400" text-anchor="start">运行：报告列为 non-thinking</text><text x="36" y="660" fill="#282c35" font-size="21" font-weight="400" text-anchor="start">这里比较可调用接口，不推断内部能力的绝对上限。</text><text x="36" y="710" fill="#626977" font-size="17" font-weight="400" text-anchor="start">来源：官方 vision-models / s2s-models  ·  2026-10-01</text></g></svg>
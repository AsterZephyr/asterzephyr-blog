<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-label="同一段视频，不同的证据"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626977"/></marker></defs><rect width="720" height="770" rx="20" fill="#faf8f3"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="48" fill="#282c35" font-size="29" font-weight="600" text-anchor="start">同一段视频，不同的证据</text><text x="36" y="79" fill="#626977" font-size="18" font-weight="400" text-anchor="start">会议为假设场景  ·  信号能否保留取决于输入流程</text><rect x="36" y="108" width="648" height="100" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="58" y="143" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">画面：预算表与投屏版本</text><text x="58" y="177" fill="#626977" font-size="22" font-weight="400" text-anchor="start">列名、金额、手势、画面切换</text><rect x="36" y="232" width="648" height="100" rx="13" fill="#ffffff" stroke="#dedbd4"/><text x="58" y="267" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">转写文本：说了什么</text><text x="58" y="301" fill="#626977" font-size="22" font-weight="400" text-anchor="start">版本名称、日期、明确口述的指令</text><rect x="36" y="356" width="648" height="129" rx="13" fill="#eee8ff" stroke="#dedbd4"/><text x="58" y="391" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">原声音：怎样发生</text><text x="58" y="425" fill="#626977" font-size="22" font-weight="400" text-anchor="start">重叠发言、停顿、背景事件</text><text x="58" y="454" fill="#626977" font-size="22" font-weight="400" text-anchor="start">没有保留的声音，长上下文无法补回</text><rect x="36" y="509" width="648" height="129" rx="13" fill="#dcf1ec" stroke="#dedbd4"/><text x="58" y="544" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">时空关系：何时、对应何处</text><text x="58" y="578" fill="#626977" font-size="22" font-weight="400" text-anchor="start">声音与画面是否处于同一时间轴</text><text x="58" y="607" fill="#626977" font-size="22" font-weight="400" text-anchor="start">方向线索还依赖实际采集的空间通道</text><text x="36" y="688" fill="#282c35" font-size="22" font-weight="600" text-anchor="start">输入 video 文件 ≠ 已确认所有音轨与时空信息都入模</text><text x="36" y="745" fill="#626977" font-size="17" font-weight="400" text-anchor="start">博主信号拆解  ·  基于 Omni Section 2，不是接口处理流程图</text></g></svg>
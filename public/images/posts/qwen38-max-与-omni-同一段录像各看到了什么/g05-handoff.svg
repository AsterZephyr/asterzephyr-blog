<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-label="协作建议：交接结论，也交接证据"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626977"/></marker></defs><rect width="720" height="1180" rx="20" fill="#faf8f3"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="48" fill="#282c35" font-size="29" font-weight="600" text-anchor="start">协作建议：交接结论，也交接证据</text><text x="36" y="79" fill="#626977" font-size="18" font-weight="400" text-anchor="start">工程设计示意  ·  非官方固定 Omni→Max 组合</text><rect x="90" y="108" width="580" height="118" rx="13" fill="#eee8ff" stroke="#dedbd4"/><text x="112" y="143" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">前台观察 / 实时交互</text><text x="112" y="177" fill="#626977" font-size="20" font-weight="400" text-anchor="start">声音任务可使用 Omni；会话可使用 Realtime</text><text x="112" y="206" fill="#626977" font-size="20" font-weight="400" text-anchor="start">即时回应与后台完成分别记录</text><path d="M380 226V259" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="250" fill="#626977" font-size="18" font-weight="400" text-anchor="start">提取并保留来源</text><rect x="90" y="268" width="580" height="163" rx="13" fill="#dcf1ec" stroke="#dedbd4"/><text x="112" y="303" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">证据对象</text><text x="112" y="337" fill="#626977" font-size="21" font-weight="400" text-anchor="start">event_id · 时间范围 · 原媒体指针</text><text x="112" y="366" fill="#626977" font-size="21" font-weight="400" text-anchor="start">observation · proposed_action · unresolved</text><text x="112" y="395" fill="#626977" font-size="21" font-weight="400" text-anchor="start">摘要用于理解，媒体地址用于回查</text><path d="M380 431V464" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="455" fill="#626977" font-size="18" font-weight="400" text-anchor="start">委托 + 立即确认</text><rect x="90" y="473" width="580" height="120" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="112" y="508" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">可选执行后端</text><text x="112" y="542" fill="#626977" font-size="22" font-weight="400" text-anchor="start">Max / Omni / 其他合适的执行模型</text><text x="112" y="571" fill="#626977" font-size="22" font-weight="400" text-anchor="start">task_id · 修订号 · 持久执行状态</text><path d="M380 593V626" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="617" fill="#626977" font-size="18" font-weight="400" text-anchor="start">调用工具</text><rect x="90" y="635" width="580" height="118" rx="13" fill="#ffffff" stroke="#dedbd4"/><text x="112" y="670" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">工具执行与真实产物</text><text x="112" y="704" fill="#626977" font-size="21" font-weight="400" text-anchor="start">文件、页面、程序、应用状态</text><text x="112" y="733" fill="#626977" font-size="21" font-weight="400" text-anchor="start">重复事件去重；参数更新与取消分开处理</text><path d="M380 753V786" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="777" fill="#626977" font-size="18" font-weight="400" text-anchor="start">验收</text><rect x="90" y="795" width="580" height="118" rx="13" fill="#dcf1ec" stroke="#dedbd4"/><text x="112" y="830" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">验证记录</text><text x="112" y="864" fill="#626977" font-size="21" font-weight="400" text-anchor="start">能否打开 · 是否正确渲染 · 操作是否成功</text><text x="112" y="893" fill="#626977" font-size="21" font-weight="400" text-anchor="start">完成声明必须对应真实结果</text><path d="M380 913V946" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="937" fill="#626977" font-size="18" font-weight="400" text-anchor="start">异步结果回传</text><rect x="90" y="955" width="580" height="96" rx="13" fill="#eee8ff" stroke="#dedbd4"/><text x="112" y="990" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">前台反馈</text><text x="112" y="1024" fill="#626977" font-size="22" font-weight="400" text-anchor="start">根据后台结果告知进度与完成状态</text><path d="M90 854H48V350H90" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="53" y="600" fill="#626977" font-size="18" font-weight="400" text-anchor="start">回查</text><text x="90" y="1100" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">打断播音 ≠ 取消后台任务；模型分工是可选设计。</text><text x="36" y="1155" fill="#626977" font-size="17" font-weight="400" text-anchor="start">博主工程建议  ·  受 Omni Section 7 / Max 视觉工作流启发</text></g></svg>
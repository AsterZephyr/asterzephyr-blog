<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1270" viewBox="0 0 720 1270" role="img" aria-label="训练：两份材料披露了不同侧面"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626977"/></marker></defs><rect width="720" height="1270" rx="20" fill="#faf8f3"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="48" fill="#282c35" font-size="29" font-weight="600" text-anchor="start">训练：两份材料披露了不同侧面</text><text x="36" y="79" fill="#626977" font-size="18" font-weight="400" text-anchor="start">Max 为三项并列设计；Omni 为阶段与后训练流程</text><text x="36" y="127" fill="#282c35" font-size="24" font-weight="600" text-anchor="start">MAX：环境、反馈、训练稳定性</text><rect x="36" y="147" width="648" height="122" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="58" y="182" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">组合扩展环境</text><text x="58" y="216" fill="#626977" font-size="22" font-weight="400" text-anchor="start">Task × Workspace × Harness</text><text x="58" y="245" fill="#626977" font-size="22" font-weight="400" text-anchor="start">单任务 / 跨天，文件 / 目录，框架 / 技能</text><rect x="36" y="312" width="648" height="122" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="58" y="347" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">统一奖励系统</text><text x="58" y="381" fill="#626977" font-size="20" font-weight="400" text-anchor="start">执行校验 · 文本与渲染视觉 rubric · agentic 检查</text><text x="58" y="410" fill="#626977" font-size="20" font-weight="400" text-anchor="start">反馈组织方式公开；完整 verifier 与权重未公开</text><rect x="36" y="477" width="648" height="92" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="58" y="512" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">在线 batch 均衡</text><text x="58" y="546" fill="#626977" font-size="22" font-weight="400" text-anchor="start">按任务、难度、工作区与 Harness 重组</text><text x="36" y="624" fill="#282c35" font-size="24" font-weight="600" text-anchor="start">OMNI：感知接入、稀疏训练、能力合流</text><rect x="36" y="647" width="648" height="97" rx="13" fill="#eee8ff" stroke="#dedbd4"/><text x="58" y="682" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">S1 → S2：接入，再联合适应</text><text x="58" y="716" fill="#626977" font-size="21" font-weight="400" text-anchor="start">冻结骨干，先 adapter 后编码器 → 全参数训练</text><path d="M360 744V777" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="786" width="648" height="97" rx="13" fill="#eee8ff" stroke="#dedbd4"/><text x="58" y="821" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">S3 → S4：索引器，再稀疏联合</text><text x="58" y="855" fill="#626977" font-size="22" font-weight="400" text-anchor="start">dense 监督 indexer → 启用 QSA 联合训练</text><path d="M360 883V916" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="925" width="648" height="126" rx="13" fill="#eee8ff" stroke="#dedbd4"/><text x="58" y="960" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">多教师轨迹 → 单一学生</text><text x="58" y="994" fill="#626977" font-size="22" font-weight="400" text-anchor="start">专家各自 SFT + RL，再提供训练轨迹</text><text x="58" y="1023" fill="#626977" font-size="22" font-weight="400" text-anchor="start">轨迹合流，形成统一学生的初始策略</text><path d="M360 1051V1084" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="1093" width="648" height="94" rx="13" fill="#dcf1ec" stroke="#dedbd4"/><text x="58" y="1128" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">统一 RL：按执行结果奖励</text><text x="58" y="1162" fill="#626977" font-size="22" font-weight="400" text-anchor="start">长任务依据真实结果，不依据自报完成</text><text x="36" y="1245" fill="#626977" font-size="17" font-weight="400" text-anchor="start">来源：Max 官方“办公助手”；Omni Sections 3–4  ·  博主自绘</text></g></svg>
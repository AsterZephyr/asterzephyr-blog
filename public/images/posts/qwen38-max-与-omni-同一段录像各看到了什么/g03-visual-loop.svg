<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-label="Max：观察结果，再修正行动"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626977"/></marker></defs><rect width="720" height="820" rx="20" fill="#faf8f3"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="48" fill="#282c35" font-size="29" font-weight="600" text-anchor="start">Max：观察结果，再修正行动</text><text x="36" y="79" fill="#626977" font-size="18" font-weight="400" text-anchor="start">Hybrid Agent  ·  Coding 与 GUI 的反馈互相补充</text><rect x="90" y="108" width="580" height="95" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="112" y="143" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">任务目标</text><text x="112" y="177" fill="#626977" font-size="22" font-weight="400" text-anchor="start">例如：从截图复刻可交互应用</text><path d="M380 203V224H225V244" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 224H535V244" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="394" y="217" fill="#626977" font-size="18" font-weight="400" text-anchor="start">推进</text><rect x="90" y="244" width="270" height="125" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="112" y="279" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">Coding</text><text x="112" y="313" fill="#626977" font-size="22" font-weight="400" text-anchor="start">实现逻辑</text><text x="112" y="342" fill="#626977" font-size="22" font-weight="400" text-anchor="start">生成代码与工具参数</text><rect x="400" y="244" width="270" height="125" rx="13" fill="#fff1d4" stroke="#dedbd4"/><text x="422" y="279" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">GUI 操作</text><text x="422" y="313" fill="#626977" font-size="22" font-weight="400" text-anchor="start">运行中的应用</text><text x="422" y="342" fill="#626977" font-size="22" font-weight="400" text-anchor="start">实际交互与反馈</text><path d="M225 369V397H380V424" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 369V397H380" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="433" width="580" height="110" rx="13" fill="#dcf1ec" stroke="#dedbd4"/><text x="112" y="468" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">观察实际产物</text><text x="112" y="502" fill="#626977" font-size="22" font-weight="400" text-anchor="start">页面布局、空间关系、交互结果</text><path d="M380 543V580" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="395" y="570" fill="#626977" font-size="18" font-weight="400" text-anchor="start">检查</text><rect x="90" y="589" width="580" height="110" rx="13" fill="#ffffff" stroke="#dedbd4"/><text x="112" y="624" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">验证 / 修正</text><text x="112" y="658" fill="#626977" font-size="20" font-weight="400" text-anchor="start">执行校验 + 文本与视觉 rubric + agentic 检查</text><path d="M90 640H48V155H90" fill="none" stroke="#626977" stroke-width="2" marker-end="url(#arrow)"/><text x="53" y="417" fill="#626977" font-size="18" font-weight="400" text-anchor="start">反馈</text><text x="102" y="740" fill="#282c35" font-size="20" font-weight="400" text-anchor="start">工具产物可以是图像或场景，公开模型输出仍为文本。</text><text x="36" y="795" fill="#626977" font-size="17" font-weight="400" text-anchor="start">博主机制概括  ·  Max 官方发布文“多模态智能体 / 办公助手”</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="逐笔固定抽成，会挡住本可成交的机会"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="360" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">逐笔固定抽成，会挡住本可成交的机会</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">教学假设：两位买方都付 100；A 的媒体可接受 70，B 的媒体至少要 90</text><rect x="36" y="82" width="317.0" height="190" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">逐笔约束</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">固定 20%</text><text x="56" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">A：平台留 20，媒体得 80  ✓</text><text x="56" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">B：媒体只能得 80 &lt; 90  ✗</text><text x="56" y="239" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">一笔交易被规则挡在门外</text><rect x="367.0" y="82" width="317.0" height="190" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">汇总约束</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">整体 20%</text><text x="387.0" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">A：平台留 30，媒体得 70  ✓</text><text x="387.0" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">B：平台留 10，媒体得 90  ✓</text><text x="387.0" y="239" fill="#86663b" font-size="17" font-weight="600" text-anchor="start">收入 200，付款 160，抽成仍为 20%</text><text x="36" y="302" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">弹性来自跨笔分配：A 的媒体从 80 降到 70，B 才成交。</text><text x="36" y="326" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">跨不同媒体、不同合同不能这样相互抵消。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="428" viewBox="0 0 720 428" role="img" aria-label="控制器读到的反馈，总比现实慢一步"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="428" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">控制器读到的反馈，总比现实慢一步</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">综合 Chen 的延迟反馈讨论与本篇工程推导，不是某家平台的部署架构</text><rect x="64" y="82" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="107.0" r="15" fill="#ded6c6"/><text x="64" y="112.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">1</text><text x="96" y="113.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">请求与预测</text><text x="666" y="113.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">预测价值 v，读取 λ、μ</text><path d="M64 133V139" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="140" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="165.0" r="15" fill="#ded6c6"/><text x="64" y="170.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">2</text><text x="96" y="171.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">出价与硬保护</text><text x="666" y="171.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">计算 k，选择竞价动作</text><path d="M64 191V197" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="198" width="620" height="50" rx="10" fill="#fae3dc" stroke="#ded8cc"/><circle cx="64" cy="223.0" r="15" fill="#86663b"/><text x="64" y="228.0" fill="#fffdf8" font-size="15" font-weight="600" text-anchor="middle">3</text><text x="96" y="229.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">成交，费用未回传</text><text x="666" y="229.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">已发生但未结算的暴露</text><path d="M64 249V255" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="256" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="281.0" r="15" fill="#ded6c6"/><text x="64" y="286.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">4</text><text x="96" y="287.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">归因与结算窗口</text><text x="666" y="287.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">对齐价值、成本与归属时间</text><path d="M64 307V313" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="314" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="339.0" r="15" fill="#ded6c6"/><text x="64" y="344.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">5</text><text x="96" y="345.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">更新下一轮状态</text><text x="666" y="345.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">用完整反馈更新 λ、μ</text><path d="M46 107.0H64" stroke="#c3bbab" stroke-width="1.4" marker-end="url(#ar)"/><path d="M64 339.0H46V107.0" fill="none" stroke="#c3bbab" stroke-width="1.4" stroke-dasharray="4 4"/><text x="36" y="394" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">第 3 步是风险点：把“没看到费用”当成“还没花钱”，控制器会继续加价。</text></g></svg>
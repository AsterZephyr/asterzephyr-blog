<svg xmlns="http://www.w3.org/2000/svg" width="720" height="505" viewBox="0 0 720 505" role="img" aria-label="一家交易所的增长，不等于全市场增量"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="505" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">一家交易所的增长，不等于全市场增量</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">教学假设：两笔买方支付均为 100，忽略其他费用</text><rect x="36" y="82" width="317.0" height="173" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">1</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">交易 1：路径没变</text><text x="56" y="168" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">始终由交易所 A 成交</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">媒体收款  80 → 78    −2</text><text x="56" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">A 的毛利  20 → 22    +2</text><rect x="367.0" y="82" width="317.0" height="173" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">2</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">交易 2：A 从 B 手里赢走</text><text x="387.0" y="168" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">原来 B 成交，现在 A 成交</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">媒体收款  92 → 93    +1</text><text x="387.0" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">路径毛利   8 →  7    −1</text><path d="M360.0 273V309" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="300.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">按同一市场口径合并</text><rect x="36" y="319" width="206.66666666666666" height="122" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="349" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">媒体合计</text><text x="56" y="379" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">172 → 171</text><text x="56" y="406" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">净收入少了 1</text><rect x="256.66666666666663" y="319" width="206.66666666666666" height="122" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="349" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">交易所合计</text><text x="276.66666666666663" y="379" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">28 → 29</text><text x="276.66666666666663" y="406" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">A +9，B −8</text><rect x="477.33333333333326" y="319" width="206.66666666666666" height="122" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="349" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">买方合计</text><text x="497.33333333333326" y="379" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">200 → 200</text><text x="497.33333333333326" y="406" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">支付没有变化</text><text x="36" y="471" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">A 的报表新增一笔 93，媒体真实增量只有 1；验收要覆盖替代路径，比较媒体整体净收入。</text></g></svg>
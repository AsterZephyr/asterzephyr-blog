<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="A fixed per-trade take rate blocks feasible trades"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="384" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">A fixed per-trade take rate blocks feasible trades</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Teaching assumption: both buyers pay 100; A's media accepts 70, B's media needs at least 90</text><rect x="36" y="82" width="317.0" height="190" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Per-trade constraint</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Fixed 20%</text><text x="56" y="168" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">A: platform keeps 20, media gets 80  ✓</text><text x="56" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">B: media can only get 80 &lt; 90  ✗</text><text x="56" y="239" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">One feasible trade is ruled out</text><rect x="367.0" y="82" width="317.0" height="190" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Aggregate constraint</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Portfolio 20%</text><text x="387.0" y="168" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">A: platform keeps 30, media gets 70  ✓</text><text x="387.0" y="195" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">B: platform keeps 10, media gets 90  ✓</text><text x="387.0" y="239" fill="#86663b" font-size="13" font-weight="600" text-anchor="start">Revenue 200, payout 160, take rate still 20%</text><text x="36" y="302" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">The flexibility comes from reallocating across trades: A's media drops from 80 to 7</text><text x="36" y="326" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">0 so that B can clear. Across different media owners or contracts, those cannot off</text><text x="36" y="350" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">set each other.</text></g></svg>
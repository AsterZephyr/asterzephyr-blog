<svg xmlns="http://www.w3.org/2000/svg" width="720" height="509" viewBox="0 0 720 509" role="img" aria-label="One trade, three ledgers and three prices"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="509" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">One trade, three ledgers and three prices</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Teaching assumption: the customer pays 100, the platform pays media 80, taxes and rebates ignored</text><rect x="36" y="82" width="206.66666666666666" height="173" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Pays, receives value</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Advertiser</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Value V = 500</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Pays R = 100</text><text x="56" y="222" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">ROAS = 5</text><rect x="256.66666666666663" y="82" width="206.66666666666666" height="173" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Settles in between</text><text x="276.66666666666663" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Platform</text><text x="276.66666666666663" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Revenue R = 100</text><text x="276.66666666666663" y="195" fill="#282c35" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0.3">Procurement C = 80</text><text x="276.66666666666663" y="222" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">Margin 20%</text><rect x="477.33333333333326" y="82" width="206.66666666666666" height="173" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Sells inventory</text><text x="497.33333333333326" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Media owner</text><text x="497.33333333333326" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Receives C = 80</text><text x="497.33333333333326" y="195" fill="#3f4450" font-size="14" font-weight="400" text-anchor="start">Supplies the impression</text><text x="497.33333333333326" y="222" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">Cares about net revenue across paths</text><text x="36" y="285" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">The two ratios have different denominators and different owners: ROAS measures th</text><text x="36" y="309" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">e advertiser, margin measures the platform.</text><rect x="36.0" y="329" width="206.66666666666666" height="92" rx="12" fill="#f3efe7" stroke="#ded8cc"/><text x="54.0" y="363" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Customer's stated price</text><text x="54.0" y="391" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">What they will pay</text><path d="M244.66666666666666 375H254.66666666666666" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><rect x="256.66666666666663" y="329" width="206.66666666666666" height="92" rx="12" fill="#f3efe7" stroke="#ded8cc"/><text x="274.66666666666663" y="363" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Bid the platform submits</text><text x="274.66666666666663" y="391" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">Controller plus one-shot optimiser</text><path d="M465.33333333333326 375H475.33333333333326" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><rect x="477.3333333333333" y="329" width="206.66666666666666" height="92" rx="12" fill="#f3efe7" stroke="#ded8cc"/><text x="495.3333333333333" y="363" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Settlement after the win</text><text x="495.3333333333333" y="391" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">Customer pays R, media receives C</text><text x="36" y="451" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">Lowering the submitted bid pushes C down; whether the customer's bill R moves depen</text><text x="36" y="475" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">ds on the billing basis and the contract.</text></g></svg>
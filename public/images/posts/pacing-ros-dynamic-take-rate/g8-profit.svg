<svg xmlns="http://www.w3.org/2000/svg" width="720" height="501" viewBox="0 0 720 501" role="img" aria-label="毛利率降了，利润金额可以升"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="501" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">毛利率降了，利润金额可以升</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">教学算例；同一金额尺度，蓝为成本、绿为毛利</text><text x="36" y="104" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">原方案</text><text x="36" y="130" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">R = 100  C = 80</text><rect x="186" y="92" width="229.0" height="34" rx="5" fill="#cfe0ef" stroke="#ded8cc"/><rect x="415.0" y="92" width="57.2" height="34" rx="5" fill="#cfe8d8" stroke="#ded8cc"/><text x="300.5" y="115" fill="#3f5668" font-size="14" font-weight="400" text-anchor="middle">C 80</text><text x="443.625" y="115" fill="#2f5d42" font-size="14" font-weight="400" text-anchor="middle">20</text><text x="480.8375" y="115" fill="#86663b" font-size="15" font-weight="600" text-anchor="start">毛利率 20%</text><text x="36" y="196" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">放量后</text><text x="36" y="222" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">R = 150  C = 123</text><rect x="186" y="184" width="352.1" height="34" rx="5" fill="#cfe0ef" stroke="#ded8cc"/><rect x="538.1" y="184" width="77.3" height="34" rx="5" fill="#cfe8d8" stroke="#ded8cc"/><text x="362.04375" y="207" fill="#3f5668" font-size="14" font-weight="400" text-anchor="middle">C 123</text><text x="576.73125" y="207" fill="#2f5d42" font-size="14" font-weight="400" text-anchor="middle">27</text><text x="623.9625" y="207" fill="#86663b" font-size="15" font-weight="600" text-anchor="start">毛利率 18%</text><rect x="36" y="288" width="317.0" height="149" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="318" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">保住利润金额的门槛</text><text x="56" y="348" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">0.18 × R₁ ≥ 20</text><text x="56" y="375" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">R₁ ≥ 111.11…</text><text x="56" y="402" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">收入至少涨 11.11%</text><rect x="367.0" y="288" width="317.0" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="318" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">增量单独核算</text><text x="387.0" y="348" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">ΔR = 50,  ΔC = 43,  ΔΠ = 7</text><text x="387.0" y="375" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">增量毛利率只有 14%</text><text x="387.0" y="402" fill="#3f4450" font-size="16" font-weight="400" text-anchor="start">逐笔 18% 会拒掉它，整体 18% 放得过</text><text x="36" y="467" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">多赚的 7 来自新增收入覆盖了新增成本，不是降低毛利率本身创造了收益。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="529" viewBox="0 0 720 529" role="img" aria-label="Growth at one exchange is not growth for the market"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="529" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">Growth at one exchange is not growth for the market</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Teaching assumption: both buyers pay 100, other fees ignored</text><rect x="36" y="82" width="317.0" height="173" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">1</text><text x="56" y="138" fill="#282c35" font-size="17" font-weight="600" text-anchor="start">Trade 1: the path does not change</text><text x="56" y="168" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">Exchange A wins both before and after</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Media receives  80 → 78    −2</text><text x="56" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">A's profit     20 → 22    +2</text><rect x="367.0" y="82" width="317.0" height="173" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">2</text><text x="387.0" y="138" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Trade 2: A takes the win from B</text><text x="387.0" y="168" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">B used to win, now A does</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Media receives  92 → 93    +1</text><text x="387.0" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Path profit     8 →  7    −1</text><path d="M360.0 273V309" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="300.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">add them up on one market denominator</text><rect x="36" y="319" width="206.66666666666666" height="122" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="349" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Media owner, total</text><text x="56" y="379" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">172 → 171</text><text x="56" y="406" fill="#86663b" font-size="15" font-weight="600" text-anchor="start">Net revenue is 1 lower</text><rect x="256.66666666666663" y="319" width="206.66666666666666" height="122" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="349" fill="#282c35" font-size="20" font-weight="600" text-anchor="start">Exchanges, total</text><text x="276.66666666666663" y="379" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">28 → 29</text><text x="276.66666666666663" y="406" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">A +9, B −8</text><rect x="477.33333333333326" y="319" width="206.66666666666666" height="122" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="349" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Buyers, total</text><text x="497.33333333333326" y="379" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">200 → 200</text><text x="497.33333333333326" y="406" fill="#86663b" font-size="17" font-weight="600" text-anchor="start">Payments unchanged</text><text x="36" y="471" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">A's report shows a new 93, while the media owner truly gains 1. Measurement has to c</text><text x="36" y="495" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">over the alternative path and compare net revenue across all of them.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="How one round of feedback changes the next bid"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="370" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">How one round of feedback changes the next bid</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Projected-gradient teaching example, every number assumed</text><rect x="36" y="82" width="206.66666666666666" height="200" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">1</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Starting point</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">λ = 1,  μ = 0.2</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Step size η = 0.1</text><text x="56" y="222" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">k = 2 / 1.2 = 1.667</text><rect x="256.66666666666663" y="82" width="206.66666666666666" height="200" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">2</text><text x="276.66666666666663" y="138" fill="#282c35" font-size="13" font-weight="600" text-anchor="start">What this round returned</text><text x="276.66666666666663" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Paid p = 0.8</text><text x="276.66666666666663" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Value v x = 0.6</text><text x="276.66666666666663" y="222" fill="#282c35" font-size="14" font-weight="500" text-anchor="start" letter-spacing="0.3">Per-round budget ρ = 0.5</text><text x="276.66666666666663" y="249" fill="#86663b" font-size="17" font-weight="600" text-anchor="start">Two gaps: 0.2 and 0.3</text><rect x="477.33333333333326" y="82" width="206.66666666666666" height="200" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">3</text><text x="497.33333333333326" y="138" fill="#282c35" font-size="20" font-weight="600" text-anchor="start">After the update</text><text x="497.33333333333326" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">λ′ = 1.02</text><text x="497.33333333333326" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">μ′ = 0.23</text><text x="497.33333333333326" y="222" fill="#86663b" font-size="15" font-weight="600" text-anchor="start">k′ = 2.02 / 1.25 = 1.616</text><text x="36" y="312" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">Positive gaps mean this round added pressure, so the next multiplier is smaller. λ </text><text x="36" y="336" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">sits in both numerator and denominator, so it is not a monotone discount knob.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="414" viewBox="0 0 720 414" role="img" aria-label="One phrase, two different optimisation problems"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="414" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">One phrase, two different optimisation problems</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">V advertiser value, R customer payment, C media cost</text><rect x="36" y="82" width="317.0" height="244" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">The side that pays</text><text x="56" y="138" fill="#282c35" font-size="14" font-weight="600" text-anchor="start">Advertiser: maximise conversion value</text><text x="56" y="168" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">Normalised value W = V / ROS target</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max W</text><text x="56" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. R ≤ W,  R ≤ B</text><text x="56" y="266" fill="#6b7280" font-size="14" font-weight="400" text-anchor="start">λ price of efficiency, μ price of budget</text><text x="56" y="293" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">Bid multiplier k = (1+λ)/(μ+λ)</text><rect x="367.0" y="82" width="317.0" height="244" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">The side in between</text><text x="387.0" y="138" fill="#282c35" font-size="16" font-weight="600" text-anchor="start">Platform: maximise customer spend</text><text x="387.0" y="168" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">Margin floor m, customer budget B</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max R</text><text x="387.0" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. C ≤ (1−m)R,  R ≤ B</text><text x="387.0" y="266" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">λ price of the margin floor, μ price of budget</text><text x="387.0" y="293" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">Two separate sets of dual variables</text><text x="36" y="356" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">The structure carries over; the objective and the meaning of λ do not. Both forms om</text><text x="36" y="380" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">it the constant μB.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="一次反馈怎样改变下一轮出价"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="370" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">一次反馈怎样改变下一轮出价</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">投影梯度教学算例，数值全为假设</text><rect x="36" y="82" width="206.66666666666666" height="200" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">1</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">起点</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">λ = 1,  μ = 0.2</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">学习率 η = 0.1</text><text x="56" y="222" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">k = 2 / 1.2 = 1.667</text><rect x="256.66666666666663" y="82" width="206.66666666666666" height="200" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">2</text><text x="276.66666666666663" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">这一轮的结果</text><text x="276.66666666666663" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">支付 p = 0.8</text><text x="276.66666666666663" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">价值 v x = 0.6</text><text x="276.66666666666663" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">每轮预算 ρ = 0.5</text><text x="276.66666666666663" y="249" fill="#86663b" font-size="17" font-weight="600" text-anchor="start">两个缺口：0.2 与 0.3</text><rect x="477.33333333333326" y="82" width="206.66666666666666" height="200" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">3</text><text x="497.33333333333326" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">更新之后</text><text x="497.33333333333326" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">λ′ = 1.02</text><text x="497.33333333333326" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">μ′ = 0.23</text><text x="497.33333333333326" y="222" fill="#86663b" font-size="15" font-weight="600" text-anchor="start">k′ = 2.02 / 1.25 = 1.616</text><text x="36" y="312" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">缺口为正，说明这一轮加重了约束压力，下一轮乘数变小。</text><text x="36" y="336" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">λ 同时出现在分子和分母，不是单调的降价按钮。</text></g></svg>
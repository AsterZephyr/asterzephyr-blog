<svg xmlns="http://www.w3.org/2000/svg" width="720" height="721" viewBox="0 0 720 721" role="img" aria-label="把毛利率底线改写成成本约束"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="721" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">把毛利率底线改写成成本约束</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">博主推导；比率按同一结算窗口的汇总额计算</text><rect x="36" y="82" width="648.0" height="149" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">业务语言</text><text x="56" y="142" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">收入分母的毛利率不低于 m</text><text x="56" y="169" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">(R − C) / R ≥ m</text><text x="56" y="196" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">R &gt; 0,  0 ≤ m &lt; 1</text><path d="M360.0 249V285" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="276.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">等价变形</text><rect x="36" y="295" width="648.0" height="149" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="325" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">约束语言</text><text x="56" y="355" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">C ≤ (1 − m) R</text><text x="56" y="382" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">m = 20% → C ≤ 0.8 R</text><text x="56" y="409" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">形式与 ROS 约束相同：收入当“价值”，成本当“花费”</text><path d="M360.0 462V498" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="489.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">预算限制哪一笔钱？</text><rect x="36" y="508" width="317.0" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="538" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">客户预算</text><text x="56" y="568" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">R ≤ B</text><text x="56" y="595" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">L = [1 + λ(1−m) − μ]R − λC + μB</text><text x="56" y="622" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">μ 作用在收入系数上</text><rect x="367.0" y="508" width="317.0" height="149" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="538" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">采购预算</text><text x="387.0" y="568" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">C ≤ B</text><text x="387.0" y="595" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">L = [1 + λ(1−m)]R − (λ+μ)C + μB</text><text x="387.0" y="622" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">μ 作用在成本系数上</text><text x="36" y="687" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">都叫“预算”，出价系数却不同；min-pacing 的保证不会自动跟着搬过来。</text></g></svg>
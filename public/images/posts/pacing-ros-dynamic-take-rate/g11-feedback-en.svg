<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" role="img" aria-label="The feedback a controller reads always lags reality"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="452" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">The feedback a controller reads always lags reality</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Combines Chen's discussion of delayed feedback with this post's engineering reading, not any deployed architecture</text><rect x="64" y="82" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="107.0" r="15" fill="#ded6c6"/><text x="64" y="112.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">1</text><text x="96" y="113.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Request and prediction</text><text x="666" y="113.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">Predict v, read λ and μ</text><path d="M64 133V139" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="140" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="165.0" r="15" fill="#ded6c6"/><text x="64" y="170.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">2</text><text x="96" y="171.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Bid and hard guard</text><text x="666" y="171.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">Compute k, choose the action</text><path d="M64 191V197" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="198" width="620" height="50" rx="10" fill="#fae3dc" stroke="#ded8cc"/><circle cx="64" cy="223.0" r="15" fill="#86663b"/><text x="64" y="228.0" fill="#fffdf8" font-size="15" font-weight="600" text-anchor="middle">3</text><text x="96" y="229.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Won, cost not yet reported</text><text x="666" y="229.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">Exposure incurred but unsettled</text><path d="M64 249V255" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="256" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="281.0" r="15" fill="#ded6c6"/><text x="64" y="286.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">4</text><text x="96" y="287.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Attribution and settlement</text><text x="666" y="287.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">Align value, cost and timing</text><path d="M64 307V313" stroke="#c3bbab" stroke-width="1.4"/><rect x="64" y="314" width="620" height="50" rx="10" fill="#f3efe7" stroke="#ded8cc"/><circle cx="64" cy="339.0" r="15" fill="#ded6c6"/><text x="64" y="344.0" fill="#55504a" font-size="15" font-weight="600" text-anchor="middle">5</text><text x="96" y="345.0" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Update the next round</text><text x="666" y="345.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="end">Update λ and μ on complete feedback</text><path d="M46 107.0H64" stroke="#c3bbab" stroke-width="1.4" marker-end="url(#ar)"/><path d="M64 339.0H46V107.0" fill="none" stroke="#c3bbab" stroke-width="1.4" stroke-dasharray="4 4"/><text x="36" y="394" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">Step 3 is where it breaks: read "no cost seen" as "nothing spent" and the controlle</text><text x="36" y="418" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">r keeps bidding up.</text></g></svg>
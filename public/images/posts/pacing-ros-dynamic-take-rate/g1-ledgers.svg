<svg xmlns="http://www.w3.org/2000/svg" width="720" height="461" viewBox="0 0 720 461" role="img" aria-label="一笔交易，三本账和三个价格"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="461" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">一笔交易，三本账和三个价格</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">教学假设：客户支付 100，平台向媒体支付 80，忽略税费与返点</text><rect x="36" y="82" width="206.66666666666666" height="173" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">付钱、拿价值</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">广告主</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">价值 V = 500</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">支付 R = 100</text><text x="56" y="222" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">ROAS = 5</text><rect x="256.66666666666663" y="82" width="206.66666666666666" height="173" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">居间结算</text><text x="276.66666666666663" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">平台</text><text x="276.66666666666663" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">收入 R = 100</text><text x="276.66666666666663" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">采购 C = 80</text><text x="276.66666666666663" y="222" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">毛利率 20%</text><rect x="477.33333333333326" y="82" width="206.66666666666666" height="173" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">卖流量</text><text x="497.33333333333326" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">媒体</text><text x="497.33333333333326" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">收款 C = 80</text><text x="497.33333333333326" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">提供展示机会</text><text x="497.33333333333326" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">关心全渠道净收入</text><text x="36" y="285" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">两个比率的分母和主体都不同：ROAS 衡量广告主，毛利率衡量平台。</text><rect x="36.0" y="305" width="206.66666666666666" height="92" rx="12" fill="#f3efe7" stroke="#ded8cc"/><text x="54.0" y="339" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">客户原始报价</text><text x="54.0" y="367" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">表达愿意支付多少</text><path d="M244.66666666666666 351H254.66666666666666" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><rect x="256.66666666666663" y="305" width="206.66666666666666" height="92" rx="12" fill="#f3efe7" stroke="#ded8cc"/><text x="274.66666666666663" y="339" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">平台提交的出价</text><text x="274.66666666666663" y="367" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">控制器 + 单次拍卖优化</text><path d="M465.33333333333326 351H475.33333333333326" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><rect x="477.3333333333333" y="305" width="206.66666666666666" height="92" rx="12" fill="#f3efe7" stroke="#ded8cc"/><text x="495.3333333333333" y="339" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">成交后的实际结算</text><text x="495.3333333333333" y="367" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">客户付 R，媒体收 C</text><text x="36" y="427" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">降低提交出价会压低 C，客户账单 R 是否变化由计费口径与合同决定。</text></g></svg>
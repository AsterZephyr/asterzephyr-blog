<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="同一句“提消耗”，两个不同的优化问题"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="390" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">同一句“提消耗”，两个不同的优化问题</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">V 广告主价值 · R 客户支付 · C 媒体成本</text><rect x="36" y="82" width="317.0" height="244" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">付钱的一侧</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">广告主：最大化转化价值</text><text x="56" y="168" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">归一化价值 W = V / ROS 目标</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max W</text><text x="56" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. R ≤ W,  R ≤ B</text><text x="56" y="266" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">λ 效率价格 · μ 预算价格</text><text x="56" y="293" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">出价乘子 k = (1+λ)/(μ+λ)</text><rect x="367.0" y="82" width="317.0" height="244" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">居间的一侧</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">平台：最大化客户消耗</text><text x="387.0" y="168" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">毛利率下限 m · 客户预算 B</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max R</text><text x="387.0" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. C ≤ (1−m)R,  R ≤ B</text><text x="387.0" y="266" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">λ 利润率价格 · μ 预算价格</text><text x="387.0" y="293" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">两组对偶变量各自定义</text><text x="36" y="356" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">数学结构可以复用，目标函数和 λ 的含义不能直接画等号；两式各省略常数项 μB。</text></g></svg>
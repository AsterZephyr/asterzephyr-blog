<svg xmlns="http://www.w3.org/2000/svg" width="720" height="718" viewBox="0 0 720 718" role="img" aria-label="From two cumulative constraints to a single bid"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="718" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">From two cumulative constraints to a single bid</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Field Guide §2.1, equations (2) to (3)</text><rect x="36" y="82" width="648.0" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">The original problem spans many auctions</text><text x="56" y="142" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max Σ v x</text><text x="56" y="169" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Σ p ≤ Σ v x    ROS constraint</text><text x="56" y="196" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Σ p ≤ B        budget constraint</text><path d="M360.0 249V285" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="276.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">price the constraints</text><rect x="36" y="295" width="648.0" height="122" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="325" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Lagrangian: violating a constraint has a price</text><text x="56" y="355" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">L = μB + Σ[(1+λ)v x − (μ+λ)p]</text><text x="56" y="382" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">λ for ROS, μ for budget, both non-negative</text><path d="M360.0 435V471" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="462.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">divide by the positive μ+λ</text><rect x="36" y="481" width="648.0" height="149" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="511" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Each auction can then be decided on its own</text><text x="56" y="541" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max  k v x(b) − p(b)</text><text x="56" y="568" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">k = (1+λ)/(μ+λ)</text><text x="56" y="595" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Under a truthful auction, submit b = k v</text><text x="36" y="660" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">λ and μ are state; k is what reaches the bidder. A first-price auction still needs i</text><text x="36" y="684" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">ts own shading step.</text></g></svg>
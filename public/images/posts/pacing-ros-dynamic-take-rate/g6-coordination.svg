<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-label="两个控制器，三种组合方式"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="363" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">两个控制器，三种组合方式</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Field Guide 式 (3)、(6)、(7)；假设相关变量为正</text><rect x="36" y="82" width="206.66666666666666" height="217" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">可能线性违约或线性遗憾</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">串联相乘</text><text x="56" y="168" fill="#282c35" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0.3">k = (1 + 1/λ) × (1/μ)</text><text x="56" y="212" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">ROS 绑定时降价</text><text x="56" y="239" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">预算未花完时抬价</text><text x="56" y="266" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">两环互相抵消</text><rect x="256.66666666666663" y="82" width="206.66666666666666" height="217" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">接口改动小</text><text x="276.66666666666663" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Min-pacing</text><text x="276.66666666666663" y="168" fill="#282c35" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0.3">k = min(1 + 1/λ,  1/μ)</text><text x="276.66666666666663" y="212" fill="#3f4450" font-size="16" font-weight="400" text-anchor="start">两个候选出价取较小者</text><text x="276.66666666666663" y="239" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">服务可以不合并</text><text x="276.66666666666663" y="266" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">O(√T) 遗憾界</text><rect x="477.33333333333326" y="82" width="206.66666666666666" height="217" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">改造成本较高</text><text x="497.33333333333326" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">联合对偶</text><text x="497.33333333333326" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">k = (1 + λ)/(μ + λ)</text><text x="497.33333333333326" y="212" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">由拉格朗日问题推出</text><text x="497.33333333333326" y="239" fill="#3f4450" font-size="16" font-weight="400" text-anchor="start">两变量在同一式中协调</text><text x="497.33333333333326" y="266" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">零违约桶内表现最好</text><text x="36" y="329" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">三者都必须读取真实成交反馈；min 是出价选择机制，不证明任意独立控制器都安全。</text></g></svg>
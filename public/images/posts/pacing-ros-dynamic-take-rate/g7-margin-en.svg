<svg xmlns="http://www.w3.org/2000/svg" width="720" height="745" viewBox="0 0 720 745" role="img" aria-label="Rewriting a margin floor as a cost constraint"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="745" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">Rewriting a margin floor as a cost constraint</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Derivation for this post; the ratio uses totals from the same settlement window</text><rect x="36" y="82" width="648.0" height="149" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Business wording</text><text x="56" y="142" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Margin on a revenue denominator is at least m</text><text x="56" y="169" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">(R − C) / R ≥ m</text><text x="56" y="196" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">R &gt; 0,  0 ≤ m &lt; 1</text><path d="M360.0 249V285" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="276.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">equivalent form</text><rect x="36" y="295" width="648.0" height="149" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="325" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Constraint wording</text><text x="56" y="355" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">C ≤ (1 − m) R</text><text x="56" y="382" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">m = 20% → C ≤ 0.8 R</text><text x="56" y="409" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Same shape as the ROS constraint: revenue plays value, cost plays spend</text><path d="M360.0 462V498" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="489.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">which money does the budget cap?</text><rect x="36" y="508" width="317.0" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="538" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Customer budget</text><text x="56" y="568" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">R ≤ B</text><text x="56" y="595" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">L = [1 + λ(1−m) − μ]R − λC + μB</text><text x="56" y="622" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">μ acts on the revenue coefficient</text><rect x="367.0" y="508" width="317.0" height="149" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="538" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Procurement budget</text><text x="387.0" y="568" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">C ≤ B</text><text x="387.0" y="595" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">L = [1 + λ(1−m)]R − (λ+μ)C + μB</text><text x="387.0" y="622" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">μ acts on the cost coefficient</text><text x="36" y="687" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">Both are called a budget, yet the bidding coefficient differs, and the min-pacing g</text><text x="36" y="711" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">uarantee does not transfer on its own.</text></g></svg>
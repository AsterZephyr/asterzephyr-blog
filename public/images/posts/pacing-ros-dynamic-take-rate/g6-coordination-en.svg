<svg xmlns="http://www.w3.org/2000/svg" width="720" height="387" viewBox="0 0 720 387" role="img" aria-label="Two controllers, three ways to combine them"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="387" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">Two controllers, three ways to combine them</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Field Guide equations (3), (6) and (7); assuming the relevant terms are positive</text><rect x="36" y="82" width="206.66666666666666" height="217" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">Can incur linear violation or regret</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Sequential</text><text x="56" y="168" fill="#282c35" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0.3">k = (1 + 1/λ) × (1/μ)</text><text x="56" y="212" fill="#3f4450" font-size="12" font-weight="400" text-anchor="start">ROS binds, so it cuts the bid</text><text x="56" y="239" fill="#3f4450" font-size="12" font-weight="400" text-anchor="start">Budget unspent, so it lifts the bid</text><text x="56" y="266" fill="#86663b" font-size="14" font-weight="600" text-anchor="start">The two loops cancel out</text><rect x="256.66666666666663" y="82" width="206.66666666666666" height="217" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="112" fill="#6b7280" font-size="13" font-weight="600" text-anchor="start">A small interface change</text><text x="276.66666666666663" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Min-pacing</text><text x="276.66666666666663" y="168" fill="#282c35" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0.3">k = min(1 + 1/λ,  1/μ)</text><text x="276.66666666666663" y="212" fill="#3f4450" font-size="12" font-weight="400" text-anchor="start">Take the smaller of two candidate bids</text><text x="276.66666666666663" y="239" fill="#3f4450" font-size="12" font-weight="400" text-anchor="start">Services need not be merged</text><text x="276.66666666666663" y="266" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">O(√T) regret bound</text><rect x="477.33333333333326" y="82" width="206.66666666666666" height="217" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">More costly to build</text><text x="497.33333333333326" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Joint dual</text><text x="497.33333333333326" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">k = (1 + λ)/(μ + λ)</text><text x="497.33333333333326" y="212" fill="#3f4450" font-size="12" font-weight="400" text-anchor="start">Derived from the Lagrangian</text><text x="497.33333333333326" y="239" fill="#3f4450" font-size="12" font-weight="400" text-anchor="start">Both variables coordinate in one expression</text><text x="497.33333333333326" y="266" fill="#86663b" font-size="12" font-weight="600" text-anchor="start">Best inside the zero-violation bucket</text><text x="36" y="329" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">All three must read realised auction feedback. The min is a selection rule, not a pr</text><text x="36" y="353" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">oof that any decoupled controller is safe.</text></g></svg>
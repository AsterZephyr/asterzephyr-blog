<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none">
  <defs>
    <filter id="shadowSoft"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/></filter>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a8a87"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="12" fill="#f8f6f3"/>

  <text x="480" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#141413">TensorFlow Serving 高可用服务架构</text>

  <!-- RTB Request -->
  <g filter="url(#shadowSoft)">
    <rect x="400" y="55" width="160" height="45" rx="8" fill="#ffffff" stroke="#9b72b0" stroke-width="2"/>
  </g>
  <text x="480" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9b72b0">RTB 请求</text>

  <!-- Load Balancer -->
  <path d="M480 100 L480 125" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>
  <g filter="url(#shadowSoft)">
    <rect x="370" y="130" width="220" height="45" rx="8" fill="#ffffff" stroke="#c4956a" stroke-width="2"/>
  </g>
  <text x="480" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#c4956a">Load Balancer</text>

  <!-- CTR Serving instances -->
  <path d="M420 175 L200 210" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M450 175 L350 210" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M480 175 L480 210" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="100" y="215" width="180" height="45" rx="8" fill="#e0f7fa" stroke="#0c8599" stroke-width="1.5"/>
  </g>
  <text x="190" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0c8599">TF Serving 1 — CTR Model v1</text>

  <g filter="url(#shadowSoft)">
    <rect x="300" y="215" width="180" height="45" rx="8" fill="#e0f7fa" stroke="#0c8599" stroke-width="1.5"/>
  </g>
  <text x="390" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0c8599">TF Serving 2 — CTR Model v1</text>

  <g filter="url(#shadowSoft)">
    <rect x="500" y="215" width="180" height="45" rx="8" fill="#e0f7fa" stroke="#0c8599" stroke-width="1.5"/>
  </g>
  <text x="590" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0c8599">TF Serving 3 — CTR Model v1</text>

  <!-- CVR Serving instances -->
  <path d="M530 175 L720 210" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M550 175 L850 210" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="640" y="215" width="180" height="45" rx="8" fill="#f3e8ff" stroke="#9b72b0" stroke-width="1.5"/>
  </g>
  <text x="730" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9b72b0">TF Serving 4 — CVR Model v1</text>

  <g filter="url(#shadowSoft)">
    <rect x="770" y="270" width="160" height="45" rx="8" fill="#f3e8ff" stroke="#9b72b0" stroke-width="1.5"/>
  </g>
  <text x="850" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9b72b0">TF Serving 5 — CVR Model v1</text>

  <!-- Model Storage -->
  <g filter="url(#shadowSoft)">
    <rect x="350" y="330" width="200" height="50" rx="8" fill="#fff8e1" stroke="#c4956a" stroke-width="2"/>
  </g>
  <text x="450" y="353" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#c4956a">Model Storage</text>
  <text x="450" y="371" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#666">NFS / S3</text>

  <!-- Connections to storage -->
  <path d="M190 260 L400 330" stroke="#8a8a87" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M390 260 L430 330" stroke="#8a8a87" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M590 260 L470 330" stroke="#8a8a87" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M730 260 L500 330" stroke="#8a8a87" stroke-width="1" fill="none" stroke-dasharray="3,3"/>

  <!-- Model Training -->
  <g filter="url(#shadowSoft)">
    <rect x="100" y="340" width="180" height="45" rx="8" fill="#e8f5e9" stroke="#6b9e8a" stroke-width="1.5"/>
  </g>
  <text x="190" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b9e8a">Model Training</text>

  <path d="M280 362 L350 355" stroke="#6b9e8a" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>
  <text x="315" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#6b9e8a">新版本</text>

  <!-- Health Check -->
  <g filter="url(#shadowSoft)">
    <rect x="680" y="340" width="160" height="45" rx="8" fill="#e8f5e9" stroke="#6b9e8a" stroke-width="1.5"/>
  </g>
  <text x="760" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b9e8a">Health Check</text>

  <!-- Design principles -->
  <text x="480" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#8a8a87">核心原则：无状态服务 | gRPC 负载均衡 | 健康检查自动剔除 | 预估失败时历史 CTR/CVR 兜底</text>
</svg>

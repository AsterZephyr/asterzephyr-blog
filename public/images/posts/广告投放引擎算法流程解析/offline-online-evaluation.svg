<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" fill="none">
  <defs>
    <filter id="shadowSoft"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/></filter>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a8a87"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c92a2a"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="12" fill="#f8f6f3"/>

  <text x="480" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#141413">模型评估：离线 vs 在线的鸿沟</text>

  <!-- Offline evaluation -->
  <g filter="url(#shadowSoft)">
    <rect x="80" y="65" width="160" height="45" rx="8" fill="#ffffff" stroke="#9b72b0" stroke-width="2"/>
  </g>
  <text x="160" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#9b72b0">离线评估</text>

  <path d="M240 87 L310 87" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="315" y="65" width="130" height="45" rx="8" fill="#ffffff" stroke="#8a8a87" stroke-width="1.5"/>
  </g>
  <text x="380" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#141413">历史数据</text>

  <path d="M445 87 L505 87" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="510" y="65" width="200" height="45" rx="8" fill="#e8f5e9" stroke="#6b9e8a" stroke-width="1.5"/>
  </g>
  <text x="610" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b9e8a">AUC, LogLoss, GAUC</text>

  <path d="M710 87 L770 87" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Decision diamond -->
  <polygon points="840,87 880,62 920,87 880,112" fill="#ffffff" stroke="#c4956a" stroke-width="1.5"/>
  <text x="880" y="91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#c4956a">提升?</text>

  <!-- Yes path down -->
  <path d="M880 112 L880 145" stroke="#6b9e8a" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="893" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#6b9e8a">是</text>

  <!-- No path back -->
  <path d="M840 87 L840 40 L160 40 L160 65" stroke="#c92a2a" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <text x="500" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#c92a2a">否 → 继续优化模型</text>

  <!-- A/B Test -->
  <g filter="url(#shadowSoft)">
    <rect x="790" y="150" width="180" height="45" rx="8" fill="#fff8e1" stroke="#c4956a" stroke-width="2"/>
  </g>
  <text x="880" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#c4956a">上线 A/B 测试</text>

  <!-- Online evaluation -->
  <path d="M880 195 L880 225" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="80" y="230" width="160" height="45" rx="8" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
  </g>
  <text x="160" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#0c8599">在线评估</text>

  <path d="M790 252 L240 252" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="310" y="230" width="280" height="45" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  </g>
  <text x="450" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c92a2a">CTR, CVR, ROI, Revenue</text>

  <path d="M590 252 L660 252" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Online decision -->
  <polygon points="720,252 760,227 800,252 760,277" fill="#ffffff" stroke="#c4956a" stroke-width="1.5"/>
  <text x="760" y="256" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#c4956a">业务提升?</text>

  <!-- Outcomes -->
  <path d="M760 277 L760 315" stroke="#6b9e8a" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="775" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#6b9e8a">是</text>

  <g filter="url(#shadowSoft)">
    <rect x="680" y="320" width="160" height="40" rx="8" fill="#e8f5e9" stroke="#6b9e8a" stroke-width="2"/>
  </g>
  <text x="760" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#6b9e8a">全量发布</text>

  <path d="M800 252 L870 252 L870 325" stroke="#c92a2a" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="895" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#c92a2a">否</text>

  <g filter="url(#shadowSoft)">
    <rect x="840" y="330" width="100" height="40" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  </g>
  <text x="890" y="355" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#c92a2a">回滚</text>

  <!-- Key insight -->
  <text x="300" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#8a8a87">关键矛盾：离线 AUC 提升不等于在线收益提升 — AUC 只衡量排序能力，不衡量预估值校准</text>
</svg>

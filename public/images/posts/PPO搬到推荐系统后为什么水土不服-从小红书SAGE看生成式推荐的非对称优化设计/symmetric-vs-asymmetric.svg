<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 12px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 12px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .bad { fill: #c92a2a; }
    .good { fill: #2f9e44; }
  </style>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" class="title">对称 Clipping vs 非对称 Clipping (SAGE)</text>

  <!-- Left: Symmetric -->
  <rect x="30" y="50" width="435" height="410" rx="10" fill="none" stroke="#e8a09a" stroke-width="1.5"/>
  <text x="247" y="74" text-anchor="middle" class="section-label">对称 Clipping (PPO / GBPO)</text>

  <rect x="60" y="95" width="375" height="44" rx="8" fill="#f5f5f5" stroke="#8a8a87" stroke-width="1.2" filter="url(#shadowSoft)"/>
  <text x="247" y="115" text-anchor="middle" class="node-title">正反馈上界: 1 + epsilon</text>
  <text x="247" y="131" text-anchor="middle" class="node-sub">冷启动成功 = 热门成功 = 同一上界</text>

  <rect x="60" y="155" width="375" height="44" rx="8" fill="#f5f5f5" stroke="#8a8a87" stroke-width="1.2" filter="url(#shadowSoft)"/>
  <text x="247" y="175" text-anchor="middle" class="node-title">负反馈下界: 1 - epsilon</text>
  <text x="247" y="191" text-anchor="middle" class="node-sub">探索失败 = 同质化失败 = 同一下界</text>

  <!-- Problems -->
  <rect x="60" y="225" width="375" height="44" rx="8" fill="#fff5f5" stroke="#e8a09a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="247" y="250" text-anchor="middle" class="node-title bad">冷启动物品无法突破曝光阈值</text>

  <rect x="60" y="285" width="375" height="44" rx="8" fill="#fff5f5" stroke="#e8a09a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="247" y="310" text-anchor="middle" class="node-title bad">多样性持续坍塌</text>

  <!-- Summary -->
  <rect x="80" y="360" width="335" height="80" rx="8" fill="#fff5f5" stroke="#e8a09a" stroke-width="1"/>
  <text x="247" y="385" text-anchor="middle" class="node-sub">核心问题:</text>
  <text x="247" y="403" text-anchor="middle" class="node-sub">无法区分「探索性失败」和「同质化失败」</text>
  <text x="247" y="421" text-anchor="middle" class="node-sub">所有成功等权 → 冷启动物品永远弱势</text>

  <!-- Right: Asymmetric (SAGE) -->
  <rect x="495" y="50" width="435" height="410" rx="10" fill="none" stroke="#6b9e8a" stroke-width="1.5"/>
  <text x="712" y="74" text-anchor="middle" class="section-label">非对称 Clipping (SAGE)</text>

  <rect x="525" y="95" width="375" height="44" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="712" y="115" text-anchor="middle" class="node-title">正反馈上界: 1 + epsilon + boost</text>
  <text x="712" y="131" text-anchor="middle" class="node-sub">冷启动成功获得超线性激励</text>

  <rect x="525" y="155" width="375" height="44" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="712" y="175" text-anchor="middle" class="node-title">负反馈下界: 随列表熵动态调整</text>
  <text x="712" y="191" text-anchor="middle" class="node-sub">低熵(同质化)严惩 / 高熵(探索)宽容</text>

  <!-- Solutions -->
  <rect x="525" y="225" width="375" height="44" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="712" y="250" text-anchor="middle" class="node-title good">冷启动物品突破曝光阈值</text>

  <rect x="525" y="285" width="375" height="44" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="712" y="310" text-anchor="middle" class="node-title good">多样性持续改善</text>

  <!-- Summary -->
  <rect x="545" y="360" width="335" height="80" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="712" y="385" text-anchor="middle" class="node-sub">核心创新:</text>
  <text x="712" y="403" text-anchor="middle" class="node-sub">正向: 冷启动 boost 打破马太效应</text>
  <text x="712" y="421" text-anchor="middle" class="node-sub">负向: 熵感知惩罚区分两种失败模式</text>
</svg>

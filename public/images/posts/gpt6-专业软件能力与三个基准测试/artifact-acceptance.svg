<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-label="专业成果的必要条件与质量评分"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#60727e" stroke-width="1.5"/></marker></defs><rect width="600" height="580" rx="18" fill="#f6f4ed"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#183543"><text x="32" y="44" font-size="30" fill="#183543" font-weight="700">先确认可交付，再评质量</text><text x="32" y="78" font-size="22" fill="#536875" font-weight="400">ALE 的 gate-and-score 评分思路</text><rect x="32" y="108" width="536" height="122" rx="14" fill="white" stroke="#d8dedb"/><rect x="32" y="108" width="7" height="122" rx="3" fill="#087e83"/><text x="56" y="142" font-size="18" fill="#087e83" font-weight="700">01 / 交付完整</text><text x="56" y="177" font-size="28" fill="#183543" font-weight="650">必需的文件是否齐全？</text><text x="56" y="210" font-size="21" fill="#536875" font-weight="400">项目 / 导出物 / 预览，按任务要求检查</text><path d="M300 238 V256" stroke="#60727e" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="268" width="536" height="122" rx="14" fill="white" stroke="#d8dedb"/><rect x="32" y="268" width="7" height="122" rx="3" fill="#aa6b2c"/><text x="56" y="302" font-size="18" fill="#aa6b2c" font-weight="700">02 / 必要条件</text><text x="56" y="337" font-size="28" fill="#183543" font-weight="650">硬性约束是否满足？</text><text x="56" y="370" font-size="21" fill="#536875" font-weight="400">例如加工无碰撞；门槛失败可直接零分</text><path d="M300 396 V414" stroke="#60727e" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="426" width="536" height="122" rx="14" fill="white" stroke="#d8dedb"/><rect x="32" y="426" width="7" height="122" rx="3" fill="#5375aa"/><text x="56" y="460" font-size="18" fill="#5375aa" font-weight="700">03 / 质量得分</text><text x="56" y="495" font-size="28" fill="#183543" font-weight="650">通过门槛后，结果有多准确？</text><text x="56" y="528" font-size="21" fill="#536875" font-weight="400">按任务评数值、几何或其他质量指标</text><text x="32" y="572" font-size="19" fill="#536875" font-weight="400">示意结构；具体文件、门槛与权重因任务而异</text></g></svg>
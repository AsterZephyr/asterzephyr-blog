<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1032" viewBox="0 0 480 1032" role="img" aria-label="从工程图走到交付物"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#60727e" stroke-width="1.5"/></marker></defs><rect width="480" height="1032" rx="18" fill="#f6f4ed"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#183543"><text x="26" y="44" font-size="28" font-weight="700">从工程图走到交付物</text><text x="26" y="80" font-size="22" fill="#536875">每一步都要保留原始要求</text><rect x="26" y="110" width="428" height="112" rx="12" fill="white" stroke="#d8dedb"/><rect x="26" y="110" width="6" height="112" rx="3" fill="#5375aa"/><text x="46" y="149" font-size="26" font-weight="650">① 读懂图纸与技术要求</text><text x="46" y="189" font-size="22" fill="#5375aa">确定尺寸、特征与关系</text><path d="M240 229V244" stroke="#60727e" stroke-width="2" marker-end="url(#a)"/><rect x="26" y="252" width="428" height="112" rx="12" fill="white" stroke="#d8dedb"/><rect x="26" y="252" width="6" height="112" rx="3" fill="#087e83"/><text x="46" y="291" font-size="26" font-weight="650">② 定位界面中的入口</text><text x="46" y="331" font-size="22" fill="#087e83">ScreenSpot-Pro：找准控件</text><path d="M240 371V386" stroke="#60727e" stroke-width="2" marker-end="url(#a)"/><rect x="26" y="394" width="428" height="112" rx="12" fill="white" stroke="#d8dedb"/><rect x="26" y="394" width="6" height="112" rx="3" fill="#5375aa"/><text x="46" y="433" font-size="26" font-weight="650">③ 选择操作方法</text><text x="46" y="473" font-size="22" fill="#5375aa">GUI / 代码 → 几何对象</text><path d="M240 513V528" stroke="#60727e" stroke-width="2" marker-end="url(#a)"/><rect x="26" y="536" width="428" height="112" rx="12" fill="white" stroke="#d8dedb"/><rect x="26" y="536" width="6" height="112" rx="3" fill="#5375aa"/><text x="46" y="575" font-size="26" font-weight="650">④ 保持并更新任务状态</text><text x="46" y="615" font-size="22" fill="#5375aa">OSWorld：持续推进工作</text><path d="M240 655V670" stroke="#60727e" stroke-width="2" marker-end="url(#a)"/><rect x="26" y="678" width="428" height="112" rx="12" fill="white" stroke="#d8dedb"/><rect x="26" y="678" width="6" height="112" rx="3" fill="#5375aa"/><text x="46" y="717" font-size="26" font-weight="650">⑤ 检查偏差，修改结果</text><text x="46" y="757" font-size="22" fill="#5375aa">让检查真正改变交付物</text><path d="M240 797V812" stroke="#60727e" stroke-width="2" marker-end="url(#a)"/><rect x="26" y="820" width="428" height="112" rx="12" fill="white" stroke="#d8dedb"/><rect x="26" y="820" width="6" height="112" rx="3" fill="#aa6b2c"/><text x="46" y="859" font-size="26" font-weight="650">⑥ 按专业标准验收</text><text x="46" y="899" font-size="22" fill="#aa6b2c">ALE：必要条件与质量</text><text x="26" y="1008" font-size="21" fill="#536875">观察范围有重叠；并非联合实验</text></g></svg>
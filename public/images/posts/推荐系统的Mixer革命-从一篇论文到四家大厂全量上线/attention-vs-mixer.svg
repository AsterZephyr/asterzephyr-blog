<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 13px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 11px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
  </style>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">Self-Attention vs RankMixer 特征交互</text>

  <!-- Left: Self-Attention -->
  <rect x="30" y="55" width="430" height="365" rx="10" fill="none" stroke="#e8a09a" stroke-width="1.5"/>
  <text x="245" y="78" text-anchor="middle" class="section-label">SELF-ATTENTION 特征交互</text>

  <!-- Input tokens -->
  <rect x="60" y="95" width="150" height="30" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="135" y="114" text-anchor="middle" class="node-sub">Token 1: 年龄=25</text>
  <rect x="60" y="130" width="150" height="30" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="135" y="149" text-anchor="middle" class="node-sub">Token 2: 品类=美妆</text>
  <rect x="60" y="165" width="150" height="30" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="135" y="184" text-anchor="middle" class="node-sub">Token 3: 设备=iPhone</text>

  <!-- QKV -->
  <rect x="260" y="110" width="120" height="40" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="320" y="134" text-anchor="middle" class="node-title">Q K V 投影</text>

  <!-- Attention matrix -->
  <rect x="160" y="220" width="220" height="50" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="270" y="243" text-anchor="middle" class="node-title">T x T 注意力矩阵</text>
  <text x="270" y="261" text-anchor="middle" class="node-sub">O(T^2) 复杂度</text>

  <!-- Shared FFN -->
  <rect x="160" y="295" width="220" height="40" rx="8" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="270" y="319" text-anchor="middle" class="node-title">共享 FFN</text>

  <!-- Problem -->
  <rect x="60" y="360" width="380" height="44" rx="6" fill="#fff5f5" stroke="#e8a09a" stroke-width="1"/>
  <text x="250" y="380" text-anchor="middle" class="node-sub" style="fill:#c92a2a">问题: 异构 token 间内积无语义含义</text>
  <text x="250" y="396" text-anchor="middle" class="node-sub" style="fill:#c92a2a">MFU 仅 4.5% (memory-bound 操作)</text>

  <!-- Arrows left -->
  <line x1="210" y1="140" x2="260" y2="130" stroke="#c4956a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="320" y1="150" x2="300" y2="220" stroke="#c92a2a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="270" y1="270" x2="270" y2="295" stroke="#9b72b0" stroke-width="1.2" marker-end="url(#arrowControl)"/>

  <!-- Right: RankMixer -->
  <rect x="500" y="55" width="430" height="365" rx="10" fill="none" stroke="#6b9e8a" stroke-width="1.5"/>
  <text x="715" y="78" text-anchor="middle" class="section-label">RANKMIXER 特征交互</text>

  <!-- Input tokens -->
  <rect x="530" y="95" width="150" height="30" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="605" y="114" text-anchor="middle" class="node-sub">Token 1: 年龄=25</text>
  <rect x="530" y="130" width="150" height="30" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="605" y="149" text-anchor="middle" class="node-sub">Token 2: 品类=美妆</text>
  <rect x="530" y="165" width="150" height="30" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="605" y="184" text-anchor="middle" class="node-sub">Token 3: 设备=iPhone</text>

  <!-- Token Mixing -->
  <rect x="710" y="110" width="180" height="50" rx="8" fill="#e0f7fa" stroke="#0c8599" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="800" y="133" text-anchor="middle" class="node-title">Multi-head Token Mixing</text>
  <text x="800" y="150" text-anchor="middle" class="node-sub">无参数, 代数变换, O(T)</text>

  <!-- Mixed output -->
  <rect x="610" y="220" width="220" height="44" rx="8" fill="#ffffff" stroke="#8a8a87" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="720" y="240" text-anchor="middle" class="node-title">混合后的 Token</text>
  <text x="720" y="256" text-anchor="middle" class="node-sub">信息跨 token 流动</text>

  <!-- Per-token FFN -->
  <rect x="610" y="295" width="220" height="44" rx="8" fill="#f0e6f6" stroke="#9b72b0" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="720" y="315" text-anchor="middle" class="node-title">Per-token FFN</text>
  <text x="720" y="331" text-anchor="middle" class="node-sub">每个 token 独立参数</text>

  <!-- Advantage -->
  <rect x="530" y="360" width="380" height="44" rx="6" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="720" y="380" text-anchor="middle" class="node-sub" style="fill:#2f6b55">MFU 45% (10x 提升), 纯 dense matmul</text>
  <text x="720" y="396" text-anchor="middle" class="node-sub" style="fill:#2f6b55">1B 参数延迟 = 16M baseline (14.3ms vs 14.5ms)</text>

  <!-- Arrows right -->
  <line x1="680" y1="140" x2="710" y2="130" stroke="#0c8599" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="800" y1="160" x2="750" y2="220" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="720" y1="264" x2="720" y2="295" stroke="#9b72b0" stroke-width="1.2" marker-end="url(#arrowControl)"/>
</svg>

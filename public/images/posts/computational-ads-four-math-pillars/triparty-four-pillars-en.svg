<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-label="How DSP buyers, ADX exchanges, and SSP sellers share the four mathematical pillars and break when any single pillar fails">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7c6b53" />
    </marker>
    <marker id="arr-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#a44a3f" />
    </marker>
  </defs>

  <rect width="960" height="490" rx="14" fill="#fbf9f5" stroke="#e4ddd0" stroke-width="1.5" />

  <text x="36" y="38" fill="#86663b" font-size="11.5" font-weight="700" letter-spacing="1.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">THREE-SIDED ROLES, SHARED PILLARS &amp; FAILURE BRANCHES</text>
  <text x="36" y="64" fill="#231f1a" font-size="19" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Asymmetric Roles (Bidders vs. Rule-Makers) Share the Same Four-Pillar Core</text>

  <!-- Left Column -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="36" y="96" width="236" height="104" rx="10" fill="#eef2f7" stroke="#96aec8" stroke-width="1.4" />
    <text x="52" y="118" fill="#2b527a" font-size="10.8" font-weight="700" font-family="ui-monospace, monospace">BUYER · DSP / ADVERTISER</text>
    <text x="52" y="140" fill="#1a344f" font-size="13.5" font-weight="700">Sees App Purchases &amp; Spend</text>
    <text x="52" y="162" fill="#3a526c" font-size="11.8">Goal: Max Value under Budget/ROAS</text>
    <text x="52" y="182" fill="#64748b" font-size="11.2">Blind Spot: Winning Rival Bids</text>

    <rect x="36" y="218" width="236" height="104" rx="10" fill="#fcf3e6" stroke="#d8a866" stroke-width="1.4" />
    <text x="52" y="240" fill="#86663b" font-size="10.8" font-weight="700" font-family="ui-monospace, monospace">EXCHANGE · ADX MATCHING</text>
    <text x="52" y="262" fill="#231f1a" font-size="12.8" font-weight="700">Sees Cross-DSP Bids &amp; Rebates</text>
    <text x="52" y="284" fill="#5b5449" font-size="11.5">Goal: Max Net Margin under QPS Cap</text>
    <text x="52" y="304" fill="#7c6b53" font-size="11">Blind Spot: Advertiser Backend GMV</text>

    <rect x="36" y="340" width="236" height="104" rx="10" fill="#eef4f0" stroke="#9ebaa8" stroke-width="1.4" />
    <text x="52" y="362" fill="#2d6647" font-size="10.8" font-weight="700" font-family="ui-monospace, monospace">SELLER · SSP / PUBLISHER</text>
    <text x="52" y="384" fill="#1e3d2b" font-size="13.5" font-weight="700">Sees Inventory &amp; Retention</text>
    <text x="52" y="406" fill="#3c5a47" font-size="11.8">Goal: Max eCPM under Ad Load Cap</text>
    <text x="52" y="426" fill="#53725e" font-size="11.2">Blind Spot: Bids Below Reserve Floor</text>
  </g>

  <line x1="272" y1="148" x2="326" y2="215" stroke="#7c6b53" stroke-width="1.5" marker-end="url(#arr)" />
  <line x1="272" y1="270" x2="326" y2="270" stroke="#7c6b53" stroke-width="1.5" marker-end="url(#arr)" />
  <line x1="272" y1="392" x2="326" y2="325" stroke="#7c6b53" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Center Box -->
  <rect x="330" y="96" width="318" height="348" rx="12" fill="#ffffff" stroke="#c59c63" stroke-width="1.8" />
  <text x="489" y="122" text-anchor="middle" fill="#86663b" font-size="11.5" font-weight="700" font-family="ui-monospace, monospace">SHARED MATHEMATICAL CORE</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="348" y="136" width="282" height="58" rx="8" fill="#fbf7ef" stroke="#d8c7ab" stroke-width="1.2" />
    <text x="362" y="159" fill="#231f1a" font-size="13.2" font-weight="700">1. Expectation &amp; Calibration</text>
    <text x="362" y="180" fill="#5b5449" font-size="11.4">Turn rank scores into priceable probabilities</text>

    <rect x="348" y="210" width="282" height="58" rx="8" fill="#fbf7ef" stroke="#d8c7ab" stroke-width="1.2" />
    <text x="362" y="233" fill="#231f1a" font-size="13.2" font-weight="700">2. Lagrangian Duality &amp; Pacing</text>
    <text x="362" y="254" fill="#5b5449" font-size="11.4">Map Budget / QPS / Ad Load to dual prices</text>

    <rect x="348" y="284" width="282" height="58" rx="8" fill="#fbf7ef" stroke="#d8c7ab" stroke-width="1.2" />
    <text x="362" y="307" fill="#231f1a" font-size="13.2" font-weight="700">3. Counterfactual &amp; Censoring Fix</text>
    <text x="362" y="328" fill="#5b5449" font-size="11.4">Repair MNAR logs via IPS &amp; survival loss</text>

    <rect x="348" y="358" width="282" height="58" rx="8" fill="#fbf7ef" stroke="#d8c7ab" stroke-width="1.2" />
    <text x="362" y="381" fill="#231f1a" font-size="13.2" font-weight="700">4. Non-Stationary Exploration</text>
    <text x="362" y="402" fill="#5b5449" font-size="11.4">Keep fresh supply &amp; valid IPS propensities</text>
  </g>

  <line x1="489" y1="194" x2="489" y2="207" stroke="#86663b" stroke-width="1.4" marker-end="url(#arr)" />
  <line x1="489" y1="268" x2="489" y2="281" stroke="#86663b" stroke-width="1.4" marker-end="url(#arr)" />
  <line x1="489" y1="342" x2="489" y2="355" stroke="#86663b" stroke-width="1.4" marker-end="url(#arr)" />

  <!-- Right Column: Failure Branches -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <line x1="630" y1="165" x2="674" y2="165" stroke="#a44a3f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-fail)" />
    <rect x="678" y="136" width="252" height="58" rx="8" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1.3" />
    <text x="690" y="158" fill="#8f362c" font-size="11.8" font-weight="700">Failure: Good Rank, Wrong Price</text>
    <text x="690" y="179" fill="#8f362c" font-size="10.2">Under-bid starves volume; over-bid bleeds</text>

    <line x1="630" y1="239" x2="674" y2="239" stroke="#a44a3f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-fail)" />
    <rect x="678" y="210" width="252" height="58" rx="8" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1.3" />
    <text x="690" y="232" fill="#8f362c" font-size="11.8" font-weight="700">Failure: Budget Burn or Chaos</text>
    <text x="690" y="253" fill="#8f362c" font-size="10.2">ROAS breach, locked buckets, broken IC</text>

    <line x1="630" y1="313" x2="674" y2="313" stroke="#a44a3f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-fail)" />
    <rect x="678" y="284" width="252" height="58" rx="8" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1.3" />
    <text x="690" y="306" fill="#8f362c" font-size="11.8" font-weight="700">Failure: Bigger Model, Deeper Bias</text>
    <text x="690" y="327" fill="#8f362c" font-size="10.2">Memorizes prior policy &amp; delayed negatives</text>

    <line x1="630" y1="387" x2="674" y2="387" stroke="#a44a3f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-fail)" />
    <rect x="678" y="358" width="252" height="58" rx="8" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1.3" />
    <text x="690" y="380" fill="#8f362c" font-size="11.8" font-weight="700">Failure: Echo Chamber Collapse</text>
    <text x="690" y="401" fill="#8f362c" font-size="10.2">Cold-start starves; ops fall back to rules</text>
  </g>

  <text x="36" y="472" fill="#7c6b53" font-size="11.3" font-family="system-ui, -apple-system, sans-serif">
    Note: Walled-garden ad platforms unify buyer, exchange, and publisher roles internally, yet all four pillars remain active inside the stack.
  </text>
</svg>

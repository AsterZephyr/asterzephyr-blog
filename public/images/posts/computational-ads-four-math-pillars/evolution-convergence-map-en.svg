<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="How four generations of computational advertising architectures converge onto four unchanged mathematical pillars">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7c6b53" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="14" fill="#fbf9f5" stroke="#e4ddd0" stroke-width="1.5" />

  <!-- Header -->
  <text x="36" y="38" fill="#86663b" font-size="11.5" font-weight="700" letter-spacing="1.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EVOLUTION TO MATHEMATICAL INVARIANTS (2002 - 2026)</text>
  <text x="36" y="64" fill="#231f1a" font-size="19.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Four Ad-Tech Eras Upgraded Models &amp; Coupling, Yet Converged on Four Pillars</text>

  <!-- Row 1: Four Eras -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="36" y="92" width="198" height="108" rx="10" fill="#f4efe6" stroke="#d4c9b5" stroke-width="1.3" />
    <text x="50" y="114" fill="#86663b" font-size="11" font-weight="700" font-family="ui-monospace, monospace">ERA 1 · 2002 - 2014</text>
    <text x="50" y="136" fill="#231f1a" font-size="14" font-weight="700">Linear Auctions &amp; RTB</text>
    <text x="50" y="158" fill="#5b5449" font-size="11.8">AdWords GSP · LR / FTRL</text>
    <text x="50" y="176" fill="#5b5449" font-size="11.8">GD Duals · Delay · Bandits</text>

    <rect x="264" y="92" width="198" height="108" rx="10" fill="#f4efe6" stroke="#d4c9b5" stroke-width="1.3" />
    <text x="278" y="114" fill="#86663b" font-size="11" font-weight="700" font-family="ui-monospace, monospace">ERA 2 · 2015 - 2022</text>
    <text x="278" y="136" fill="#231f1a" font-size="14" font-weight="700">Deep Cascade &amp; 1PA</text>
    <text x="278" y="158" fill="#5b5449" font-size="11.8">DeepFM / DIN · oCPX / ROAS</text>
    <text x="278" y="176" fill="#5b5449" font-size="11.8">ESMM / ZILN · Shading · QPS</text>

    <rect x="492" y="92" width="198" height="108" rx="10" fill="#eef4f0" stroke="#9ebaa8" stroke-width="1.4" />
    <text x="506" y="114" fill="#2d6647" font-size="11" font-weight="700" font-family="ui-monospace, monospace">ERA 3 · 2024 - 2026</text>
    <text x="506" y="136" fill="#1e3d2b" font-size="14" font-weight="700">Ranking Scaling Laws</text>
    <text x="506" y="158" fill="#3c5a47" font-size="11.8">Wukong · RankMixer (15B)</text>
    <text x="506" y="176" fill="#3c5a47" font-size="11.8">OneTrans · RankUp High-Rank</text>

    <rect x="720" y="92" width="204" height="108" rx="10" fill="#eef2f7" stroke="#96aec8" stroke-width="1.4" />
    <text x="734" y="114" fill="#2b527a" font-size="11" font-weight="700" font-family="ui-monospace, monospace">ERA 4 · 2024 - 2026</text>
    <text x="734" y="136" fill="#1a344f" font-size="14" font-weight="700">Generative Ads &amp; Bids</text>
    <text x="734" y="158" fill="#3a526c" font-size="11.8">HSTU / OneRec · GPR / GR4AD</text>
    <text x="734" y="176" fill="#3a526c" font-size="11.8">GEM-Rec Monotonic · AIGB</text>
  </g>

  <!-- Era progression arrows -->
  <line x1="234" y1="146" x2="261" y2="146" stroke="#7c6b53" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="462" y1="146" x2="489" y2="146" stroke="#7c6b53" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="690" y1="146" x2="717" y2="146" stroke="#7c6b53" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Middle Convergence Band -->
  <rect x="110" y="228" width="740" height="44" rx="22" fill="#fcf3e6" stroke="#d8a866" stroke-width="1.4" stroke-dasharray="5 3" />
  <text x="480" y="255" text-anchor="middle" fill="#6b4b1f" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">
    Changed: Function Capacity &amp; Stage Coupling · Unchanged: Four Mathematical Hard Boundaries
  </text>

  <line x1="135" y1="200" x2="180" y2="226" stroke="#7c6b53" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="363" y1="200" x2="363" y2="226" stroke="#7c6b53" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="591" y1="200" x2="591" y2="226" stroke="#7c6b53" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="822" y1="200" x2="780" y2="226" stroke="#7c6b53" stroke-width="1.3" marker-end="url(#arrow)" />

  <line x1="180" y1="272" x2="135" y2="300" stroke="#7c6b53" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="363" y1="272" x2="363" y2="300" stroke="#7c6b53" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="591" y1="272" x2="591" y2="300" stroke="#7c6b53" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="780" y1="272" x2="822" y2="300" stroke="#7c6b53" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Row 2: Four Pillars -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="36" y="304" width="204" height="136" rx="10" fill="#ffffff" stroke="#c59c63" stroke-width="1.6" />
    <text x="50" y="326" fill="#86663b" font-size="10.8" font-weight="700" font-family="ui-monospace, monospace">PILLAR 1 · PRICING RULER</text>
    <text x="50" y="348" fill="#231f1a" font-size="13" font-weight="700">Expectation &amp; Calibration</text>
    <text x="50" y="370" fill="#524b42" font-size="11.8">Chain Rule · Heavy-Tail ZILN</text>
    <rect x="48" y="384" width="180" height="44" rx="6" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1" />
    <text x="56" y="402" fill="#8f362c" font-size="10.4" font-weight="700">2026 Pushback: Funnel Shift</text>
    <text x="56" y="418" fill="#8f362c" font-size="10.2">Lost in the Funnel · SID Clash</text>

    <rect x="264" y="304" width="204" height="136" rx="10" fill="#ffffff" stroke="#c59c63" stroke-width="1.6" />
    <text x="278" y="326" fill="#86663b" font-size="10.8" font-weight="700" font-family="ui-monospace, monospace">PILLAR 2 · GLOBAL GUARDRAIL</text>
    <text x="278" y="348" fill="#231f1a" font-size="13" font-weight="700">Duality &amp; Pacing Control</text>
    <text x="278" y="370" fill="#524b42" font-size="11.8">Shadow Price · Budget / ROAS</text>
    <rect x="276" y="384" width="180" height="44" rx="6" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1" />
    <text x="284" y="402" fill="#8f362c" font-size="10.4" font-weight="700">2026 Pushback: Monotonicity</text>
    <text x="284" y="418" fill="#8f362c" font-size="10.2">GEM-Rec · FIXP / Chaos Games</text>

    <rect x="492" y="304" width="204" height="136" rx="10" fill="#ffffff" stroke="#c59c63" stroke-width="1.6" />
    <text x="506" y="326" fill="#86663b" font-size="10.8" font-weight="700" font-family="ui-monospace, monospace">PILLAR 3 · TRUE WORLD</text>
    <text x="506" y="348" fill="#231f1a" font-size="13" font-weight="700">Counterfactual Debiasing</text>
    <text x="506" y="370" fill="#524b42" font-size="11.8">Selection · Delay · Censoring</text>
    <rect x="504" y="384" width="180" height="44" rx="6" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1" />
    <text x="510" y="402" fill="#8f362c" font-size="10" font-weight="700">2026 Pushback: Loop Drift</text>
    <text x="510" y="418" fill="#8f362c" font-size="10.2">ABPO Restores IPS Anchor</text>

    <rect x="720" y="304" width="204" height="136" rx="10" fill="#ffffff" stroke="#c59c63" stroke-width="1.6" />
    <text x="730" y="326" fill="#86663b" font-size="10.8" font-weight="700" font-family="ui-monospace, monospace">PILLAR 4 · MARKET OXYGEN</text>
    <text x="730" y="348" fill="#231f1a" font-size="12.8" font-weight="700">Non-Stationary Exploration</text>
    <text x="730" y="370" fill="#524b42" font-size="11.8">Bandits · Cold-Start · Floors</text>
    <rect x="732" y="384" width="180" height="44" rx="6" fill="#fdf1ef" stroke="#e2b4ad" stroke-width="1" />
    <text x="740" y="402" fill="#8f362c" font-size="10.4" font-weight="700">2026 Pushback: RL Collapse</text>
    <text x="740" y="418" fill="#8f362c" font-size="10.2">Negative Adv Kills Broad Recall</text>
  </g>
</svg>

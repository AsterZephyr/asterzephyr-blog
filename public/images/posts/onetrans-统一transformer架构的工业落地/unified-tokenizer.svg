<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c4956a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b72b0"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 13px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 11px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .arrow-label { font-size: 10px; font-weight: 500; fill: #5a5a58; }
    .token { font-size: 12px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">Unified Tokenizer</text>

  <!-- Left: Sequence inputs -->
  <text x="80" y="72" class="section-label">行为序列输入</text>

  <rect x="60" y="85" width="160" height="40" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="140" y="110" text-anchor="middle" class="node-title">点击序列</text>

  <rect x="60" y="145" width="160" height="40" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="140" y="170" text-anchor="middle" class="node-title">加购序列</text>

  <rect x="60" y="205" width="160" height="40" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="140" y="230" text-anchor="middle" class="node-title">购买序列</text>

  <!-- MLPs for sequences -->
  <rect x="280" y="85" width="100" height="40" rx="6" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="330" y="110" text-anchor="middle" class="node-sub">MLP₁</text>

  <rect x="280" y="145" width="100" height="40" rx="6" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="330" y="170" text-anchor="middle" class="node-sub">MLP₂</text>

  <rect x="280" y="205" width="100" height="40" rx="6" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="330" y="230" text-anchor="middle" class="node-sub">MLP₃</text>

  <!-- S-tokens -->
  <rect x="440" y="85" width="100" height="40" rx="20" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2"/>
  <text x="490" y="110" text-anchor="middle" class="token" style="fill:#2f6b55">S-token₁</text>

  <rect x="440" y="145" width="100" height="40" rx="20" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2"/>
  <text x="490" y="170" text-anchor="middle" class="token" style="fill:#2f6b55">S-token₂</text>

  <rect x="440" y="205" width="100" height="40" rx="20" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2"/>
  <text x="490" y="230" text-anchor="middle" class="token" style="fill:#2f6b55">S-token₃</text>

  <!-- Arrows: input → MLP → token -->
  <line x1="220" y1="105" x2="280" y2="105" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="220" y1="165" x2="280" y2="165" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="220" y1="225" x2="280" y2="225" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="380" y1="105" x2="440" y2="105" stroke="#9b72b0" stroke-width="1.2" marker-end="url(#arrowPurple)"/>
  <line x1="380" y1="165" x2="440" y2="165" stroke="#9b72b0" stroke-width="1.2" marker-end="url(#arrowPurple)"/>
  <line x1="380" y1="225" x2="440" y2="225" stroke="#9b72b0" stroke-width="1.2" marker-end="url(#arrowPurple)"/>

  <!-- Non-sequence inputs -->
  <text x="80" y="290" class="section-label">非序列特征输入</text>

  <rect x="60" y="305" width="160" height="40" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="140" y="330" text-anchor="middle" class="node-title">年龄/性别/城市</text>

  <rect x="60" y="360" width="160" height="40" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="140" y="385" text-anchor="middle" class="node-title">广告特征</text>

  <!-- Unified MLP -->
  <rect x="280" y="325" width="100" height="50" rx="6" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="330" y="348" text-anchor="middle" class="node-sub">统一 MLP</text>
  <text x="330" y="364" text-anchor="middle" class="node-sub">Auto-Split</text>

  <!-- NS-tokens -->
  <rect x="440" y="310" width="100" height="34" rx="17" fill="#fdf6e3" stroke="#c4956a" stroke-width="2"/>
  <text x="490" y="332" text-anchor="middle" class="token" style="fill:#8a5c2a">NS-token₁</text>

  <rect x="440" y="356" width="100" height="34" rx="17" fill="#fdf6e3" stroke="#c4956a" stroke-width="2"/>
  <text x="490" y="378" text-anchor="middle" class="token" style="fill:#8a5c2a">NS-token₂</text>

  <!-- Arrows: NS input → MLP → tokens -->
  <line x1="220" y1="325" x2="280" y2="340" stroke="#c4956a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="220" y1="380" x2="280" y2="360" stroke="#c4956a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="380" y1="340" x2="440" y2="327" stroke="#c4956a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="380" y1="358" x2="440" y2="370" stroke="#c4956a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- Timestamp-aware fusion -->
  <rect x="620" y="110" width="240" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="740" y="133" text-anchor="middle" class="node-title">按时间戳交错排列</text>
  <text x="740" y="150" text-anchor="middle" class="node-sub">Timestamp-aware Fusion</text>

  <!-- Arrows from S-tokens to fusion -->
  <line x1="540" y1="105" x2="620" y2="125" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="540" y1="165" x2="620" y2="135" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="540" y1="215" x2="620" y2="145" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>

  <!-- Final sequence -->
  <rect x="600" y="240" width="330" height="70" rx="10" fill="#ffffff" stroke="#141413" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="765" y="265" text-anchor="middle" class="section-label">最终 TOKEN 序列</text>

  <!-- Token sequence visualization -->
  <rect x="620" y="275" width="36" height="22" rx="4" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="638" y="290" text-anchor="middle" style="font-size:9px;fill:#2f6b55">S₁</text>
  <rect x="660" y="275" width="36" height="22" rx="4" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="678" y="290" text-anchor="middle" style="font-size:9px;fill:#2f6b55">S₂</text>
  <rect x="700" y="275" width="36" height="22" rx="4" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="718" y="290" text-anchor="middle" style="font-size:9px;fill:#2f6b55">S₃</text>
  <text x="748" y="290" text-anchor="middle" style="font-size:11px;fill:#8a8a87">...</text>
  <rect x="762" y="275" width="36" height="22" rx="4" fill="#fdf6e3" stroke="#c4956a" stroke-width="1"/>
  <text x="780" y="290" text-anchor="middle" style="font-size:9px;fill:#8a5c2a">NS₁</text>
  <rect x="802" y="275" width="36" height="22" rx="4" fill="#fdf6e3" stroke="#c4956a" stroke-width="1"/>
  <text x="820" y="290" text-anchor="middle" style="font-size:9px;fill:#8a5c2a">NS₂</text>
  <rect x="842" y="275" width="36" height="22" rx="4" fill="#fdf6e3" stroke="#c4956a" stroke-width="1"/>
  <text x="860" y="290" text-anchor="middle" style="font-size:9px;fill:#8a5c2a">NS₃</text>
  <rect x="882" y="275" width="36" height="22" rx="4" fill="#fdf6e3" stroke="#c4956a" stroke-width="1"/>
  <text x="900" y="290" text-anchor="middle" style="font-size:9px;fill:#8a5c2a">NS₄</text>

  <!-- Arrows to final -->
  <line x1="740" y1="160" x2="740" y2="240" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
  <path d="M 540 350 L 600 280" fill="none" stroke="#c4956a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- Key design decisions -->
  <rect x="600" y="340" width="330" height="120" rx="10" fill="none" stroke="#ded8cf" stroke-width="1"/>
  <text x="620" y="365" class="section-label">关键设计决策</text>
  <text x="620" y="388" class="node-sub">1. 多行为序列按时间交错排列 (非按类型分段)</text>
  <text x="620" y="408" class="node-sub">2. Auto-Split: 非序列特征过统一MLP均匀切分</text>
  <text x="620" y="428" class="node-sub">3. S-tokens 共享参数, NS-tokens 独立参数</text>
  <text x="620" y="448" class="node-sub">4. Causal mask 天然支持 KV Caching</text>
</svg>

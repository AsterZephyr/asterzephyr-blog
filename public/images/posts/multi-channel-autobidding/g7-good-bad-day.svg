<svg xmlns="http://www.w3.org/2000/svg" width="720" height="539" viewBox="0 0 720 539" role="img" aria-label="只调预算也会输：好日子和坏日子"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="539" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">只调预算也会输：好日子和坏日子</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">博主构造的反例，对应论文 Eq. (1)、(4) 的随机设定</text><rect x="36" y="82" width="317.0" height="146" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">z = A</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">好日子（概率 1/2）</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">一场拍卖：v = 20，d = 10</text><text x="56" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">v/d = 2</text><rect x="367.0" y="82" width="317.0" height="146" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">z = B</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">坏日子（概率 1/2）</text><text x="387.0" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">一场拍卖：v = 1，d = 10</text><text x="387.0" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">v/d = 0.1</text><text x="36" y="258" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">一个渠道，γ = 1，总预算 ρ = 5（按期望计）。</text><rect x="36" y="278" width="206.66666666666666" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="308" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">GL-OPT</text><text x="56" y="338" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">好日子全买，坏日子不买</text><text x="56" y="365" fill="#282c35" font-size="14" font-weight="500" text-anchor="start" letter-spacing="0.3">期望花费 5，期望转化 10</text><text x="56" y="392" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">= 10</text><rect x="256.66666666666663" y="278" width="206.66666666666666" height="149" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="308" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">只设预算 ρ1</text><text x="276.66666666666663" y="338" fill="#3f4450" font-size="14" font-weight="400" text-anchor="start">每天同一个预算，花费 ≤ 5</text><text x="276.66666666666663" y="365" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">γ1 = 0，坏日子也照买</text><text x="276.66666666666663" y="392" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">最优 ρ1 = 5，转化 5.25</text><rect x="477.33333333333326" y="278" width="206.66666666666666" height="149" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="308" fill="#282c35" font-size="14" font-weight="600" text-anchor="start">设 ROI 目标 γ1 ∈ (0.1, 2]</text><text x="497.33333333333326" y="338" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">坏日子渠道自己不买</text><text x="497.33333333333326" y="365" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">好日子预算 10 全花</text><text x="497.33333333333326" y="392" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">= 10</text><text x="36" y="457" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">把好日子概率压到 p、价值放大，只调预算的比值约为 p，同样可以趋于 0。</text><text x="36" y="481" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">Theorem 3.3 证明里的 (17) 式要求每次实现都不超预算，但全局最优的花费只在期望上等于</text><text x="36" y="505" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">预算。</text></g></svg>
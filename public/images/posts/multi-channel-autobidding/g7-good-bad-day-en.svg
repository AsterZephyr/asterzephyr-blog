<svg xmlns="http://www.w3.org/2000/svg" width="720" height="563" viewBox="0 0 720 563" role="img" aria-label="Budgets alone can lose: good and bad days"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="563" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">Budgets alone can lose: good and bad days</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">The blogger's counterexample in the stochastic setting of Eq. (1), (4)</text><rect x="36" y="82" width="317.0" height="146" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">z = A</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Good day (prob. 1/2)</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">one auction: v = 20, d = 10</text><text x="56" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">v/d = 2</text><rect x="367.0" y="82" width="317.0" height="146" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">z = B</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Bad day (prob. 1/2)</text><text x="387.0" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">one auction: v = 1, d = 10</text><text x="387.0" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">v/d = 0.1</text><text x="36" y="258" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">One channel, γ = 1, total budget ρ = 5 (in expectation).</text><rect x="36" y="278" width="206.66666666666666" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="308" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">GL-OPT</text><text x="56" y="338" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">buy good days only</text><text x="56" y="365" fill="#282c35" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0.3">E[spend] 5, E[conv.] 10</text><text x="56" y="392" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">= 10</text><rect x="256.66666666666663" y="278" width="206.66666666666666" height="149" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="308" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Budget ρ1 only</text><text x="276.66666666666663" y="338" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">one daily budget ≤ 5</text><text x="276.66666666666663" y="365" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">γ1 = 0: buys bad days</text><text x="276.66666666666663" y="392" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">best ρ1 = 5: 5.25</text><rect x="477.33333333333326" y="278" width="206.66666666666666" height="149" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="308" fill="#282c35" font-size="15" font-weight="600" text-anchor="start">ROI target γ1 ∈ (0.1, 2]</text><text x="497.33333333333326" y="338" fill="#3f4450" font-size="16" font-weight="400" text-anchor="start">skips bad days itself</text><text x="497.33333333333326" y="365" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">budget 10 on good days</text><text x="497.33333333333326" y="392" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">= 10</text><text x="36" y="457" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">Shrink the good-day probability to p and scale its value: the budget-only ratio is</text><text x="36" y="481" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">about p and can also go to 0. Eq. (17) in the proof of Theorem 3.3 needs every</text><text x="36" y="505" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">realization to stay within budget, but the optimum only matches the budget in</text><text x="36" y="529" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">expectation.</text></g></svg>
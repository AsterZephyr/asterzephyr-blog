<svg xmlns="http://www.w3.org/2000/svg" width="720" height="343" viewBox="0 0 720 343" role="img" aria-label="Each knob governs one axis"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="343" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">Each knob governs one axis</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">The blogger's summary, from Theorem 3.2 and the counterexample</text><rect x="36" y="82" width="317.0" height="173" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Across channels</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Budget ρj</text><text x="56" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">splits money across channels</text><text x="56" y="195" fill="#3f4450" font-size="13" font-weight="400" text-anchor="start">lets cheap channels subsidize costly ones</text><text x="56" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">cannot flex with each day's traffic</text><rect x="367.0" y="82" width="317.0" height="173" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Across time</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Target ROI γj</text><text x="387.0" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">picks traffic worth buying</text><text x="387.0" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">spends less on bad days by itself</text><text x="387.0" y="222" fill="#6b7280" font-size="14" font-weight="400" text-anchor="start">a hard cutoff, no cross-channel subsidy</text><text x="36" y="285" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">"Budgets suffice" holds for deterministic instances and very stable traffic; the</text><text x="36" y="309" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">more traffic quality swings across periods, the less an ROI target is redundant.</text></g></svg>
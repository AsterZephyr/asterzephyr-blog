<svg xmlns="http://www.w3.org/2000/svg" width="720" height="534" viewBox="0 0 720 534" role="img" aria-label="ROI targets alone: the gap can be arbitrarily large"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="534" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="25" font-weight="600" text-anchor="start">ROI targets alone: the gap can be arbitrarily large</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Instance from Theorem 3.2, γ = 1, unlimited budget</text><rect x="36" y="82" width="317.0" height="173" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Infinite ROI</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Channel 1</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Auction 1: v = 1, d = 0</text><text x="56" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">a free conversion</text><rect x="367.0" y="82" width="317.0" height="173" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Each loses alone</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Channel 2</text><text x="387.0" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Auction 2: v = X, d = 1+X</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">Auction 3: v = 2X, d = 2(1+X)</text><text x="387.0" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">both have ROI X/(1+X) &lt; 1</text><rect x="36" y="273" width="317.0" height="173" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="303" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Cross-channel subsidy</text><text x="56" y="329" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Global optimum</text><text x="56" y="359" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">Buy 1 and 2: conversion 1+X, spend 1+X</text><text x="56" y="386" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">channel 1's surplus funds channel 2</text><text x="56" y="413" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">GL-OPT = 1 + X</text><rect x="367.0" y="273" width="317.0" height="173" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="303" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">All or nothing</text><text x="387.0" y="329" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Set only γ2</text><text x="387.0" y="359" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">γ2 ≤ X/(1+X): buys both, total ROI &lt; 1</text><text x="387.0" y="386" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">γ2 &gt; X/(1+X): buys neither</text><text x="387.0" y="413" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">CH-OPT(IR) = 1</text><text x="36" y="476" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">The ratio 1/(1+X) goes to 0 as X → ∞. An ROI knob cannot say "buy only part"; a</text><text x="36" y="500" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">budget can: ρ2 = 1+X lands exactly on the optimum.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="两个优化问题：理想上限与实际可做"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="390" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">两个优化问题：理想上限与实际可做</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">论文 Eq. (1)、(3)、(4)</text><rect x="36" y="82" width="317.0" height="244" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">理论上限</text><text x="56" y="138" fill="#282c35" font-size="20" font-weight="600" text-anchor="start">GL-OPT：逐场拍卖决定买不买</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max Σj E[vjᵀ xj]</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. Σ E[vᵀx] ≥ γ Σ E[dᵀx]</text><text x="56" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">     Σ E[dᵀx] ≤ ρ</text><text x="56" y="266" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">x 可以随每次实现的 z 变化</text><text x="56" y="293" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">广告主实际做不到</text><rect x="367.0" y="82" width="317.0" height="244" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">现实可做</text><text x="387.0" y="138" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">CH-OPT(I)：只调每个渠道的旋钮</text><text x="387.0" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max Σj E[Vj(γj, ρj; zj)]</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. Σ E[Vj] ≥ γ Σ E[Dj]</text><text x="387.0" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">     Σ E[Dj] ≤ ρ</text><text x="387.0" y="266" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">渠道每次按 (γj, ρj) 求解 Eq. (4)</text><text x="387.0" y="293" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">IB 只调预算 · IR 只调 ROI · IG 都调</text><text x="36" y="356" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">Lemma 3.1：任何旋钮组合都不会超过 GL-OPT。问题是哪种旋钮能逼近它。</text></g></svg>
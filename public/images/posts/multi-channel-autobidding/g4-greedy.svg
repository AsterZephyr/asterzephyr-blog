<svg xmlns="http://www.w3.org/2000/svg" width="720" height="536" viewBox="0 0 720 536" role="img" aria-label="预算为什么好用：渠道在做分数背包"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="536" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">预算为什么好用：渠道在做分数背包</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">论文 Lemma 4.3 的结构，示意</text><rect x="36" y="82" width="648" height="250" rx="12" fill="#fffdf8" stroke="#ded8cc"/><path d="M96 288H634" stroke="#c3bbab" stroke-width="1.2"/><path d="M96 288V128" stroke="#c3bbab" stroke-width="1.2"/><path d="M96.0 288.0 L192.8 222.0 L311.2 175.4 L461.8 143.8 L634.0 128.0" fill="none" stroke="#86663b" stroke-width="2.4"/><circle cx="192.8" cy="222.0" r="3.5" fill="#86663b"/><text x="152.42000000000002" y="274.984126984127" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">v/d 最高的先买</text><circle cx="311.2" cy="175.4" r="3.5" fill="#86663b"/><text x="260.02" y="218.68783068783068" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">次高</text><circle cx="461.8" cy="143.8" r="3.5" fill="#86663b"/><text x="394.52000000000004" y="179.6049382716049" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">再次</text><circle cx="634.0" cy="128.0" r="3.5" fill="#86663b"/><text x="555.9200000000001" y="155.90123456790124" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">最差</text><path d="M391.90000000000003 288V128" stroke="#7e8a93" stroke-width="1.5" stroke-dasharray="3 4"/><text x="385.90000000000003" y="142" fill="#5f6a72" font-size="14" font-weight="400" text-anchor="end">预算 ρj 截断在这里</text><text x="86" y="132" fill="#282c35" font-size="15" font-weight="600" text-anchor="end">Vj</text><text x="634" y="314" fill="#6b7280" font-size="14" font-weight="400" text-anchor="end">预算 ρj →</text><rect x="36" y="350" width="317.0" height="122" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="380" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">渠道内部</text><text x="56" y="410" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">按 v/d 从高到低买，直到预算花完</text><text x="56" y="437" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">斜率依次变小：凹、分段线性</text><rect x="367.0" y="350" width="317.0" height="122" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="380" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">广告主这边</text><text x="387.0" y="410" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Vj(ρj) 是凹函数</text><text x="387.0" y="437" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">跨渠道分预算 = 凸优化</text><text x="36" y="502" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">弯折点只取决于 (v, d) 的分布；对偶价格一变，最优预算跳到另一个弯折点。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="343" viewBox="0 0 720 343" role="img" aria-label="两个旋钮各管一个维度"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="343" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">两个旋钮各管一个维度</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">博主的归纳，基于 Theorem 3.2 与上面的反例</text><rect x="36" y="82" width="317.0" height="173" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">跨渠道</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">预算 ρj</text><text x="56" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">管“钱在渠道之间怎么分”</text><text x="56" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">能用便宜渠道的盈余补贴贵渠道</text><text x="56" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">不能随当天流量好坏伸缩</text><rect x="367.0" y="82" width="317.0" height="173" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">跨时间</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">目标 ROI γj</text><text x="387.0" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">管“渠道内部哪些量值得买”</text><text x="387.0" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">能在坏日子自动少花</text><text x="387.0" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">一刀切，无法跨渠道补贴</text><text x="36" y="285" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">论文的结论“只需预算”在确定性实例和流量很稳定时成立；</text><text x="36" y="309" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">流量质量随周期波动越大，ROI 目标越不该被当成冗余。</text></g></svg>
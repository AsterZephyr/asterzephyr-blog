<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="Two problems: the ideal bound and what is doable"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="390" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="27" font-weight="600" text-anchor="start">Two problems: the ideal bound and what is doable</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Paper Eq. (1), (3), (4)</text><rect x="36" y="82" width="317.0" height="244" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Theoretical bound</text><text x="56" y="138" fill="#282c35" font-size="16" font-weight="600" text-anchor="start">GL-OPT: decide auction by auction</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max Σj E[vjᵀ xj]</text><text x="56" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. Σ E[vᵀx] ≥ γ Σ E[dᵀx]</text><text x="56" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">     Σ E[dᵀx] ≤ ρ</text><text x="56" y="266" fill="#6b7280" font-size="15" font-weight="400" text-anchor="start">x may change with every realization z</text><text x="56" y="293" fill="#86663b" font-size="17" font-weight="600" text-anchor="start">Not available to the advertiser</text><rect x="367.0" y="82" width="317.0" height="244" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Doable in practice</text><text x="387.0" y="138" fill="#282c35" font-size="16" font-weight="600" text-anchor="start">CH-OPT(I): only per-channel knobs</text><text x="387.0" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">max Σj E[Vj(γj, ρj; zj)]</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">s.t. Σ E[Vj] ≥ γ Σ E[Dj]</text><text x="387.0" y="222" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">     Σ E[Dj] ≤ ρ</text><text x="387.0" y="266" fill="#6b7280" font-size="14" font-weight="400" text-anchor="start">Each channel solves Eq. (4) given (γj, ρj)</text><text x="387.0" y="293" fill="#86663b" font-size="15" font-weight="600" text-anchor="start">IB budget only · IR ROI only · IG both</text><text x="36" y="356" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">Lemma 3.1: no knob setting beats GL-OPT. The question is which knob gets close.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="535" viewBox="0 0 720 535" role="img" aria-label="SGD-UCB: dual prices plus a multi-armed bandit"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="535" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">SGD-UCB: dual prices plus a multi-armed bandit</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Algorithm 1, one loop per period</text><rect x="36" y="82" width="317.0" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">1  Pick budgets</text><text x="56" y="142" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">K budget arms, spacing δ</text><text x="56" y="169" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">each channel takes the argmax of</text><text x="56" y="196" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">mean + UCB − (λγ+μ)a/(1+λ)</text><rect x="367.0" y="82" width="317.0" height="149" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">2  Observe</text><text x="387.0" y="142" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">budget fully spent (Asm. 4.1)</text><text x="387.0" y="169" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">only this period's Vj is seen</text><text x="387.0" y="196" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">update arm mean and count</text><path d="M360.0 249V285" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="276.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">compute two constraint gaps</text><rect x="36" y="295" width="317.0" height="176" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="56" y="325" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">3  Update dual prices</text><text x="56" y="355" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">g1 = Σ(Vj − γρj)   ROI slack</text><text x="56" y="382" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">g2 = ρ − Σρj       budget slack</text><text x="56" y="409" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">λ ← Π(λ − η g1)</text><text x="56" y="436" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">μ ← Π(μ − η g2)</text><rect x="367.0" y="295" width="317.0" height="176" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="325" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">4  Safety valve</text><text x="387.0" y="355" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">cum. ROI or spend off track</text><text x="387.0" y="382" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">stop; tiny budgets after</text><text x="387.0" y="409" fill="#86663b" font-size="17" font-weight="600" text-anchor="start">keeps constraints in expectation</text><text x="36" y="501" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">The output is the time-averaged budget ρ̄T over T periods, not the last round.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="535" viewBox="0 0 720 535" role="img" aria-label="SGD-UCB：对偶价格配多臂老虎机"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="535" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">SGD-UCB：对偶价格配多臂老虎机</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">论文 Algorithm 1，每个周期一圈</text><rect x="36" y="82" width="317.0" height="149" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">1  选预算</text><text x="56" y="142" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">预算离散成 K 个臂，间隔 δ</text><text x="56" y="169" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">每渠道选 argmax</text><text x="56" y="196" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">均值 + UCB − (λγ+μ)a/(1+λ)</text><rect x="367.0" y="82" width="317.0" height="149" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">2  看回传</text><text x="387.0" y="142" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">渠道花光预算（Assumption 4.1）</text><text x="387.0" y="169" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">只观察本周期 Vj</text><text x="387.0" y="196" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">更新该臂均值和次数</text><path d="M360.0 249V285" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="276.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">算两个约束缺口</text><rect x="36" y="295" width="317.0" height="176" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="56" y="325" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">3  更新对偶价格</text><text x="56" y="355" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">g1 = Σ(Vj − γρj)   ROI 余量</text><text x="56" y="382" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">g2 = ρ − Σρj       预算余量</text><text x="56" y="409" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">λ ← Π(λ − η g1)</text><text x="56" y="436" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">μ ← Π(μ − η g2)</text><rect x="367.0" y="295" width="317.0" height="176" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="325" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">4  安全阀</text><text x="387.0" y="355" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">累计 ROI 太负或花费太多</text><text x="387.0" y="382" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">就停止学习，余下周期给极小预算</text><text x="387.0" y="409" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">保证约束在期望上成立</text><text x="36" y="501" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">输出是 T 个周期预算的平均值 ρ̄T，不是最后一轮的预算。</text></g></svg>
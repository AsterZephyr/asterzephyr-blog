<svg xmlns="http://www.w3.org/2000/svg" width="720" height="766" viewBox="0 0 720 766" role="img" aria-label="No auctions in sight, only two knobs"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="766" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">No auctions in sight, only two knobs</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Model of Section 2: channels bid for the advertiser and report two totals</text><rect x="36" y="82" width="648.0" height="200" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Decision maker</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Advertiser</text><text x="56" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Global goal: maximize total conversion</text><text x="56" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Global constraints: total ROI ≥ γ, total spend ≤ ρ</text><text x="56" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">Per channel, only two settings:</text><text x="56" y="249" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">budget ρj  ·  target ROI γj</text><path d="M360.0 300V336" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="327.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">send (γj, ρj) each period</text><rect x="36" y="346" width="206.66666666666666" height="146" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="56" y="376" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">e.g. Google Ads</text><text x="56" y="402" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Channel 1</text><text x="56" y="432" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">its own autobidding</text><text x="56" y="459" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">black box</text><rect x="256.66666666666663" y="346" width="206.66666666666666" height="146" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="376" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">e.g. Meta</text><text x="276.66666666666663" y="402" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Channel 2</text><text x="276.66666666666663" y="432" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">its own autobidding</text><text x="276.66666666666663" y="459" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">black box</text><rect x="477.33333333333326" y="346" width="206.66666666666666" height="146" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="376" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">…</text><text x="497.33333333333326" y="402" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Channel M</text><text x="497.33333333333326" y="432" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">its own autobidding</text><text x="497.33333333333326" y="459" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">black box</text><path d="M360.0 510V546" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="537.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">each channel buys across mj auctions</text><rect x="36" y="556" width="648.0" height="122" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="586" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Auctions</text><text x="56" y="616" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Each auction has value v and cost d (e.g. highest competing bid)</text><text x="56" y="643" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">(v, d) is drawn once per period from an unknown distribution pj</text><text x="36" y="708" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">The advertiser only gets back this period's total conversion Vj and spend Dj:</text><text x="36" y="732" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">bandit feedback.</text></g></svg>
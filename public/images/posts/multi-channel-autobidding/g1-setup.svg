<svg xmlns="http://www.w3.org/2000/svg" width="720" height="742" viewBox="0 0 720 742" role="img" aria-label="广告主看不见拍卖，只能拧两个旋钮"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="742" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">广告主看不见拍卖，只能拧两个旋钮</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">论文 Section 2 的建模：渠道代为竞价，只回传两个汇总数</text><rect x="36" y="82" width="648.0" height="200" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">决策方</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">广告主</text><text x="56" y="168" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">全局目标：总转化最大</text><text x="56" y="195" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">全局约束：总 ROI ≥ γ，总花费 ≤ ρ</text><text x="56" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">每个渠道只能设：</text><text x="56" y="249" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">预算 ρj  ·  目标 ROI γj</text><path d="M360.0 300V336" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="327.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">每个周期下发 (γj, ρj)</text><rect x="36" y="346" width="206.66666666666666" height="146" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="56" y="376" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">如 Google Ads</text><text x="56" y="402" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">渠道 1</text><text x="56" y="432" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">自己的 autobidding</text><text x="56" y="459" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">黑盒</text><rect x="256.66666666666663" y="346" width="206.66666666666666" height="146" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="276.66666666666663" y="376" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">如 Meta</text><text x="276.66666666666663" y="402" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">渠道 2</text><text x="276.66666666666663" y="432" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">自己的 autobidding</text><text x="276.66666666666663" y="459" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">黑盒</text><rect x="477.33333333333326" y="346" width="206.66666666666666" height="146" rx="12" fill="#ece7fb" stroke="#ded8cc" stroke-width="1"/><text x="497.33333333333326" y="376" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">…</text><text x="497.33333333333326" y="402" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">渠道 M</text><text x="497.33333333333326" y="432" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">自己的 autobidding</text><text x="497.33333333333326" y="459" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">黑盒</text><path d="M360.0 510V546" fill="none" stroke="#c3bbab" stroke-width="1.5" marker-end="url(#ar)"/><text x="374.0" y="537.0" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">每个渠道在 mj 场拍卖里买量</text><rect x="36" y="556" width="648.0" height="122" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="586" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">拍卖</text><text x="56" y="616" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">每场拍卖有价值 v 和成本 d（如最高竞争出价）</text><text x="56" y="643" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">(v, d) 每周期从未知分布 pj 中抽一次</text><text x="36" y="708" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">回传给广告主的只有本周期总转化 Vj 和总花费 Dj，即 bandit feedback。</text></g></svg>
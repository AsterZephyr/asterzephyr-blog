<svg xmlns="http://www.w3.org/2000/svg" width="720" height="534" viewBox="0 0 720 534" role="img" aria-label="只调 ROI 目标：差距可以任意大"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="534" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">只调 ROI 目标：差距可以任意大</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">论文 Theorem 3.2 的实例，γ = 1，预算无限</text><rect x="36" y="82" width="317.0" height="173" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">ROI 无穷大</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">渠道 1</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">拍卖 1：v = 1，d = 0</text><text x="56" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">白送的转化</text><rect x="367.0" y="82" width="317.0" height="173" rx="12" fill="#fae3dc" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">单看都亏</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">渠道 2</text><text x="387.0" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">拍卖 2：v = X，d = 1+X</text><text x="387.0" y="195" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">拍卖 3：v = 2X，d = 2(1+X)</text><text x="387.0" y="222" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">两场 ROI 都是 X/(1+X) &lt; 1</text><rect x="36" y="273" width="317.0" height="173" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="56" y="303" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">跨渠道补贴</text><text x="56" y="329" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">全局最优</text><text x="56" y="359" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">买 1 和 2：转化 1+X，花费 1+X</text><text x="56" y="386" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">用渠道 1 的盈余补渠道 2</text><text x="56" y="413" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">GL-OPT = 1 + X</text><rect x="367.0" y="273" width="317.0" height="173" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="303" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">全有或全无</text><text x="387.0" y="329" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">只设 γ2</text><text x="387.0" y="359" fill="#3f4450" font-size="16" font-weight="400" text-anchor="start">γ2 ≤ X/(1+X)：两场全买，总 ROI &lt; 1</text><text x="387.0" y="386" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">γ2 &gt; X/(1+X)：一场都不买</text><text x="387.0" y="413" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">CH-OPT(IR) = 1</text><text x="36" y="476" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">比值 1/(1+X)，X → ∞ 时趋于 0。ROI 旋钮切不出“只买一部分”，预算旋钮可以：ρ2 = 1+X </text><text x="36" y="500" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">正好买到全局最优。</text></g></svg>
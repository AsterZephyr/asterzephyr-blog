<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="Why budgets work: a fractional knapsack"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="560" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">Why budgets work: a fractional knapsack</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Structure from Lemma 4.3, schematic</text><rect x="36" y="82" width="648" height="250" rx="12" fill="#fffdf8" stroke="#ded8cc"/><path d="M96 288H634" stroke="#c3bbab" stroke-width="1.2"/><path d="M96 288V128" stroke="#c3bbab" stroke-width="1.2"/><path d="M96.0 288.0 L192.8 222.0 L311.2 175.4 L461.8 143.8 L634.0 128.0" fill="none" stroke="#86663b" stroke-width="2.4"/><circle cx="192.8" cy="222.0" r="3.5" fill="#86663b"/><text x="152.42000000000002" y="274.984126984127" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">highest v/d first</text><circle cx="311.2" cy="175.4" r="3.5" fill="#86663b"/><text x="260.02" y="218.68783068783068" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">next</text><circle cx="461.8" cy="143.8" r="3.5" fill="#86663b"/><text x="394.52000000000004" y="179.6049382716049" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">then</text><circle cx="634.0" cy="128.0" r="3.5" fill="#86663b"/><text x="555.9200000000001" y="155.90123456790124" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start">worst</text><path d="M391.90000000000003 288V128" stroke="#7e8a93" stroke-width="1.5" stroke-dasharray="3 4"/><text x="385.90000000000003" y="142" fill="#5f6a72" font-size="14" font-weight="400" text-anchor="end">budget ρj cuts here</text><text x="86" y="132" fill="#282c35" font-size="15" font-weight="600" text-anchor="end">Vj</text><text x="634" y="314" fill="#6b7280" font-size="14" font-weight="400" text-anchor="end">budget ρj →</text><rect x="36" y="350" width="317.0" height="122" rx="12" fill="#dcf1ec" stroke="#ded8cc" stroke-width="1"/><text x="56" y="380" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Inside the channel</text><text x="56" y="410" fill="#3f4450" font-size="15" font-weight="400" text-anchor="start">buy by falling v/d until budget ends</text><text x="56" y="437" fill="#6b7280" font-size="14" font-weight="400" text-anchor="start">slopes shrink: concave, piecewise linear</text><rect x="367.0" y="350" width="317.0" height="122" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="380" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">On the advertiser side</text><text x="387.0" y="410" fill="#3f4450" font-size="17" font-weight="400" text-anchor="start">Vj(ρj) is concave</text><text x="387.0" y="437" fill="#86663b" font-size="16" font-weight="600" text-anchor="start">splitting budget = convex problem</text><text x="36" y="502" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">Kinks depend only on the (v, d) distribution; when dual prices move, the optimal</text><text x="36" y="526" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">budget jumps to another kink.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="O(T^-1/3) 放在哪个位置"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="480" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">O(T^-1/3) 放在哪个位置</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">论文 Section 1.2 与 Remark 4.2 的对比，均为对最优值的近似误差</text><rect x="36" y="82" width="317.0" height="146" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">单点估计</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Flaxman et al. 2004</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">O(T^-1/4)</text><text x="56" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">约束已知，可直接判断是否可行</text><rect x="367.0" y="82" width="317.0" height="146" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">单点估计</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">该论文 SGD-UCB</text><text x="387.0" y="168" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">O(T^-1/3)</text><text x="387.0" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">约束未知 · 单点 · 非光滑</text><rect x="36" y="246" width="317.0" height="146" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="276" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">两点估计</text><text x="56" y="302" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Nguyen &amp; Balasubramanian 2022</text><text x="56" y="332" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">O(T^-1/2)</text><text x="56" y="359" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">光滑 + 强凸 · 两点估计</text><rect x="367.0" y="246" width="317.0" height="146" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="276" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">两点估计</text><text x="387.0" y="302" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Usmanova et al. 2019</text><text x="387.0" y="332" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">O(T^-1)</text><text x="387.0" y="359" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">线性未知约束 · 光滑 · 两点估计</text><text x="36" y="422" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">“两点估计”指同一周期能把函数查两次。广告主一天只能给渠道一个预算，只有单点。</text><text x="36" y="446" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">这一设定下的最优速率作者也说仍是开放问题。</text></g></svg>
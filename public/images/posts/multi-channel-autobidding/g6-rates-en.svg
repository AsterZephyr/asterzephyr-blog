<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504" role="img" aria-label="Where O(T^-1/3) sits"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c3bbab"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect width="720" height="504" rx="18" fill="#faf8f3"/><text x="36" y="46" fill="#282c35" font-size="28" font-weight="600" text-anchor="start">Where O(T^-1/3) sits</text><text x="36" y="74" fill="#6b7280" font-size="17" font-weight="400" text-anchor="start">Section 1.2 and Remark 4.2; approximation error to the optimum</text><rect x="36" y="82" width="317.0" height="146" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">One-point</text><text x="56" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Flaxman et al. 2004</text><text x="56" y="168" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">O(T^-1/4)</text><text x="56" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">known constraints</text><rect x="367.0" y="82" width="317.0" height="146" rx="12" fill="#fdf0d9" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="112" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">One-point</text><text x="387.0" y="138" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">This paper, SGD-UCB</text><text x="387.0" y="168" fill="#86663b" font-size="18" font-weight="600" text-anchor="start">O(T^-1/3)</text><text x="387.0" y="195" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">unknown constr. · non-smooth</text><rect x="36" y="246" width="317.0" height="146" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="56" y="276" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Two-point</text><text x="56" y="302" fill="#282c35" font-size="18" font-weight="600" text-anchor="start">Nguyen &amp; Balasubramanian 2022</text><text x="56" y="332" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">O(T^-1/2)</text><text x="56" y="359" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">smooth + strongly convex</text><rect x="367.0" y="246" width="317.0" height="146" rx="12" fill="#f3efe7" stroke="#ded8cc" stroke-width="1"/><text x="387.0" y="276" fill="#6b7280" font-size="14" font-weight="600" text-anchor="start">Two-point</text><text x="387.0" y="302" fill="#282c35" font-size="21" font-weight="600" text-anchor="start">Usmanova et al. 2019</text><text x="387.0" y="332" fill="#282c35" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0.3">O(T^-1)</text><text x="387.0" y="359" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">unknown linear constr. · smooth</text><text x="36" y="422" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">"Two-point" means querying the function twice per period. An advertiser sets one</text><text x="36" y="446" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">budget per period, so only one point. The authors call the optimal rate in this</text><text x="36" y="470" fill="#6b7280" font-size="16" font-weight="400" text-anchor="start">setting an open question.</text></g></svg>
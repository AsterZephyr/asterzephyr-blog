<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" fill="none">
  <defs>
    <filter id="shadowSoft"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/></filter>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a8a87"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c92a2a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b9e8a"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="12" fill="#f8f6f3"/>

  <!-- Traditional RAG -->
  <rect x="40" y="30" width="880" height="120" rx="8" fill="none" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#c92a2a">传统 RAG 流程</text>

  <g filter="url(#shadowSoft)">
    <rect x="80" y="70" width="140" height="50" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.5"/>
  </g>
  <text x="150" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#141413">检索文档</text>

  <path d="M220 95 L280 95" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="285" y="70" width="140" height="50" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.5"/>
  </g>
  <text x="355" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#141413">拼接上下文</text>

  <path d="M425 95 L485 95" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="490" y="70" width="140" height="50" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.5"/>
  </g>
  <text x="560" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#141413">生成回答</text>

  <path d="M630 95 L690 95" stroke="#c92a2a" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>

  <g filter="url(#shadowSoft)">
    <rect x="695" y="70" width="190" height="50" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  </g>
  <text x="790" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c92a2a">遗漏条件</text>
  <text x="790" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c92a2a">步骤出错</text>

  <!-- Enhanced RAG -->
  <rect x="40" y="180" width="880" height="140" rx="8" fill="none" stroke="#6b9e8a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#6b9e8a">Ctx2Skill 增强流程</text>

  <g filter="url(#shadowSoft)">
    <rect x="80" y="220" width="130" height="50" rx="8" fill="#ffffff" stroke="#6b9e8a" stroke-width="1.5"/>
  </g>
  <text x="145" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#141413">检索文档</text>

  <path d="M210 245 L255 245" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="260" y="220" width="170" height="50" rx="8" fill="#fff8e1" stroke="#c4956a" stroke-width="2"/>
  </g>
  <text x="345" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#c4956a">技能提取</text>
  <text x="345" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#666">(自动/预计算)</text>

  <path d="M430 245 L475 245" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="480" y="220" width="160" height="50" rx="8" fill="#ffffff" stroke="#6b9e8a" stroke-width="1.5"/>
  </g>
  <text x="560" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#141413">技能指导推理</text>

  <path d="M640 245 L685 245" stroke="#8a8a87" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadowSoft)">
    <rect x="690" y="220" width="200" height="50" rx="8" fill="#e8f5e9" stroke="#6b9e8a" stroke-width="2"/>
  </g>
  <text x="790" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2e7d32">规则完整覆盖</text>
  <text x="790" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2e7d32">可审计</text>

  <!-- Comparison label -->
  <text x="480" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8a8a87">核心差异：在检索和生成之间插入显式的"技能提取"步骤，将隐含规则转化为可操作指令</text>
</svg>

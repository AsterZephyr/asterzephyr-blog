<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c4956a"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 14px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 12px; fill: #5a5a58; }
    .arrow-label { font-size: 12px; font-weight: 500; fill: #5a5a58; }
    .legend { font-size: 12px; fill: #5a5a58; }
  </style>

  <!-- Background -->
  <rect width="960" height="680" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title">秒杀系统分层优化策略</text>

  <!-- Node: 用户请求 -->
  <rect x="395" y="70" width="170" height="46" rx="8" fill="#ffffff" stroke="#ded8cf" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480" y="98" text-anchor="middle" class="node-title">用户请求</text>

  <!-- Node: 前端防重提交 -->
  <rect x="395" y="150" width="170" height="46" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480" y="178" text-anchor="middle" class="node-title">前端防重提交</text>

  <!-- Node: 订单服务生成流水号 -->
  <rect x="375" y="230" width="210" height="46" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480" y="258" text-anchor="middle" class="node-title">订单服务生成流水号</text>

  <!-- Node: 是否热点商品? (diamond) -->
  <polygon points="480,310 580,350 480,390 380,350" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480" y="354" text-anchor="middle" class="node-title">是否热点商品?</text>

  <!-- Node: 库存分片扣减 -->
  <rect x="220" y="420" width="180" height="46" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="310" y="448" text-anchor="middle" class="node-title">库存分片扣减</text>

  <!-- Node: 直接扣减主库存 -->
  <rect x="560" y="420" width="180" height="46" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="650" y="448" text-anchor="middle" class="node-title">直接扣减主库存</text>

  <!-- Node: Redis子库存原子操作 -->
  <rect x="195" y="500" width="230" height="46" rx="8" fill="#f0e6d6" stroke="#b8860b" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="310" y="528" text-anchor="middle" class="node-title">Redis 子库存原子操作</text>

  <!-- Node: MySQL主库存乐观锁 -->
  <rect x="535" y="500" width="230" height="46" rx="8" fill="#f0e6d6" stroke="#b8860b" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="650" y="528" text-anchor="middle" class="node-title">MySQL 主库存乐观锁</text>

  <!-- Node: 记录流水至Redis -->
  <rect x="375" y="580" width="210" height="46" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480" y="608" text-anchor="middle" class="node-title">记录流水至 Redis</text>

  <!-- Node: 异步同步至MySQL -->
  <rect x="375" y="645" width="210" height="46" rx="8" fill="#e2ddd5" stroke="#8a8a87" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480" y="673" text-anchor="middle" class="node-title">异步同步至 MySQL</text>

  <!-- Arrows -->
  <!-- 用户请求 → 前端防重 -->
  <line x1="480" y1="116" x2="480" y2="150" stroke="#6b9e8a" stroke-width="1.8" marker-end="url(#arrowControl)"/>
  <!-- 前端防重 → 订单服务 -->
  <line x1="480" y1="196" x2="480" y2="230" stroke="#6b9e8a" stroke-width="1.8" marker-end="url(#arrowControl)"/>
  <!-- 订单服务 → 判断 -->
  <line x1="480" y1="276" x2="480" y2="310" stroke="#6b9e8a" stroke-width="1.8" marker-end="url(#arrowControl)"/>
  <!-- 判断 → 库存分片 (是) -->
  <path d="M 380 350 L 310 350 L 310 420" fill="none" stroke="#c4956a" stroke-width="1.8" marker-end="url(#arrowData)"/>
  <rect x="315" y="373" width="24" height="18" rx="3" fill="#f8f6f3" stroke="none"/>
  <text x="327" y="387" text-anchor="middle" class="arrow-label">是</text>
  <!-- 判断 → 直接扣减 (否) -->
  <path d="M 580 350 L 650 350 L 650 420" fill="none" stroke="#c4956a" stroke-width="1.8" marker-end="url(#arrowData)"/>
  <rect x="655" y="373" width="24" height="18" rx="3" fill="#f8f6f3" stroke="none"/>
  <text x="667" y="387" text-anchor="middle" class="arrow-label">否</text>
  <!-- 库存分片 → Redis -->
  <line x1="310" y1="466" x2="310" y2="500" stroke="#6b9e8a" stroke-width="1.8" marker-end="url(#arrowControl)"/>
  <!-- 直接扣减 → MySQL -->
  <line x1="650" y1="466" x2="650" y2="500" stroke="#6b9e8a" stroke-width="1.8" marker-end="url(#arrowControl)"/>
  <!-- Redis → 记录流水 -->
  <path d="M 310 546 L 310 603 L 375 603" fill="none" stroke="#6b9e8a" stroke-width="1.8" marker-end="url(#arrowControl)"/>
  <!-- MySQL → 记录流水 -->
  <path d="M 650 546 L 650 603 L 585 603" fill="none" stroke="#6b9e8a" stroke-width="1.8" marker-end="url(#arrowControl)"/>
  <!-- 记录流水 → 异步同步 -->
  <line x1="480" y1="626" x2="480" y2="645" stroke="#8a8a87" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowControl)"/>

  <!-- Legend -->
  <rect x="730" y="620" width="200" height="55" rx="6" fill="none" stroke="#ded8cf" stroke-width="1"/>
  <line x1="745" y1="640" x2="775" y2="640" stroke="#6b9e8a" stroke-width="1.8"/>
  <text x="782" y="644" class="legend">控制流</text>
  <line x1="745" y1="660" x2="775" y2="660" stroke="#c4956a" stroke-width="1.8"/>
  <text x="782" y="664" class="legend">条件分支</text>
</svg>

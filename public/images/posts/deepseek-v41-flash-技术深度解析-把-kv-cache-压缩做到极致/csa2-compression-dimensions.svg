<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 675" role="img" aria-labelledby="title desc">
<title id="title">全局 KV 的三个压缩维度</title>
<desc id="desc">条目大小 × 条目数量 × 独立缓存层数</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5a5a5a"/></marker></defs>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1000" height="675" fill="#f8f6f3"/>
<text x="40" y="58" font-size="32" font-weight="600" text-anchor="start" fill="#1a1a1a">全局 KV 的三个压缩维度</text>
<text x="40" y="101" font-size="22" font-weight="400" text-anchor="start" fill="#6a6a6a">条目大小 × 条目数量 × 独立缓存层数</text>
<rect x="40" y="145" width="920" height="110" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="183" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">条目表示 Entry</text>
<text x="60" y="222" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">共享或压缩 head / latent 表示，减少每个条目占用</text>
<rect x="40" y="285" width="920" height="110" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="323" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">序列条目 Sequence</text>
<text x="60" y="362" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">Encoder m=2；Decoder m=1，不做序列合并</text>
<rect x="40" y="425" width="920" height="110" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="463" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">独立缓存层 Layer</text>
<text x="60" y="502" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">跨层共享 main KV 与 indexer K，减少重复存储</text>
<text x="40" y="602" font-size="24" font-weight="400" text-anchor="start" fill="#1a1a1a">稀疏选择约束“读哪些位置”；它与存储容量是不同口径。</text>
<text x="40" y="647" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">博主自绘 · §2.3</text>
</svg>

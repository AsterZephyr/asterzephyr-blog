<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bgGrad)" rx="8"/>
  <text x="450" y="32" text-anchor="middle" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Post-Training Pipeline</text>
  <text x="450" y="50" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="12">Data Engineering > Algorithm Innovation</text>

  <!-- Stage 1: SFT -->
  <rect x="20" y="70" width="130" height="340" rx="6" fill="#1a2a3a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="85" y="96" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="16" font-weight="700">SFT</text>
  <line x1="40" y1="106" x2="130" y2="106" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
  <text x="85" y="130" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="10">Standard</text>
  <text x="85" y="146" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="10">supervised</text>
  <text x="85" y="162" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="10">fine-tuning</text>
  <text x="85" y="200" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">No novelty</text>
  <text x="85" y="216" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">here</text>

  <!-- Arrow SFT -> RL -->
  <line x1="150" y1="240" x2="170" y2="240" stroke="#9ca3af" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Stage 2: RL (large) -->
  <rect x="170" y="70" width="480" height="340" rx="6" fill="#1e1e3a" stroke="#4ade80" stroke-width="2"/>
  <text x="410" y="96" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Reinforcement Learning</text>
  <line x1="190" y1="106" x2="630" y2="106" stroke="#4ade80" stroke-width="0.5" opacity="0.5"/>

  <!-- Sub-box: Task Synthesis -->
  <rect x="185" y="116" width="220" height="62" rx="4" fill="#1a3a2a" stroke="#4ade80" stroke-width="1"/>
  <text x="295" y="136" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10" font-weight="600">Task Synthesis</text>
  <text x="295" y="152" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">(problem, environment,</text>
  <text x="295" y="166" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9"> verification) triplets</text>

  <!-- Sub-box: DSec -->
  <rect x="415" y="116" width="220" height="62" rx="4" fill="#2a1a3a" stroke="#a78bfa" stroke-width="1"/>
  <text x="525" y="136" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="600">DSec Platform</text>
  <text x="525" y="152" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Millions of sandboxes</text>
  <text x="525" y="166" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">NUMA isolation, eBPF security</text>

  <!-- Sub-box: Multi-scaffold -->
  <rect x="185" y="190" width="220" height="62" rx="4" fill="#1a1a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="295" y="210" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="600">Multi-scaffold Training</text>
  <text x="295" y="226" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Claude Code, Codex, Pi,</text>
  <text x="295" y="240" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">mini-SWE, DSH</text>

  <!-- Sub-box: Controllable Effort -->
  <rect x="415" y="190" width="220" height="62" rx="4" fill="#3a2a1a" stroke="#fbbf24" stroke-width="1"/>
  <text x="525" y="210" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="10" font-weight="600">Controllable Effort</text>
  <text x="525" y="226" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">b in {1..100}</text>
  <text x="525" y="240" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Exponential token penalty k(b)</text>

  <!-- Model merging loop -->
  <rect x="260" y="268" width="300" height="36" rx="4" fill="#2a2a4a" stroke="#818cf8" stroke-width="1"/>
  <text x="410" y="290" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10">Model Merging Across RL Runs</text>
  <!-- Loop arrow -->
  <path d="M 560 286 Q 600 286 600 220 Q 600 140 560 140" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-dasharray="4"/>
  <polygon points="562,143 555,140 562,137" fill="#818cf8"/>

  <!-- Asynchronous infra note -->
  <rect x="185" y="316" width="450" height="36" rx="4" fill="none" stroke="#6b7280" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="410" y="330" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">Async rollout-training: same GPUs, time-shared. Token-level interruption.</text>
  <text x="410" y="344" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">Sample-level dispatch. Concatenated routing-replay across checkpoints.</text>

  <!-- Connections inside RL -->
  <line x1="295" y1="178" x2="295" y2="190" stroke="#4ade80" stroke-width="0.8" stroke-dasharray="3"/>
  <line x1="525" y1="178" x2="525" y2="190" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3"/>
  <line x1="410" y1="252" x2="410" y2="268" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="3"/>

  <!-- Arrow RL -> OPD -->
  <line x1="650" y1="240" x2="670" y2="240" stroke="#9ca3af" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Stage 3: OPD -->
  <rect x="670" y="70" width="210" height="340" rx="6" fill="#2a1a3a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="775" y="96" text-anchor="middle" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="16" font-weight="700">OPD</text>
  <line x1="690" y1="106" x2="860" y2="106" stroke="#a78bfa" stroke-width="0.5" opacity="0.5"/>
  <text x="775" y="130" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10">On-Policy</text>
  <text x="775" y="146" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10">Distillation</text>
  <text x="775" y="176" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="10">40+ heterogeneous</text>
  <text x="775" y="192" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="10">teacher models</text>
  <text x="775" y="224" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">Full-vocabulary OPD</text>
  <text x="775" y="240" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">Architecture-agnostic</text>
  <text x="775" y="256" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">(logit alignment only)</text>
  <text x="775" y="288" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">Dynamic teacher</text>
  <text x="775" y="304" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">switching during</text>
  <text x="775" y="320" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">training</text>

  <!-- Bottom quote -->
  <rect x="40" y="430" width="820" height="36" rx="6" fill="#2a2a4a" stroke="#fbbf24" stroke-width="1"/>
  <text x="450" y="454" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="12" font-style="italic">"No algorithmic innovation. All gains from data pipeline engineering."</text>
</svg>

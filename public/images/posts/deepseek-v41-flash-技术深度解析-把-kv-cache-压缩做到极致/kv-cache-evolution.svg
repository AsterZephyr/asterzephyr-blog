<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">全局 KV：每个 token 需要多少状态？</title>
<desc id="desc">单位 bytes/token · 横轴为对数刻度，每格相差 10 倍</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5a5a5a"/></marker></defs>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1000" height="720" fill="#f8f6f3"/>
<text x="40" y="58" font-size="32" font-weight="600" text-anchor="start" fill="#1a1a1a">全局 KV：每个 token 需要多少状态？</text>
<text x="40" y="101" font-size="22" font-weight="400" text-anchor="start" fill="#6a6a6a">单位 bytes/token · 横轴为对数刻度，每格相差 10 倍</text>
<path d="M280 175 V540" stroke="#d4cec6" stroke-dasharray="4 5"/>
<text x="280" y="158" font-size="18" font-weight="400" text-anchor="middle" fill="#6a6a6a">10^2</text>
<path d="M420 175 V540" stroke="#d4cec6" stroke-dasharray="4 5"/>
<text x="420" y="158" font-size="18" font-weight="400" text-anchor="middle" fill="#6a6a6a">10^3</text>
<path d="M560 175 V540" stroke="#d4cec6" stroke-dasharray="4 5"/>
<text x="560" y="158" font-size="18" font-weight="400" text-anchor="middle" fill="#6a6a6a">10^4</text>
<path d="M700 175 V540" stroke="#d4cec6" stroke-dasharray="4 5"/>
<text x="700" y="158" font-size="18" font-weight="400" text-anchor="middle" fill="#6a6a6a">10^5</text>
<path d="M840 175 V540" stroke="#d4cec6" stroke-dasharray="4 5"/>
<text x="840" y="158" font-size="18" font-weight="400" text-anchor="middle" fill="#6a6a6a">10^6</text>
<text x="40" y="223" font-size="24" font-weight="600" text-anchor="start" fill="#1a1a1a">V1</text>
<path d="M280 215 H782.611697455927" stroke="#426a63" stroke-width="4"/>
<circle cx="782.611697455927" cy="215" r="7" fill="#426a63"/>
<text x="800.611697455927" y="223" font-size="25" font-weight="600" text-anchor="start" fill="#1a1a1a">389,120</text>
<text x="40" y="315" font-size="24" font-weight="600" text-anchor="start" fill="#1a1a1a">V3.2</text>
<path d="M280 307 H655.459847350045" stroke="#426a63" stroke-width="4"/>
<circle cx="655.459847350045" cy="307" r="7" fill="#426a63"/>
<text x="673.459847350045" y="315" font-size="25" font-weight="600" text-anchor="start" fill="#1a1a1a">48,068</text>
<text x="40" y="407" font-size="24" font-weight="600" text-anchor="start" fill="#1a1a1a">V4-Flash</text>
<path d="M280 399 H496.4122460022987" stroke="#426a63" stroke-width="4"/>
<circle cx="496.4122460022987" cy="399" r="7" fill="#426a63"/>
<text x="514.4122460022986" y="407" font-size="25" font-weight="600" text-anchor="start" fill="#1a1a1a">3,514</text>
<text x="40" y="499" font-size="24" font-weight="600" text-anchor="start" fill="#1a1a1a">V4.1-Flash</text>
<path d="M280 491 H412.9146009302878" stroke="#426a63" stroke-width="4"/>
<circle cx="412.9146009302878" cy="491" r="7" fill="#426a63"/>
<text x="430.9146009302878" y="499" font-size="25" font-weight="600" text-anchor="start" fill="#1a1a1a">890</text>
<text x="40" y="603" font-size="30" font-weight="600" text-anchor="start" fill="#1a1a1a">389,120 ÷ 890 ≈ 437 倍</text>
<text x="40" y="646" font-size="23" font-weight="400" text-anchor="start" fill="#1a1a1a">只统计全局 KV，不含权重、SWA 与运行时工作区。</text>
<text x="40" y="692" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">博主自绘 · Figure 1b</text>
</svg>

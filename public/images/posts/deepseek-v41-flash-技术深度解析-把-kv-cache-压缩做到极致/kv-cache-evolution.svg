<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="barV1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#718096"/>
    </linearGradient>
    <linearGradient id="barV32" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#6b8fc4"/>
    </linearGradient>
    <linearGradient id="barV4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d7d9a"/>
      <stop offset="100%" stop-color="#48a9c5"/>
    </linearGradient>
    <linearGradient id="barV41" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="420" rx="12" fill="#1a1a2e"/>

  <text x="450" y="38" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Global KV Cache Per Token (Bytes)</text>

  <!-- Y axis labels -->
  <text x="28" y="100" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">DeepSeek-V1</text>
  <text x="28" y="118" fill="#718096" font-family="system-ui, sans-serif" font-size="10" text-anchor="start">2023.11</text>

  <text x="28" y="178" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">DeepSeek-V3.2</text>
  <text x="28" y="196" fill="#718096" font-family="system-ui, sans-serif" font-size="10" text-anchor="start">2025.12</text>

  <text x="28" y="258" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">DeepSeek-V4-Flash</text>
  <text x="28" y="276" fill="#718096" font-family="system-ui, sans-serif" font-size="10" text-anchor="start">2026.04</text>

  <text x="28" y="338" fill="#48cae4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">DeepSeek-V4.1-Flash</text>
  <text x="28" y="356" fill="#48cae4" font-family="system-ui, sans-serif" font-size="10" text-anchor="start">2026.09</text>

  <!-- Bars - scaled to max width 640px for 389120 -->
  <!-- V1: 389120 -> 640px -->
  <rect x="200" y="86" width="640" height="28" rx="4" fill="url(#barV1)" opacity="0.9"/>
  <text x="848" y="105" text-anchor="end" fill="#e0e0e0" font-family="monospace" font-size="13" font-weight="600">389,120</text>

  <!-- V3.2: 48068 -> 79px -->
  <rect x="200" y="166" width="79" height="28" rx="4" fill="url(#barV32)" opacity="0.9"/>
  <text x="288" y="185" text-anchor="start" fill="#e0e0e0" font-family="monospace" font-size="13" font-weight="600">48,068</text>

  <!-- V4-Flash: 3514 -> 6px min display 24px -->
  <rect x="200" y="246" width="24" height="28" rx="4" fill="url(#barV4)" opacity="0.9"/>
  <text x="232" y="265" text-anchor="start" fill="#e0e0e0" font-family="monospace" font-size="13" font-weight="600">3,514</text>

  <!-- V4.1-Flash: 890 -> min display 16px -->
  <rect x="200" y="326" width="16" height="28" rx="4" fill="url(#barV41)" opacity="0.9" filter="url(#glow)"/>
  <text x="224" y="345" text-anchor="start" fill="#48cae4" font-family="monospace" font-size="14" font-weight="700">890</text>

  <!-- Compression arrows -->
  <path d="M 700 118 C 700 140, 320 140, 320 162" fill="none" stroke="#6b8fc4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="320,162 316,154 324,154" fill="#6b8fc4"/>
  <text x="540" y="148" text-anchor="middle" fill="#6b8fc4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">8.1x smaller</text>

  <path d="M 280 198 C 280 220, 240 220, 240 242" fill="none" stroke="#48a9c5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="240,242 236,234 244,234" fill="#48a9c5"/>
  <text x="310" y="228" text-anchor="middle" fill="#48a9c5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">13.7x smaller</text>

  <path d="M 230 278 C 230 300, 224 300, 224 322" fill="none" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="224,322 220,314 228,314" fill="#48cae4"/>
  <text x="290" y="308" text-anchor="middle" fill="#48cae4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">3.9x smaller</text>

  <!-- Total compression label -->
  <rect x="540" y="320" width="200" height="36" rx="6" fill="#48cae4" fill-opacity="0.12" stroke="#48cae4" stroke-width="1"/>
  <text x="640" y="343" text-anchor="middle" fill="#48cae4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">437x total compression</text>

  <!-- Subtitle -->
  <text x="450" y="405" text-anchor="middle" fill="#718096" font-family="system-ui, sans-serif" font-size="11">MHA → MLA → CSA+HCA+FP8 → CSA2+CED+FP4</text>
</svg>
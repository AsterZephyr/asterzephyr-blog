<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" role="img" aria-labelledby="title desc">
<title id="title">EPD：拆分的是三个部署阶段</title>
<desc id="desc">视觉编码 → Prompt Prefill → Token Decode</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5a5a5a"/></marker></defs>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1000" height="575" fill="#f8f6f3"/>
<text x="40" y="58" font-size="32" font-weight="600" text-anchor="start" fill="#1a1a1a">EPD：拆分的是三个部署阶段</text>
<text x="40" y="101" font-size="22" font-weight="400" text-anchor="start" fill="#6a6a6a">视觉编码 → Prompt Prefill → Token Decode</text>
<rect x="40" y="160" width="270" height="170" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="198" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">E · 视觉编码</text>
<text x="60" y="237" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">图片 → 视觉特征</text>
<text x="60" y="269" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">纯文本不经过该步骤</text>
<path d="M 310 245 L 365 245" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="365" y="160" width="270" height="170" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="385" y="198" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">P · Prompt Prefill</text>
<text x="385" y="237" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">CED Encoder 主体</text>
<text x="385" y="269" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">投影与 Decoder 回放</text>
<path d="M 635 245 L 690 245" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="690" y="160" width="270" height="170" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="710" y="198" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">D · Token Decode</text>
<text x="710" y="237" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">新 token 前向</text>
<text x="710" y="269" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">CED 两半主干参与</text>
<text x="40" y="402" font-size="27" font-weight="600" text-anchor="start" fill="#1a1a1a">E 是 Vision Encoder，不是 CED 的前 20 层。</text>
<text x="40" y="454" font-size="25" font-weight="400" text-anchor="start" fill="#1a1a1a">各阶段可独立扩缩容；状态传输与排队仍需计入。</text>
<text x="40" y="499" font-size="25" font-weight="400" text-anchor="start" fill="#1a1a1a">硬件选型需要测量，不从激活参数直接推断。</text>
<text x="40" y="547" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">博主自绘 · §3.2</text>
</svg>

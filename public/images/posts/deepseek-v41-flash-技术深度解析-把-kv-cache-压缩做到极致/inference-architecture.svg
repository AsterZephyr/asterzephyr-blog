<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="url(#bgGrad)" rx="8"/>
  <text x="450" y="32" text-anchor="middle" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Inference Architecture</text>
  <text x="450" y="50" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="12">EPD Disaggregation + Persistent KV Cache</text>

  <!-- TOP: EPD Pipeline -->
  <rect x="20" y="66" width="860" height="220" rx="6" fill="#1e1e3a" stroke="#6b7280" stroke-width="0.5"/>
  <text x="40" y="88" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">EPD Pipeline (3-stage disaggregation)</text>

  <!-- Encoder -->
  <rect x="40" y="100" width="240" height="110" rx="6" fill="#1a3a2a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="160" y="124" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Encoder</text>
  <text x="160" y="144" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">8B activated params</text>
  <text x="160" y="160" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Compute-dense</text>
  <text x="160" y="176" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">No decoder KV needed</text>
  <text x="160" y="196" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">Can use cheaper GPU</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="155" x2="330" y2="155" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="305" y="148" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">H_L/2</text>

  <!-- Prefill -->
  <rect x="330" y="100" width="240" height="110" rx="6" fill="#1a1a3a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="124" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Prefill</text>
  <text x="450" y="144" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="10">CED projection</text>
  <text x="450" y="160" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="10">+ SWA Bounded Replay</text>
  <text x="450" y="180" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Medium compute</text>
  <text x="450" y="196" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">Needs HBM bandwidth</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="155" x2="620" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="595" y="148" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">KV</text>

  <!-- Decode -->
  <rect x="620" y="100" width="240" height="110" rx="6" fill="#2a1a1a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="740" y="124" text-anchor="middle" fill="#fb923c" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Decode</text>
  <text x="740" y="144" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="10">16B activated params</text>
  <text x="740" y="160" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Memory-bandwidth bound</text>
  <text x="740" y="176" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">11 kernels / Reuse layer</text>
  <text x="740" y="196" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">Needs large HBM</text>

  <!-- Label -->
  <text x="450" y="240" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="11">Three stages scale independently. Different hardware per stage. No head-of-line blocking.</text>
  <text x="450" y="258" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">Decode FLOPs nearly constant from 4K to 1M context (Figure 2)</text>
  <text x="450" y="275" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">Same H100: 12 concurrent 1M sessions (V4) → 47 sessions (V4.1)</text>

  <!-- BOTTOM: Persistent KV Cache Tiers -->
  <rect x="20" y="296" width="860" height="250" rx="6" fill="#1e1e3a" stroke="#6b7280" stroke-width="0.5"/>
  <text x="40" y="320" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Persistent KV Cache: Dual-Tier Architecture</text>

  <!-- Tier 1: SSD -->
  <rect x="40" y="336" width="380" height="100" rx="6" fill="#1a2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="358" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Tier 1: Global KV on SSD</text>
  <text x="60" y="378" fill="#9ca3af" font-family="monospace" font-size="10">LRU eviction, 72h+ TTL</text>
  <text x="60" y="396" fill="#9ca3af" font-family="monospace" font-size="10">Full prefix granularity</text>
  <text x="60" y="414" fill="#9ca3af" font-family="monospace" font-size="10">Cross-session reuse (multi-turn)</text>
  <rect x="300" y="340" width="110" height="24" rx="12" fill="#1a3a2a" stroke="#4ade80" stroke-width="1"/>
  <text x="355" y="356" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">890 B/token</text>

  <!-- Tier 2: DRAM -->
  <rect x="40" y="448" width="380" height="84" rx="6" fill="#2a1a3a" stroke="#a78bfa" stroke-width="1"/>
  <text x="60" y="470" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Tier 2: SWA KV in Host DRAM Pool</text>
  <text x="60" y="490" fill="#9ca3af" font-family="monospace" font-size="10">10% of node DRAM, minute-level TTL</text>
  <text x="60" y="508" fill="#9ca3af" font-family="monospace" font-size="10">Checkpoint-based (prompt end + output end)</text>
  <rect x="300" y="452" width="110" height="24" rx="12" fill="#2a1a3a" stroke="#a78bfa" stroke-width="1"/>
  <text x="355" y="468" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="9">Short-lived</text>

  <!-- Miss path -->
  <rect x="480" y="370" width="180" height="50" rx="6" fill="#3a2a1a" stroke="#fbbf24" stroke-width="1"/>
  <text x="570" y="392" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="10">Cache Miss?</text>
  <text x="570" y="408" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">SWA KV expired</text>

  <line x1="660" y1="395" x2="700" y2="395" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="700" y="360" width="170" height="70" rx="6" fill="#1a3a2a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="785" y="384" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="11" font-weight="600">Bounded Replay</text>
  <text x="785" y="402" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">O(n_win) fallback</text>
  <text x="785" y="418" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">Graceful degradation</text>

  <!-- Summary -->
  <rect x="560" y="460" width="300" height="70" rx="6" fill="#1a1a3a" stroke="#818cf8" stroke-width="1"/>
  <text x="710" y="482" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Persistent footprint</text>
  <text x="710" y="502" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="14" font-weight="700">1/8 of V4-Flash</text>
  <text x="710" y="518" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">SWA KV eliminated from SSD entirely</text>
</svg>

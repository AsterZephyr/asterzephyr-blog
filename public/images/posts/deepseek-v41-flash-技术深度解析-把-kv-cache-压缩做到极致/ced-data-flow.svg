<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="encGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5a27" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d5a27" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a4a7a" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#48cae4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#68d391"/>
    </marker>
  </defs>

  <rect width="900" height="520" rx="12" fill="#1a1a2e"/>

  <text x="450" y="34" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Causal Encoder-Decoder (CED) Data Flow</text>

  <!-- Encoder box -->
  <rect x="40" y="60" width="360" height="380" rx="10" fill="url(#encGrad)" stroke="#68d391" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="220" y="82" text-anchor="middle" fill="#68d391" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ENCODER (20 layers)</text>

  <!-- Decoder box -->
  <rect x="500" y="60" width="360" height="380" rx="10" fill="url(#decGrad)" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="680" y="82" text-anchor="middle" fill="#48cae4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DECODER (20 layers)</text>

  <!-- Encoder layers -->
  <text x="100" y="115" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="11">Input: N tokens</text>

  <rect x="80" y="125" width="280" height="30" rx="5" fill="#2d5a27" fill-opacity="0.5" stroke="#68d391" stroke-width="1"/>
  <text x="220" y="145" text-anchor="middle" fill="#c6f6d5" font-family="monospace" font-size="11">Layer 1-2: SWA only</text>

  <rect x="80" y="165" width="280" height="30" rx="5" fill="#2d5a27" fill-opacity="0.5" stroke="#68d391" stroke-width="1"/>
  <text x="220" y="185" text-anchor="middle" fill="#c6f6d5" font-family="monospace" font-size="11">Layer 3-8: CSA2(m=2, Full+Reuse)</text>

  <rect x="80" y="205" width="280" height="30" rx="5" fill="#2d5a27" fill-opacity="0.5" stroke="#68d391" stroke-width="1"/>
  <text x="220" y="225" text-anchor="middle" fill="#c6f6d5" font-family="monospace" font-size="11">Layer 9-14: CSA2(m=2, Full+Reuse)</text>

  <rect x="80" y="245" width="280" height="30" rx="5" fill="#2d5a27" fill-opacity="0.5" stroke="#68d391" stroke-width="1"/>
  <text x="220" y="265" text-anchor="middle" fill="#c6f6d5" font-family="monospace" font-size="11">Layer 15-20: CSA2(m=2, Full+Reuse)</text>

  <!-- H_{L/2} output -->
  <rect x="110" y="295" width="220" height="36" rx="6" fill="#68d391" fill-opacity="0.2" stroke="#68d391" stroke-width="2"/>
  <text x="220" y="318" text-anchor="middle" fill="#68d391" font-family="monospace" font-size="13" font-weight="700">H_L/2 (hidden states)</text>

  <!-- Decoder layers -->
  <rect x="540" y="125" width="280" height="28" rx="5" fill="#1a4a7a" fill-opacity="0.5" stroke="#48cae4" stroke-width="1"/>
  <text x="680" y="143" text-anchor="middle" fill="#bee3f8" font-family="monospace" font-size="10">Layer 21: CSA2(m=1, Full) + SWA</text>

  <rect x="540" y="160" width="280" height="28" rx="5" fill="#1a4a7a" fill-opacity="0.4" stroke="#63b3ed" stroke-width="0.8"/>
  <text x="680" y="178" text-anchor="middle" fill="#bee3f8" font-family="monospace" font-size="10">Layer 22-24: CSA2(m=1, Reuse) + SWA</text>

  <rect x="540" y="195" width="280" height="28" rx="5" fill="#1a4a7a" fill-opacity="0.4" stroke="#63b3ed" stroke-width="0.8"/>
  <text x="680" y="213" text-anchor="middle" fill="#bee3f8" font-family="monospace" font-size="10">Layer 25-28: CSA2(m=1, Reindex+Reuse)</text>

  <text x="680" y="240" text-anchor="middle" fill="#718096" font-family="system-ui, sans-serif" font-size="11">...</text>

  <rect x="540" y="252" width="280" height="28" rx="5" fill="#1a4a7a" fill-opacity="0.4" stroke="#63b3ed" stroke-width="0.8"/>
  <text x="680" y="270" text-anchor="middle" fill="#bee3f8" font-family="monospace" font-size="10">Layer 37-40: CSA2(m=1, Reindex+Reuse)</text>

  <!-- Projection arrows from H_{L/2} to each decoder layer -->
  <line x1="330" y1="305" x2="536" y2="139" stroke="#48cae4" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.7"/>
  <line x1="330" y1="310" x2="536" y2="174" stroke="#48cae4" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.5"/>
  <line x1="330" y1="315" x2="536" y2="209" stroke="#48cae4" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.4"/>
  <line x1="330" y1="318" x2="536" y2="266" stroke="#48cae4" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.3"/>

  <!-- Projection label -->
  <rect x="380" y="340" width="140" height="50" rx="6" fill="#48cae4" fill-opacity="0.12" stroke="#48cae4" stroke-width="1"/>
  <text x="450" y="360" text-anchor="middle" fill="#48cae4" font-family="monospace" font-size="10" font-weight="600">CED Projection</text>
  <text x="450" y="378" text-anchor="middle" fill="#90cdf4" font-family="monospace" font-size="10">C_l = H * W_l^KV</text>

  <!-- Key insight boxes at bottom -->
  <rect x="40" y="455" width="260" height="44" rx="6" fill="#68d391" fill-opacity="0.1" stroke="#68d391" stroke-width="1"/>
  <text x="170" y="473" text-anchor="middle" fill="#68d391" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Prefill: Encoder only</text>
  <text x="170" y="490" text-anchor="middle" fill="#a0aec0" font-family="monospace" font-size="10">8B activated params</text>

  <rect x="320" y="455" width="260" height="44" rx="6" fill="#48cae4" fill-opacity="0.1" stroke="#48cae4" stroke-width="1"/>
  <text x="450" y="473" text-anchor="middle" fill="#48cae4" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Decode: Encoder + Decoder</text>
  <text x="450" y="490" text-anchor="middle" fill="#a0aec0" font-family="monospace" font-size="10">16B activated params</text>

  <rect x="600" y="455" width="260" height="44" rx="6" fill="#f6ad55" fill-opacity="0.1" stroke="#f6ad55" stroke-width="1"/>
  <text x="730" y="473" text-anchor="middle" fill="#f6ad55" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Key Insight</text>
  <text x="730" y="490" text-anchor="middle" fill="#a0aec0" font-family="monospace" font-size="10">1 projection, not per-layer KV</text>
</svg>
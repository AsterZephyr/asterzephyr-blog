<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc">
<title id="title">CED：输入与生成采用不同计算路径</title>
<desc id="desc">模型内部分层；与部署中的视觉编码 EPD 区分</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5a5a5a"/></marker></defs>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1000" height="735" fill="#f8f6f3"/>
<text x="40" y="58" font-size="32" font-weight="600" text-anchor="start" fill="#1a1a1a">CED：输入与生成采用不同计算路径</text>
<text x="40" y="101" font-size="22" font-weight="400" text-anchor="start" fill="#6a6a6a">模型内部分层；与部署中的视觉编码 EPD 区分</text>
<text x="40" y="165" font-size="24" font-weight="600" text-anchor="start" fill="#1a1a1a">PREFILL · 输入 N 个 prompt token</text>
<rect x="40" y="193" width="270" height="155" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="231" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">20 层 Encoder</text>
<text x="60" y="270" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">处理长 prompt 主体</text>
<text x="60" y="302" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">输出 hidden states</text>
<rect x="365" y="193" width="270" height="155" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="385" y="231" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">CED 投影</text>
<text x="385" y="270" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">生成 Decoder</text>
<text x="385" y="302" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">共享的全局 KV</text>
<rect x="690" y="193" width="270" height="155" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="710" y="231" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">20 层 Decoder</text>
<text x="710" y="270" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">仅回放末尾 128 token</text>
<text x="710" y="302" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">初始化本层 SWA</text>
<path d="M 310 270 L 365 270" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 635 270 L 690 270" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="425" font-size="24" font-weight="600" text-anchor="start" fill="#1a1a1a">DECODE · 每生成一个新 token</text>
<rect x="40" y="453" width="270" height="155" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="491" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">20 层 Encoder</text>
<text x="60" y="530" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">当前 token 前向</text>
<text x="60" y="562" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">生成并更新状态</text>
<rect x="365" y="453" width="270" height="155" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="385" y="491" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">20 层 Decoder</text>
<text x="385" y="530" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">读取共享全局 KV</text>
<text x="385" y="562" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">计算本层 Q 与 SWA</text>
<rect x="690" y="453" width="270" height="155" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="710" y="491" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">生成下一个 token</text>
<text x="710" y="530" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">两半主干均参与</text>
<text x="710" y="562" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">约 16B 激活参数</text>
<path d="M 310 530 L 365 530" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 635 530 L 690 530" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="661" font-size="25" font-weight="400" text-anchor="start" fill="#1a1a1a">节省的是长 prompt 主体完整经过 Decoder 的工作。</text>
<text x="40" y="707" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">博主自绘 · §2.2、§3.2.2</text>
</svg>

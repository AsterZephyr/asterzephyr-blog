<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">三个组件，分别降低不同开销</title>
<desc id="desc">激活搬运、条件记忆、串行 token 生成</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5a5a5a"/></marker></defs>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1000" height="720" fill="#f8f6f3"/>
<text x="40" y="58" font-size="32" font-weight="600" text-anchor="start" fill="#1a1a1a">三个组件，分别降低不同开销</text>
<text x="40" y="101" font-size="22" font-weight="400" text-anchor="start" fill="#6a6a6a">激活搬运、条件记忆、串行 token 生成</text>
<rect x="40" y="145" width="920" height="140" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="183" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">mHC / Mega-mHC</text>
<text x="60" y="222" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">Manifold-Constrained Hyper-Connections</text>
<text x="60" y="254" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">融合计算，降低激活读写流量，不等于驻留显存减半</text>
<rect x="40" y="315" width="920" height="140" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="353" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">Engram · 条件记忆</text>
<text x="60" y="392" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">N-gram 确定性寻址，有利于预取</text>
<text x="60" y="424" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">完整模块包括上下文门控与多分支集成</text>
<rect x="40" y="485" width="920" height="140" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="523" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">DSpark · 投机解码</text>
<text x="60" y="562" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">半自回归草稿 + 按置信度调度验证长度</text>
<text x="60" y="594" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">收益取决于候选接受情况与验证开销</text>
<text x="40" y="692" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">博主自绘 · §2.4.1–2.4.3</text>
</svg>

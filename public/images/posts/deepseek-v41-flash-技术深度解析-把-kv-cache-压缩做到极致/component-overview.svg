<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="580" fill="url(#bgGrad)" rx="8"/>
  <text x="450" y="36" text-anchor="middle" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Three Efficiency Components</text>

  <!-- Column 1: Single-Pass mHC -->
  <rect x="15" y="52" width="280" height="510" rx="6" fill="#1e1e3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="155" y="76" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Single-Pass mHC</text>

  <!-- V4: 3 kernels -->
  <text x="30" y="100" fill="#f87171" font-family="monospace" font-size="10" font-weight="600">V4: 3 Sequential Kernels</text>
  <rect x="30" y="110" width="70" height="28" rx="3" fill="#3a1a1a" stroke="#f87171" stroke-width="0.8"/>
  <text x="65" y="128" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="8">Residual</text>
  <line x1="100" y1="124" x2="115" y2="124" stroke="#f87171" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="115" y="110" width="70" height="28" rx="3" fill="#3a1a1a" stroke="#f87171" stroke-width="0.8"/>
  <text x="150" y="128" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="8">Coeff</text>
  <line x1="185" y1="124" x2="200" y2="124" stroke="#f87171" stroke-width="1"/>
  <rect x="200" y="110" width="70" height="28" rx="3" fill="#3a1a1a" stroke="#f87171" stroke-width="0.8"/>
  <text x="235" y="128" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="8">Mix</text>
  <text x="155" y="156" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Data dependency chain ↓</text>
  <text x="155" y="170" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="9">Memory: (4n+4)d</text>

  <!-- Arrow down -->
  <text x="155" y="195" text-anchor="middle" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="16">↓</text>

  <!-- V4.1: 1 fused kernel -->
  <text x="30" y="218" fill="#4ade80" font-family="monospace" font-size="10" font-weight="600">V4.1: 1 Fused Mega-mHC</text>
  <rect x="45" y="228" width="210" height="36" rx="5" fill="#1a3a2a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="150" y="250" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">Mega-mHC Kernel</text>
  <text x="155" y="282" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Uses prev block coefficients</text>
  <text x="155" y="296" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">→ breaks dependency chain</text>
  <text x="155" y="318" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">Memory: (2n+2)d</text>
  <text x="155" y="332" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">(theoretical optimum)</text>

  <!-- n streams illustration -->
  <g transform="translate(40,350)">
    <text x="0" y="0" fill="#9ca3af" font-family="monospace" font-size="9">n residual streams:</text>
    <line x1="10" y1="12" x2="10" y2="80" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="12" x2="40" y2="80" stroke="#818cf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="12" x2="70" y2="80" stroke="#4ade80" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="12" x2="100" y2="80" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    <rect x="0" y="30" width="120" height="24" rx="3" fill="#2a2a4a" stroke="#818cf8" stroke-width="0.8"/>
    <text x="60" y="46" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="8">Transformer Block</text>
    <text x="130" y="46" fill="#6b7280" font-family="monospace" font-size="8">× 40</text>
    <text x="60" y="100" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">1 read + 1 write per block</text>
  </g>

  <!-- Column 2: Engram -->
  <rect x="310" y="52" width="280" height="510" rx="6" fill="#1e1e3a" stroke="#a78bfa" stroke-width="1"/>
  <text x="450" y="76" text-anchor="middle" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Engram (196B params)</text>

  <!-- Hash lookup flow -->
  <rect x="370" y="96" width="160" height="28" rx="4" fill="#2a2a4a" stroke="#818cf8" stroke-width="0.8"/>
  <text x="450" y="114" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">Input Token IDs</text>
  <line x1="450" y1="124" x2="450" y2="142" stroke="#a78bfa" stroke-width="1.5"/>
  <polygon points="445,140 450,148 455,140" fill="#a78bfa"/>

  <rect x="370" y="148" width="160" height="28" rx="4" fill="#2a1a3a" stroke="#a78bfa" stroke-width="1"/>
  <text x="450" y="166" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10">N-gram Hash (2,3,4)</text>
  <line x1="450" y1="176" x2="450" y2="194" stroke="#a78bfa" stroke-width="1.5"/>
  <polygon points="445,192 450,200 455,192" fill="#a78bfa"/>

  <rect x="345" y="200" width="210" height="36" rx="4" fill="#2a1a3a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="215" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="9">8 hash heads × 16M entries</text>
  <text x="450" y="228" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="9">dim=2048, prime table sizes</text>
  <line x1="450" y1="236" x2="450" y2="254" stroke="#a78bfa" stroke-width="1.5"/>
  <polygon points="445,252 450,260 455,252" fill="#a78bfa"/>

  <rect x="370" y="260" width="160" height="28" rx="4" fill="#2a2a4a" stroke="#818cf8" stroke-width="0.8"/>
  <text x="450" y="278" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">Embedding Output</text>

  <!-- Key properties -->
  <rect x="325" y="310" width="250" height="80" rx="4" fill="none" stroke="#6b7280" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="450" y="330" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">No attention, no softmax</text>
  <text x="450" y="348" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">Pure deterministic lookup</text>
  <text x="450" y="366" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Latency: O(1), context-independent</text>

  <!-- Placement -->
  <text x="450" y="415" text-anchor="middle" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="11">Placement:</text>
  <rect x="345" y="425" width="95" height="26" rx="3" fill="#2a2a4a" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="392" y="442" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="9">Layer 1</text>
  <rect x="455" y="425" width="95" height="26" rx="3" fill="#2a2a4a" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="502" y="442" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="9">Layer 14</text>

  <text x="450" y="475" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="9">RDMA prefetch from host memory</text>
  <text x="450" y="490" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="9">overlaps with 1st block compute</text>
  <text x="450" y="510" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">FP8 embeddings + FP8 projections</text>

  <!-- Column 3: DSpark -->
  <rect x="605" y="52" width="280" height="510" rx="6" fill="#1e1e3a" stroke="#fbbf24" stroke-width="1"/>
  <text x="745" y="76" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="14" font-weight="600">DSpark</text>

  <!-- Drafter -->
  <text x="620" y="100" fill="#9ca3af" font-family="monospace" font-size="10">Semi-autoregressive Drafter:</text>
  <g transform="translate(625,110)">
    <rect x="0" y="0" width="60" height="24" rx="3" fill="#3a2a1a" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="30" y="16" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="8">Block 1</text>
    <rect x="70" y="0" width="60" height="24" rx="3" fill="#3a2a1a" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="100" y="16" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="8">Block 2</text>
    <rect x="140" y="0" width="60" height="24" rx="3" fill="#3a2a1a" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="170" y="16" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="8">Block 3</text>
  </g>
  <text x="745" y="155" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">SWA window=128</text>

  <!-- 5 parallel positions -->
  <text x="620" y="180" fill="#9ca3af" font-family="monospace" font-size="10">5 draft positions (parallel):</text>
  <g transform="translate(640,188)">
    <rect x="0" y="0" width="36" height="22" rx="3" fill="#2a2a4a" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="18" y="15" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="8">d1</text>
    <rect x="42" y="0" width="36" height="22" rx="3" fill="#2a2a4a" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="60" y="15" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="8">d2</text>
    <rect x="84" y="0" width="36" height="22" rx="3" fill="#2a2a4a" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="102" y="15" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="8">d3</text>
    <rect x="126" y="0" width="36" height="22" rx="3" fill="#2a2a4a" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="144" y="15" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="8">d4</text>
    <rect x="168" y="0" width="36" height="22" rx="3" fill="#2a2a4a" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="186" y="15" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="8">d5</text>
  </g>

  <!-- Markov head -->
  <line x1="745" y1="218" x2="745" y2="238" stroke="#fbbf24" stroke-width="1"/>
  <polygon points="740,236 745,244 750,236" fill="#fbbf24"/>
  <rect x="660" y="244" width="170" height="30" rx="4" fill="#3a2a1a" stroke="#fbbf24" stroke-width="1"/>
  <text x="745" y="263" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="9">Markov Head</text>
  <text x="745" y="293" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Models draft dependencies</text>
  <text x="745" y="307" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">→ prefix survival probability</text>

  <!-- Confidence scheduling -->
  <line x1="745" y1="316" x2="745" y2="334" stroke="#fbbf24" stroke-width="1"/>
  <polygon points="740,332 745,340 750,332" fill="#fbbf24"/>
  <rect x="630" y="340" width="230" height="44" rx="5" fill="#1a3a2a" stroke="#4ade80" stroke-width="1"/>
  <text x="745" y="358" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">Confidence-Scheduled</text>
  <text x="745" y="374" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">Verification</text>

  <text x="745" y="405" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="9">Dynamic verify length per request</text>
  <text x="745" y="420" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Maximizes system-wide throughput</text>

  <!-- Training note -->
  <rect x="625" y="445" width="250" height="60" rx="4" fill="none" stroke="#6b7280" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="750" y="465" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">Training:</text>
  <text x="750" y="480" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Backbone frozen, no grad backprop</text>
  <text x="750" y="495" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="9">Follows RL policy evolution</text>

  <text x="745" y="530" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8">Accelerates serving + RL rollouts</text>
</svg>

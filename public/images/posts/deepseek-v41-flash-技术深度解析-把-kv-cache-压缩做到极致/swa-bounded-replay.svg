<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#bgGrad)" rx="8"/>
  <text x="450" y="36" text-anchor="middle" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">SWA Bounded Replay</text>

  <!-- LEFT: V4 Full Replay -->
  <rect x="20" y="56" width="420" height="440" rx="6" fill="#1e1e3a" stroke="#e74c3c" stroke-width="1.5" opacity="0.7"/>
  <text x="230" y="82" text-anchor="middle" fill="#e74c3c" font-family="system-ui,sans-serif" font-size="14" font-weight="600">V4: Full Replay (expensive)</text>

  <!-- Cached prefix -->
  <rect x="40" y="100" width="260" height="30" rx="4" fill="#2a5a3a" stroke="#4ade80" stroke-width="1"/>
  <text x="170" y="120" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="11">Cached Prefix (Global KV hit)</text>
  <!-- New suffix -->
  <rect x="310" y="100" width="110" height="30" rx="4" fill="#3a3a6a" stroke="#818cf8" stroke-width="1"/>
  <text x="365" y="120" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="11">New Suffix</text>

  <!-- Layers stack -->
  <g transform="translate(40,150)">
    <text x="0" y="0" fill="#9ca3af" font-family="monospace" font-size="10">Decoder Layers</text>
    <rect x="0" y="10" width="380" height="22" rx="3" fill="#3a1a1a" stroke="#e74c3c" stroke-width="0.8" opacity="0.6"/>
    <text x="190" y="25" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="9">Layer L — replay full L×n_win window</text>
    <rect x="0" y="38" width="380" height="22" rx="3" fill="#3a1a1a" stroke="#e74c3c" stroke-width="0.8" opacity="0.6"/>
    <text x="190" y="53" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="9">Layer L-1 — replay full L×n_win window</text>
    <text x="190" y="78" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="12">⋮</text>
    <rect x="0" y="88" width="380" height="22" rx="3" fill="#3a1a1a" stroke="#e74c3c" stroke-width="0.8" opacity="0.6"/>
    <text x="190" y="103" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="9">Layer 1 — replay full L×n_win window</text>
  </g>

  <!-- Big red bracket -->
  <line x1="60" y1="160" x2="60" y2="270" stroke="#e74c3c" stroke-width="2"/>
  <line x1="60" y1="160" x2="70" y2="160" stroke="#e74c3c" stroke-width="2"/>
  <line x1="60" y1="270" x2="70" y2="270" stroke="#e74c3c" stroke-width="2"/>
  <text x="50" y="220" text-anchor="end" fill="#e74c3c" font-family="monospace" font-size="10" transform="rotate(-90,50,220)">L layers</text>

  <!-- Cost label -->
  <rect x="80" y="310" width="300" height="36" rx="6" fill="#4a1a1a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="230" y="333" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="14" font-weight="700">O(L × n_win) computation</text>

  <!-- Cross -->
  <line x1="180" y1="360" x2="280" y2="400" stroke="#e74c3c" stroke-width="3" opacity="0.8"/>
  <line x1="280" y1="360" x2="180" y2="400" stroke="#e74c3c" stroke-width="3" opacity="0.8"/>
  <text x="230" y="430" text-anchor="middle" fill="#e74c3c" font-family="system-ui,sans-serif" font-size="12">Prohibitive in production</text>
  <text x="230" y="448" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="10">L=40, n_win=128 → 5,120 token-layers</text>

  <!-- RIGHT: V4.1 Bounded Replay -->
  <rect x="460" y="56" width="420" height="440" rx="6" fill="#1e1e3a" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
  <text x="670" y="82" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="14" font-weight="600">V4.1: Bounded Replay (cheap)</text>

  <!-- Cached prefix -->
  <rect x="480" y="100" width="260" height="30" rx="4" fill="#2a5a3a" stroke="#4ade80" stroke-width="1"/>
  <text x="610" y="120" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="11">Cached Prefix (Global KV hit)</text>
  <!-- New suffix -->
  <rect x="750" y="100" width="110" height="30" rx="4" fill="#3a3a6a" stroke="#818cf8" stroke-width="1"/>
  <text x="805" y="120" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="11">New Suffix</text>

  <!-- Only replay last n_win -->
  <rect x="720" y="100" width="30" height="30" rx="2" fill="#22543d" stroke="#4ade80" stroke-width="2"/>
  <text x="735" y="93" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">n_win</text>

  <!-- Single replay block -->
  <g transform="translate(480,150)">
    <text x="0" y="0" fill="#9ca3af" font-family="monospace" font-size="10">Decoder Layers</text>
    <rect x="0" y="10" width="380" height="22" rx="3" fill="#1a3a2a" stroke="#4ade80" stroke-width="0.8" opacity="0.6"/>
    <text x="190" y="25" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">Layer L — replay only last n_win tokens</text>
    <rect x="0" y="38" width="380" height="22" rx="3" fill="#1a3a2a" stroke="#4ade80" stroke-width="0.8" opacity="0.6"/>
    <text x="190" y="53" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">Layer L-1 — replay only last n_win tokens</text>
    <text x="190" y="78" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="12">⋮</text>
    <rect x="0" y="88" width="380" height="22" rx="3" fill="#1a3a2a" stroke="#4ade80" stroke-width="0.8" opacity="0.6"/>
    <text x="190" y="103" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">Layer 1 — replay only last n_win tokens</text>
  </g>

  <!-- Cost label -->
  <rect x="520" y="310" width="300" height="36" rx="6" fill="#1a3a2a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="670" y="333" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="14" font-weight="700">O(n_win) computation</text>

  <!-- Check -->
  <text x="670" y="375" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="24">✓</text>
  <text x="670" y="400" text-anchor="middle" fill="#e0e0e0" font-family="system-ui,sans-serif" font-size="11">Approximate ≈ Exact</text>
  <text x="670" y="418" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="10">(negligible quality loss)</text>
  <text x="670" y="448" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10">Post-training simulates bounded replay</text>
  <text x="670" y="466" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10">→ model adapts to approximate state</text>

  <!-- Center arrow -->
  <polygon points="445,260 455,250 455,270" fill="#e0e0e0" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">有界回放：截断依赖，保留多层计算</title>
<desc id="desc">Decoder 的相关层数为 20；每次 prefill 初始化 SWA</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5a5a5a"/></marker></defs>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1000" height="760" fill="#f8f6f3"/>
<text x="40" y="58" font-size="32" font-weight="600" text-anchor="start" fill="#1a1a1a">有界回放：截断依赖，保留多层计算</text>
<text x="40" y="101" font-size="22" font-weight="400" text-anchor="start" fill="#6a6a6a">Decoder 的相关层数为 20；每次 prefill 初始化 SWA</text>
<text x="40" y="163" font-size="25" font-weight="600" text-anchor="start" fill="#1a1a1a">精确恢复：依赖随相关层数向更早位置扩展</text>
<rect x="40" y="190" width="920" height="76" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="500" y="237" font-size="25" font-weight="400" text-anchor="middle" fill="#1a1a1a">回放 token 范围约为相关层数 × 窗口长度</text>
<text x="40" y="325" font-size="25" font-weight="600" text-anchor="start" fill="#1a1a1a">Bounded Replay：仅回放最近一个窗口</text>
<rect x="40" y="355" width="625" height="76" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="352" y="402" font-size="25" font-weight="400" text-anchor="middle" fill="#1a1a1a">更早 prefix：复用已有全局 KV</text>
<rect x="705" y="355" width="255" height="76" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="832" y="402" font-size="24" font-weight="400" text-anchor="middle" fill="#1a1a1a">最近 128 token</text>
<path d="M 832 431 L 832 490" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="450" y="490" width="510" height="140" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="470" y="528" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">经过相关网络层</text>
<text x="470" y="567" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">重建各层 SWA；状态是近似的</text>
<text x="470" y="599" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">Encoder 旧 prefix 全局 KV 不覆盖</text>
<text x="40" y="689" font-size="25" font-weight="400" text-anchor="start" fill="#1a1a1a">缩短回放序列，不等于省去层数或得到精确状态。</text>
<text x="40" y="732" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">博主自绘 · §3.2.2</text>
</svg>

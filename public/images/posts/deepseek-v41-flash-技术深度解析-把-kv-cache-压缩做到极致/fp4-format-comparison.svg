<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 785" role="img" aria-labelledby="title desc">
<title id="title">FP4：数据位宽之外，还有缩放开销</title>
<desc id="desc">Indexer 与 main KV 使用不同格式；SWA KV 保持 FP8</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5a5a5a"/></marker></defs>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1000" height="785" fill="#f8f6f3"/>
<text x="40" y="58" font-size="32" font-weight="600" text-anchor="start" fill="#1a1a1a">FP4：数据位宽之外，还有缩放开销</text>
<text x="40" y="101" font-size="22" font-weight="400" text-anchor="start" fill="#6a6a6a">Indexer 与 main KV 使用不同格式；SWA KV 保持 FP8</text>
<rect x="40" y="145" width="920" height="145" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="183" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">Indexer Q/K · MXFP4</text>
<text x="60" y="222" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">标准分组：32 个元素 + E8M0 scale</text>
<rect x="40" y="320" width="920" height="145" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="358" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">Main KV · 参考 NVFP4 的布局</text>
<text x="60" y="397" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">E2M1 数据；每 16 channels 一个 E4M3 scale</text>
<text x="60" y="429" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">省去二级全局 scale；不直接等同标准 MXFP4</text>
<rect x="40" y="495" width="920" height="145" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="60" y="533" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">Main KV 的位宽账</text>
<text x="60" y="572" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">16 × 4 + 8 = 72 bit / block，即 4.5 bit / channel</text>
<text x="60" y="604" font-size="22" font-weight="400" text-anchor="start" fill="#1a1a1a">包含分块 scale，尚未计入对齐开销</text>
<text x="40" y="716" font-size="26" font-weight="600" text-anchor="start" fill="#1a1a1a">RoPE 后量化 → 压缩存储 → Attention 前反量化</text>
<text x="40" y="757" font-size="18" font-weight="400" text-anchor="start" fill="#6a6a6a">博主自绘 · §2.4.4；NVIDIA NVFP4 文档</text>
</svg>

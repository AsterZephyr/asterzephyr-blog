<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Roofline Model: Memory-Bound vs Compute-Bound</text>
  <line x1="120" y1="420" x2="860" y2="420" stroke="#374151" stroke-width="1.5"/>
  <line x1="120" y1="420" x2="120" y2="80" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="460" text-anchor="middle" font-size="13" fill="#374151">Arithmetic Intensity (FLOPS/Byte)</text>
  <text x="45" y="250" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90, 45, 250)">Attainable FLOPS</text>
  <path d="M 140 400 L 470 140" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M 470 140 L 840 140" stroke="#dc2626" stroke-width="3" fill="none"/>
  <circle cx="470" cy="140" r="6" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <text x="470" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Ridge Point</text>
  <text x="470" y="110" text-anchor="middle" font-size="10" fill="#6b7280">(Peak FLOPS / Peak BW)</text>
  <line x1="470" y1="140" x2="470" y2="420" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="180" y="260" width="180" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="270" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Memory-Bound</text>
  <text x="270" y="300" text-anchor="middle" font-size="10" fill="#6b7280">Bottleneck: data movement</text>
  <rect x="530" y="220" width="180" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="620" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Compute-Bound</text>
  <text x="620" y="260" text-anchor="middle" font-size="10" fill="#6b7280">Bottleneck: arithmetic units</text>
  <circle cx="250" cy="330" r="8" fill="#ea580c"/>
  <text x="264" y="334" font-size="11" fill="#ea580c">LLM Decode (GEMV)</text>
  <circle cx="650" cy="160" r="8" fill="#16a34a"/>
  <text x="664" y="164" font-size="11" fill="#16a34a">Prefill (GEMM)</text>
  <circle cx="400" cy="240" r="8" fill="#9333ea"/>
  <text x="414" y="244" font-size="11" fill="#9333ea">Quantized Decode</text>
  <path d="M 260 325 Q 325 280 390 245" stroke="#9333ea" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow-purple)"/>
  <defs>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9333ea"/>
    </marker>
  </defs>
  <rect x="220" y="475" width="600" height="20" rx="4" fill="#f9fafb"/>
  <text x="520" y="489" text-anchor="middle" font-size="11" fill="#6b7280">Quantization increases arithmetic intensity -> shifts workload from Memory-Bound toward Compute-Bound</text>
</svg>
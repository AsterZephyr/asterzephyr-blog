<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Storage Hierarchy: Bandwidth vs Capacity Tradeoff</text>
  <rect x="60" y="60" width="840" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="85" font-size="14" font-weight="600" fill="#2563eb">HBM (GPU)</text>
  <rect x="220" y="72" width="500" height="20" rx="4" fill="#2563eb" opacity="0.8"/>
  <text x="730" y="87" font-size="12" fill="#2563eb" font-weight="600">3,350 GB/s</text>
  <text x="85" y="112" font-size="11" fill="#6b7280">Capacity: 80 GB</text>
  <text x="400" y="112" font-size="11" fill="#6b7280">Load 7B FP16 (14GB): 4 ms</text>
  <text x="680" y="112" font-size="11" fill="#6b7280">Weights + KV Cache + Activations</text>
  <rect x="60" y="145" width="840" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="170" font-size="14" font-weight="600" fill="#16a34a">DDR5 (CPU)</text>
  <rect x="220" y="157" width="14" height="20" rx="4" fill="#16a34a" opacity="0.8"/>
  <text x="244" y="172" font-size="12" fill="#16a34a" font-weight="600">~100 GB/s</text>
  <text x="85" y="197" font-size="11" fill="#6b7280">Capacity: 512 GB</text>
  <text x="400" y="197" font-size="11" fill="#6b7280">Load 7B FP16 (14GB): 140 ms</text>
  <text x="680" y="197" font-size="11" fill="#6b7280">Offload overflow weights</text>
  <rect x="60" y="230" width="840" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="255" font-size="14" font-weight="600" fill="#ea580c">NVMe SSD</text>
  <rect x="220" y="242" width="8" height="20" rx="4" fill="#ea580c" opacity="0.8"/>
  <text x="238" y="257" font-size="12" fill="#ea580c" font-weight="600">~7 GB/s</text>
  <text x="85" y="282" font-size="11" fill="#6b7280">Capacity: 4 TB</text>
  <text x="400" y="282" font-size="11" fill="#6b7280">Load 7B FP16 (14GB): 2.0 s</text>
  <text x="680" y="282" font-size="11" fill="#6b7280">Cold KV / Checkpoint storage</text>
  <rect x="60" y="315" width="840" height="70" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="340" font-size="14" font-weight="600" fill="#6b7280">HDD</text>
  <rect x="220" y="327" width="8" height="20" rx="4" fill="#6b7280" opacity="0.8"/>
  <text x="238" y="342" font-size="12" fill="#6b7280" font-weight="600">~0.2 GB/s</text>
  <text x="85" y="367" font-size="11" fill="#6b7280">Capacity: 16 TB</text>
  <text x="400" y="367" font-size="11" fill="#6b7280">Load 7B FP16 (14GB): 70.0 s</text>
  <text x="680" y="367" font-size="11" fill="#6b7280">Archive only</text>
  <rect x="60" y="380" width="840" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#dc2626">Key: "Can fit" != "Can serve". HBM bandwidth is 33x CPU, 478x SSD. Speed is everything.</text>
</svg>
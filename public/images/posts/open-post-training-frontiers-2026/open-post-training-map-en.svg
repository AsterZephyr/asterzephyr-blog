<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title desc">
<title id="title">2026 Open Post-Training Map: Compute Shift, Six Open Problems, and Failure Branches</title>
<desc id="desc">Top row traces four shifts in open post-training: RL compute overtaking pretraining, post-post-training as base weights vanish, six open problems ordered by compute intensity, and what remains human under RSI. Dashed cards below highlight common traps and boundaries.</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#4f4942"/>
  </marker>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#b1462f"/>
  </marker>
</defs>

<rect width="1000" height="420" fill="#faf7f2"/>

<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" x="500" y="34" font-size="18" font-weight="700" fill="#1f1d1a" text-anchor="middle">2026 Open Post-Training Map: Compute Shift, Specialization, and Six Open Problems</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" x="500" y="57" font-size="12.5" fill="#5d574f" text-anchor="middle">Top row maps high-leverage entry points for open teams; dashed bottom cards mark recurring failure modes</text>

<!-- Node 1 -->
<rect x="28" y="82" width="220" height="154" rx="10" fill="#edf3f9" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M38 82 H238 Q248 82 248 92 V118 H28 V92 Q28 82 38 82 Z" fill="#d3e3f3"/>
<line x1="28" y1="118" x2="248" y2="118" stroke="#2f5d8a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="105" font-size="12.5" font-weight="700" fill="#1b3956">01 RL Compute Shift</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="142" font-size="11" fill="#23201c">• Recipes: RLHF → R1 → MOPD</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="166" font-size="11" fill="#23201c">• RL reaches ~55% of lab share</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="190" font-size="11" fill="#23201c">• Full stack costs O($50M+/yr)</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="40" y="218" font-size="10" font-weight="600" fill="#2f5d8a">R1 · Beam · MiMo-V2-Flash</text>

<!-- Node 2 -->
<rect x="268" y="82" width="220" height="154" rx="10" fill="#fcf5e6" stroke="#a6631b" stroke-width="1.6"/>
<path d="M278 82 H478 Q488 82 488 92 V118 H268 V92 Q268 82 278 82 Z" fill="#f4e0bc"/>
<line x1="268" y1="118" x2="488" y2="118" stroke="#a6631b" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="105" font-size="12.5" font-weight="700" fill="#633a0d">02 Post-Post-Training</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="142" font-size="11" fill="#23201c">• 8/12 open labs skip base weights</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="166" font-size="11" fill="#23201c">• Start RL from reasoning models</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="190" font-size="11" fill="#23201c">• Adapt to domains and harnesses</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="280" y="218" font-size="10" font-weight="600" fill="#9a5914">Harvey · SkyRL · TMax · CLM</text>

<!-- Node 3 -->
<rect x="508" y="82" width="220" height="154" rx="10" fill="#e9f4f0" stroke="#2c6b5a" stroke-width="1.6"/>
<path d="M518 82 H718 Q728 82 728 92 V118 H508 V92 Q508 82 518 82 Z" fill="#cae4db"/>
<line x1="508" y1="118" x2="728" y2="118" stroke="#2c6b5a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="105" font-size="12.5" font-weight="700" fill="#1a463a">03 Six Open Problems</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="142" font-size="11" fill="#23201c">• Low: Harness · Character · Envs</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="166" font-size="11" fill="#23201c">• Mid: Reasoning efficiency (NGU)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="190" font-size="11" fill="#23201c">• High: RL &amp; multi-agent scaling</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="520" y="218" font-size="10" font-weight="600" fill="#255d4e">NGU · ScaleRL · Agent Teams</text>

<!-- Node 4 -->
<rect x="748" y="82" width="224" height="154" rx="10" fill="#f3eff8" stroke="#634b7a" stroke-width="1.6"/>
<path d="M758 82 H962 Q972 82 972 92 V118 H748 V92 Q748 82 758 82 Z" fill="#dfd5eb"/>
<line x1="748" y1="118" x2="972" y2="118" stroke="#634b7a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="105" font-size="12.5" font-weight="700" fill="#3f2d52">04 Human Research Core</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="142" font-size="11" fill="#23201c">• Claude leads 26% (AL4); AL5: 0%</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="166" font-size="11" fill="#23201c">• Build surges; Design/Decide ~0</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="190" font-size="11" fill="#23201c">• Framing, evals, and standards</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="760" y="218" font-size="10" font-weight="600" fill="#594170">Anthropic · OpenAI · Trillium</text>

<!-- Horizontal arrows -->
<line x1="248" y1="159" x2="265" y2="159" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="488" y1="159" x2="505" y2="159" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="728" y1="159" x2="745" y2="159" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>

<!-- Vertical failure arrows -->
<line x1="138" y1="236" x2="138" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="378" y1="236" x2="378" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="618" y1="236" x2="618" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="860" y1="236" x2="860" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>

<!-- Failure tags -->
<rect x="76" y="247" width="124" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="138" y="261" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">Mixing metrics</text>

<rect x="312" y="247" width="132" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="378" y="261" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">Cloning full stack</text>

<rect x="556" y="247" width="124" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="618" y="261" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">Ignoring limits</text>

<rect x="798" y="247" width="124" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="860" y="261" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">Confusing output</text>

<!-- Failure cards -->
<rect x="28" y="284" width="220" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="308" font-size="11.5" font-weight="700" fill="#9b3621">Trap 1: GPU-hours != FLOPs</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="331" font-size="10.6" fill="#433834">RL spends heavy wall time sampling,</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="351" font-size="10.6" fill="#433834">so its FLOP share lags GPU-hours</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="371" font-size="10.6" fill="#433834">and still needs strong base weights.</text>

<rect x="268" y="284" width="220" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="308" font-size="11.5" font-weight="700" fill="#9b3621">Trap 2: Full-Stack Cloning</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="331" font-size="10.6" fill="#433834">Small labs chasing frontier RL</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="351" font-size="10.6" fill="#433834">burn budget without domain edge,</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="371" font-size="10.6" fill="#433834">shipping delayed copies instead.</text>

<rect x="508" y="284" width="220" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="308" font-size="11.5" font-weight="700" fill="#9b3621">Trap 3: Biased RL Budgets</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="331" font-size="10.6" fill="#433834">Fixed GRPO wastes easy rollouts;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="351" font-size="10.6" fill="#433834">early curves hide low ceilings;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="371" font-size="10.6" fill="#433834">large agent teams flatten over time.</text>

<rect x="748" y="284" width="224" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="308" font-size="11.5" font-weight="700" fill="#9b3621">Trap 4: Output != Insight</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="331" font-size="10.6" fill="#433834">Task volume exaggerates full RSI;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="351" font-size="10.6" fill="#433834">junior researchers skipping manual</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="371" font-size="10.6" fill="#433834">debugging fail to build judgment.</text>
</svg>

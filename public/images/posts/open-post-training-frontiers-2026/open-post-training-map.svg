<line x1="248" y1="159" x2="265" y2="159" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="488" y1="159" x2="505" y2="159" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="728" y1="159" x2="745" y2="159" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>


<line x1="138" y1="236" x2="138" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="378" y1="236" x2="378" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="618" y1="236" x2="618" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="860" y1="236" x2="860" y2="281" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>

<!-- Failure tags -->
<rect x="86" y="247" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="138" y="261" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">混同算力口径时</text>

<rect x="326" y="247" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="378" y="261" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">硬拼全链路时</text>

<rect x="566" y="247" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="618" y="261" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">脱离验证选错题</text>

<rect x="808" y="247" width="104" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="860" y="261" font-size="10.5" font-weight="600" fill="#b1462f" text-anchor="middle">用产出替理解时</text>

<!-- Failure cards -->
<rect x="28" y="284" width="220" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="308" font-size="12" font-weight="700" fill="#9b3621">误判 1：把卡时当 FLOPs</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="331" font-size="11.2" fill="#433834">RL 大量卡时耗在自回归采样，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="352" font-size="11.2" fill="#433834">FLOPs 占比远低于卡时占比，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="373" font-size="11.2" fill="#433834">且无法绕开强基座与冷启动。</text>

<rect x="268" y="284" width="220" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="308" font-size="12" font-weight="700" fill="#9b3621">误判 2：中小团队复刻全栈</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="331" font-size="11.2" fill="#433834">从零追头部通用后训练成本高，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="352" font-size="11.2" fill="#433834">缺少垂类环境与 Harness 适配，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="373" font-size="11.2" fill="#433834">投入巨大却只做出滞后拷贝。</text>

<rect x="508" y="284" width="220" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="308" font-size="12" font-weight="700" fill="#9b3621">误判 3：盲目堆题与不公对照</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="331" font-size="11.2" fill="#433834">固定批 GRPO 把算力耗在简单题；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="352" font-size="11.2" fill="#433834">小算力快起飞不等于上限更高；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="373" font-size="11.2" fill="#433834">多 Agent 堆数量长程仍会触顶。</text>

<rect x="748" y="284" width="224" height="106" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="308" font-size="12" font-weight="700" fill="#9b3621">误判 4：把加速代码当科研</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="331" font-size="11.2" fill="#433834">只看任务数会高估全自动进度；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="352" font-size="11.2" fill="#433834">新人若全程跳过手动低效排查，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="373" font-size="11.2" fill="#433834">反而更难建立第一性理解。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">四篇论文各自处理的序列长度</title><desc id="desc">对数坐标下，UNIQUE 用 501 个 token，LazFormer 默认 2048、实验扩到 9216，ReST 实验到 16K，SequenceO1 到 100K，其中最近 10K 走 STCA，其余压成 1024 个 sketch token。</desc><rect width="720" height="560" rx="12" fill="#faf8f2"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="44" font-size="24" font-weight="600" fill="#213c34">序列有多长，历史怎么进模型</text><text x="32" y="72" font-size="16" fill="#66756d">横轴为对数刻度；深色为论文默认配置，浅色为论文实验范围</text><g stroke="#d8d9ce"><path d="M150 96V480"/><path d="M323 96V480"/><path d="M496 96V480"/><path d="M670 96V480"/></g><g font-size="15" fill="#66756d" text-anchor="middle"><text x="150" y="504">100</text><text x="323" y="504">1K</text><text x="496" y="504">10K</text><text x="670" y="504">100K</text></g><text x="32" y="130" font-size="19" font-weight="600" fill="#213c34">UNIQUE</text><text x="32" y="152" font-size="14" fill="#66756d">百度召回</text><rect x="150" y="116" width="121" height="26" rx="4" fill="#236354"/><text x="282" y="135" font-size="16" fill="#213c34">501 = 1 画像 + 100 短期 + 200 中期 + 200 兴趣</text><text x="282" y="157" font-size="14" fill="#66756d">实现细节段给出的配置，生产长度未单独披露</text><text x="32" y="222" font-size="19" font-weight="600" fill="#213c34">LazFormer</text><text x="32" y="244" font-size="14" fill="#66756d">阿里国际电商</text><rect x="150" y="208" width="340" height="26" rx="4" fill="#cfe0d6"/><rect x="150" y="208" width="227" height="26" rx="4" fill="#236354"/><text x="150" y="262" font-size="16" fill="#213c34">默认 2048：最近 1024 条原样，其余每 8 条 sum pooling</text><text x="150" y="284" font-size="16" fill="#66756d">实验扩到 9216</text><text x="32" y="334" font-size="19" font-weight="600" fill="#213c34">ReST</text><text x="32" y="356" font-size="14" fill="#66756d">TikTok Shop 广告</text><rect x="150" y="320" width="381" height="26" rx="4" fill="#cfe0d6"/><text x="150" y="374" font-size="16" fill="#213c34">实验 100 → 16K，整段历史进 encoder 做 self-attention</text><text x="150" y="396" font-size="16" fill="#66756d">线上配置长度论文未披露</text><text x="32" y="436" font-size="19" font-weight="600" fill="#213c34">SequenceO1</text><text x="32" y="458" font-size="14" fill="#66756d">抖音精排</text><rect x="150" y="422" width="520" height="26" rx="4" fill="#a35336"/><rect x="150" y="422" width="346" height="26" rx="4" fill="#236354"/><text x="360" y="441" font-size="15" fill="#ffffff" text-anchor="middle">最近 10K → STCA</text><text x="584" y="441" font-size="15" fill="#ffffff" text-anchor="middle">全量 → sketch</text><text x="150" y="476" font-size="16" fill="#213c34">两路并行：最近 10K 直接做 STCA；完整 100K 压成 1024 个 token</text><text x="32" y="540" font-size="15" fill="#66756d">数据来源：四篇原论文实验设置与部署章节（博主自绘）</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">LLM 和推荐排序的计算形状</title><desc id="desc">LLM 一条序列对应一串逐位置的标签；推荐排序是一份用户历史对 N 个候选，每个候选只有稀疏标签。用户侧计算可以共享，候选侧计算要乘以 N。</desc><defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#66756d" stroke-width="1.5"/></marker></defs><rect width="720" height="520" rx="12" fill="#faf8f2"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="46" font-size="24" font-weight="600" fill="#213c34">LLM：一条序列，每个位置都有监督</text><g fill="#e8efe9" stroke="#236354" stroke-width="1.5"><rect x="32" y="70" width="60" height="40" rx="6"/><rect x="102" y="70" width="60" height="40" rx="6"/><rect x="172" y="70" width="60" height="40" rx="6"/><rect x="242" y="70" width="60" height="40" rx="6"/><rect x="312" y="70" width="60" height="40" rx="6"/></g><g font-size="18" fill="#213c34" text-anchor="middle"><text x="62" y="96">x1</text><text x="132" y="96">x2</text><text x="202" y="96">x3</text><text x="272" y="96">x4</text><text x="342" y="96">x5</text></g><g stroke="#66756d" stroke-width="1.5" marker-end="url(#a1)"><path d="M62 112V138"/><path d="M132 112V138"/><path d="M202 112V138"/><path d="M272 112V138"/><path d="M342 112V138"/></g><g font-size="18" fill="#236354" text-anchor="middle"><text x="62" y="160">x2</text><text x="132" y="160">x3</text><text x="202" y="160">x4</text><text x="272" y="160">x5</text><text x="342" y="160">x6</text></g><text x="400" y="100" font-size="19" fill="#66756d">标签稠密：每个 token</text><text x="400" y="128" font-size="19" fill="#66756d">都是下一个 token 的答案</text><path d="M32 196H688" stroke="#d8d9ce"/><text x="32" y="238" font-size="24" font-weight="600" fill="#213c34">推荐排序：一份历史，N 个候选</text><rect x="32" y="262" width="300" height="56" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.5"/><text x="182" y="286" font-size="19" font-weight="600" fill="#213c34" text-anchor="middle">用户行为历史（1K–100K）</text><text x="182" y="308" font-size="16" fill="#66756d" text-anchor="middle">噪声大、时间间隔不均匀</text><g stroke="#66756d" stroke-width="1.5" marker-end="url(#a1)"><path d="M334 290L420 262"/><path d="M334 290L420 318"/><path d="M334 290L420 374"/></g><g fill="#f6e6dd" stroke="#a35336" stroke-width="1.5"><rect x="424" y="244" width="150" height="38" rx="6"/><rect x="424" y="300" width="150" height="38" rx="6"/><rect x="424" y="356" width="150" height="38" rx="6"/></g><g font-size="17" fill="#213c34" text-anchor="middle"><text x="499" y="269">候选 1</text><text x="499" y="325">候选 2</text><text x="499" y="381">候选 N</text></g><text x="499" y="350" font-size="14" fill="#66756d" text-anchor="middle">⋯</text><g font-size="16" fill="#a35336"><text x="586" y="269">0/1</text><text x="586" y="325">0/1</text><text x="586" y="381">0/1</text></g><text x="618" y="325" font-size="15" fill="#66756d">稀疏</text><text x="618" y="345" font-size="15" fill="#66756d">且延迟</text><rect x="32" y="420" width="656" height="76" rx="10" fill="#ffffff" stroke="#d8d9ce"/><text x="52" y="452" font-size="19" fill="#213c34">直接套 decoder-only：每个候选重算一遍历史</text><text x="600" y="452" font-size="19" font-weight="600" fill="#a35336" text-anchor="end">N·(T + C)</text><text x="52" y="482" font-size="19" fill="#213c34">把用户侧拆出来只算一次</text><text x="600" y="482" font-size="19" font-weight="600" fill="#236354" text-anchor="end">T + N·C</text><text x="612" y="468" font-size="14" fill="#66756d">T 用户侧</text><text x="612" y="486" font-size="14" fill="#66756d">C 候选侧</text></g></svg>

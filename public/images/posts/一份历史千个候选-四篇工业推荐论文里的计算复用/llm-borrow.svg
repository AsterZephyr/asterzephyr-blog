<svg xmlns="http://www.w3.org/2000/svg" width="720" height="658" viewBox="0 0 720 658" role="img" aria-labelledby="title desc"><title id="title">从 LLM 借来的技巧，到推荐里怎么改</title><desc id="desc">七组对照：左边是 LLM 常用做法，右边是四篇论文在推荐场景里的改法和出处。</desc><defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#66756d" stroke-width="1.5"/></marker></defs><rect width="720" height="658" rx="12" fill="#faf8f2"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="44" font-size="24" font-weight="600" fill="#213c34">从 LLM 借来的技巧，到推荐里怎么改</text><text x="32" y="76" font-size="15" fill="#66756d">LLM 做法</text><text x="330" y="76" font-size="15" fill="#66756d">推荐里的改法</text><text x="688" y="76" font-size="15" fill="#66756d" text-anchor="end">出处</text><rect x="24" y="96" width="672" height="64" rx="8" fill="#ffffff" stroke="#d8d9ce"/><text x="40" y="134" font-size="16" fill="#66756d">RoPE：按 token 位置旋转</text><path d="M270 128H318" stroke="#66756d" stroke-width="1.5" marker-end="url(#a4)"/><text x="330" y="122" font-size="16" font-weight="600" fill="#213c34">RoTE：按物理时间分桶旋转</text><text x="330" y="144" font-size="14" fill="#236354">秒到年 7 种粒度分给不同 head</text><text x="684" y="134" font-size="13" fill="#a35336" text-anchor="end">ReST</text><rect x="24" y="170" width="672" height="64" rx="8" fill="#ffffff" stroke="#d8d9ce"/><text x="40" y="208" font-size="16" fill="#66756d">Pre-LN 直接加深</text><path d="M270 202H318" stroke="#66756d" stroke-width="1.5" marker-end="url(#a4)"/><text x="330" y="196" font-size="16" font-weight="600" fill="#213c34">SRN：浅层换 LN 位置</text><text x="330" y="218" font-size="14" fill="#236354">残差分支乘 α，初始化 0.01</text><text x="684" y="208" font-size="13" fill="#a35336" text-anchor="end">ReST</text><rect x="24" y="244" width="672" height="64" rx="8" fill="#ffffff" stroke="#d8d9ce"/><text x="40" y="282" font-size="16" fill="#66756d">MoE：加参数换效果</text><path d="M270 276H318" stroke="#66756d" stroke-width="1.5" marker-end="url(#a4)"/><text x="330" y="270" font-size="16" font-weight="600" fill="#213c34">encoder 加 MoE，参数 +500%</text><text x="330" y="292" font-size="14" fill="#236354">AUC 提升 0.00%</text><text x="684" y="282" font-size="13" fill="#a35336" text-anchor="end">ReST 消融</text><rect x="24" y="318" width="672" height="64" rx="8" fill="#ffffff" stroke="#d8d9ce"/><text x="40" y="356" font-size="16" fill="#66756d">KV cache：逐位置缓存</text><path d="M270 350H318" stroke="#66756d" stroke-width="1.5" marker-end="url(#a4)"/><text x="330" y="344" font-size="16" font-weight="600" fill="#213c34">缓存固定 k×d 的 sketch</text><text x="330" y="366" font-size="14" fill="#236354">大小与历史长度无关</text><text x="684" y="356" font-size="13" fill="#a35336" text-anchor="end">SequenceO1</text><rect x="24" y="392" width="672" height="64" rx="8" fill="#ffffff" stroke="#d8d9ce"/><text x="40" y="430" font-size="16" fill="#66756d">token-wise softmax</text><path d="M270 424H318" stroke="#66756d" stroke-width="1.5" marker-end="url(#a4)"/><text x="330" y="418" font-size="16" font-weight="600" fill="#213c34">prototype-wise 归一化</text><text x="330" y="440" font-size="14" fill="#236354">每条行为都分配到摘要里</text><text x="684" y="430" font-size="13" fill="#a35336" text-anchor="end">SequenceO1</text><rect x="24" y="466" width="672" height="64" rx="8" fill="#ffffff" stroke="#d8d9ce"/><text x="40" y="504" font-size="16" fill="#66756d">预训练后全量微调</text><path d="M270 498H318" stroke="#66756d" stroke-width="1.5" marker-end="url(#a4)"/><text x="330" y="492" font-size="16" font-weight="600" fill="#213c34">零初始化残差 adapter</text><text x="330" y="514" font-size="14" fill="#236354">每个 epoch 重置 sparse 参数</text><text x="684" y="504" font-size="13" fill="#a35336" text-anchor="end">LazFormer</text><rect x="24" y="540" width="672" height="64" rx="8" fill="#ffffff" stroke="#d8d9ce"/><text x="40" y="578" font-size="16" fill="#66756d">RQ-VAE 多层语义 ID</text><path d="M270 572H318" stroke="#66756d" stroke-width="1.5" marker-end="url(#a4)"/><text x="330" y="566" font-size="16" font-weight="600" fill="#213c34">单层 16384 码本</text><text x="330" y="588" font-size="14" fill="#236354">按使用频率惩罚热门码</text><text x="684" y="578" font-size="13" fill="#a35336" text-anchor="end">UNIQUE</text><text x="32" y="642" font-size="14" fill="#66756d">博主自绘，基于四篇原论文方法章节与消融表</text></g></svg>
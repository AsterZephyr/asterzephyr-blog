<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc"><title id="title">四篇论文分别在哪一层复用计算</title><desc id="desc">按请求内、训练样本、跨请求、跨阶段四个复用层次，对比 ReST、SequenceO1、LazFormer、UNIQUE 的做法。</desc><rect width="720" height="580" rx="12" fill="#faf8f2"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="44" font-size="24" font-weight="600" fill="#213c34">什么只算一次，在哪一层复用</text><text x="225.0" y="92" font-size="17" font-weight="600" fill="#213c34" text-anchor="middle">ReST</text><text x="365.0" y="92" font-size="17" font-weight="600" fill="#213c34" text-anchor="middle">SequenceO1</text><text x="505.0" y="92" font-size="17" font-weight="600" fill="#213c34" text-anchor="middle">LazFormer</text><text x="645.0" y="92" font-size="17" font-weight="600" fill="#213c34" text-anchor="middle">UNIQUE</text><path d="M24 110H704" stroke="#d8d9ce"/><text x="32" y="154" font-size="18" font-weight="600" fill="#213c34">请求内</text><text x="32" y="178" font-size="14" fill="#66756d">N 个候选</text><rect x="159" y="120" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="225.0" y="145.0" font-size="14" fill="#213c34" text-anchor="middle">encoder 算一次</text><text x="225.0" y="165.0" font-size="14" fill="#213c34" text-anchor="middle">decoder 跑 N 次</text><text x="225.0" y="185.0" font-size="14" fill="#213c34" text-anchor="middle">成本最多降 20×</text><rect x="299" y="120" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="365.0" y="155.0" font-size="14" fill="#213c34" text-anchor="middle">sketch 共享</text><text x="365.0" y="175.0" font-size="14" fill="#213c34" text-anchor="middle">STCA 仍按候选跑</text><rect x="439" y="120" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="505.0" y="145.0" font-size="14" fill="#213c34" text-anchor="middle">历史与候选拼成</text><text x="505.0" y="165.0" font-size="14" fill="#213c34" text-anchor="middle">一条序列</text><text x="505.0" y="185.0" font-size="14" fill="#213c34" text-anchor="middle">mask 隔离候选</text><rect x="579" y="120" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="645.0" y="145.0" font-size="14" fill="#213c34" text-anchor="middle">候选/码 token</text><text x="645.0" y="165.0" font-size="14" fill="#213c34" text-anchor="middle">接在前缀后</text><text x="645.0" y="185.0" font-size="14" fill="#213c34" text-anchor="middle">target split</text><path d="M24 210H704" stroke="#d8d9ce"/><text x="32" y="254" font-size="18" font-weight="600" fill="#213c34">训练样本</text><text x="32" y="278" font-size="14" fill="#66756d">同一用户多条</text><rect x="159" y="220" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="225.0" y="245.0" font-size="14" fill="#213c34" text-anchor="middle">ULT 并集序列</text><text x="225.0" y="265.0" font-size="14" fill="#213c34" text-anchor="middle">前缀掩码</text><text x="225.0" y="285.0" font-size="14" fill="#213c34" text-anchor="middle">吞吐 5.8×</text><rect x="299" y="220" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="365.0" y="245.0" font-size="14" fill="#213c34" text-anchor="middle">MRLB 分组</text><text x="365.0" y="265.0" font-size="14" fill="#213c34" text-anchor="middle">R = 40</text><text x="365.0" y="285.0" font-size="14" fill="#213c34" text-anchor="middle">3h TTL 缓存</text><rect x="439" y="220" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="505.0" y="255.0" font-size="14" fill="#213c34" text-anchor="middle">请求级样本</text><text x="505.0" y="275.0" font-size="14" fill="#213c34" text-anchor="middle">历史只传一次</text><rect x="579" y="220" width="132" height="80" rx="8" fill="#f2f1ea" stroke="#d8d9ce" stroke-width="1.2"/><text x="645.0" y="265.0" font-size="14" fill="#9aa39e" text-anchor="middle">论文未描述</text><path d="M24 310H704" stroke="#d8d9ce"/><text x="32" y="354" font-size="18" font-weight="600" fill="#213c34">跨请求</text><text x="32" y="378" font-size="14" fill="#66756d">连续访问</text><rect x="159" y="320" width="132" height="80" rx="8" fill="#f2f1ea" stroke="#d8d9ce" stroke-width="1.2"/><text x="225.0" y="365.0" font-size="14" fill="#9aa39e" text-anchor="middle">论文未描述</text><rect x="299" y="320" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="365.0" y="345.0" font-size="14" fill="#213c34" text-anchor="middle">sketch 缓存</text><text x="365.0" y="365.0" font-size="14" fill="#213c34" text-anchor="middle">1h TTL</text><text x="365.0" y="385.0" font-size="14" fill="#213c34" text-anchor="middle">命中率约 0.6</text><rect x="439" y="320" width="132" height="80" rx="8" fill="#f2f1ea" stroke="#d8d9ce" stroke-width="1.2"/><text x="505.0" y="365.0" font-size="14" fill="#9aa39e" text-anchor="middle">论文未描述</text><rect x="579" y="320" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="645.0" y="355.0" font-size="14" fill="#213c34" text-anchor="middle">15s / 30s 缓存窗</text><text x="645.0" y="375.0" font-size="14" fill="#213c34" text-anchor="middle">命中 37% / 60%</text><path d="M24 410H704" stroke="#d8d9ce"/><text x="32" y="454" font-size="18" font-weight="600" fill="#213c34">跨阶段</text><text x="32" y="478" font-size="14" fill="#66756d">召回/预训练</text><rect x="159" y="420" width="132" height="80" rx="8" fill="#f2f1ea" stroke="#d8d9ce" stroke-width="1.2"/><text x="225.0" y="465.0" font-size="14" fill="#9aa39e" text-anchor="middle">论文未描述</text><rect x="299" y="420" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="365.0" y="455.0" font-size="14" fill="#213c34" text-anchor="middle">pipeline lift</text><text x="365.0" y="475.0" font-size="14" fill="#213c34" text-anchor="middle">与召回并行</text><rect x="439" y="420" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="505.0" y="445.0" font-size="14" fill="#213c34" text-anchor="middle">预训练参数</text><text x="505.0" y="465.0" font-size="14" fill="#213c34" text-anchor="middle">进排序；多 epoch</text><text x="505.0" y="485.0" font-size="14" fill="#213c34" text-anchor="middle">重置 sparse</text><rect x="579" y="420" width="132" height="80" rx="8" fill="#e8efe9" stroke="#236354" stroke-width="1.2"/><text x="645.0" y="455.0" font-size="14" fill="#213c34" text-anchor="middle">码预测与排序</text><text x="645.0" y="475.0" font-size="14" fill="#213c34" text-anchor="middle">共用一次前向</text><path d="M24 510H704" stroke="#d8d9ce"/><text x="32" y="542" font-size="14" fill="#66756d">灰色格子：论文没写到这一层，不代表系统里没有。</text><text x="32" y="564" font-size="14" fill="#66756d">博主自绘，基于四篇原论文方法与系统章节。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" width="1000" height="424" role="img" aria-labelledby="title desc">
<title id="title">Four Years of Generative Recommendation: From Semantic IDs to Wide-Beam Serving Systems</title>
<desc id="desc">Top row tracks four engineering shifts from 2022 to late 2026: Semantic IDs, scaling architectures, commercial alignment and reasoning, and wide-beam inference systems. Bottom dashed cards mark the next constraint exposed at each step.</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#4f4942"/>
  </marker>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#b1462f"/>
  </marker>
</defs>

<rect width="1000" height="424" fill="#faf7f2"/>

<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" x="500" y="34" font-size="18" font-weight="700" fill="#1f1d1a" text-anchor="middle">Four Years of Generative Recommendation: Solving One Bottleneck Exposes the Next</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" x="500" y="57" font-size="12.5" fill="#5d574f" text-anchor="middle">Top row shows major engineering shifts (2022 to 2026); dashed cards mark the next wall hit in production</text>

<!-- Stage 1 -->
<rect x="28" y="82" width="220" height="156" rx="10" fill="#edf3f9" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M38 82 H238 Q248 82 248 92 V118 H28 V92 Q28 82 38 82 Z" fill="#d3e3f3"/>
<line x1="28" y1="118" x2="248" y2="118" stroke="#2f5d8a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="105" font-size="12.5" font-weight="700" fill="#1b3956">Semantic IDs (2022-23)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="142" font-size="10.6" fill="#23201c">• Replace external ANN lookup</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="166" font-size="10.6" fill="#23201c">• RQ-VAE maps items to 3-4 tokens</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="40" y="190" font-size="10.6" fill="#23201c">• Shared prefixes aid cold start</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="40" y="219" font-size="10" font-weight="600" fill="#2f5d8a">P5 · DSI · TIGER</text>

<!-- Stage 2 -->
<rect x="268" y="82" width="220" height="156" rx="10" fill="#fcf5e6" stroke="#a6631b" stroke-width="1.6"/>
<path d="M278 82 H478 Q488 82 488 92 V118 H268 V92 Q268 82 278 82 Z" fill="#f4e0bc"/>
<line x1="268" y1="118" x2="488" y2="118" stroke="#a6631b" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="105" font-size="12.5" font-weight="700" fill="#633a0d">Scaling Laws (2024-25)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="142" font-size="10.8" fill="#23201c">• Scale from billions to 1.5T params</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="166" font-size="10.8" fill="#23201c">• HSTU / MTGR keep cross-features</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="280" y="190" font-size="10.8" fill="#23201c">• OneRec-V2 / PLUM unify pipelines</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="280" y="219" font-size="9.6" font-weight="600" fill="#9a5914">HSTU · MTGR · OneRec-V2 · PLUM</text>

<!-- Stage 3 -->
<rect x="508" y="82" width="220" height="156" rx="10" fill="#e9f4f0" stroke="#2c6b5a" stroke-width="1.6"/>
<path d="M518 82 H718 Q728 82 728 92 V118 H508 V92 Q508 82 518 82 Z" fill="#cae4db"/>
<line x1="508" y1="118" x2="728" y2="118" stroke="#2c6b5a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="105" font-size="12.5" font-weight="700" fill="#1a463a">Alignment &amp; CoT (2025-26)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="142" font-size="10.8" fill="#23201c">• Break past SFT click-imitation cap</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="166" font-size="10.8" fill="#23201c">• Deterministic tail + RL for GMV</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="520" y="190" font-size="10.8" fill="#23201c">• CoT links world knowledge to SIDs</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="520" y="219" font-size="9.8" font-weight="600" fill="#255d4e">GPR · SAGE · OneReason · TGR</text>

<!-- Stage 4 -->
<rect x="748" y="82" width="224" height="156" rx="10" fill="#f3eff8" stroke="#634b7a" stroke-width="1.6"/>
<path d="M758 82 H962 Q972 82 972 92 V118 H748 V92 Q748 82 758 82 Z" fill="#dfd5eb"/>
<line x1="748" y1="118" x2="972" y2="118" stroke="#634b7a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="105" font-size="12.5" font-weight="700" fill="#3f2d52">Wide-Beam Serving (2026)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="142" font-size="10.8" fill="#23201c">• Target 10-100 ms online SLA</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="166" font-size="10.8" fill="#23201c">• Tree Attention drops prefix rereads</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" x="760" y="190" font-size="10.8" fill="#23201c">• Static KV + unroll beat vLLM 25×</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="760" y="219" font-size="9.8" font-weight="600" fill="#594170">xGR · UniSGR · 2611.23339</text>

<!-- Horizontal arrows -->
<line x1="248" y1="160" x2="265" y2="160" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="488" y1="160" x2="505" y2="160" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>
<line x1="728" y1="160" x2="745" y2="160" stroke="#4f4942" stroke-width="1.8" marker-end="url(#arrow-main)"/>

<!-- Vertical arrows -->
<line x1="138" y1="238" x2="138" y2="283" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="378" y1="238" x2="378" y2="283" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="618" y1="238" x2="618" y2="283" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
<line x1="860" y1="238" x2="860" y2="283" stroke="#b1462f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>

<!-- Tags -->
<rect x="76" y="249" width="124" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="138" y="263" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">At industrial scale</text>

<rect x="316" y="249" width="124" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="378" y="263" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">Once models scale</text>

<rect x="556" y="249" width="124" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="618" y="263" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">At online serving</text>

<rect x="798" y="249" width="124" height="20" rx="4" fill="#faf7f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="860" y="263" font-size="10.2" font-weight="600" fill="#b1462f" text-anchor="middle">Remaining gap</text>

<!-- Bottleneck cards -->
<rect x="28" y="286" width="220" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="310" font-size="11.4" font-weight="700" fill="#9b3621">Wall: Non-Stationary Streams</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="333" font-size="10.5" fill="#433834">Vanilla Transformers struggle with</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="353" font-size="10.5" fill="#433834">high-frequency event logs and lack</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="40" y="373" font-size="10.5" fill="#433834">predictable production scaling laws.</text>

<rect x="268" y="286" width="220" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="310" font-size="11.4" font-weight="700" fill="#9b3621">Wall: SFT Cap &amp; Collisions</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="333" font-size="10.5" fill="#433834">Imitating past clicks caps quality;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="353" font-size="10.5" fill="#433834">pure semantic IDs collide 85% in</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="280" y="373" font-size="10.5" fill="#433834">ads and hide bid or value signals.</text>

<rect x="508" y="286" width="220" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="310" font-size="11.4" font-weight="700" fill="#9b3621">Wall: LLM Engines Stall</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="333" font-size="10.5" fill="#433834">Long prefix + 512 beams + 3 tokens:</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="353" font-size="10.5" fill="#433834">vLLM takes 1,989 ms on 1.7B,</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="520" y="373" font-size="10.5" fill="#433834">far over the 10-100 ms SLA.</text>

<rect x="748" y="286" width="224" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="310" font-size="11.4" font-weight="700" fill="#9b3621">Open: 10K Prefill &amp; 8B Load</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="333" font-size="10.5" fill="#433834">10.8K prefix TTFT stays 379 ms;</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="353" font-size="10.5" fill="#433834">8B at BW=512 takes 246 ms, needing</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="760" y="373" font-size="10.5" fill="#433834">prefill caching and custom tree ops.</text>
</svg>

<!-- Bottleneck cards -->
<rect x="28" y="286" width="220" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="310" font-size="12" font-weight="700" fill="#9b3621">新瓶颈：高基数实时流</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="333" font-size="11.2" fill="#433834">标准 Transformer 吃不下非平稳</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="354" font-size="11.2" fill="#433834">高频行为流，小数据集有效但</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="42" y="375" font-size="11.2" fill="#433834">进工业界缺少可预测缩放律。</text>

<rect x="268" y="286" width="220" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="310" font-size="12" font-weight="700" fill="#9b3621">新瓶颈：模仿上限与撞号</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="333" font-size="11.2" fill="#433834">纯 SFT 模仿历史点击很快见顶；</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="354" font-size="11.2" fill="#433834">广告纯语义撞号率高达 85%，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="282" y="375" font-size="11.2" fill="#433834">且无法区分出价和商业价值。</text>

<rect x="508" y="286" width="220" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="310" font-size="12" font-weight="700" fill="#9b3621">新瓶颈：通用推理引擎翻车</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="333" font-size="11.2" fill="#433834">长历史前缀 + 512 宽束 + 3 步输出，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="354" font-size="11.2" fill="#433834">vLLM 把 1.7B 拖到近 2 秒，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="522" y="375" font-size="11.2" fill="#433834">远超 10-100 ms 线上预算。</text>

<rect x="748" y="286" width="224" height="108" rx="8" fill="#fdf2ef" stroke="#c96e59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="310" font-size="12" font-weight="700" fill="#9b3621">未完待续：长前缀与大模型</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="333" font-size="11.2" fill="#433834">10K 前缀 TTFT 仍占 379 ms，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="354" font-size="11.2" fill="#433834">8B 模型宽束 512 仍需 246 ms，</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" x="762" y="375" font-size="11.2" fill="#433834">还需 Prefill 压缩与定制树算子。</text>

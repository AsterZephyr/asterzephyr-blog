<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" width="1000" height="424" role="img" aria-labelledby="title desc">
<title id="title">生成式推荐四年演进全景：从 Semantic ID 到 2026 推理系统之战</title>
<desc id="desc">上排四列展示生成式推荐从离散表达 Semantic ID、规模化架构、商业对齐与显式推理，到 2026 宽束低延迟推理系统的技术演进；下排虚线卡片标出每一步解决旧瓶颈后暴露的下一堵工程墙。</desc>
<defs>
  <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#4f4942"/>
  </marker>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#b1462f"/>
  </marker>
</defs>

<rect width="1000" height="424" fill="#faf7f2"/>

<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif" x="500" y="34" font-size="18" font-weight="700" fill="#1f1d1a" text-anchor="middle">生成式推荐四年演进主线：每解决一处瓶颈，立刻撞上下一堵工程墙</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif" x="500" y="57" font-size="12.5" fill="#5d574f" text-anchor="middle">上排是 2022 到 2026 年的核心工程解法，下排虚线是各阶段进入大规模线上后暴露的新约束</text>

<!-- Stage 1 -->
<rect x="28" y="82" width="220" height="156" rx="10" fill="#edf3f9" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M38 82 H238 Q248 82 248 92 V118 H28 V92 Q28 82 38 82 Z" fill="#d3e3f3"/>
<line x1="28" y1="118" x2="248" y2="118" stroke="#2f5d8a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="42" y="105" font-size="13" font-weight="700" fill="#1b3956">离散表达：Semantic ID</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="42" y="142" font-size="11.4" fill="#23201c">• 2022-2023 · 替代外置 ANN 检索</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="42" y="166" font-size="11.4" fill="#23201c">• RQ-VAE 把商品压成 3-4 枚编码</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="42" y="190" font-size="11.4" fill="#23201c">• 语义前缀共享，缓解冷启动问题</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="42" y="219" font-size="10.2" font-weight="600" fill="#2f5d8a">P5 · DSI · TIGER</text>

<!-- Stage 2 -->
<rect x="268" y="82" width="220" height="156" rx="10" fill="#fcf5e6" stroke="#a6631b" stroke-width="1.6"/>
<path d="M278 82 H478 Q488 82 488 92 V118 H268 V92 Q268 82 278 82 Z" fill="#f4e0bc"/>
<line x1="268" y1="118" x2="488" y2="118" stroke="#a6631b" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="282" y="105" font-size="13" font-weight="700" fill="#633a0d">规模架构：跑出缩放律</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="282" y="142" font-size="11.4" fill="#23201c">• 2024-2025 · 冲上十亿至万亿级</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="282" y="166" font-size="11.4" fill="#23201c">• HSTU / MTGR 保留交叉特征缩放</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="282" y="190" font-size="11.4" fill="#23201c">• OneRec-V2 / PLUM 统一生成链路</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="282" y="219" font-size="10.2" font-weight="600" fill="#9a5914">HSTU · MTGR · OneRec-V2 · PLUM</text>

<!-- Stage 3 -->
<rect x="508" y="82" width="220" height="156" rx="10" fill="#e9f4f0" stroke="#2c6b5a" stroke-width="1.6"/>
<path d="M518 82 H718 Q728 82 728 92 V118 H508 V92 Q508 82 518 82 Z" fill="#cae4db"/>
<line x1="508" y1="118" x2="728" y2="118" stroke="#2c6b5a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="522" y="105" font-size="13" font-weight="700" fill="#1a463a">价值对齐与显式推理</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="522" y="142" font-size="11.4" fill="#23201c">• 2025-2026 · 跨过纯模仿上限</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="522" y="166" font-size="11.4" fill="#23201c">• 业务确定性尾码 + RL 对齐 GMV</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="522" y="190" font-size="11.4" fill="#23201c">• 思维链把世界知识接入推荐</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="522" y="219" font-size="10.2" font-weight="600" fill="#255d4e">GPR · SAGE · OneReason · TGR</text>

<!-- Stage 4 -->
<rect x="748" y="82" width="224" height="156" rx="10" fill="#f3eff8" stroke="#634b7a" stroke-width="1.6"/>
<path d="M758 82 H962 Q972 82 972 92 V118 H748 V92 Q748 82 758 82 Z" fill="#dfd5eb"/>
<line x1="748" y1="118" x2="972" y2="118" stroke="#634b7a" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="762" y="105" font-size="13" font-weight="700" fill="#3f2d52">2026 前沿：宽束推理系统</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="762" y="142" font-size="11.4" fill="#23201c">• 2026 年底 · 死磕 10-100 ms SLA</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="762" y="166" font-size="11.4" fill="#23201c">• Tree Attention 消除前缀重读</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" x="762" y="190" font-size="11.4" fill="#23201c">• 静态 KV + 展开图快过 vLLM 25×</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="762" y="219" font-size="10.2" font-weight="600" fill="#594170">xGR · UniSGR · 2611.23339</text>


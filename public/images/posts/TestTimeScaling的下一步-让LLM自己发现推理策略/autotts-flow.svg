<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c4956a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b72b0"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 13px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 11px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .arrow-label { font-size: 10px; font-weight: 500; fill: #5a5a58; }
  </style>

  <!-- Background -->
  <rect width="960" height="580" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">AutoTTS 流程</text>

  <!-- Phase 1: Offline Data -->
  <text x="80" y="72" class="section-label">PHASE 1: 离线准备</text>

  <rect x="80" y="85" width="340" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="250" y="108" text-anchor="middle" class="node-title">离线数据采集</text>
  <text x="250" y="125" text-anchor="middle" class="node-sub">每个问题预采样 128 条推理轨迹</text>

  <rect x="520" y="85" width="360" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="700" y="108" text-anchor="middle" class="node-title">构建 Replay 环境</text>
  <text x="700" y="125" text-anchor="middle" class="node-sub">所有 LLM 调用提前完成, 后续评估 = 查表</text>

  <line x1="420" y1="110" x2="520" y2="110" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>

  <!-- Arrow down to discovery loop -->
  <line x1="700" y1="135" x2="700" y2="170" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>

  <!-- Phase 2: Discovery Loop -->
  <text x="80" y="190" class="section-label">PHASE 2: 发现循环 (5 轮)</text>

  <rect x="60" y="200" width="840" height="270" rx="12" fill="none" stroke="#9b72b0" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Loop steps -->
  <rect x="100" y="225" width="330" height="50" rx="8" fill="#f0e6f6" stroke="#9b72b0" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="265" y="248" text-anchor="middle" class="node-title">Explorer LLM 提出新策略代码</text>
  <text x="265" y="265" text-anchor="middle" class="node-sub">阅读历史, 诊断失败原因, 改进设计</text>

  <rect x="530" y="225" width="330" height="50" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="695" y="248" text-anchor="middle" class="node-title">在 Replay 环境中评估</text>
  <text x="695" y="265" text-anchor="middle" class="node-sub">扫描 beta 参数, 记录 scaling curve</text>

  <rect x="530" y="310" width="330" height="50" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="695" y="333" text-anchor="middle" class="node-title">记录执行轨迹</text>
  <text x="695" y="350" text-anchor="middle" class="node-sub">Agent 可以诊断「为什么这个策略失败了」</text>

  <rect x="100" y="310" width="330" height="50" rx="8" fill="#ffffff" stroke="#8a8a87" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="265" y="333" text-anchor="middle" class="node-title">追加到历史记录</text>
  <text x="265" y="350" text-anchor="middle" class="node-sub">策略代码 + 评估结果 + 失败分析</text>

  <!-- Loop arrows -->
  <line x1="430" y1="250" x2="530" y2="250" stroke="#9b72b0" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="480" y="242" text-anchor="middle" class="arrow-label">提出</text>

  <line x1="695" y1="275" x2="695" y2="310" stroke="#c4956a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <line x1="530" y1="335" x2="430" y2="335" stroke="#8a8a87" stroke-width="1.5" marker-end="url(#arrowControl)"/>

  <!-- Loop back arrow -->
  <path d="M 265 310 L 265 290 L 265 275" fill="none" stroke="#9b72b0" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="240" y="290" class="arrow-label">下一轮</text>

  <!-- Round counter -->
  <rect x="100" y="385" width="160" height="30" rx="15" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1"/>
  <text x="180" y="405" text-anchor="middle" class="node-sub">5 轮 × $39.9 × 160 min</text>

  <!-- Cost callout -->
  <rect x="300" y="385" width="250" height="30" rx="15" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1"/>
  <text x="425" y="405" text-anchor="middle" class="node-sub">零 LLM 推理调用 (纯查表评估)</text>

  <!-- Phase 3: Selection -->
  <text x="80" y="510" class="section-label">PHASE 3: 选择与验证</text>

  <rect x="100" y="520" width="300" height="44" rx="8" fill="#e0f7fa" stroke="#0c8599" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="250" y="546" text-anchor="middle" class="node-title">选择最优策略 + beta 值</text>

  <rect x="500" y="520" width="360" height="44" rx="8" fill="#e0f7fa" stroke="#0c8599" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="680" y="546" text-anchor="middle" class="node-title">在 held-out benchmark 上验证泛化性</text>

  <line x1="400" y1="542" x2="500" y2="542" stroke="#0c8599" stroke-width="1.5" marker-end="url(#arrowControl)"/>

  <!-- Arrow from loop to selection -->
  <line x1="480" y1="470" x2="480" y2="510" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
</svg>

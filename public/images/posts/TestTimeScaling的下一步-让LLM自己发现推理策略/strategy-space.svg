<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c4956a"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 13px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 11px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .arrow-label { font-size: 10px; font-weight: 500; fill: #5a5a58; }
    .category { font-size: 12px; font-weight: 600; fill: #5a5a58; }
  </style>

  <!-- Background -->
  <rect width="960" height="520" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">TTS 策略在宽度-深度空间中的轨迹</text>

  <!-- Strategy nodes -->
  <!-- SC -->
  <rect x="60" y="70" width="250" height="56" rx="8" fill="#ffffff" stroke="#8a8a87" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="185" y="93" text-anchor="middle" class="node-title">Self-Consistency SC@64</text>
  <text x="185" y="112" text-anchor="middle" class="node-sub">固定宽度=64, 固定深度=max</text>

  <!-- ASC -->
  <rect x="60" y="150" width="250" height="56" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="185" y="173" text-anchor="middle" class="node-title">ASC 自适应采样</text>
  <text x="185" y="192" text-anchor="middle" class="node-sub">逐步增加宽度, 确信度达标即停</text>

  <!-- ESC -->
  <rect x="60" y="230" width="250" height="56" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="185" y="253" text-anchor="middle" class="node-title">ESC 分块早停</text>
  <text x="185" y="272" text-anchor="middle" class="node-sub">批量生成, 滑动窗口检测稳定性</text>

  <!-- PP -->
  <rect x="60" y="310" width="250" height="56" rx="8" fill="#f0e6f6" stroke="#9b72b0" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="185" y="333" text-anchor="middle" class="node-title">Parallel-Probe</text>
  <text x="185" y="352" text-anchor="middle" class="node-sub">宽启动 → 渐进剪枝 → 同时加深</text>

  <!-- ST-BoN -->
  <rect x="60" y="390" width="250" height="56" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="185" y="413" text-anchor="middle" class="node-title">ST-BoN</text>
  <text x="185" y="432" text-anchor="middle" class="node-sub">先宽展开 → 选最优 → 再加深</text>

  <!-- Category labels -->
  <rect x="420" y="80" width="120" height="36" rx="18" fill="#f5f5f5" stroke="#8a8a87" stroke-width="1.2"/>
  <text x="480" y="103" text-anchor="middle" class="category">静态策略</text>

  <rect x="420" y="180" width="140" height="36" rx="18" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="1.2"/>
  <text x="490" y="203" text-anchor="middle" class="category">半自适应</text>

  <rect x="420" y="320" width="140" height="36" rx="18" fill="#f0e6f6" stroke="#9b72b0" stroke-width="1.2"/>
  <text x="490" y="343" text-anchor="middle" class="category">全自适应</text>

  <rect x="420" y="400" width="140" height="36" rx="18" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.2"/>
  <text x="490" y="423" text-anchor="middle" class="category">分阶段策略</text>

  <!-- Arrows from strategies to categories -->
  <line x1="310" y1="98" x2="420" y2="98" stroke="#8a8a87" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="310" y1="178" x2="420" y2="198" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="310" y1="258" x2="420" y2="198" stroke="#6b9e8a" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="310" y1="338" x2="420" y2="338" stroke="#9b72b0" stroke-width="1.2" marker-end="url(#arrowControl)"/>
  <line x1="310" y1="418" x2="420" y2="418" stroke="#c4956a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- Human-designed convergence -->
  <rect x="680" y="220" width="220" height="56" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="790" y="247" text-anchor="middle" class="node-title" style="fill:#c92a2a">人类设计的启发式</text>
  <text x="790" y="266" text-anchor="middle" class="node-sub">所有策略都是手工选取的点</text>

  <!-- Dashed arrows to human -->
  <path d="M 540 98 L 680 235" fill="none" stroke="#c92a2a" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <path d="M 560 198 L 680 240" fill="none" stroke="#c92a2a" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <path d="M 560 338 L 680 252" fill="none" stroke="#c92a2a" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <path d="M 560 418 L 680 260" fill="none" stroke="#c92a2a" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>

  <!-- Legend -->
  <text x="680" y="320" class="section-label">宽度维度: 并行推理分支数</text>
  <text x="680" y="340" class="section-label">深度维度: 每条分支推理步数</text>
  <text x="680" y="370" class="node-sub">所有策略 = 控制空间中的一条轨迹</text>
  <text x="680" y="390" class="node-sub">搜索 = 自动化地发现更优轨迹</text>

  <!-- Insight box -->
  <rect x="650" y="420" width="280" height="72" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.2"/>
  <text x="790" y="444" text-anchor="middle" class="section-label">AUTOTTS 的洞察</text>
  <text x="790" y="464" text-anchor="middle" class="node-sub">把「发明启发式」变成</text>
  <text x="790" y="480" text-anchor="middle" class="node-sub">「在控制空间中搜索好轨迹」</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">RL Algorithms for LLM: Key Differences</text>

  <!-- PPO -->
  <rect x="40" y="60" width="200" height="390" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">PPO</text>
  <text x="140" y="106" text-anchor="middle" font-size="10" fill="#6b7280">Proximal Policy Opt.</text>
  <line x1="55" y1="115" x2="225" y2="115" stroke="#93c5fd" stroke-width="1"/>
  <text x="55" y="135" font-size="10" fill="#374151">Need: Reward Model</text>
  <text x="55" y="152" font-size="10" fill="#374151">Need: Value Function</text>
  <text x="55" y="169" font-size="10" fill="#374151">Need: Reference Policy</text>
  <text x="55" y="186" font-size="10" fill="#374151">Need: 4 models in VRAM</text>
  <line x1="55" y1="200" x2="225" y2="200" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="55" y="218" font-size="10" font-weight="600" fill="#16a34a">Pro: Stable, proven</text>
  <text x="55" y="235" font-size="10" font-weight="600" fill="#16a34a">Pro: Fine-grained credit</text>
  <text x="55" y="252" font-size="10" font-weight="600" fill="#16a34a">Pro: Used by OpenAI</text>
  <line x1="55" y1="265" x2="225" y2="265" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="55" y="283" font-size="10" font-weight="600" fill="#dc2626">Con: 4x memory cost</text>
  <text x="55" y="300" font-size="10" font-weight="600" fill="#dc2626">Con: Complex infra</text>
  <text x="55" y="317" font-size="10" font-weight="600" fill="#dc2626">Con: Reward hacking</text>
  <line x1="55" y1="330" x2="225" y2="330" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="140" y="355" text-anchor="middle" font-size="10" fill="#6b7280">Users:</text>
  <text x="140" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">OpenAI, Anthropic</text>
  <text x="140" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Meta (RLHF)</text>

  <!-- DPO -->
  <rect x="270" y="60" width="200" height="390" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">DPO</text>
  <text x="370" y="106" text-anchor="middle" font-size="10" fill="#6b7280">Direct Preference Opt.</text>
  <line x1="285" y1="115" x2="455" y2="115" stroke="#d8b4fe" stroke-width="1"/>
  <text x="285" y="135" font-size="10" fill="#374151">Need: Preference pairs</text>
  <text x="285" y="152" font-size="10" fill="#374151">Need: Reference Policy</text>
  <text x="285" y="169" font-size="10" fill="#374151">NO reward model</text>
  <text x="285" y="186" font-size="10" fill="#374151">Offline (no sampling)</text>
  <line x1="285" y1="200" x2="455" y2="200" stroke="#d8b4fe" stroke-width="0.5"/>
  <text x="285" y="218" font-size="10" font-weight="600" fill="#16a34a">Pro: Simple to train</text>
  <text x="285" y="235" font-size="10" font-weight="600" fill="#16a34a">Pro: Low memory</text>
  <text x="285" y="252" font-size="10" font-weight="600" fill="#16a34a">Pro: No reward model</text>
  <line x1="285" y1="265" x2="455" y2="265" stroke="#d8b4fe" stroke-width="0.5"/>
  <text x="285" y="283" font-size="10" font-weight="600" fill="#dc2626">Con: Offline only</text>
  <text x="285" y="300" font-size="10" font-weight="600" fill="#dc2626">Con: Distribution shift</text>
  <text x="285" y="317" font-size="10" font-weight="600" fill="#dc2626">Con: Weaker than online</text>
  <line x1="285" y1="330" x2="455" y2="330" stroke="#d8b4fe" stroke-width="0.5"/>
  <text x="370" y="355" text-anchor="middle" font-size="10" fill="#6b7280">Users:</text>
  <text x="370" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Mistral, Zephyr</text>
  <text x="370" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Many academic labs</text>

  <!-- GRPO -->
  <rect x="500" y="60" width="200" height="390" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">GRPO</text>
  <text x="600" y="106" text-anchor="middle" font-size="10" fill="#6b7280">Group Relative PO</text>
  <line x1="515" y1="115" x2="685" y2="115" stroke="#fdba74" stroke-width="1"/>
  <text x="515" y="135" font-size="10" fill="#374151">Need: Verifiable reward</text>
  <text x="515" y="152" font-size="10" fill="#374151">NO value function</text>
  <text x="515" y="169" font-size="10" fill="#374151">Online sampling (k per Q)</text>
  <text x="515" y="186" font-size="10" fill="#374151">Group-relative advantage</text>
  <line x1="515" y1="200" x2="685" y2="200" stroke="#fdba74" stroke-width="0.5"/>
  <text x="515" y="218" font-size="10" font-weight="600" fill="#16a34a">Pro: No critic model</text>
  <text x="515" y="235" font-size="10" font-weight="600" fill="#16a34a">Pro: Less memory</text>
  <text x="515" y="252" font-size="10" font-weight="600" fill="#16a34a">Pro: Simple to impl.</text>
  <line x1="515" y1="265" x2="685" y2="265" stroke="#fdba74" stroke-width="0.5"/>
  <text x="515" y="283" font-size="10" font-weight="600" fill="#dc2626">Con: Entropy collapse</text>
  <text x="515" y="300" font-size="10" font-weight="600" fill="#dc2626">Con: Needs pass@k&gt;0</text>
  <text x="515" y="317" font-size="10" font-weight="600" fill="#dc2626">Con: Kills diversity</text>
  <line x1="515" y1="330" x2="685" y2="330" stroke="#fdba74" stroke-width="0.5"/>
  <text x="600" y="355" text-anchor="middle" font-size="10" fill="#6b7280">Users:</text>
  <text x="600" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">DeepSeek-R1</text>
  <text x="600" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Academic RL papers</text>

  <!-- DAPO -->
  <rect x="730" y="60" width="200" height="390" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">DAPO</text>
  <text x="830" y="106" text-anchor="middle" font-size="10" fill="#6b7280">Decoupled Alignment PO</text>
  <line x1="745" y1="115" x2="915" y2="115" stroke="#86efac" stroke-width="1"/>
  <text x="745" y="135" font-size="10" fill="#374151">GRPO + anti-collapse</text>
  <text x="745" y="152" font-size="10" fill="#374151">Decoupled KL penalty</text>
  <text x="745" y="169" font-size="10" fill="#374151">Dynamic sampling temp</text>
  <text x="745" y="186" font-size="10" fill="#374151">Overlong filtering</text>
  <line x1="745" y1="200" x2="915" y2="200" stroke="#86efac" stroke-width="0.5"/>
  <text x="745" y="218" font-size="10" font-weight="600" fill="#16a34a">Pro: Less entropy drop</text>
  <text x="745" y="235" font-size="10" font-weight="600" fill="#16a34a">Pro: Better diversity</text>
  <text x="745" y="252" font-size="10" font-weight="600" fill="#16a34a">Pro: Longer training</text>
  <line x1="745" y1="265" x2="915" y2="265" stroke="#86efac" stroke-width="0.5"/>
  <text x="745" y="283" font-size="10" font-weight="600" fill="#dc2626">Con: Still needs strong</text>
  <text x="745" y="300" font-size="10" font-weight="600" fill="#dc2626">     base model</text>
  <text x="745" y="317" font-size="10" font-weight="600" fill="#dc2626">Con: Complex tuning</text>
  <line x1="745" y1="330" x2="915" y2="330" stroke="#86efac" stroke-width="0.5"/>
  <text x="830" y="355" text-anchor="middle" font-size="10" fill="#6b7280">Users:</text>
  <text x="830" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">ByteDance (proRL)</text>
  <text x="830" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Academic RL papers</text>
</svg>

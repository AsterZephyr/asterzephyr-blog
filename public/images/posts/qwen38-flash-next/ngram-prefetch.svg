<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900" role="img" aria-labelledby="title desc">
<title id="title">N-gram table lookup overlaps Layer 1</title><desc id="desc">Token ids determine n-gram keys and table row addresses. On the host, the needed rows are gathered from tables in host memory and copied asynchronously to the accelerator while it computes the vocabulary embedding and Layer 1. Layer 2 adds the n-gram vectors. If the rows arrive after Layer 1 finishes, Layer 2 waits. Box lengths are illustrative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/></marker><pattern id="future" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#c9c5bf" stroke-width="4"/></pattern></defs>
<rect width="680" height="900" rx="16" fill="#f8f6f3"/>
<style>text { font-family: Arial, Helvetica, 'PingFang SC', sans-serif; fill: #1a1a1a; } .muted { fill: #5a5a5a; }</style>
<text data-graph-role="title" x="340.0" y="46.0" font-size="21" font-weight="700" text-anchor="middle">WHERE THE TABLE LOOKUP HIDES</text>
<g id="ids" data-graph-role="node"><rect x="46.0" y="78.0" width="588.0" height="88.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="340.0" y="118.6" font-size="19" font-weight="600" text-anchor="middle">token ids known</text><text data-graph-role="node-label" x="340.0" y="139.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">row addresses depend on token IDs, not hidden states</text></g>
<text data-graph-role="label" x="176.0" y="210.0" font-size="19" font-weight="700" text-anchor="middle">HOST</text>
<text data-graph-role="label" x="504.0" y="210.0" font-size="19" font-weight="700" text-anchor="middle">ACCELERATOR</text>
<line data-graph-role="decoration" x1="340" y1="190" x2="340" y2="742" stroke="#c9c5bf" stroke-width="2" stroke-dasharray="4,6"/>
<g id="tables" data-graph-role="node"><rect x="46.0" y="232.0" width="260.0" height="92.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="176.0" y="274.6" font-size="19" font-weight="600" text-anchor="middle">n-gram tables</text><text data-graph-role="node-label" x="176.0" y="295.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">51B params in host memory</text></g>
<g id="gather" data-graph-role="node"><rect x="46.0" y="360.0" width="260.0" height="76.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="176.0" y="394.6" font-size="19" font-weight="600" text-anchor="middle">gather the rows</text><text data-graph-role="node-label" x="176.0" y="415.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">for this batch</text></g>
<g id="copy" data-graph-role="node"><rect x="46.0" y="472.0" width="260.0" height="92.0" rx="12" fill="#f6d38b" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="176.0" y="514.6" font-size="19" font-weight="600" text-anchor="middle">async copy</text><text data-graph-role="node-label" x="176.0" y="535.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">host → accelerator</text></g>
<g id="embed" data-graph-role="node"><rect x="374.0" y="232.0" width="260.0" height="76.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="504.0" y="276.6" font-size="19" font-weight="600" text-anchor="middle">vocab embedding</text></g>
<g id="layer1" data-graph-role="node"><rect x="374.0" y="344.0" width="260.0" height="220.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="504.0" y="439.6" font-size="20" font-weight="700" text-anchor="middle">Layer 1</text><text data-graph-role="node-label" x="504.0" y="461.7" font-size="17" font-weight="400" text-anchor="middle" class="muted">GDN + MoE</text><text data-graph-role="node-label" x="504.0" y="483.0" font-size="17" font-weight="400" text-anchor="middle" class="muted">overlap window</text></g>
<g id="layer2" data-graph-role="node"><rect x="374.0" y="600.0" width="260.0" height="92.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="504.0" y="642.3" font-size="20" font-weight="700" text-anchor="middle">Layer 2</text><text data-graph-role="node-label" x="504.0" y="664.4" font-size="17" font-weight="400" text-anchor="middle" class="muted">adds n-gram vectors</text></g>
<g id="rest" data-graph-role="node"><rect x="374.0" y="728.0" width="260.0" height="60.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="504.0" y="764.6" font-size="19" font-weight="600" text-anchor="middle">Layers 3 … 48</text></g>
<g id="e-ids-tables" data-graph-role="edge"><path d="M 100.0 166.0 L 100.0 232.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-ids-embed" data-graph-role="edge"><path d="M 604.0 166.0 L 604.0 232.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-tables-gather" data-graph-role="edge"><path d="M 176.0 324.0 L 176.0 360.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-gather-copy" data-graph-role="edge"><path d="M 176.0 436.0 L 176.0 472.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-embed-l1" data-graph-role="edge"><path d="M 504.0 308.0 L 504.0 344.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-l1-l2" data-graph-role="edge"><path d="M 504.0 564.0 L 504.0 600.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-l2-rest" data-graph-role="edge"><path d="M 504.0 692.0 L 504.0 728.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-copy-l2" data-graph-role="edge"><path d="M 176.0 564.0 L 176.0 646.0 L 374.0 646.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow)"/></g><text data-graph-role="label" x="190.0" y="636.0" font-size="17" font-weight="400" text-anchor="start" class="muted">rows arrive</text>
<g id="cost" data-graph-role="node"><rect x="46.0" y="812.0" width="588.0" height="72.0" rx="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="8,6"/><text data-graph-role="node-label" x="340.0" y="843.5" font-size="16" font-weight="600" text-anchor="middle">still costs: host memory, link bandwidth, a stall if rows are late</text><text data-graph-role="node-label" x="340.0" y="863.5" font-size="16" font-weight="400" text-anchor="middle" class="muted">lengths are illustrative; the report gives no timings</text></g>
</svg>

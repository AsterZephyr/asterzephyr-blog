<svg xmlns="http://www.w3.org/2000/svg" width="680" height="980" viewBox="0 0 680 980" role="img" aria-labelledby="title desc">
<title id="title">Gated Residual read and write</title><desc id="desc">Four residual branches are normalized separately. A low-rank sigmoid gate computed from all branches gives one gate per branch and channel; the gated branches are averaged into the sublayer input. The sublayer output is written back to every branch with one scalar per branch. The 4 by 4 branch mixing matrix on the identity path is removed, although branches still mix through the read, the sublayer and the write; branches are stored in FP8, and the read and the write are each one fused kernel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/></marker><pattern id="future" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#c9c5bf" stroke-width="4"/></pattern></defs>
<rect width="680" height="980" rx="16" fill="#f8f6f3"/>
<style>text { font-family: Arial, Helvetica, 'PingFang SC', sans-serif; fill: #1a1a1a; } .muted { fill: #5a5a5a; }</style>
<text data-graph-role="title" x="340.0" y="46.0" font-size="21" font-weight="700" text-anchor="middle">ONE SUBLAYER: READ, COMPUTE, WRITE</text>
<g id="branch-1" data-graph-role="node"><rect x="46.0" y="104.0" width="134.0" height="70.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="113.0" y="135.6" font-size="19" font-weight="600" text-anchor="middle">branch R1</text><text data-graph-role="node-label" x="113.0" y="156.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">d values</text></g>
<g id="branch-2" data-graph-role="node"><rect x="197.0" y="104.0" width="134.0" height="70.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="264.0" y="135.6" font-size="19" font-weight="600" text-anchor="middle">branch R2</text><text data-graph-role="node-label" x="264.0" y="156.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">d values</text></g>
<g id="branch-3" data-graph-role="node"><rect x="348.0" y="104.0" width="134.0" height="70.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="415.0" y="135.6" font-size="19" font-weight="600" text-anchor="middle">branch R3</text><text data-graph-role="node-label" x="415.0" y="156.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">d values</text></g>
<g id="branch-4" data-graph-role="node"><rect x="499.0" y="104.0" width="134.0" height="70.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="566.0" y="135.6" font-size="19" font-weight="600" text-anchor="middle">branch R4</text><text data-graph-role="node-label" x="566.0" y="156.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">d values</text></g>
<text data-graph-role="label" x="340.0" y="84.0" font-size="17" font-weight="400" text-anchor="middle" class="muted">4 residual branches, stored in FP8 (half the bytes of BF16)</text>
<g id="norm" data-graph-role="node"><rect x="46.0" y="222.0" width="588.0" height="62.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="340.0" y="259.6" font-size="19" font-weight="600" text-anchor="middle">RMSNorm each branch separately</text></g>
<g id="e-branch-norm-1" data-graph-role="edge"><path d="M 113.0 174.0 L 113.0 222.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-branch-norm-2" data-graph-role="edge"><path d="M 264.0 174.0 L 264.0 222.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-branch-norm-3" data-graph-role="edge"><path d="M 415.0 174.0 L 415.0 222.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-branch-norm-4" data-graph-role="edge"><path d="M 566.0 174.0 L 566.0 222.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<text data-graph-role="label" x="46.0" y="322.0" font-size="19" font-weight="700" text-anchor="start">READ (rich)</text>
<text data-graph-role="label" x="400.0" y="322.0" font-size="19" font-weight="700" text-anchor="start">WRITE (scalar)</text>
<g id="gate" data-graph-role="node"><rect x="46.0" y="340.0" width="310.0" height="104.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="201.0" y="377.3" font-size="19" font-weight="600" text-anchor="middle">gate from all 4 branches</text><text data-graph-role="node-label" x="201.0" y="399.1" font-size="17" font-weight="400" text-anchor="middle" class="muted">low rank d/8, sigmoid</text><text data-graph-role="node-label" x="201.0" y="420.4" font-size="17" font-weight="400" text-anchor="middle" class="muted">one gate per branch × channel</text></g>
<g id="scal" data-graph-role="node"><rect x="400.0" y="340.0" width="234.0" height="104.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="517.0" y="377.3" font-size="19" font-weight="600" text-anchor="middle">write scalars</text><text data-graph-role="node-label" x="517.0" y="399.1" font-size="17" font-weight="400" text-anchor="middle" class="muted">s = 2σ(·), one per branch</text><text data-graph-role="node-label" x="517.0" y="420.4" font-size="17" font-weight="400" text-anchor="middle" class="muted">each in (0, 2)</text></g>
<g id="e-norm-gate" data-graph-role="edge"><path d="M 250.0 284.0 L 250.0 340.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="e-norm-scal" data-graph-role="edge"><path d="M 600.0 284.0 L 600.0 340.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="mix" data-graph-role="node"><rect x="46.0" y="484.0" width="310.0" height="82.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="201.0" y="520.6" font-size="18" font-weight="600" text-anchor="middle">x = mean_i ( G_i × norm(R_i) )</text><text data-graph-role="node-label" x="201.0" y="542.1" font-size="17" font-weight="400" text-anchor="middle" class="muted">elementwise; replaces pre-norm</text></g>
<g id="e-gate-mix" data-graph-role="edge"><path d="M 201.0 444.0 L 201.0 484.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g><text data-graph-role="label" x="214.0" y="470.0" font-size="17" font-weight="400" text-anchor="start" class="muted">G and norm(R)</text>
<g id="sub" data-graph-role="node"><rect x="46.0" y="604.0" width="310.0" height="82.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="201.0" y="640.9" font-size="19" font-weight="600" text-anchor="middle">sublayer F(x)</text><text data-graph-role="node-label" x="201.0" y="662.7" font-size="17" font-weight="400" text-anchor="middle" class="muted">GDN, QSA or MoE</text></g>
<g id="e-mix-sub" data-graph-role="edge"><path d="M 201.0 566.0 L 201.0 604.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<g id="write" data-graph-role="node"><rect x="400.0" y="604.0" width="234.0" height="82.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="517.0" y="640.9" font-size="19" font-weight="600" text-anchor="middle">R_i ← R_i + s_i · y</text><text data-graph-role="node-label" x="517.0" y="662.7" font-size="17" font-weight="400" text-anchor="middle" class="muted">raw branch, all 4</text></g>
<g id="e-sub-write" data-graph-role="edge"><path d="M 356.0 645.0 L 400.0 645.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow)"/></g>
<text data-graph-role="label" x="378.0" y="632.0" font-size="18" font-weight="700" text-anchor="middle">y</text>
<g id="e-scal-write" data-graph-role="edge"><path d="M 517.0 444.0 L 517.0 604.0" fill="none" stroke="#5a5a5a" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow)"/></g>
<g id="hres" data-graph-role="node"><rect x="46.0" y="714.0" width="588.0" height="100.0" rx="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="8,6"/><text data-graph-role="node-label" x="340.0" y="750.6" font-size="19" font-weight="600" text-anchor="middle">removed: branch-mixing matrix H_res (4 × 4)</text><text data-graph-role="node-label" x="340.0" y="771.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">branches still mix through read → F → write</text><text data-graph-role="node-label" x="340.0" y="791.4" font-size="16" font-weight="400" text-anchor="middle" class="muted">one fewer full read of the residual state per block</text></g>
<g id="fused" data-graph-role="node"><rect x="46.0" y="830.0" width="588.0" height="64.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="340.0" y="868.2" font-size="18" font-weight="600" text-anchor="middle">read fused into one kernel, write fused into one kernel</text></g>
<line data-graph-role="decoration" x1="120" y1="936" x2="170" y2="936" stroke="#5a5a5a" stroke-width="2.5"/>
<text data-graph-role="label" x="180.0" y="942.0" font-size="17" font-weight="400" text-anchor="start" class="muted">read path</text>
<line data-graph-role="decoration" x1="360" y1="936" x2="410" y2="936" stroke="#5a5a5a" stroke-width="2.5" stroke-dasharray="7,5"/>
<text data-graph-role="label" x="420.0" y="942.0" font-size="17" font-weight="400" text-anchor="start" class="muted">write path</text>
</svg>

<g id="score" data-graph-role="node"><rect x="46.0" y="404.0" width="382.0" height="100.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text data-graph-role="node-label" x="237.0" y="439.0" font-size="18" font-weight="600" text-anchor="middle">score of block b = Σ over 4 heads</text><text data-graph-role="node-label" x="237.0" y="460.5" font-size="17" font-weight="400" text-anchor="middle" class="muted">of ReLU(query 9 · block key b)</text><text data-graph-role="node-label" x="237.0" y="481.7" font-size="17" font-weight="400" text-anchor="middle" class="muted">keep the top 512 blocks (K = 2048)</text></g>

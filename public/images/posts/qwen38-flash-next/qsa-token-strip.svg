<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1066" viewBox="0 0 680 1066" role="img" aria-labelledby="title desc">
<title id="title">QSA scores compressed blocks and reads original tokens</title><desc id="desc">Query at position 9 with block size 4. Positions 0 to 3 and 4 to 7 are complete blocks; each is average-pooled into one index key and scored. Positions 8 and 9 are the visible tail and are always read. Positions 10 and 11 are in the future. Selected blocks expand back to original tokens, so core attention reads original K and V for positions 0 to 9. At long context only the top 512 of about n/4 complete blocks are kept.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/></marker><pattern id="future" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#c9c5bf" stroke-width="4"/></pattern></defs>
<rect width="680" height="1066" rx="16" fill="#f8f6f3"/>
<style>text { font-family: Arial, Helvetica, 'PingFang SC', sans-serif; fill: #1a1a1a; } .muted { fill: #5a5a5a; }</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow11"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arr11" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RQ-VAE 残差量化的逐层逼近过程</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">如何用多层码本实现指数级容量 — 每层编码上一层的"剩余误差"</text>

  <!-- Original vector -->
  <rect x="40" y="80" width="880" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="105" font-size="12" font-weight="600" fill="#2563eb">原始向量 z_e (Encoder 输出, d 维连续向量)</text>
  <rect x="60" y="115" width="840" height="30" rx="4" fill="#dbeafe"/>
  <text x="480" y="135" text-anchor="middle" font-size="11" fill="#2563eb">[0.23, -0.45, 0.87, 0.12, -0.67, 0.34, 0.91, -0.28, ...] (完整信息)</text>

  <!-- Layer 1 -->
  <rect x="40" y="180" width="880" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow11)"/>
  <text x="60" y="205" font-size="12" font-weight="700" fill="#16a34a">Layer 1: 粗粒度编码</text>
  <text x="60" y="225" font-size="10" fill="#374151">从 K=1024 个码字中找最近的 → k1 = 37</text>
  <text x="60" y="245" font-size="10" fill="#374151">z_q1 = codebook1[37] = [0.20, -0.40, 0.90, 0.10, -0.70, 0.30, 0.85, -0.30, ...]</text>
  <text x="60" y="263" font-size="10" fill="#dc2626">残差 r1 = z_e - z_q1 = [0.03, -0.05, -0.03, 0.02, 0.03, 0.04, 0.06, 0.02, ...]</text>
  <rect x="750" y="195" width="150" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="825" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">k1 = 37</text>
  <text x="825" y="238" text-anchor="middle" font-size="9" fill="#374151">类比: "中国"</text>

  <line x1="480" y1="270" x2="480" y2="288" stroke="#374151" stroke-width="1.5" marker-end="url(#arr11)"/>

  <!-- Layer 2 -->
  <rect x="40" y="290" width="880" height="90" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow11)"/>
  <text x="60" y="315" font-size="12" font-weight="700" fill="#7c3aed">Layer 2: 中粒度编码 (编码 r1 的残差)</text>
  <text x="60" y="335" font-size="10" fill="#374151">从 K=1024 个码字中找 r1 最近的 → k2 = 512</text>
  <text x="60" y="355" font-size="10" fill="#374151">z_q2 = codebook2[512] = [0.03, -0.04, -0.02, 0.02, 0.04, 0.03, 0.05, 0.02, ...]</text>
  <text x="60" y="373" font-size="10" fill="#dc2626">残差 r2 = r1 - z_q2 = [0.00, -0.01, -0.01, 0.00, -0.01, 0.01, 0.01, 0.00, ...] (更小了!)</text>
  <rect x="750" y="305" width="150" height="55" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="825" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">k2 = 512</text>
  <text x="825" y="348" text-anchor="middle" font-size="9" fill="#374151">类比: "北京"</text>

  <line x1="480" y1="380" x2="480" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#arr11)"/>

  <!-- Layer 3 -->
  <rect x="40" y="400" width="880" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow11)"/>
  <text x="60" y="425" font-size="12" font-weight="700" fill="#ea580c">Layer 3: 细粒度编码 (编码 r2 的残差)</text>
  <text x="60" y="445" font-size="10" fill="#374151">从 K=1024 个码字中找 r2 最近的 → k3 = 891</text>
  <text x="60" y="465" font-size="10" fill="#374151">残差 r3 ≈ [0.00, 0.00, 0.00, ...] (几乎为零 → 已高精度逼近)</text>
  <rect x="750" y="415" width="150" height="45" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="825" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">k3 = 891</text>
  <text x="825" y="452" text-anchor="middle" font-size="9" fill="#374151">类比: "海淀区"</text>

  <!-- Final SID -->
  <rect x="200" y="500" width="560" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow11)"/>
  <text x="480" y="528" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Semantic ID = [37, 512, 891]</text>
  <text x="480" y="552" text-anchor="middle" font-size="11" fill="#374151">总容量 = 1024^3 = 1,073,741,824 (十亿级不同 item)</text>
  <text x="480" y="572" text-anchor="middle" font-size="11" fill="#374151">存储 = 仅 3 个整数 (vs 原始 d 维 float 向量)</text>

  <!-- Reconstruction arrow -->
  <line x1="760" y1="510" x2="920" y2="510" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="860" y="530" font-size="9" fill="#dc2626">重建:</text>
  <text x="835" y="545" font-size="9" fill="#dc2626">z_q1 + z_q2 + z_q3 ≈ z_e</text>
</svg>

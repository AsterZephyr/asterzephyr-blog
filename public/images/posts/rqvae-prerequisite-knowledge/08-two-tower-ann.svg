<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow8"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arr8" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">双塔模型与 ANN 向量召回</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">工业级推荐系统召回层的核心架构 — 从千万级候选中毫秒级检索</text>

  <!-- Two Tower Architecture -->
  <rect x="40" y="75" width="500" height="280" rx="8" fill="#f9fafb" stroke="#d1d5db" filter="url(#shadow8)"/>
  <text x="290" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">双塔模型 (Two-Tower / DSSM)</text>

  <!-- User Tower -->
  <rect x="70" y="120" width="180" height="200" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">User Tower</text>
  <rect x="90" y="160" width="140" height="24" rx="3" fill="#dbeafe"/><text x="160" y="177" text-anchor="middle" font-size="9" fill="#2563eb">用户画像特征</text>
  <rect x="90" y="190" width="140" height="24" rx="3" fill="#dbeafe"/><text x="160" y="207" text-anchor="middle" font-size="9" fill="#2563eb">行为序列特征</text>
  <rect x="90" y="220" width="140" height="24" rx="3" fill="#dbeafe"/><text x="160" y="237" text-anchor="middle" font-size="9" fill="#2563eb">上下文特征</text>
  <rect x="90" y="255" width="140" height="24" rx="3" fill="#93c5fd"/><text x="160" y="272" text-anchor="middle" font-size="9" fill="#1e40af">DNN layers</text>
  <rect x="105" y="290" width="110" height="22" rx="11" fill="#2563eb"/><text x="160" y="305" text-anchor="middle" font-size="10" fill="#ffffff">user_emb (d维)</text>

  <!-- Item Tower -->
  <rect x="310" y="120" width="180" height="200" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">Item Tower</text>
  <rect x="330" y="160" width="140" height="24" rx="3" fill="#dcfce7"/><text x="400" y="177" text-anchor="middle" font-size="9" fill="#16a34a">物料 ID 特征</text>
  <rect x="330" y="190" width="140" height="24" rx="3" fill="#dcfce7"/><text x="400" y="207" text-anchor="middle" font-size="9" fill="#16a34a">内容特征 (图/文)</text>
  <rect x="330" y="220" width="140" height="24" rx="3" fill="#dcfce7"/><text x="400" y="237" text-anchor="middle" font-size="9" fill="#16a34a">统计特征</text>
  <rect x="330" y="255" width="140" height="24" rx="3" fill="#86efac"/><text x="400" y="272" text-anchor="middle" font-size="9" fill="#166534">DNN layers</text>
  <rect x="345" y="290" width="110" height="22" rx="11" fill="#16a34a"/><text x="400" y="305" text-anchor="middle" font-size="10" fill="#ffffff">item_emb (d维)</text>

  <!-- Dot product -->
  <text x="270" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">score = dot(user_emb, item_emb)</text>

  <!-- ANN Index -->
  <rect x="560" y="75" width="360" height="280" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow8)"/>
  <text x="740" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">ANN 向量索引</text>
  <text x="580" y="125" font-size="11" fill="#374151">离线：所有 item_emb 建入向量索引</text>
  <text x="580" y="145" font-size="11" fill="#374151">在线：用 user_emb 检索 Top-K 最近邻</text>

  <rect x="580" y="165" width="320" height="40" rx="4" fill="#ffffff" stroke="#d97706"/>
  <text x="740" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">HNSW (Hierarchical Navigable Small World)</text>
  <text x="740" y="200" text-anchor="middle" font-size="9" fill="#374151">分层图结构, 从顶层粗搜到底层精搜</text>

  <rect x="580" y="215" width="320" height="40" rx="4" fill="#ffffff" stroke="#d97706"/>
  <text x="740" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">IVF-PQ (倒排+乘积量化)</text>
  <text x="740" y="250" text-anchor="middle" font-size="9" fill="#374151">先聚类分桶, 桶内用 PQ 压缩存储+距离计算</text>

  <rect x="580" y="265" width="320" height="40" rx="4" fill="#ffffff" stroke="#d97706"/>
  <text x="740" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">ScaNN (Google) / Milvus / Faiss</text>
  <text x="740" y="300" text-anchor="middle" font-size="9" fill="#374151">工业向量检索引擎, 支持百亿级向量</text>

  <text x="580" y="330" font-size="10" fill="#374151">检索速度: ~1ms / query (千万级候选)</text>
  <text x="580" y="348" font-size="10" fill="#374151">召回率: ~95% (vs 精确搜索)</text>

  <!-- Key insight: link to SID -->
  <rect x="40" y="380" width="880" height="180" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">双塔 + ANN 与 Semantic ID 的关系</text>

  <rect x="70" y="425" width="400" height="120" rx="6" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="270" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">传统双塔召回</text>
  <text x="90" y="475" font-size="10" fill="#374151">user_emb → ANN(item_emb_table) → Top-K items</text>
  <text x="90" y="495" font-size="10" fill="#374151">优势：成熟、快速、工业验证</text>
  <text x="90" y="515" font-size="10" fill="#dc2626">局限：item_emb 表需全量存储和更新</text>
  <text x="90" y="535" font-size="10" fill="#dc2626">局限：新 item 必须入库才能被召回</text>

  <rect x="500" y="425" width="400" height="120" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="700" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">生成式召回 (SID)</text>
  <text x="520" y="475" font-size="10" fill="#374151">user_history → Transformer → 生成 SID [k1,k2,k3]</text>
  <text x="520" y="495" font-size="10" fill="#374151">优势：不需要维护 item emb 索引</text>
  <text x="520" y="515" font-size="10" fill="#16a34a">优势：新 item 只要有 SID 就能被生成</text>
  <text x="520" y="535" font-size="10" fill="#dc2626">挑战：生成质量、beam search 效率</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow14"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arr14" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Transformer 在推荐系统中的应用</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">SASRec / BERT4Rec / BST — 用 Self-Attention 建模用户行为序列</text>

  <!-- SASRec -->
  <rect x="40" y="80" width="280" height="200" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow14)"/>
  <text x="180" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">SASRec (2018)</text>
  <text x="180" y="123" text-anchor="middle" font-size="10" fill="#6b7280">Self-Attentive Sequential Rec</text>
  <line x1="55" y1="133" x2="305" y2="133" stroke="#e5e7eb"/>
  <text x="55" y="155" font-size="10" fill="#374151">单向 Transformer (因果 mask)</text>
  <text x="55" y="175" font-size="10" fill="#374151">输入: 用户历史 item 序列</text>
  <text x="55" y="195" font-size="10" fill="#374151">输出: 预测 next item</text>
  <text x="55" y="215" font-size="10" fill="#374151">训练: 交叉熵 (next-item pred)</text>
  <text x="55" y="240" font-size="10" fill="#16a34a">类比 GPT: 自回归预测</text>
  <text x="55" y="260" font-size="10" fill="#7c3aed">与 SID 的关系: 生成式推荐的</text>
  <text x="55" y="275" font-size="10" fill="#7c3aed">Transformer backbone 就是 SASRec</text>

  <!-- BERT4Rec -->
  <rect x="340" y="80" width="280" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow14)"/>
  <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">BERT4Rec (2019)</text>
  <text x="480" y="123" text-anchor="middle" font-size="10" fill="#6b7280">Bidirectional Sequential Rec</text>
  <line x1="355" y1="133" x2="605" y2="133" stroke="#e5e7eb"/>
  <text x="355" y="155" font-size="10" fill="#374151">双向 Transformer (全 attention)</text>
  <text x="355" y="175" font-size="10" fill="#374151">训练: Masked Item Prediction</text>
  <text x="355" y="195" font-size="10" fill="#374151">随机 mask 序列中的 item</text>
  <text x="355" y="215" font-size="10" fill="#374151">预测被 mask 的 item</text>
  <text x="355" y="240" font-size="10" fill="#16a34a">类比 BERT: 完形填空</text>
  <text x="355" y="260" font-size="10" fill="#6b7280">优势: 双向上下文信息更丰富</text>
  <text x="355" y="275" font-size="10" fill="#6b7280">局限: 推理时需要 [MASK] token</text>

  <!-- BST -->
  <rect x="640" y="80" width="280" height="200" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow14)"/>
  <text x="780" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">BST (2019, 阿里)</text>
  <text x="780" y="123" text-anchor="middle" font-size="10" fill="#6b7280">Behavior Sequence Transformer</text>
  <line x1="655" y1="133" x2="905" y2="133" stroke="#e5e7eb"/>
  <text x="655" y="155" font-size="10" fill="#374151">Transformer 嵌入 CTR 模型</text>
  <text x="655" y="175" font-size="10" fill="#374151">输入: 用户行为序列 + 候选 item</text>
  <text x="655" y="195" font-size="10" fill="#374151">Attention 层替代 DIN 的加权</text>
  <text x="655" y="215" font-size="10" fill="#374151">输出: CTR 预测概率</text>
  <text x="655" y="240" font-size="10" fill="#16a34a">工业落地: 淘宝推荐精排</text>
  <text x="655" y="260" font-size="10" fill="#6b7280">与 DIN 对比: Multi-Head 替代</text>
  <text x="655" y="275" font-size="10" fill="#6b7280">单头 Attention, 建模更丰富</text>

  <!-- Comparison flow -->
  <rect x="40" y="300" width="880" height="200" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Transformer 在推荐各阶段的应用</text>

  <rect x="70" y="345" width="240" height="60" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="190" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">召回层</text>
  <text x="190" y="393" text-anchor="middle" font-size="10" fill="#374151">SASRec → 生成式召回 (SID)</text>

  <rect x="360" y="345" width="240" height="60" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="480" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">精排层</text>
  <text x="480" y="393" text-anchor="middle" font-size="10" fill="#374151">BST / HSTU (Meta) → CTR 预估</text>

  <rect x="650" y="345" width="240" height="60" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="770" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">全链路</text>
  <text x="770" y="393" text-anchor="middle" font-size="10" fill="#374151">OneRec (快手) → 端到端统一</text>

  <text x="70" y="435" font-size="11" fill="#374151">关键洞察: Transformer 的 Self-Attention 机制天然适合推荐场景——用户历史行为就是一个"序列"，</text>
  <text x="70" y="455" font-size="11" fill="#374151">不同历史 item 对当前推荐目标的重要性不同。Attention 权重自动学出这种差异化关注。</text>

  <rect x="70" y="470" width="820" height="20" rx="4" fill="#fef2f2"/>
  <text x="80" y="485" font-size="10" font-weight="600" fill="#dc2626">SID 生成式推荐的 Backbone = SASRec 变体 (单向 Transformer + 自回归预测 SID 码字序列)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow3"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arr3" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">从连续空间到离散编码：向量量化的核心机制</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">理解 VQ 的本质：在连续表征和离散符号之间架桥</text>

  <!-- Left: Continuous space -->
  <rect x="40" y="80" width="280" height="200" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="180" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">连续表征空间</text>
  <text x="60" y="130" font-size="11" fill="#374151">输入 x 经过 Encoder 后得到</text>
  <text x="60" y="148" font-size="11" fill="#374151">连续向量 z_e(x) in R^d</text>
  <!-- Scatter dots representing continuous vectors -->
  <circle cx="100" cy="200" r="4" fill="#93c5fd"/>
  <circle cx="130" cy="185" r="4" fill="#93c5fd"/>
  <circle cx="160" cy="210" r="4" fill="#93c5fd"/>
  <circle cx="190" cy="190" r="4" fill="#93c5fd"/>
  <circle cx="220" cy="220" r="4" fill="#93c5fd"/>
  <circle cx="250" cy="195" r="4" fill="#93c5fd"/>
  <circle cx="115" cy="230" r="4" fill="#93c5fd"/>
  <circle cx="175" cy="245" r="4" fill="#93c5fd"/>
  <circle cx="235" cy="240" r="4" fill="#93c5fd"/>
  <circle cx="145" cy="260" r="4" fill="#93c5fd"/>
  <text x="60" y="270" font-size="10" fill="#6b7280">每个点是一个 item 的连续表征</text>

  <!-- Middle: Quantization -->
  <rect x="360" y="80" width="240" height="200" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">量化操作 (VQ)</text>
  <text x="380" y="130" font-size="11" fill="#374151">z_q = argmin ||z_e - e_k||</text>
  <text x="380" y="148" font-size="11" fill="#374151">找到最近的码字 e_k</text>
  <!-- Codebook vectors (larger, distinct colors) -->
  <circle cx="420" cy="195" r="10" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <circle cx="480" cy="210" r="10" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="540" cy="185" r="10" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
  <circle cx="450" cy="245" r="10" fill="#ea580c" stroke="#fff" stroke-width="2"/>
  <circle cx="510" cy="250" r="10" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <text x="380" y="270" font-size="10" fill="#6b7280">大圆 = 码字 (codebook vectors)</text>
  <!-- Assignment arrows -->
  <line x1="320" y1="200" x2="358" y2="200" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Right: Discrete codes -->
  <rect x="640" y="80" width="280" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="780" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">离散编码 (Semantic ID)</text>
  <text x="660" y="130" font-size="11" fill="#374151">每个 item → 一个整数索引 k</text>
  <text x="660" y="148" font-size="11" fill="#374151">多层 RQ → [k1, k2, ..., kL]</text>
  <rect x="670" y="170" width="60" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="700" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">3</text>
  <rect x="740" y="170" width="60" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="770" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">7</text>
  <rect x="810" y="170" width="60" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="840" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">2</text>
  <text x="660" y="225" font-size="10" fill="#374151">Item A 的 SID = [3, 7, 2]</text>
  <text x="660" y="245" font-size="10" fill="#374151">可以用自回归模型逐层生成</text>
  <text x="660" y="265" font-size="10" fill="#6b7280">离散 → 有限词表 → Scaling Law</text>
  <!-- Arrow -->
  <line x1="600" y1="200" x2="638" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Bottom: Training flow -->
  <rect x="40" y="310" width="880" height="245" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="480" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">VQ-VAE 训练流程</text>

  <!-- Encoder -->
  <rect x="70" y="365" width="120" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="395" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Encoder</text>
  <text x="130" y="412" text-anchor="middle" font-size="10" fill="#374151">x → z_e</text>

  <line x1="190" y1="395" x2="228" y2="395" stroke="#374151" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Quantize -->
  <rect x="230" y="365" width="150" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="305" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Quantize</text>
  <text x="305" y="410" text-anchor="middle" font-size="10" fill="#374151">z_e → z_q (最近码字)</text>

  <line x1="380" y1="395" x2="418" y2="395" stroke="#374151" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Decoder -->
  <rect x="420" y="365" width="120" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="395" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">Decoder</text>
  <text x="480" y="412" text-anchor="middle" font-size="10" fill="#374151">z_q → x_hat</text>

  <line x1="540" y1="395" x2="578" y2="395" stroke="#374151" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Loss -->
  <rect x="580" y="365" width="160" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="660" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Loss 计算</text>
  <text x="660" y="410" text-anchor="middle" font-size="10" fill="#374151">重建 + commit + VQ</text>

  <!-- Gradient problem -->
  <rect x="70" y="450" width="840" height="90" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="90" y="475" font-size="11" font-weight="700" fill="#92400e">核心难点：argmin 不可微</text>
  <text x="90" y="498" font-size="11" fill="#374151">量化操作 z_q = e_k (k = argmin ||z_e - e_i||) 是离散选择，梯度为零。</text>
  <text x="90" y="518" font-size="11" fill="#374151">解决方案：Straight-Through Estimator (STE) — 前向用 z_q，反向假装 z_q = z_e，让梯度"穿过"量化层直达 Encoder。</text>
  <text x="90" y="538" font-size="11" fill="#6b7280">这是整个 VQ-VAE 体系的数学基石。没有 STE，离散码本无法用梯度下降训练。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow9"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arr9" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">对比学习 (Contrastive Learning) 核心机制</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">无需标注数据的表征学习 — SimCLR / MoCo / CLIP / InfoNCE</text>

  <!-- Core idea -->
  <rect x="40" y="75" width="880" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow9)"/>
  <text x="480" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">核心思想：拉近正样本对，推远负样本对</text>

  <!-- Positive pair -->
  <circle cx="200" cy="170" r="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="175" text-anchor="middle" font-size="10" fill="#16a34a">x_i</text>
  <circle cx="320" cy="170" r="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="175" text-anchor="middle" font-size="10" fill="#16a34a">x_i+</text>
  <line x1="225" y1="170" x2="295" y2="170" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="260" y="160" text-anchor="middle" font-size="9" fill="#16a34a">拉近</text>
  <text x="260" y="215" text-anchor="middle" font-size="10" fill="#374151">正样本对 (同一 item 的不同增强)</text>

  <!-- Negative pairs -->
  <circle cx="550" cy="140" r="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="550" y="145" text-anchor="middle" font-size="9" fill="#dc2626">x_j</text>
  <circle cx="620" cy="180" r="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="185" text-anchor="middle" font-size="9" fill="#dc2626">x_k</text>
  <circle cx="700" cy="150" r="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="155" text-anchor="middle" font-size="9" fill="#dc2626">x_m</text>
  <circle cx="780" cy="190" r="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="780" y="195" text-anchor="middle" font-size="9" fill="#dc2626">x_n</text>
  <text x="660" y="230" text-anchor="middle" font-size="10" fill="#374151">负样本 (batch 内其他 item)</text>

  <!-- Arrow push away -->
  <line x1="345" y1="165" x2="525" y2="145" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr9)"/>
  <text x="430" y="140" font-size="9" fill="#dc2626">推远</text>

  <!-- InfoNCE Loss -->
  <rect x="40" y="275" width="450" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">InfoNCE Loss</text>
  <text x="60" y="330" font-size="12" fill="#111827">L = -log( exp(sim(z_i, z_i+)/tau) )</text>
  <text x="60" y="350" font-size="12" fill="#111827">        / sum_j( exp(sim(z_i, z_j)/tau) )</text>
  <text x="60" y="378" font-size="10" fill="#374151">sim = cosine similarity, tau = 温度参数</text>
  <text x="60" y="395" font-size="10" fill="#6b7280">本质是 softmax 交叉熵：正样本是"正确答案"</text>

  <!-- Applications in RecSys -->
  <rect x="510" y="275" width="410" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="715" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">在推荐系统中的应用</text>
  <text x="530" y="325" font-size="10" fill="#374151">1. 双塔训练损失 = InfoNCE (in-batch negatives)</text>
  <text x="530" y="345" font-size="10" fill="#374151">2. SID Encoder 预训练 = 对比学习 item 表征</text>
  <text x="530" y="365" font-size="10" fill="#374151">3. 多模态对齐 (CLIP): 图文 emb 拉近同 item</text>
  <text x="530" y="385" font-size="10" fill="#374151">4. 序列增强: dropout/mask 同序列不同 view</text>

  <!-- Connection to VQ-VAE -->
  <rect x="40" y="415" width="880" height="85" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">与 RQ-VAE Semantic ID 的连接</text>
  <text x="60" y="465" font-size="11" fill="#374151">RQ-VAE 的 Encoder 输入通常是多模态 Embedding (图像 CNN 特征 + 文本 BERT 特征)。</text>
  <text x="60" y="485" font-size="11" fill="#374151">这些多模态 Embedding 的质量直接决定 SID 的语义结构。对比学习是训练这些 Encoder 的主流方法。</text>
</svg>

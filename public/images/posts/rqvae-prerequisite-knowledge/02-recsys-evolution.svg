<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow2"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arr2" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">搜广推系统演进：从规则到生成式推荐</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">每个时代的核心矛盾决定了下一代技术的方向</text>

  <!-- Era 1 -->
  <rect x="40" y="75" width="200" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="140" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">规则时代</text>
  <text x="140" y="118" text-anchor="middle" font-size="11" fill="#6b7280">2000-2010</text>
  <line x1="60" y1="128" x2="220" y2="128" stroke="#e5e7eb" stroke-width="1"/>
  <text x="55" y="148" font-size="10" fill="#374151">人工规则匹配</text>
  <text x="55" y="166" font-size="10" fill="#374151">基于标签的召回</text>
  <text x="55" y="184" font-size="10" fill="#374151">简单 CF 协同过滤</text>
  <text x="55" y="208" font-size="10" font-weight="600" fill="#dc2626">瓶颈：人工规则</text>
  <text x="55" y="224" font-size="10" font-weight="600" fill="#dc2626">无法覆盖长尾</text>
  <text x="55" y="244" font-size="10" fill="#16a34a">ID: 无 / 业务标签</text>

  <!-- Arrow -->
  <line x1="240" y1="165" x2="268" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Era 2 -->
  <rect x="270" y="75" width="200" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="370" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">特征工程时代</text>
  <text x="370" y="118" text-anchor="middle" font-size="11" fill="#6b7280">2010-2016</text>
  <line x1="290" y1="128" x2="450" y2="128" stroke="#e5e7eb" stroke-width="1"/>
  <text x="285" y="148" font-size="10" fill="#374151">LR / GBDT / FM</text>
  <text x="285" y="166" font-size="10" fill="#374151">CTR 预估模型</text>
  <text x="285" y="184" font-size="10" fill="#374151">人工特征 + 交叉</text>
  <text x="285" y="208" font-size="10" font-weight="600" fill="#dc2626">瓶颈：人工特征</text>
  <text x="285" y="224" font-size="10" font-weight="600" fill="#dc2626">组合爆炸</text>
  <text x="285" y="244" font-size="10" fill="#16a34a">ID: One-Hot Hash</text>

  <!-- Arrow -->
  <line x1="470" y1="165" x2="498" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Era 3 -->
  <rect x="500" y="75" width="200" height="180" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="600" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">深度学习时代</text>
  <text x="600" y="118" text-anchor="middle" font-size="11" fill="#6b7280">2016-2023</text>
  <line x1="520" y1="128" x2="680" y2="128" stroke="#e5e7eb" stroke-width="1"/>
  <text x="515" y="148" font-size="10" fill="#374151">DNN / DeepFM / DIN</text>
  <text x="515" y="166" font-size="10" fill="#374151">Embedding + MLP</text>
  <text x="515" y="184" font-size="10" fill="#374151">多阶段 pipeline</text>
  <text x="515" y="208" font-size="10" font-weight="600" fill="#dc2626">瓶颈：pipeline 割裂</text>
  <text x="515" y="224" font-size="10" font-weight="600" fill="#dc2626">ID 无泛化能力</text>
  <text x="515" y="244" font-size="10" fill="#16a34a">ID: Embedding Table</text>

  <!-- Arrow -->
  <line x1="700" y1="165" x2="728" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Era 4 -->
  <rect x="730" y="75" width="200" height="180" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="830" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">生成式推荐时代</text>
  <text x="830" y="118" text-anchor="middle" font-size="11" fill="#6b7280">2023-Now</text>
  <line x1="750" y1="128" x2="910" y2="128" stroke="#e5e7eb" stroke-width="1"/>
  <text x="745" y="148" font-size="10" fill="#374151">Semantic ID + 自回归</text>
  <text x="745" y="166" font-size="10" fill="#374151">端到端生成 item</text>
  <text x="745" y="184" font-size="10" fill="#374151">有限词表 → Scaling Law</text>
  <text x="745" y="208" font-size="10" font-weight="600" fill="#dc2626">瓶颈：稳定性</text>
  <text x="745" y="224" font-size="10" font-weight="600" fill="#dc2626">广告场景受限</text>
  <text x="745" y="244" font-size="10" fill="#16a34a">ID: Semantic ID (RQ-VAE)</text>

  <!-- Bottom: Pipeline detail -->
  <rect x="40" y="285" width="890" height="250" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="485" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">现代推荐/广告系统 Pipeline 详解</text>

  <!-- Pipeline stages -->
  <rect x="70" y="330" width="140" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="140" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">召回 (Recall)</text>
  <text x="85" y="375" font-size="9" fill="#374151">千万 → 几百</text>
  <text x="85" y="392" font-size="9" fill="#374151">双塔/图/倒排索引</text>

  <line x1="210" y1="370" x2="238" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="240" y="330" width="140" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="310" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">粗排 (Pre-rank)</text>
  <text x="255" y="375" font-size="9" fill="#374151">几百 → 几十</text>
  <text x="255" y="392" font-size="9" fill="#374151">轻量模型/蒸馏</text>

  <line x1="380" y1="370" x2="408" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="410" y="330" width="140" height="80" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="480" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">精排 (Rank)</text>
  <text x="425" y="375" font-size="9" fill="#374151">几十 → 排序</text>
  <text x="425" y="392" font-size="9" fill="#374151">CTR/CVR 精细打分</text>

  <line x1="550" y1="370" x2="578" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="580" y="330" width="140" height="80" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="650" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#ea580c">重排 (Rerank)</text>
  <text x="595" y="375" font-size="9" fill="#374151">最终展示排列</text>
  <text x="595" y="392" font-size="9" fill="#374151">多样性/频控/广告</text>

  <line x1="720" y1="370" x2="748" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="750" y="330" width="140" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="820" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">竞价 (Auction)</text>
  <text x="765" y="375" font-size="9" fill="#374151">eCPM 排序出价</text>
  <text x="765" y="392" font-size="9" fill="#374151">pCTR*pCVR*Bid</text>

  <!-- Key metrics -->
  <text x="80" y="445" font-size="11" font-weight="600" fill="#374151">核心指标：</text>
  <rect x="160" y="432" width="80" height="22" rx="4" fill="#dbeafe"/><text x="200" y="447" text-anchor="middle" font-size="10" fill="#2563eb">召回率</text>
  <rect x="250" y="432" width="80" height="22" rx="4" fill="#dcfce7"/><text x="290" y="447" text-anchor="middle" font-size="10" fill="#16a34a">NDCG</text>
  <rect x="340" y="432" width="80" height="22" rx="4" fill="#f3e8ff"/><text x="380" y="447" text-anchor="middle" font-size="10" fill="#7c3aed">AUC/GAUC</text>
  <rect x="430" y="432" width="80" height="22" rx="4" fill="#ffedd5"/><text x="470" y="447" text-anchor="middle" font-size="10" fill="#ea580c">GMV/RPM</text>
  <rect x="520" y="432" width="80" height="22" rx="4" fill="#fef2f2"/><text x="560" y="447" text-anchor="middle" font-size="10" fill="#dc2626">eCPM</text>

  <!-- SID transformation note -->
  <rect x="70" y="468" width="850" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="90" y="490" font-size="11" font-weight="700" fill="#92400e">生成式推荐的颠覆点</text>
  <text x="90" y="510" font-size="11" fill="#374151">传统 pipeline：每一级独立优化，召回阶段丢掉的 item 后面再也捡不回来。SID + 自回归 = 一个模型直接生成最终 item，跳过整个 pipeline。</text>
</svg>

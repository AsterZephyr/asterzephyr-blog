<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c4956a"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 14px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 12px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .arrow-label { font-size: 11px; font-weight: 500; fill: #5a5a58; }
  </style>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">推理服务架构选型</text>

  <!-- Load Balancer -->
  <rect x="380" y="60" width="200" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="480" y="90" text-anchor="middle" class="node-title">Load Balancer</text>

  <!-- Scorer Pods -->
  <rect x="120" y="160" width="160" height="50" rx="8" fill="#ffffff" stroke="#ded8cf" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="200" y="190" text-anchor="middle" class="node-title">Scorer Pod 1</text>

  <rect x="400" y="160" width="160" height="50" rx="8" fill="#ffffff" stroke="#ded8cf" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480" y="190" text-anchor="middle" class="node-title">Scorer Pod 2</text>

  <rect x="680" y="160" width="160" height="50" rx="8" fill="#ffffff" stroke="#ded8cf" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="760" y="190" text-anchor="middle" class="node-title">Scorer Pod 3</text>

  <!-- KV Cache Store -->
  <rect x="340" y="260" width="280" height="56" rx="8" fill="#fdf6e3" stroke="#c4956a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="480" y="285" text-anchor="middle" class="node-title">KV Cache Store</text>
  <text x="480" y="303" text-anchor="middle" class="node-sub">缓存层</text>

  <!-- Three options -->
  <rect x="60" y="370" width="250" height="70" rx="8" fill="#ffffff" stroke="#ded8cf" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="185" y="395" text-anchor="middle" class="node-title">方案 A: GPU 本地缓存</text>
  <text x="185" y="415" text-anchor="middle" class="node-sub">延迟 &lt;1ms | 命中率低 | 占 GPU 显存</text>
  <text x="185" y="430" text-anchor="middle" class="node-sub">适合: 小规模、固定路由</text>

  <rect x="355" y="370" width="250" height="70" rx="8" fill="#ffffff" stroke="#ded8cf" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="480" y="395" text-anchor="middle" class="node-title">方案 B: Redis 集群</text>
  <text x="480" y="415" text-anchor="middle" class="node-sub">延迟 2-5ms | 命中率高 | 独立集群</text>
  <text x="480" y="430" text-anchor="middle" class="node-sub">适合: 大规模、无状态服务</text>

  <rect x="650" y="370" width="250" height="70" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="775" y="395" text-anchor="middle" class="node-title">方案 C: 两级混合</text>
  <text x="775" y="415" text-anchor="middle" class="node-sub">Hot &lt;1ms / Cold 3ms | 最高命中率</text>
  <text x="775" y="430" text-anchor="middle" class="node-sub">生产首选</text>

  <!-- Arrows: LB to Pods -->
  <line x1="420" y1="110" x2="250" y2="160" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
  <line x1="480" y1="110" x2="480" y2="160" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
  <line x1="540" y1="110" x2="710" y2="160" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>

  <!-- Arrows: Pods to Cache -->
  <line x1="200" y1="210" x2="380" y2="265" stroke="#c4956a" stroke-width="1.5" marker-end="url(#arrowData)"/>
  <line x1="480" y1="210" x2="480" y2="260" stroke="#c4956a" stroke-width="1.5" marker-end="url(#arrowData)"/>
  <line x1="760" y1="210" x2="580" y2="265" stroke="#c4956a" stroke-width="1.5" marker-end="url(#arrowData)"/>

  <!-- Arrows: Cache to options -->
  <line x1="380" y1="316" x2="230" y2="370" stroke="#8a8a87" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowControl)"/>
  <line x1="480" y1="316" x2="480" y2="370" stroke="#8a8a87" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowControl)"/>
  <line x1="580" y1="316" x2="730" y2="370" stroke="#8a8a87" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowControl)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b9e8a"/>
    </marker>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .subtitle { font-size: 13px; fill: #5a5a58; }
    .node-title { font-size: 14px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 11px; fill: #5a5a58; }
    .section-label { font-size: 12px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; text-transform: uppercase; }
    .arrow-label { font-size: 11px; font-weight: 500; fill: #5a5a58; }
  </style>

  <!-- Background -->
  <rect width="960" height="520" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">Cross-Request KV Cache 对比</text>

  <!-- Left container: No Cache -->
  <rect x="40" y="60" width="400" height="420" rx="10" fill="none" stroke="#ded8cf" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="240" y="88" text-anchor="middle" class="section-label">无 Cache：C 次完整计算</text>

  <!-- Request blocks (no cache) -->
  <rect x="80" y="110" width="320" height="56" rx="8" fill="#fff5f5" stroke="#e8a09a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="135" text-anchor="middle" class="node-title">Request 1</text>
  <text x="240" y="153" text-anchor="middle" class="node-sub">User(1500 tokens) + Ad₁(16 tokens)</text>

  <rect x="80" y="185" width="320" height="56" rx="8" fill="#fff5f5" stroke="#e8a09a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="210" text-anchor="middle" class="node-title">Request 2</text>
  <text x="240" y="228" text-anchor="middle" class="node-sub">User(1500 tokens) + Ad₂(16 tokens)</text>

  <rect x="80" y="260" width="320" height="56" rx="8" fill="#fff5f5" stroke="#e8a09a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="285" text-anchor="middle" class="node-title">Request 3</text>
  <text x="240" y="303" text-anchor="middle" class="node-sub">User(1500 tokens) + Ad₃(16 tokens)</text>

  <text x="240" y="345" text-anchor="middle" class="node-sub">...</text>

  <rect x="80" y="365" width="320" height="56" rx="8" fill="#fff5f5" stroke="#e8a09a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="240" y="390" text-anchor="middle" class="node-title">Request C</text>
  <text x="240" y="408" text-anchor="middle" class="node-sub">User(1500 tokens) + Adₓ(16 tokens)</text>

  <!-- Cost annotation left -->
  <text x="240" y="456" text-anchor="middle" class="node-sub">总计算量: C × 1516 tokens</text>

  <!-- Right container: With Cache -->
  <rect x="520" y="60" width="400" height="420" rx="10" fill="none" stroke="#6b9e8a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="720" y="88" text-anchor="middle" class="section-label">有 Cache：1 + C 计算</text>

  <!-- User KV Cache (computed once) -->
  <rect x="580" y="120" width="280" height="64" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="720" y="148" text-anchor="middle" class="node-title">User KV Cache</text>
  <text x="720" y="168" text-anchor="middle" class="node-sub">1500 tokens — 只算 1 次，复用 C 次</text>

  <!-- Ad blocks (append only) -->
  <rect x="590" y="220" width="120" height="44" rx="6" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="650" y="247" text-anchor="middle" class="node-title">Ad₁ (16)</text>

  <rect x="730" y="220" width="120" height="44" rx="6" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="790" y="247" text-anchor="middle" class="node-title">Ad₂ (16)</text>

  <rect x="590" y="284" width="120" height="44" rx="6" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="650" y="311" text-anchor="middle" class="node-title">Ad₃ (16)</text>

  <rect x="730" y="284" width="120" height="44" rx="6" fill="#fdf6e3" stroke="#c4956a" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="790" y="311" text-anchor="middle" class="node-title">Adₓ (16)</text>

  <!-- Arrows from cache to ads -->
  <line x1="660" y1="184" x2="650" y2="220" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
  <line x1="740" y1="184" x2="790" y2="220" stroke="#6b9e8a" stroke-width="1.5" marker-end="url(#arrowControl)"/>
  <line x1="660" y1="184" x2="650" y2="284" stroke="#6b9e8a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowControl)"/>
  <line x1="740" y1="184" x2="790" y2="284" stroke="#6b9e8a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowControl)"/>

  <!-- Cost annotation right -->
  <text x="720" y="370" text-anchor="middle" class="node-sub">总计算量: 1500 + C × 16 tokens</text>

  <!-- Savings callout -->
  <rect x="600" y="400" width="240" height="50" rx="8" fill="#e8eeeb" stroke="#6b9e8a" stroke-width="2"/>
  <text x="720" y="422" text-anchor="middle" class="node-title">节省比例</text>
  <text x="720" y="440" text-anchor="middle" class="node-sub">C=50 时计算量降低 97%</text>
</svg>

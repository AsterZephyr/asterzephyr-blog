<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #141413; }
    .node-title { font-size: 12px; font-weight: 600; fill: #141413; }
    .node-sub { font-size: 10px; fill: #5a5a58; }
    .section-label { font-size: 11px; font-weight: 600; fill: #8a8a87; letter-spacing: 0.05em; }
    .axis-label { font-size: 12px; font-weight: 600; fill: #5a5a58; }
    .quadrant { font-size: 14px; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">产品防御性矩阵</text>

  <!-- Axes -->
  <!-- X axis: 网络效应 -->
  <line x1="120" y1="380" x2="900" y2="380" stroke="#8a8a87" stroke-width="2"/>
  <text x="510" y="415" text-anchor="middle" class="axis-label">网络效应 / 数据壁垒 →</text>
  <text x="140" y="400" class="node-sub">弱</text>
  <text x="880" y="400" class="node-sub">强</text>

  <!-- Y axis: 离模型远 -->
  <line x1="120" y1="60" x2="120" y2="380" stroke="#8a8a87" stroke-width="2"/>
  <text x="50" y="220" text-anchor="middle" class="axis-label" transform="rotate(-90 50 220)">离模型原生能力的距离 →</text>
  <text x="135" y="375" class="node-sub">近</text>
  <text x="135" y="75" class="node-sub">远</text>

  <!-- Q1: 近 + 弱 = 死亡区 -->
  <rect x="130" y="230" width="370" height="140" rx="0" fill="#fff5f5" opacity="0.5"/>
  <text x="315" y="260" text-anchor="middle" class="quadrant" style="fill:#c92a2a">死亡区</text>
  <text x="315" y="280" text-anchor="middle" class="node-sub">离模型近 + 无网络效应 = 随时被吃</text>

  <!-- Products in Q1 -->
  <rect x="170" y="295" width="130" height="36" rx="6" fill="#ffffff" stroke="#c92a2a" stroke-width="1" filter="url(#shadowSoft)"/>
  <text x="235" y="312" text-anchor="middle" class="node-title">RAG 工具</text>
  <text x="235" y="326" text-anchor="middle" class="node-sub">已被 2M context 替代</text>

  <rect x="320" y="295" width="150" height="36" rx="6" fill="#ffffff" stroke="#c92a2a" stroke-width="1" filter="url(#shadowSoft)"/>
  <text x="395" y="312" text-anchor="middle" class="node-title">浏览器 AI 插件</text>
  <text x="395" y="326" text-anchor="middle" class="node-sub">context 中间层</text>

  <rect x="200" y="340" width="130" height="26" rx="6" fill="#ffffff" stroke="#c92a2a" stroke-width="1"/>
  <text x="265" y="357" text-anchor="middle" class="node-sub">Prompt 模板市场</text>

  <!-- Q2: 近 + 强 = 竞争区 -->
  <rect x="510" y="230" width="370" height="140" rx="0" fill="#fdf6e3" opacity="0.4"/>
  <text x="695" y="260" text-anchor="middle" class="quadrant" style="fill:#c4956a">竞争区</text>
  <text x="695" y="280" text-anchor="middle" class="node-sub">离模型近 + 有网络效应 = 可守但需快跑</text>

  <rect x="560" y="295" width="130" height="36" rx="6" fill="#ffffff" stroke="#c4956a" stroke-width="1" filter="url(#shadowSoft)"/>
  <text x="625" y="312" text-anchor="middle" class="node-title">Cursor</text>
  <text x="625" y="326" text-anchor="middle" class="node-sub">IDE 生态 + 企业版</text>

  <rect x="710" y="295" width="140" height="36" rx="6" fill="#ffffff" stroke="#c4956a" stroke-width="1" filter="url(#shadowSoft)"/>
  <text x="780" y="312" text-anchor="middle" class="node-title">AI 设计平台</text>
  <text x="780" y="326" text-anchor="middle" class="node-sub">协作 + 品牌资产</text>

  <!-- Q3: 远 + 弱 = 利基区 -->
  <rect x="130" y="70" width="370" height="150" rx="0" fill="#e0f7fa" opacity="0.3"/>
  <text x="315" y="100" text-anchor="middle" class="quadrant" style="fill:#0c8599">利基区</text>
  <text x="315" y="120" text-anchor="middle" class="node-sub">离模型远 + 无网络效应 = 有壁垒但难规模化</text>

  <rect x="170" y="140" width="150" height="36" rx="6" fill="#ffffff" stroke="#0c8599" stroke-width="1" filter="url(#shadowSoft)"/>
  <text x="245" y="157" text-anchor="middle" class="node-title">垂直 SaaS</text>
  <text x="245" y="171" text-anchor="middle" class="node-sub">深度行业 know-how</text>

  <rect x="340" y="140" width="130" height="36" rx="6" fill="#ffffff" stroke="#0c8599" stroke-width="1" filter="url(#shadowSoft)"/>
  <text x="405" y="157" text-anchor="middle" class="node-title">合规审计工具</text>
  <text x="405" y="171" text-anchor="middle" class="node-sub">行业认证壁垒</text>

  <!-- Q4: 远 + 强 = 安全区 -->
  <rect x="510" y="70" width="370" height="150" rx="0" fill="#e8eeeb" opacity="0.5"/>
  <text x="695" y="100" text-anchor="middle" class="quadrant" style="fill:#2f6b55">安全区</text>
  <text x="695" y="120" text-anchor="middle" class="node-sub">离模型远 + 有网络效应 = 最强防御</text>

  <rect x="560" y="140" width="140" height="36" rx="6" fill="#ffffff" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="630" y="157" text-anchor="middle" class="node-title">企业协作平台</text>
  <text x="630" y="171" text-anchor="middle" class="node-sub">关系网络 + 数据飞轮</text>

  <rect x="720" y="140" width="130" height="36" rx="6" fill="#ffffff" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="785" y="157" text-anchor="middle" class="node-title">行业 Marketplace</text>
  <text x="785" y="171" text-anchor="middle" class="node-sub">双边网络效应</text>

  <rect x="620" y="185" width="170" height="36" rx="6" fill="#ffffff" stroke="#6b9e8a" stroke-width="2" filter="url(#shadowSoft)"/>
  <text x="705" y="202" text-anchor="middle" class="node-title">数据资产平台</text>
  <text x="705" y="216" text-anchor="middle" class="node-sub">独占数据 + 合规壁垒</text>
</svg>

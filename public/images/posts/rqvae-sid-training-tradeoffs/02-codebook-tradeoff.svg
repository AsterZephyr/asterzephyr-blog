<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">码本维度 vs 利用率：核心权衡的可视化</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#6b7280">维度越小 → 利用率越高，但每个码字的表达力越弱</text>

  <!-- Left chart: Dimension vs Utilization curve -->
  <rect x="40" y="80" width="420" height="380" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="250" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">码本维度 → 利用率关系</text>

  <!-- Axes -->
  <line x1="90" y1="400" x2="420" y2="400" stroke="#374151" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="90" y2="140" stroke="#374151" stroke-width="1.5"/>
  <text x="250" y="435" text-anchor="middle" font-size="11" fill="#374151">码本向量维度 (d)</text>
  <text x="55" y="270" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90,55,270)">码本利用率 (%)</text>

  <!-- Y axis labels -->
  <text x="82" y="404" text-anchor="end" font-size="10" fill="#6b7280">0</text>
  <text x="82" y="335" text-anchor="end" font-size="10" fill="#6b7280">25</text>
  <text x="82" y="270" text-anchor="end" font-size="10" fill="#6b7280">50</text>
  <text x="82" y="205" text-anchor="end" font-size="10" fill="#6b7280">75</text>
  <text x="82" y="148" text-anchor="end" font-size="10" fill="#6b7280">100</text>

  <!-- X axis labels -->
  <text x="130" y="418" text-anchor="middle" font-size="10" fill="#6b7280">4</text>
  <text x="200" y="418" text-anchor="middle" font-size="10" fill="#6b7280">16</text>
  <text x="270" y="418" text-anchor="middle" font-size="10" fill="#6b7280">32</text>
  <text x="340" y="418" text-anchor="middle" font-size="10" fill="#6b7280">64</text>
  <text x="400" y="418" text-anchor="middle" font-size="10" fill="#6b7280">128</text>

  <!-- Grid lines -->
  <line x1="90" y1="335" x2="420" y2="335" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="270" x2="420" y2="270" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="205" x2="420" y2="205" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Utilization curve (high at low dim, drops at high dim) -->
  <path d="M130,155 C160,160 180,180 200,220 C220,260 250,300 270,330 C300,360 340,375 400,385" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="130" cy="155" r="4" fill="#2563eb"/>
  <circle cx="200" cy="220" r="4" fill="#2563eb"/>
  <circle cx="270" cy="330" r="4" fill="#2563eb"/>
  <circle cx="400" cy="385" r="4" fill="#2563eb"/>

  <!-- Reconstruction quality curve (low at low dim, high at high dim) -->
  <path d="M130,370 C160,360 180,340 200,300 C220,260 250,220 270,195 C300,175 340,165 400,158" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="130" cy="370" r="4" fill="#16a34a"/>
  <circle cx="200" cy="300" r="4" fill="#16a34a"/>
  <circle cx="270" cy="195" r="4" fill="#16a34a"/>
  <circle cx="400" cy="158" r="4" fill="#16a34a"/>

  <!-- Legend -->
  <line x1="120" y1="448" x2="150" y2="448" stroke="#2563eb" stroke-width="2.5"/>
  <text x="158" y="452" font-size="11" fill="#374151">码本利用率</text>
  <line x1="260" y1="448" x2="290" y2="448" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="298" y="452" font-size="11" fill="#374151">重建质量</text>

  <!-- Sweet spot annotation -->
  <rect x="185" y="230" width="70" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="220" y="245" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Sweet Spot</text>
  <line x1="220" y1="252" x2="220" y2="270" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Right panel: Tradeoff mechanisms -->
  <rect x="500" y="80" width="420" height="380" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="710" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">为什么维度小 = 利用率高？</text>

  <!-- Mechanism 1 -->
  <rect x="530" y="130" width="360" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="545" y="152" font-size="11" font-weight="600" fill="#2563eb">机制1：距离计算的维度诅咒</text>
  <text x="545" y="172" font-size="10" fill="#374151">维度高 → 所有点间距离趋同 → 难以区分最近邻</text>
  <text x="545" y="190" font-size="10" fill="#374151">→ 少数码字垄断分配 → 多数码字饿死</text>

  <!-- Mechanism 2 -->
  <rect x="530" y="215" width="360" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="545" y="237" font-size="11" font-weight="600" fill="#16a34a">机制2：梯度传播的稀释效应</text>
  <text x="545" y="257" font-size="10" fill="#374151">维度高 → 每个分量梯度贡献小 → 更新慢</text>
  <text x="545" y="275" font-size="10" fill="#374151">→ 初期随机优势固化 → 利用率锁死</text>

  <!-- Mechanism 3 -->
  <rect x="530" y="300" width="360" height="70" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="545" y="322" font-size="11" font-weight="600" fill="#7c3aed">机制3：信息瓶颈的被动效果</text>
  <text x="545" y="342" font-size="10" fill="#374151">维度小 → 每个码字只能编码少量信息</text>
  <text x="545" y="360" font-size="10" fill="#374151">→ 必须动用更多码字 → 利用率被迫提高</text>

  <!-- Warning box -->
  <rect x="530" y="385" width="360" height="55" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="545" y="407" font-size="11" font-weight="600" fill="#dc2626">陷阱：高利用率 ≠ 好的编码质量</text>
  <text x="545" y="427" font-size="10" fill="#374151">利用率 100% 但每个码字表达力不够 → 碰撞率飙升</text>
  <text x="545" y="445" font-size="10" fill="#374151" font-style="italic">必须同时监控：利用率 + 碰撞率 + 重建误差</text>
</svg>
<text x="167" y="498" font-size="23" fill="#292824" font-weight="600" text-anchor="start">Test outside the search loop</text>
<text x="124" y="534" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">Use evidence the optimizer could not adapt to.</text>
</g>
<text x="50" y="502" font-size="18" fill="#aa6047" font-weight="600" text-anchor="start">03</text>
<g id="s3" data-graph-role="node" data-node-id="s3" data-graph-bounds="100,616,800,726">

<text x="167" y="336" font-size="23" fill="#292824" font-weight="600" text-anchor="start">Propose and run experiments</text>
<text x="124" y="372" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">Keep code, data, budgets and results traceable.</text>
</g>
<text x="50" y="340" font-size="18" fill="#aa6047" font-weight="600" text-anchor="start">02</text>
<g id="s2" data-graph-role="node" data-node-id="s2" data-graph-bounds="100,454,800,564">

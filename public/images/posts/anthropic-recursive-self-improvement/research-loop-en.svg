<text x="167" y="174" font-size="23" fill="#292824" font-weight="600" text-anchor="start">Choose a question</text>
<text x="124" y="210" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">Define value, constraints and a failure criterion.</text>
</g>
<text x="50" y="178" font-size="18" fill="#aa6047" font-weight="600" text-anchor="start">01</text>

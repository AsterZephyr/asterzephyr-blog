<text x="167" y="660" font-size="23" fill="#292824" font-weight="600" text-anchor="start">Integrate into a successor</text>
<text x="124" y="696" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">A local gain must survive full-system validation.</text>
</g>
<text x="50" y="664" font-size="18" fill="#aa6047" font-weight="600" text-anchor="start">04</text>
<g id="s4" data-graph-role="node" data-node-id="s4" data-graph-bounds="100,778,800,888">

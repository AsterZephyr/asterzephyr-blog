<text x="167" y="822" font-size="23" fill="#292824" font-weight="600" text-anchor="start">Measure the next research cycle</text>
<text x="124" y="858" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">Check whether the successor improves research itself.</text>
</g>
<text x="50" y="826" font-size="18" fill="#aa6047" font-weight="600" text-anchor="start">05</text>
<text x="44" y="942" font-size="17" fill="#625d55" font-weight="400" text-anchor="start">Recursion requires successors to improve research, beyond a one-off speedup.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="732" viewBox="0 0 840 732" role="img" aria-labelledby="title"><title id="title">What must carry over to the next model?</title><rect width="840" height="732" fill="#f6f3eb"/><g font-family="Arial, sans-serif"><text x="42" y="52" font-size="30" fill="#292b26">What must carry over to the next model?</text><text x="42" y="86" font-size="17" fill="#6e7168">An analytical decomposition, not a measured capability ladder.</text><rect x="64" y="125" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="157" font-size="23" fill="#292b26">01  Choose a question</text><text x="88" y="188" font-size="18" fill="#6e7168">Define value, constraints and a failure criterion.</text><path d="M420 215 v25 m-7 -7 l7 7 l7 -7" fill="none" stroke="#9b7743" stroke-width="2"/><rect x="64" y="244" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="276" font-size="23" fill="#292b26">02  Propose and run experiments</text><text x="88" y="307" font-size="18" fill="#6e7168">Keep code, data, budgets and results traceable.</text><path d="M420 334 v25 m-7 -7 l7 7 l7 -7" fill="none" stroke="#9b7743" stroke-width="2"/><rect x="64" y="363" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="395" font-size="23" fill="#292b26">03  Test outside the search loop</text><text x="88" y="426" font-size="18" fill="#6e7168">Use evidence the optimizer could not adapt to.</text><path d="M420 453 v25 m-7 -7 l7 7 l7 -7" fill="none" stroke="#9b7743" stroke-width="2"/><rect x="64" y="482" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="514" font-size="23" fill="#292b26">04  Integrate into a successor</text><text x="88" y="545" font-size="18" fill="#6e7168">A local gain must survive full-system validation.</text><path d="M420 572 v25 m-7 -7 l7 7 l7 -7" fill="none" stroke="#9b7743" stroke-width="2"/><rect x="64" y="601" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="633" font-size="23" fill="#292b26">05  Measure the next research cycle</text><text x="88" y="664" font-size="18" fill="#6e7168">Check whether the successor improves research itself.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="680" viewBox="0 0 840 680" role="img" aria-labelledby="title"><title id="title">Three conditional futures</title><rect width="840" height="680" fill="#f6f3eb"/><g font-family="Arial, sans-serif"><text x="42" y="52" font-size="30" fill="#292b26">Three conditional futures</text><text x="42" y="86" font-size="17" fill="#6e7168">Comparison of possibilities, not dates or assigned probabilities.</text><rect x="42" y="125" width="756" height="142" fill="#fffdf7" stroke="#d5cdbf"/><text x="66" y="163" font-size="25" fill="#292b26">Capability plateaus</text><text x="66" y="202" font-size="21" fill="#292b26">Current tools still spread.</text><text x="66" y="237" font-size="18" fill="#6e7168">Constraint: learning new capabilities.</text><rect x="42" y="299" width="756" height="142" fill="#fffdf7" stroke="#d5cdbf"/><text x="66" y="337" font-size="25" fill="#292b26">R&amp;D becomes much cheaper</text><text x="66" y="376" font-size="21" fill="#292b26">People still choose and validate directions.</text><text x="66" y="411" font-size="18" fill="#6e7168">Constraint: judgment, review and resources.</text><rect x="42" y="473" width="756" height="142" fill="#fffdf7" stroke="#d5cdbf"/><text x="66" y="511" font-size="25" fill="#292b26">Research feeds back into models</text><text x="66" y="550" font-size="21" fill="#292b26">Successors improve future research.</text><text x="66" y="585" font-size="18" fill="#6e7168">Constraint: independent control and verification.</text></g></svg>
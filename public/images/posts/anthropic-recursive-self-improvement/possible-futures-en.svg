<text x="137" y="377" font-size="23" fill="#292824" font-weight="600" text-anchor="start">R&amp;D becomes much cheaper</text>
<text x="94" y="413" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">People still choose and validate directions.</text>
<text x="94" y="442" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">Constraint: judgment, review and resources.</text>

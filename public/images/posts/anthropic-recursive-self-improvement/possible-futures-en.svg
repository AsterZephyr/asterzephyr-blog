<text x="137" y="179" font-size="23" fill="#292824" font-weight="600" text-anchor="start">Capability plateaus</text>
<text x="94" y="215" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">Current tools still spread.</text>
<text x="94" y="244" font-size="20" fill="#625d55" font-weight="400" text-anchor="start">Constraint: learning new capabilities.</text>

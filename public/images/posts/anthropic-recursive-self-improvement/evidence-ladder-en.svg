<text x="44" y="52" font-size="30" fill="#292824" font-weight="600" text-anchor="start">Each claim needs its own evidence</text>
<text x="44" y="89" font-size="18" fill="#625d55" font-weight="400" text-anchor="start">Success at one stage does not certify the others.</text>

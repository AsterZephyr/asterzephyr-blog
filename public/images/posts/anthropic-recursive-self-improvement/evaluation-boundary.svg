<svg xmlns="http://www.w3.org/2000/svg" width="840" height="613" viewBox="0 0 840 613" role="img" aria-labelledby="title"><title id="title">Protect the test from the search</title><rect width="840" height="613" fill="#f6f3eb"/><g font-family="Arial, sans-serif"><text x="42" y="52" font-size="30" fill="#292b26">Protect the test from the search</text><text x="42" y="86" font-size="17" fill="#6e7168">Recommended evaluation separation, not the reported AAR setup.</text><rect x="64" y="125" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="157" font-size="23" fill="#292b26">Search environment</text><text x="88" y="188" font-size="18" fill="#6e7168">Agents develop candidates using development feedback.</text><path d="M420 215 v25 m-7 -7 l7 7 l7 -7" fill="none" stroke="#9b7743" stroke-width="2"/><rect x="64" y="244" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="276" font-size="23" fill="#292b26">Freeze a candidate</text><text x="88" y="307" font-size="18" fill="#6e7168">Record the method, code revision and compute spent.</text><path d="M420 334 v25 m-7 -7 l7 7 l7 -7" fill="none" stroke="#9b7743" stroke-width="2"/><rect x="64" y="363" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="395" font-size="23" fill="#292b26">Independent evaluation</text><text x="88" y="426" font-size="18" fill="#6e7168">Use untouched data and a separately controlled evaluator.</text><path d="M420 453 v25 m-7 -7 l7 7 l7 -7" fill="none" stroke="#9b7743" stroke-width="2"/><rect x="64" y="482" width="710" height="88" rx="3" fill="#fffdf7" stroke="#d5cdbf"/><text x="88" y="514" font-size="23" fill="#292b26">Replication and transfer</text><text x="88" y="545" font-size="18" fill="#6e7168">Change seeds, workloads or models before deployment.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="796" viewBox="0 0 480 796" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#177b76"/></marker></defs><rect width="480" height="796" rx="16" fill="#f7f5ef"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#233d43" font-weight="600" text-anchor="start">AI 省下成本以后</text><rect x="24" y="76" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="76" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="111" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">01 任务成本下降</text><text x="44" y="145" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">能做多少 × 用了多少 × 提效多少</text><path d="M240 186V209" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="216" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="216" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="251" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">02 公司怎么安排工作</text><text x="44" y="285" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">更多产出，也可能更少用人</text><path d="M240 326V349" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="356" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="356" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="391" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">03 省下的钱分给谁</text><text x="44" y="425" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">工资和资本回报会怎样变化</text><path d="M240 466V489" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="496" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="496" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="531" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">04 原岗位的人去哪里</text><text x="44" y="565" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">降薪、找工作、转行都需要时间</text><path d="M240 606V629" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="636" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="636" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="671" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">05 员工最后拿到多少</text><text x="44" y="705" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">GDP ↑ 不保证每个人的收入 ↑</text></g></svg>
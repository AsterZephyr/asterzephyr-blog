<svg xmlns="http://www.w3.org/2000/svg" width="480" height="796" viewBox="0 0 480 796" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#177b76"/></marker></defs><rect width="480" height="796" rx="16" fill="#f7f5ef"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#233d43" font-weight="600" text-anchor="start">一笔节省，经过五次传导</text><rect x="24" y="76" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="76" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="111" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">01 任务成本下降</text><text x="44" y="145" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">能力 × 落地 × 单次效率</text><path d="M240 186V209" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="216" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="216" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="251" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">02 企业重排生产</text><text x="44" y="285" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">更多产出，也可能更少用人</text><path d="M240 326V349" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="356" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="356" width="5" height="106" rx="2" fill="#177b76"/><text x="44" y="391" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">03 收入重新分配</text><text x="44" y="425" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">劳动份额、资本稀缺同时变化</text><path d="M240 466V489" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="496" width="432" height="106" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="496" width="5" height="106" rx="2" fill="#177b76"/><text x="44" 
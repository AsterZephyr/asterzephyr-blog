<svg xmlns="http://www.w3.org/2000/svg" width="480" height="824" viewBox="0 0 480 824" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#177b76"/></marker></defs><rect width="480" height="824" rx="16" fill="#f7f5ef"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="27" fill="#233d43" font-weight="600" text-anchor="start">怎样从问卷算出 GDP 变化</text><rect x="24" y="76" width="432" height="108" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="76" width="5" height="108" rx="2" fill="#177b76"/><text x="44" y="111" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">10,980 位美国成年受访者</text><text x="44" y="145" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">接受了 2026 年 8 月的调查</text><path d="M240 188V210" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="216" width="432" height="108" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="216" width="5" height="108" rx="2" fill="#177b76"/><text x="44" y="251" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">问卷答案转成模型参数</text><text x="44" y="285" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">能力、采用、效率、自动化、转岗</text><path d="M240 328V350" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="356" width="432" height="108" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="356" width="5" height="108" rx="2" fill="#177b76"/><text x="44" y="391" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">3,259 人五项答案完整</text><text x="44" y="425" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">每人一组参数，分别运行模型</text><path d="M240 468V490" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="496" width="432" height="108" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="496" width="5" height="108" rx="2" fill="#177b76"/><text x="44" y="531" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">没问到的条件，由研究者设定</text><text x="44" y="565" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">资本供给、新任务、工资调整等</text><path d="M240 608V630" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="636" width="432" height="108" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="636" width="5" height="108" rx="2" fill="#177b76"/><text x="44" y="671" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">汇总每个人的模拟结果</text><text x="44" y="705" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">GDP 增幅中位数为 8.6%</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="696" viewBox="0 0 480 696" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#177b76"/></marker></defs><rect width="480" height="696" rx="16" fill="#f7f5ef"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#233d43" font-weight="600" text-anchor="start">研发怎样带来更多产出</text><rect x="24" y="76" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="76" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="111" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">GDP 水平提高</text><text x="44" y="145" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">同一研发占比 → 更多研发资源</text><path d="M240 191V213" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="219" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="219" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="254" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">当期发现更多新知识</text><text x="44" y="288" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">已有知识越多，新增越困难</text><path d="M240 334V356" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="362" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="362" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="397" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">研究成果需要逐年积累</text><text x="44" y="431" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">逐渐提高全体劳动的生产率</text><path d="M240 477V499" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="505" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="505" width="5" height="110" rx="2" fill="#b66b3d"/><text x="44" y
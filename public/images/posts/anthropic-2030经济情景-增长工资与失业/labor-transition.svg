<svg xmlns="http://www.w3.org/2000/svg" width="480" height="846" viewBox="0 0 480 846" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#177b76"/></marker></defs><rect width="480" height="846" rx="16" fill="#f7f5ef"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#233d43" font-weight="600" text-anchor="start">岗位减少怎样变成失业</text><rect x="24" y="76" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="76" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="111" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">企业需要的人数减少</text><text x="44" y="145" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">工资调整慢 → 人员相对过剩</text><path d="M240 191V213" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="219" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="219" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="254" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">先用自然离职吸收变化</text><text x="44" y="288" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">空出的岗位不再补招</text><path d="M240 334V356" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="362" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="362" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="397" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">剩余缺口才转为裁员</text><text x="44" y="431" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">进入失业池，开始重新找工作</text><path d="M240 477V499" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="505" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="505" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="540" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">另一组企业发布职位</text><text x="44" y="574" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">有需求，也要花时间扩张招聘</text><path d="M240 620V642" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="648" width="432" height="110" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="648" width="5" height="110" rx="2" fill="#177b76"/><text x="44" y="683" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">求职者与职位成功匹配</text><text x="44" y="717" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">转岗障碍 μ 决定跨组搜索效率</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="846" viewBox="0 0 480 846" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#177b76"/></marker></defs><rect width="480" height="846" rx="16" fill="#f7f5ef"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#233d43" font-weight="600" text-anchor="start">100 份任务如何变成 6.75</text><text x="24" y="78" font-size="23" fill="#60757b" font-weight="400" text-anchor="start">显著变化情景 · 基期支出加权</text><rect x="24" y="106" width="432" height="104" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="106" width="5" height="104" rx="2" fill="#177b76"/><text x="44" y="141" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">100 份原有劳动任务</text><text x="44" y="175" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">能力覆盖 m = 30% → 30 份</text><path d="M240 214V237" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="244" width="432" height="104" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="244" width="5" height="104" rx="2" fill="#177b76"/><text x="44" y="279" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">30 份 AI 能做的任务</text><text x="44" y="313" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">实际采用 d = 40% → 12 份</text><path d="M240 352V375" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="382" width="432" height="130" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="382" width="5" height="130" rx="2" fill="#177b76"/><text x="44" y="417" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">12 份实际使用 AI 的任务</text><text x="44" y="451" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">自动化 75% → 9 份</text><text x="44" y="480" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">辅助 25% → 3 份</text><path d="M240 516V539" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="546" width="432" height="104" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="546" width="5" height="104" rx="2" fill="#177b76"/><text x="44" y="581" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">9 份自动化对应的新任务</text><text x="44" y="615" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">新任务比例 25% → 2.25 份</text><path d="M240 654V677" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="684" width="432" height="130" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="684" width="5" height="130" rx="2" fill="#b66b3d"/><text x="44" y="719" font-size="26" fill="#b66b3d" font-weight="600" text-anchor="start">净减少 6.75 份原劳动任务</text><text x="44" y="753" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">9 − 2.25 = 6.75</text><text x="44" y="782" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">任务权重的变化 ≠ 裁员人数</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="636" viewBox="0 0 480 636" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#177b76"/></marker></defs><rect width="480" height="636" rx="16" fill="#f7f5ef"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="27" fill="#233d43" font-weight="600" text-anchor="start">效率翻倍，用人一定不减吗？</text><text x="24" y="80" font-size="23" fill="#60757b" font-weight="400" text-anchor="start">教学例子 · 固定总需求条件</text><rect x="24" y="110" width="432" height="108" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="110" width="5" height="108" rx="2" fill="#177b76"/><text x="44" y="145" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">单位任务的劳动投入减半</text><text x="44" y="179" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">生产率 × 2；价格变为 0.5</text><path d="M240 222V250" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="263" width="432" height="134" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="263" width="5" height="134" rx="2" fill="#177b76"/><text x="44" y="298" font-size="26" fill="#177b76" font-weight="600" text-anchor="start">需求增加，但没有增加一倍</text><text x="44" y="332" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">替代弹性 σ = 0.5</text><text x="44" y="361" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">任务数量 × √2 ≈ 1.414</text><path d="M240 401V429" stroke="#177b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="442" width="432" height="134" rx="12" fill="white" stroke="#d5dfda"/><rect x="24" y="442" width="5" height="134" rx="2" fill="#b66b3d"/><text x="44" y="477" font-size="26" fill="#b66b3d" font-weight="600" text-anchor="start">总劳动投入只剩约 70.7%</text><text x="44" y="511" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">0.5 × 1.414 ≈ 0.707</text><text x="44" y="540" font-size="23" fill="#233d43" font-weight="400" text-anchor="start">完整经济还会受收入扩张影响</text></g></svg>
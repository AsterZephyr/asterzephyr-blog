<svg xmlns="http://www.w3.org/2000/svg" width="520" height="630" viewBox="0 0 520 630" role="img" aria-labelledby="title desc"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#e6edf5}.label{font-size:23px}.small{font-size:20px;fill:#a9bacd}.num{font-size:34px;font-weight:700}.head{font-size:26px;font-weight:600}</style><rect width="520" height="630" rx="20" fill="#101c2b"/><title id="title">读书与工作的一年现金差额</title><desc id="desc">教学假设，万元。工作收入18减生活费6，净增12。读书学费8加生活费9，净减少17。两条路径现金差距29，等于学费8加额外生活费3加放弃工资18。</desc>
<text x="28" y="45" class="head">同一年，两条可行路径</text><text x="28" y="78" class="small">教学假设 · 单位：万元</text>
<rect x="24" y="105" width="472" height="138" rx="12" fill="#17352f"/><text x="44" y="142" class="label">直接工作</text><text x="44" y="183" class="small">税后收入 18 − 生活支出 6</text><text x="44" y="224" class="num" style="fill:#82ddbf">年末现金 +12</text>
<rect x="24" y="261" width="472" height="138" rx="12" fill="#283047"/><text x="44" y="298" class="label">全职读书</text><text x="44" y="339" class="small">无工资 − 学费 8 − 生活支出 9</text><text x="44" y="380" class="num" style="fill:#b7bcff">年末现金 −17</text>
<text x="28" y="445" class="label">相对工作，读书少了多少现金？</text><text x="28" y="493" class="num" style="fill:#f5ca78">12 − (−17) = 29</text>
<line x1="28" y1="521" x2="490" y2="521" stroke="#3a4b61"/><text x="28" y="557" class="small">也就是：8 学费 + 3 生活费差额</text><text x="28" y="588" class="small">                 + 18 放弃的工资</text></svg>
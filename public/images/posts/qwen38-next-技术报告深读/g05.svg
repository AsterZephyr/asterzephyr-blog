<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960" role="img" aria-label="GR：逐通道读取，逐分支写回"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#54728a"/></marker></defs><rect width="900" height="960" rx="18" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#16324f"><text x="44" y="58" font-size="30" font-weight="700">GR：逐通道读取，逐分支写回</text><text x="44" y="93" font-size="18" fill="#5e7183">4 条残差分支 · 用更精细的读取替代额外分支混合</text><rect x="65" y="130" width="770" height="120" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="89" y="166" font-size="23" font-weight="600">4 条残差分支</text><text x="89" y="199" font-size="19">R₀、R₁、R₂、R₃，各自做 RMSNorm</text><path d="M450 250 L450 287" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="290" width="770" height="120" rx="14" fill="#e4f4ed" stroke="#b9cadd"/><text x="89" y="326" font-size="23" font-weight="600">动态读取</text><text x="89" y="359" font-size="19">结合全部分支预测逐通道 sigmoid gate，再加权平均</text><path d="M450 410 L450 447" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="450" width="770" height="120" rx="14" fill="#fff0dd" stroke="#b9cadd"/><text x="89" y="486" font-size="23" font-weight="600">子层计算</text><text x="89" y="519" font-size="19">执行当前 attention 或 MLP，得到 y</text><path d="M450 570 L450 607" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="610" width="770" height="120" rx="14" fill="#eee8fa" stroke="#b9cadd"/><text x="89" y="646" font-size="23" font-weight="600">动态写入</text><text x="89" y="679" font-size="19">每条分支预测一个标量 sᵢ = 2 · sigmoid(…)</text><path d="M450 730 L450 767" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="770" width="770" height="120" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="89" y="806" font-size="23" font-weight="600">输出下一组残差状态</text><text x="89" y="839" font-size="19">每条分支更新：Rᵢ′ = Rᵢ + sᵢ · y</text></g></svg>
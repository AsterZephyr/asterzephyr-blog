<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-label="QSA 的两个训练阶段"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#54728a"/></marker></defs><rect width="900" height="690" rx="18" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#16324f"><text x="44" y="58" font-size="30" font-weight="700">QSA 的两个训练阶段</text><text x="44" y="93" font-size="18" fill="#5e7183">先让索引器学会选，再让模型学会用稀疏上下文</text><rect x="70" y="130" width="760" height="170" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="94" y="166" font-size="23" font-weight="600">阶段 1  Dense Distillation</text><text x="94" y="199" font-size="19">冻结 backbone，仅训练 indexer</text><text x="94" y="227" font-size="19">学习完整注意力分布的块级目标</text><text x="94" y="255" font-size="19">1,000 steps · 8 × 256K tokens / step · LR 1e−3</text><path d="M450 300 L450 352" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="464.0" y="326.0" font-size="17" fill="#5e7183">初始化索引器</text><rect x="70" y="360" width="760" height="190" rx="14" fill="#e4f4ed" stroke="#b9cadd"/><text x="94" y="396" font-size="23" font-weight="600">阶段 2  Sparse Training</text><text x="94" y="429" font-size="19">启用 QSA，联合训练 backbone 与 indexer</text><text x="94" y="457" font-size="19">indexer KL loss 在选中的块上计算</text><text x="94" y="485" font-size="19">8,000 steps · 96 × 256K tokens / step · LR 2.5e−5</text><text x="70" y="605" font-size="19" fill="#5e7183">这是模型适配过程，不是给现有权重加一个推理开关。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-label="一项架构改动，要过四道检查"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#54728a"/></marker></defs><rect width="900" height="790" rx="18" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#16324f"><text x="44" y="58" font-size="30" font-weight="700">一项架构改动，要过四道检查</text><text x="44" y="93" font-size="18" fill="#5e7183">本文阅读框架 · 逐项判断，避免用一个数字替代全部结果</text><rect x="90" y="130" width="720" height="120" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="114" y="166" font-size="23" font-weight="600">01  能力</text><text x="114" y="199" font-size="19">训练 loss + 下游任务 + 后训练表现</text><path d="M450 250 L450 287" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="90" y="290" width="720" height="120" rx="14" fill="#e4f4ed" stroke="#b9cadd"/><text x="114" y="326" font-size="23" font-weight="600">02  成本</text><text x="114" y="359" font-size="19">分别测训练、prefill、decode 和内存搬运</text><path d="M450 410 L450 447" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="90" y="450" width="720" height="120" rx="14" fill="#fff0dd" stroke="#b9cadd"/><text x="114" y="486" font-size="23" font-weight="600">03  稳定性</text><text x="114" y="519" font-size="19">观察 loss spikes、梯度范数与激活异常值</text><path d="M450 570 L450 607" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="90" y="610" width="720" height="120" rx="14" fill="#eee8fa" stroke="#b9cadd"/><text x="114" y="646" font-size="23" font-weight="600">04  外推</text><text x="114" y="679" font-size="19">核对消融规模、完整模型和部署场景</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="N-gram：让预取与第一层计算重叠"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#54728a"/></marker></defs><rect width="900" height="700" rx="18" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#16324f"><text x="44" y="58" font-size="30" font-weight="700">N-gram：让预取与第一层计算重叠</text><text x="44" y="93" font-size="18" fill="#5e7183">确定性地址来自 token 局部上下文 · 图示不代表实测时延比例</text><rect x="250" y="130" width="400" height="100" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="274" y="166" font-size="23" font-weight="600">输入 tokens</text><text x="274" y="199" font-size="19">形成短 n-gram 地址</text><path d="M350 230 L220 285" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M550 230 L680 285" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="55" y="295" width="380" height="170" rx="14" fill="#e4f4ed" stroke="#b9cadd"/><text x="79" y="331" font-size="23" font-weight="600">GPU：计算第 1 层</text><text x="79" y="364" font-size="19">对当前 token 做主体计算</text><text x="79" y="392" font-size="19">为异步数据搬运提供重叠窗口</text><rect x="465" y="295" width="380" height="170" rx="14" fill="#eee8fa" stroke="#b9cadd"/><text x="489" y="331" font-size="23" font-weight="600">Host：查表并预取</text><text x="489" y="364" font-size="19">读取 N-gram Embedding</text><text x="489" y="392" font-size="19">将所需向量传到设备</text><path d="M220 465 L350 520" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M680 465 L550 520" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="220" y="535" width="460" height="115" rx="14" fill="#fff0dd" stroke="#b9cadd"/><text x="244" y="571" font-size="23" font-weight="600">第 2 层：接入查表表示</text><text x="244" y="604" font-size="19">增加局部上下文相关的容量</text></g></svg>
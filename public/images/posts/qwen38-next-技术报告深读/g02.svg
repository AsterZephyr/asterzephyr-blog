<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-label="GDN：先看记忆里已有多少，再写入误差"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#54728a"/></marker></defs><rect width="900" height="860" rx="18" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#16324f"><text x="44" y="58" font-size="30" font-weight="700">GDN：先看记忆里已有多少，再写入误差</text><text x="44" y="93" font-size="18" fill="#5e7183">单个 head、单个 token 的递推 · k 和 q 已完成归一化</text><rect x="90" y="130" width="720" height="125" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="114" y="166" font-size="23" font-weight="600">1  衰减旧记忆</text><text x="114" y="199" font-size="19">S̃ = α · S_prev</text><path d="M450 255 L450 295" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="90" y="300" width="720" height="125" rx="14" fill="#fff0dd" stroke="#b9cadd"/><text x="114" y="336" font-size="23" font-weight="600">2  读取并比较</text><text x="114" y="369" font-size="19">旧预测 = S̃ᵀ · k；误差 e = v − 旧预测</text><path d="M450 425 L450 465" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="90" y="470" width="720" height="125" rx="14" fill="#e4f4ed" stroke="#b9cadd"/><text x="114" y="506" font-size="23" font-weight="600">3  只写入修正量</text><text x="114" y="539" font-size="19">S = S̃ + β · k · eᵀ</text><path d="M450 595 L450 635" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="90" y="640" width="720" height="125" rx="14" fill="#eee8fa" stroke="#b9cadd"/><text x="114" y="676" font-size="23" font-weight="600">4  用当前 query 读取</text><text x="114" y="709" font-size="19">y = Sᵀ · q</text></g></svg>
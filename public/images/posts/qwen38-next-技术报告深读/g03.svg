<svg xmlns="http://www.w3.org/2000/svg" width="900" height="990" viewBox="0 0 900 990" role="img" aria-label="QSA：压缩的是索引键，精读仍回到 token"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#54728a"/></marker></defs><rect width="900" height="990" rx="18" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#16324f"><text x="44" y="58" font-size="30" font-weight="700">QSA：压缩的是索引键，精读仍回到 token</text><text x="44" y="93" font-size="18" fill="#5e7183">r = 4，K = 2048 · 概念流程省略投影与归一化细节</text><rect x="65" y="130" width="770" height="125" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="89" y="166" font-size="23" font-weight="600">完整历史块 → 压缩键</text><text x="89" y="199" font-size="19">每 4 个 token 的 key 做 AvgPool，再应用 Partial RoPE</text><path d="M450 255 L450 287" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="290" width="770" height="125" rx="14" fill="#e4f4ed" stroke="#b9cadd"/><text x="89" y="326" font-size="23" font-weight="600">块级打分</text><text x="89" y="359" font-size="19">当前 query 只给已完整出现的历史块打分</text><path d="M450 415 L450 447" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="450" width="770" height="125" rx="14" fill="#fff0dd" stroke="#b9cadd"/><text x="89" y="486" font-size="23" font-weight="600">Top-k 选择</text><text x="89" y="519" font-size="19">最多选择 512 个完整块</text><path d="M450 575 L450 607" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="610" width="770" height="125" rx="14" fill="#eee8fa" stroke="#b9cadd"/><text x="89" y="646" font-size="23" font-weight="600">展开 + 保留尾部</text><text x="89" y="679" font-size="19">回到所选原 token；另加当前未完整块的可见 token</text><path d="M450 735 L450 767" stroke="#54728a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="770" width="770" height="125" rx="14" fill="#e5f0fc" stroke="#b9cadd"/><text x="89" y="806" font-size="23" font-weight="600">Sparse Core Attention</text><text x="89" y="839" font-size="19">对这些 token 的原始 K/V 做注意力计算</text></g></svg>